<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<style>
/* Layout: one reading column; sticky header with book name + three tabs; cards only for flashcards. */
:root {
  --bg: #eef2f5;        /* frost paper */
  --surface: #ffffff;
  --ink: #17222d;       /* deep polar ink */
  --muted: #5b6b7a;
  --line: #d3dce4;
  --accent: #1f6f8b;    /* glacier blue */
  --accent-soft: #dcebf1;
  --known: #2f7d4f;
  --known-soft: #dff0e5;
  --wrong: #a8322a;
  --wrong-soft: #f9e2df;
  --new: #9a4a00;       /* new-word ink */
  --new-soft: #fbe9cf;
  --font-read: "Literata", "Noto Serif", "Noto Serif SC", Georgia, serif;
  --font-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-ipa: "Noto Sans", "Lucida Sans Unicode", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f161d; --surface: #17212b; --ink: #e3eaf0; --muted: #93a3b2; --line: #2a3744;
  --accent: #6cb8d4; --accent-soft: #1b3341; --known: #7cc99a; --known-soft: #1a3326; --wrong: #f0958d; --wrong-soft: #3b1d1a; --new: #f0b46a; --new-soft: #3a2a14; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f161d; --surface: #17212b; --ink: #e3eaf0; --muted: #93a3b2; --line: #2a3744;
  --accent: #6cb8d4; --accent-soft: #1b3341; --known: #7cc99a; --known-soft: #1a3326; --wrong: #f0958d; --wrong-soft: #3b1d1a; --new: #f0b46a; --new-soft: #3a2a14; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header .wrap { padding-block: 16px 0; display: grid; gap: 10px; }
.book { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.book h1 { margin: 0; font-family: var(--font-read); font-size: 1.5rem; font-weight: 600; text-wrap: balance; }
.book .orig { color: var(--muted); font-size: .9rem; }
.book select { font: inherit; font-size: .85rem; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs a { padding: 8px 12px 10px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a .n { font-size: .75rem; margin-left: 4px; padding: 1px 6px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { font-size: calc(15px * var(--rs, 1)); }
main .wrap { padding-block: 20px 48px; }
.fs { display: inline-flex; margin-left: auto; }
.fs button { padding: 4px 10px; font-size: .85rem; }
.fs button + button { border-left: 0; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
button { font: inherit; font-size: .88rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button.good { background: var(--known); border-color: var(--known); color: var(--bg); }
#jump { font: inherit; font-size: .88rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
input[type="search"] { font: inherit; font-size: .88rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); flex: 1 1 160px; min-width: 0; }
.stat { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Bản dịch */
.page { padding-block: 8px 24px; border-bottom: 1px solid var(--line); }
.page + .page { padding-top: 24px; }
.page-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.page p { font-family: var(--font-read); font-size: 1.15em; line-height: 1.75; margin: 0 0 .9em; max-width: 65ch; }
.page .src p { color: var(--muted); font-size: 1.05em; }
.page .note { font-size: .88rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.src { margin-bottom: 12px; }

/* Danh sách */
.items { display: grid; gap: 0; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item > div { min-width: 0; }
.item .w { font-family: var(--font-read); font-size: 1.15rem; font-weight: 600; }
.item .ipa, .card .ipa { font-family: var(--font-ipa); color: var(--muted); font-size: .9rem; }
.item .pos { font-size: .75rem; color: var(--accent); margin-left: 6px; }
.item .mean { margin-top: 2px; }
.item .ex { font-family: var(--font-read); font-style: italic; color: var(--muted); font-size: .95rem; }
.item .acts { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.item.known .w::after { content: "Đã thuộc"; font-family: var(--font-ui); font-size: .7rem; font-weight: 600; color: var(--known); background: var(--known-soft); padding: 1px 6px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }
.formula { font-family: var(--font-ui); font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; display: inline-block; margin: 4px 0; font-size: .9rem; overflow-wrap: anywhere; }
.quote { font-family: var(--font-read); border-left: 2px solid var(--accent); padding-left: 10px; margin: 6px 0; }
.pg { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Thẻ ghi nhớ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 22px; min-height: 260px; display: grid; align-content: center; gap: 10px; text-align: center; cursor: pointer; box-shadow: 0 1px 2px rgba(15, 30, 45, .06); }
.card .big { font-family: var(--font-read); font-size: 1.9rem; font-weight: 600; overflow-wrap: anywhere; }
.card .hint { font-size: .8rem; color: var(--muted); }
.card .back { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 12px; }
.card .ex { font-family: var(--font-read); font-style: italic; color: var(--muted); }
.card-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.empty { padding: 32px 0; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
.card:hover { border-color: var(--accent); }

/* Từ mới trong bản gốc */
.nw { color: var(--new); background: var(--new-soft); border-bottom: 1.5px dotted var(--new); border-radius: 3px; padding: 0 2px; cursor: pointer; }
.nw:hover, .nw[aria-expanded="true"] { background: var(--new); color: var(--surface); }
.src .legend { font-family: var(--font-ui); font-size: .8rem; color: var(--muted); margin: 0 0 8px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(10, 20, 30, .18);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet .in { max-width: 760px; margin: 0 auto; display: grid; gap: 6px; }
.sheet .w { font-family: var(--font-read); font-size: 1.4rem; font-weight: 600; }
.sheet .ex { font-family: var(--font-read); font-style: italic; color: var(--muted); }
.sheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* Đọc kiểu Kindle: trang cố định, lật trái/phải bằng cột CSS */
#reader { position: fixed; inset: 0; z-index: 30; background: var(--surface); color: var(--ink); display: grid; grid-template-rows: auto 1fr auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.rd-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.rd-bar .seg button { padding: 5px 10px; }
.rd-view { position: relative; overflow: hidden; margin: 18px max(24px, env(safe-area-inset-right, 0px)) 8px max(24px, env(safe-area-inset-left, 0px)); max-width: 680px; width: calc(100% - 48px); justify-self: center; touch-action: pan-y; }
.rd-content { position: absolute; top: 0; left: 0; height: 100%; column-fill: auto; font-family: var(--font-read); line-height: 1.7; text-align: justify; }
@media (prefers-reduced-motion: no-preference) { .rd-content.anim { transition: transform .25s ease; } }
.rd-content p { margin: 0 0 .8em; text-indent: 1.2em; }
@media (max-width: 520px) { .rd-content { text-align: left; } }
.rd-content .rd-mark { font-family: var(--font-ui); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-indent: 0; margin: .6em 0 .4em; }
.rd-content .rd-src { color: var(--muted); font-size: .92em; }
.rd-foot { display: flex; justify-content: space-between; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
#rdSheet .sheet { z-index: 40; }
#reader[hidden] { display: none; }

.offbar { font-size: .78rem; color: var(--muted); padding: 2px 0 8px; }
nav.tabs a[hidden] { display: none; }

/* Chạm vào từ bản gốc để tra */
#view p[lang], #rdContent p[lang] { cursor: pointer; -webkit-tap-highlight-color: rgba(31, 111, 139, .15); }
#rdLookup[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }

#errbar { position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 60; display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--wrong-soft); color: var(--ink); border: 1px solid var(--wrong); border-radius: 10px; padding: 8px 12px; font-size: .85rem; overflow-wrap: anywhere; }
#errbar[hidden] { display: none; }

/* Nút nổi: lên đầu / đến trang cuối trong tab Bản dịch */
#fab { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 8; display: grid; gap: 8px; }
#fab[hidden] { display: none; }
#fab button { box-shadow: 0 2px 10px rgba(10, 20, 30, .22); border-radius: 20px; padding: 8px 14px; font-weight: 600; }
#fab #toEnd { background: var(--accent); border-color: var(--accent); color: var(--bg); }

/* Trò chơi ôn tập */
.freq { font-size: .72rem; color: var(--new); background: var(--new-soft); border-radius: 10px; padding: 1px 7px; margin-left: 6px; white-space: nowrap; font-weight: 600; }
.reviewbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; padding: 10px 12px; margin-bottom: 14px; background: var(--accent-soft); border-radius: 12px; }
.rv-text { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .88rem; }
.lookup input[type="text"] { font: inherit; flex: 1 1 160px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.lookup .res { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.dots { font-size: .7rem; letter-spacing: .12em; color: var(--accent); margin-left: 6px; white-space: nowrap; }
.mini { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mini > span { min-width: 0; overflow-wrap: anywhere; }
.game { display: grid; gap: 12px; }
.ghead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.gbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.gbar i { display: block; height: 100%; background: var(--accent); }
.gq { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 16px; display: grid; gap: 12px; }
.gq .big { font-family: var(--font-read); font-size: 1.7rem; font-weight: 600; overflow-wrap: anywhere; }
.gq input[type="text"] { font: inherit; flex: 1 1 140px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.game .help { font-size: .85rem; color: var(--muted); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 12px 14px; font-size: 1rem; line-height: 1.4; overflow-wrap: anywhere; }
.opt .sub { display: block; font-size: .8rem; color: var(--muted); margin-top: 2px; }
.opt.right, .gans.right { background: var(--known-soft); border-color: var(--known); }
.opt.wrong, .gans.wrong { background: var(--wrong-soft); border-color: var(--wrong); }
.gfb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; border: 1px solid var(--line); background: var(--surface); }
.gfb.right { background: var(--known-soft); border-color: var(--known); }
.gfb.wrong { background: var(--wrong-soft); border-color: var(--wrong); }
.gfb .ex { font-family: var(--font-read); font-style: italic; color: var(--muted); }
.chips, .gans { display: flex; flex-wrap: wrap; gap: 8px; }
.gans { min-height: 52px; padding: 8px; border: 1px dashed var(--line); border-radius: 10px; align-items: center; }
.chip { font-family: var(--font-read); font-size: 1rem; padding: 8px 12px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); }
.chip:disabled:not(.on) { opacity: .35; }

/* Thêm trang */
.add { display: grid; gap: 14px; }
.add .field { display: grid; gap: 6px; }
.add textarea { font-family: var(--font-read); font-size: 1rem; line-height: 1.6; min-height: 220px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); resize: vertical; width: 100%; }
.add input[type="text"], .add select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.add .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add .help { font-size: .85rem; color: var(--muted); }
.thumb { max-height: 160px; border: 1px solid var(--line); border-radius: 8px; }
.status { padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: .9rem; white-space: pre-wrap; }
.insight p { font-family: var(--font-read); font-size: 1.05em; line-height: 1.7; margin: 0 0 .8em; max-width: 65ch; border-left: 2px solid var(--accent); padding-left: 12px; }
.status.warn { background: var(--new-soft); border: 1px solid var(--new); }
.status.err { background: var(--surface); border: 1px solid var(--line); }
details.hard { margin-top: 6px; }
details.hard summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
details.hard li { margin-bottom: 8px; }
.result h3 { font-size: .95rem; margin: 16px 0 6px; }
.danger { color: var(--muted); font-size: .8rem; padding: 2px 8px; }
</style>

</head><body>
<header>
  <div class="wrap">
    <div class="book"><h1 id="bookTitle">Sổ tay đọc sách</h1><span class="orig" id="bookOrig"></span><select id="bookSel" aria-label="Chọn sách" hidden></select>
      <span class="seg fs" role="group" aria-label="Cỡ chữ"><button id="fsDown" aria-label="Chữ nhỏ hơn">A−</button><button id="fsUp" aria-label="Chữ to hơn">A+</button></span></div>
    <nav class="tabs" aria-label="Mục">
      <a href="#ban-dich" data-tab="ban-dich">Bản dịch<span class="n" id="nPages">0</span></a>
      <a href="#them-trang" data-tab="them-trang">+ Thêm</a>
      <a href="#tu-vung" data-tab="tu-vung">Từ vựng<span class="n" id="nVocab">0</span></a>
      <a href="#mau-cau" data-tab="mau-cau">Mẫu câu<span class="n" id="nPat">0</span></a>
    </nav>
    <div class="offbar" id="offbar" hidden><span id="offtext"></span> <button id="importBtn" hidden>Nhập dữ liệu</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<div id="fab" hidden><button id="toTop" aria-label="Lên đầu trang">↑ Đầu</button><button id="toEnd" aria-label="Đến trang cuối cùng">Trang cuối ↓</button></div>
<div id="reader" hidden>
  <div class="rd-bar"><button id="closeReader">Đóng</button>
    <span class="seg" role="group" aria-label="Ngôn ngữ đọc"><button data-rdlang="vi">Tiếng Việt</button><button data-rdlang="src">Bản gốc</button><button data-rdlang="both">Song ngữ</button></span>
    <button id="rdLookup" aria-pressed="false" title="Chạm vào từ để tra thay vì lật trang">Chạm để tra</button>
    <span class="seg" role="group" aria-label="Đi nhanh"><button id="rdStart">Đầu</button><button id="rdEnd">Cuối</button></span>
    <span class="seg" role="group" aria-label="Cỡ chữ"><button data-rdsize="-1" aria-label="Chữ nhỏ hơn">A−</button><button data-rdsize="1" aria-label="Chữ to hơn">A+</button></span></div>
  <div class="rd-view" id="rdView"><div class="rd-content" id="rdContent"></div></div>
  <div class="rd-foot"><span id="rdWhere"></span><span id="rdPct"></span></div>
  <div id="rdSheet"></div>
</div>

<script>

  if (!b || !b.pages.length) return PWA ? `<p class="empty">Chưa có sách trong ứng dụng.<br>Bấm <b>“Nhập dữ liệu”</b> ở trên và chọn tệp <b>sach-du-lieu.json</b> (chỉ cần làm một lần).</p>` : `<p class="empty">Chưa có trang nào. Dán một trang sách cho Claude để bắt đầu.</p>`;
  const vocab = items("tu-vung"), vw = state.view, left = vocab.filter(v => !known.has(v.key)).length;
  const jump = b.pages.length > 3 ? `<select id="jump" aria-label="Đi tới trang"><option value="">Đi tới trang…</option>${b.pages.map(p => `<option value="${p.n}">Trang ${pad(p.n)}</option>`).join("")}</select>` : "";
  return ttsSettings() + `<div class="toolbar"><button class="primary" id="openReader">Đọc kiểu Kindle</button>${b.pages.length > 1 ? `<button data-viewpage="${b.pages[b.pages.length - 1].n}">Trang mới nhất</button>` : ""}${jump}<span class="seg" role="group" aria-label="Hiển thị">
      <button data-view="both" aria-pressed="${vw === "both"}">Song ngữ</button><button data-view="src" aria-pressed="${vw === "src"}">Bản gốc</button><button data-view="vi" aria-pressed="${vw === "vi"}">Bản dịch</button></span>
      <span class="stat">${b.pages.length} trang · ${left} từ mới chưa nhớ</span></div>${vw !== "vi" ? `<p class="help" style="font-size:.82rem;color:var(--muted);margin:-6px 0 12px">Mẹo: chạm vào bất kỳ từ nào trong bản gốc để tra ngay.</p>` : ""}` +
    b.pages.map(p => `<article class="page" id="p-${p.n}"><div class="page-head"><span class="label">Trang ${pad(p.n)}${p.label ? ` · trang sách ${esc(p.label)}` : ""}</span><span class="pg">${esc(p.date || "")}</span></div>
      ${vw !== "vi" ? `<div class="src">${(p.source || []).map(t => `<p lang="${esc(b.lang)}">${markNew(t, vocab, b.lang)}</p>`).join("")}</div>` : ""}
      ${vw !== "src" ? (p.translation || []).map(t => `<p>${markVi(t, viTerms(p))}</p>`).join("") + listenRow(b, p.n) : ""}
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
      ${(p.hard || []).length ? `<details class="hard"><summary>Phân tích câu khó (${p.hard.length})</summary><ul>${p.hard.map(h => `<li><div class="quote" lang="${esc(b.lang)}">${esc(h.s)}</div><div>${esc(h.parts)}</div><div class="pg">${esc(h.mean)}</div></li>`).join("")}</ul></details>` : ""}
      ${p.insight ? `<details class="hard"><summary>Ý nghĩa sâu xa</summary><div class="insight">${insightHTML(p.insight)}</div></details>` : p.dbId && isOwner && !p.insightDone && (p.vocab || []).length ? `<button class="danger" data-explain="${esc(p.dbId)}">Giải thích ý nghĩa sâu xa</button>` : ""}
      ${p.dbId && isOwner ? `<button class="danger" data-del="${esc(p.dbId)}">${state.confirmDel === p.dbId ? "Bấm lần nữa để xoá trang này" : "Xoá trang"}</button>` : ""}</article>`).join("");
}

function toolbar(kind) {
  const all = items(kind), k = all.filter(i => known.has(i.key)).length, m = state.mode[kind];
  return `<div class="toolbar">
    <span class="seg" role="group" aria-label="Chế độ"><button data-mode="list" aria-pressed="${m === "list"}">Danh sách</button><button data-mode="cards" aria-pressed="${m === "cards"}">Thẻ ghi nhớ</button><button data-mode="game" aria-pressed="${m === "game"}">Trò chơi</button></span>

    ${m !== "game" ? `<span class="seg" role="group" aria-label="Sắp xếp"><button data-sort="freq" aria-pressed="${state.sort === "freq"}">Hay gặp trước</button><button data-sort="page" aria-pressed="${state.sort === "page"}">Theo trang</button></span>` : ""}

    <span class="stat">Đã thuộc ${k}/${all.length}</span></div>`;
}

const freqBadge = (it, unit) => it.freq > 1 ? `<span class="freq" title="Hay gặp">gặp ${it.freq} ${unit}</span>` : "";

}
function patRow(it) {
  return `<div class="item${known.has(it.key) ? " known" : ""}"><div>
    <div class="w">${esc(it.name)} ${dots(it.key)}${freqBadge(it, "trang")}</div><div class="formula">${esc(it.formula)}</div>
    <div class="quote" lang="${esc(book().lang)}">${esc(it.src)}</div><div class="mean">${esc(it.explain)}</div>
    <div class="ex" lang="${esc(book().lang)}">${esc(it.ex)}</div><div class="mean">${esc(it.exVi)}</div><div class="pg">Trang ${pad(it.page)}</div></div>
    <div class="acts"><button data-say="${esc(it.ex)}">Nghe</button><button data-known="${esc(it.key)}">${known.has(it.key) ? "Bỏ đánh dấu" : "Đã thuộc"}</button></div></div>`;
}

// ---- Mức nhớ và trò chơi ôn tập ----
const lvOf = k => lv[k] || 0;
const dots = k => `<span class="dots" role="img" aria-label="Mức nhớ ${lvOf(k)} trên 3">${"●".repeat(lvOf(k))}${"○".repeat(3 - lvOf(k))}</span>`;
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOf = a => a[Math.floor(Math.random() * a.length)];
const norm = t => String(t).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();
const cleanW = w => String(w).replace(/\s*\([^)]*\)/g, "").trim() || String(w);
const shortTxt = s => String(s).length > 70 ? String(s).slice(0, 67) + "…" : String(s);

// Một mục "gần giống" đáp án (cùng chữ sau khi bỏ chú thích, cùng gốc từ như project/projected, hoặc cùng nghĩa chính) thì không dùng làm lựa chọn nhiễu, vì người chơi chọn nó cũng hợp lý.
const meanKey = o => norm(String(o.mean || "").split(/[,;(]/)[0]);
const stemKey = o => { const w = norm(cleanW(o.w || o.name || "")); return w.length >= 5 ? w.slice(0, 5) : w; };
function tooClose(a, b) {
  if (a.w === undefined) return false;
  if (norm(cleanW(a.w)) === norm(cleanW(b.w))) return true;
  if (stemKey(a) === stemKey(b) && norm(cleanW(a.w)).length >= 5) return true;
  const ma = meanKey(a), mb = meanKey(b); return !!ma && !!mb && ma === mb;
}
function distractors(all, it, field, n) {
  const seen = new Set([norm(it[field])]), out = [];
  for (const o of shuf(all)) {
    if (o.key === it.key || !o[field]) continue;
    const k = norm(o[field]); if (seen.has(k) || tooClose(it, o)) continue;
    seen.add(k); out.push(o); if (out.length >= n) break;
  }
  // Thiếu nhiễu (ít mục) thì nới điều kiện cho đủ lựa chọn.
  for (const o of shuf(all)) { if (out.length >= Math.min(n, all.length - 1)) break; if (o.key === it.key || !o[field] || out.includes(o)) continue; const k = norm(o[field]); if (seen.has(k)) continue; seen.add(k); out.push(o); }
  return out;
}
function mkChoices(it, all, field, text, sub) {
  const list = shuf([it, ...distractors(all, it, field, 3)]);
  return { choices: list.map(o => ({ text: text(o), sub: sub ? sub(o) : "" })), answer: list.indexOf(it) };
}
function makeQ(kind, it, all, lang) {
  const L = lvOf(it.key);
  if (kind === "tu-vung") {
    let t = pickOf(L === 0 ? ["mean", "word"] : L === 1 ? ["word", "cloze", "listen"] : ["cloze", lang === "en" ? "type" : "word", "listen"]);
    if (t === "listen" && !ttsOK()) t = "word";
    if (t === "listen") return { type: "listen", it, ...mkChoices(it, all, "w", o => cleanW(o.w)) };
    if (t === "cloze") {
      const m = it.ex ? new RegExp(wordRegex(it.w, lang).source, "iu").exec(it.ex) : null;
      if (m) return { type: "cloze", it, text: it.ex.slice(0, m.index) + "_____" + it.ex.slice(m.index + m[0].length), ...mkChoices(it, all, "w", o => cleanW(o.w)) };
      t = "word";
    }
    if (t === "type") return { type: "type", it, answer: cleanW(it.w) };
    if (t === "mean") return { type: "mean", it, ...mkChoices(it, all, "mean", o => shortTxt(o.mean)) };
    return { type: "word", it, ...mkChoices(it, all, "w", o => cleanW(o.w)) };
  }
  let t = pickOf(L === 0 ? ["which", "formula"] : L === 1 ? ["formula", "order"] : ["order", "which"]);
  if (t === "order") {
    const toks = (it.ex || "").trim().split(/\s+/).filter(Boolean);
    if (lang === "zh" || toks.length < 4 || toks.length > 14) t = "which";
    else { let pool = shuf(toks.map((_, i) => i)); for (let n = 0; n < 5 && pool.every((v, i) => v === i); n++) pool = shuf(pool); return { type: "order", it, tokens: toks, pool, picked: [] }; }
  }
  if (t === "formula") return { type: "formula", it, ...mkChoices(it, all, "formula", o => o.formula) };
  return { type: "which", it, ...mkChoices(it, all, "name", o => o.name, o => o.formula) };
}

function startGame(kind) {
  const all = items(kind), lang = book() ? book().lang : "en";
  if (all.length < 3) { state.game = { kind, tooFew: true }; return; }
  // Thứ tự chọn: 1) mục đến hạn ôn (quá hạn lâu nhất trước); 2) mục cần nhớ có điểm cao (độ hay gặp x mức còn thiếu);
  // 3) vài mục đã nhớ để ôn cho chắc. Tối đa 10 câu.
  const now = Date.now(), score = i => i.freq * (3 - lvOf(i.key)) + Math.random() * 0.5;
  const dueList = all.filter(i => due[i.key] && due[i.key] <= now).sort((a, b) => due[a.key] - due[b.key]).slice(0, 10);
  const taken = new Set(dueList.map(i => i.key));
  const todo = all.filter(i => !known.has(i.key) && !taken.has(i.key)).sort((a, b) => score(b) - score(a));
  const picked = [...dueList, ...todo.slice(0, Math.max(0, Math.min(8, 10) - dueList.length))];
  const pk = new Set(picked.map(i => i.key));
  const done = shuf(all.filter(i => known.has(i.key) && !pk.has(i.key)));
  const nDone = picked.length < 8 ? Math.min(done.length, 10 - picked.length) : Math.min(done.length, 10 - picked.length, 2);
  const picks = shuf([...picked, ...done.slice(0, nDone)]);
  const qs = picks.map(it => { try { return makeQ(kind, it, all, lang); } catch (e) { return null; } }).filter(Boolean);
  if (qs.length < 1) { state.game = { kind, tooFew: true }; return; }
  state.game = { kind, lang, all, qs, i: 0, score: 0, streak: 0, best: 0, ans: null, missed: [], newKnown: [], demoted: [], retried: false, done: false };
}
// Đúng: +1 (câu trắc nghiệm) hoặc +2 (gõ từ, sắp xếp câu). Đạt 3 thì tự chuyển sang "Đã nhớ". Sai: về 0, và nếu đang "Đã nhớ" thì quay lại danh sách cần nhớ.
function gradeAnswer(q, ok) {
  ensureMutable();
  const g = state.game, k = q.it.key; let note = "";
  if (ok) {
    lv[k] = Math.min(3, lvOf(k) + (q.type === "type" || q.type === "order" ? 2 : 1));
    if (lv[k] >= 3 && !known.has(k)) { known.add(k); g.newKnown.push(k); note = "Bạn đã nhớ mục này. Nó được chuyển sang “Đã nhớ”."; }
  } else {
    lv[k] = 0;
    if (known.has(k)) { known.delete(k); g.demoted.push(k); note = "Mục này quay lại danh sách cần nhớ."; }
  }
  due[k] = Date.now() + [5 * 60e3, DAY, 3 * DAY, 7 * DAY][lv[k]];
  const dk = dayKey(new Date()); daily[dk] = daily[dk] || { n: 0, ok: 0 }; daily[dk].n++; if (ok) daily[dk].ok++;
  touchKnown();
  return note;
}
function gameAnswer(ok, user) {
  const g = state.game, q = g.qs[g.i]; if (!g || g.ans) return;
  const note = gradeAnswer(q, ok);
  g.ans = { ok, user, note };
  if (ok) { if (!q.retry) g.score++; g.streak++; g.best = Math.max(g.best, g.streak); }
  else { g.streak = 0; if (!q.retry && !g.missed.includes(q.it)) g.missed.push(q.it); }
  render();
}
function gameNext() {
  const g = state.game; g.ans = null; g.i++;
  setTimeout(() => { const nq = !g.done && g.qs[g.i]; if (nq && nq.type === "listen") speak(nq.it.w); });
  if (g.i >= g.qs.length) {
    if (g.missed.length && !g.retried) { g.retried = true; g.qs.push(...g.missed.map(it => ({ ...makeQ(g.kind, it, g.all, g.lang), retry: true }))); }
    else g.done = true;
  }
  render();
}
function gameChoose(i) { const q = state.game.qs[state.game.i]; gameAnswer(i === q.answer, i); }
function gameCheckType() {
  const q = state.game.qs[state.game.i], el = document.getElementById("gtype"), v = el ? el.value.trim() : "";
  if (!v) return;
  const g = state.game, same = [q.it, ...g.all.filter(o => o.key !== q.it.key && meanKey(o) && meanKey(o) === meanKey(q.it))];
  gameAnswer(same.some(o => { try { return new RegExp("^" + wordRegex(o.w, "en").source + "$", "iu").test(v); } catch (e) { return false; } }), v);
}
function gamePick(idx) {
  const g = state.game, q = g.qs[g.i]; if (g.ans || q.picked.includes(idx)) return;
  q.picked.push(idx);
  if (q.picked.length < q.tokens.length) return render();
  gameAnswer(norm(q.picked.map(i => q.tokens[i]).join(" ")) === norm(q.tokens.join(" ")), q.picked.slice());
}
function gameUnpick(pos) { const g = state.game, q = g.qs[g.i]; if (g.ans) return; q.picked.splice(pos, 1); render(); }

function renderGame(kind) {
  if (!state.game || state.game.kind !== kind) startGame(kind);
  const g = state.game;
  if (g.tooFew) return `<p class="empty">Cần ít nhất 3 mục để chơi. Hãy dịch thêm trang nhé.</p>`;
  if (g.done) return renderGameResult(g);
  const q = g.qs[g.i], it = q.it, L = esc(g.lang), total = g.qs.length;
  const opts = () => `<div class="opts">${q.choices.map((c, i) => `<button class="opt${g.ans ? (i === q.answer ? " right" : g.ans.user === i ? " wrong" : "") : ""}" data-gopt="${i}"${g.ans ? " disabled" : ""}>${esc(c.text)}${c.sub ? `<span class="sub">${esc(c.sub)}</span>` : ""}</button>`).join("")}</div>`;
  let body = "", answerText = "";
  if (q.type === "mean") {
    body = `<div class="label">Chọn nghĩa đúng của từ</div><div class="big" lang="${L}">${esc(cleanW(it.w))}</div><div class="ipa">${esc(it.ipa)} · ${esc(it.pos)}</div><div><button data-say="${esc(it.w)}">Nghe</button></div>${opts()}`;
    answerText = q.choices[q.answer].text;
  } else if (q.type === "listen") {
    body = `<div class="label">Nghe rồi chọn từ bạn nghe được</div><div><button class="primary" data-say="${esc(it.w)}">Nghe từ</button></div>${g.ans ? `<div class="ipa">${esc(it.ipa)}</div>` : ""}${opts()}`;
    answerText = q.choices[q.answer].text;
  } else if (q.type === "word") {
    body = `<div class="label">Từ nào có nghĩa này?</div><div class="big" style="font-size:1.3rem">${esc(it.mean)}</div>${opts()}`;
    answerText = q.choices[q.answer].text;
  } else if (q.type === "cloze") {
    body = `<div class="label">Điền từ còn thiếu vào câu</div><div class="big" lang="${L}" style="font-size:1.25rem">${esc(q.text)}</div><div class="help">Gợi ý nghĩa: ${esc(it.mean)}</div>${opts()}`;
    answerText = q.choices[q.answer].text;
  } else if (q.type === "type") {
    const w = q.answer, hint = w.split(/\s+/).map(t => t[0] + "·".repeat(Math.max(0, t.length - 1))).join(" ");
    body = `<div class="label">Gõ từ tiếng Anh có nghĩa này</div><div class="big" style="font-size:1.3rem">${esc(it.mean)}</div><div class="help">Gợi ý: <b>${esc(hint)}</b></div>
      <div class="row"><input type="text" id="gtype" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Từ tiếng Anh"${g.ans ? ` value="${esc(g.ans.user)}" disabled` : ""}>${g.ans ? "" : `<button class="primary" id="gcheck">Kiểm tra</button>`}</div>`;
    answerText = q.answer;
  } else if (q.type === "which") {
    body = `<div class="label">Câu này dùng mẫu câu nào?</div><div class="big" lang="${L}" style="font-size:1.2rem">${esc(it.ex)}</div>${opts()}`;
    answerText = q.choices[q.answer].text;
  } else if (q.type === "formula") {
    body = `<div class="label">Chọn công thức đúng của mẫu</div><div class="big" style="font-size:1.3rem">${esc(it.name)}</div><div class="quote" lang="${L}" style="text-align:left">${esc(it.src)}</div>${opts()}`;
    answerText = q.choices[q.answer].text;
  } else {
    const chips = q.pool.map(i => `<button class="chip" data-gchip="${i}"${q.picked.includes(i) || g.ans ? " disabled" : ""} lang="${L}">${esc(q.tokens[i])}</button>`).join("");
    const built = q.picked.map((i, pos) => `<button class="chip on" data-gunpick="${pos}"${g.ans ? " disabled" : ""} lang="${L}">${esc(q.tokens[i])}</button>`).join("");
    body = `<div class="label">Sắp xếp các từ thành câu đúng</div><div class="big" style="font-size:1.15rem">${esc(it.exVi)}</div>
      <div class="gans${g.ans ? (g.ans.ok ? " right" : " wrong") : ""}" aria-label="Câu của bạn">${built || `<span class="help">Chạm vào các từ bên dưới theo thứ tự.</span>`}</div><div class="chips">${chips}</div>`;
    answerText = q.tokens.join(" ");
  }
  let fb = "";
  if (g.ans) {
    const detail = q.type === "which" || q.type === "formula" || q.type === "order"
      ? `<div class="formula">${esc(it.formula)}</div><div>${esc(it.explain)}</div><div class="ex" lang="${L}">${esc(it.ex)}</div><div>${esc(it.exVi)}</div>`
      : `<div>${esc(it.mean)}</div><div class="ex" lang="${L}">${esc(it.ex)}</div>`;
    const last = g.i + 1 >= total && (!g.missed.length || g.retried);
    fb = `<div class="gfb ${g.ans.ok ? "right" : "wrong"}" role="status"><div><b>${g.ans.ok ? "Chính xác!" : "Chưa đúng."}</b>${g.ans.ok ? "" : ` Đáp án: <b lang="${L}">${esc(answerText)}</b>`}</div>
      ${detail}<div class="help">Mức nhớ ${dots(it.key)} ${esc(g.ans.note)}</div>
      <div class="row"><button data-say="${esc(q.type === "which" || q.type === "formula" || q.type === "order" ? it.ex : it.w)}">Nghe</button><button class="primary" id="gnext">${last ? "Xem kết quả" : "Tiếp tục"}</button></div></div>`;
  }
  return `<div class="game"><div class="ghead"><span class="stat">Câu ${g.i + 1}/${total}${q.retry ? " · ôn lại câu sai" : ""}</span><span class="stat">Đúng ${g.score} · Chuỗi ${g.streak}</span></div>
    <div class="gbar"><i style="width:${Math.round(g.i / total * 100)}%"></i></div><div class="gq">${body}</div>${fb}</div>`;
}
function renderGameResult(g) {
  const real = g.qs.filter(q => !q.retry).length, by = Object.fromEntries(items(g.kind).map(i => [i.key, i]));
  const label = k => esc(by[k] ? (by[k].w || by[k].name) : k.split("|").pop()), pct = real ? g.score / real : 0;
  const msg = pct >= 0.9 ? "Rất tốt!" : pct >= 0.6 ? "Khá tốt, tiếp tục nhé." : "Chưa chắc lắm, ôn thêm một lượt nữa sẽ nhớ hơn.";

function wordAt(x, y, lang) {

}

// Đọc câu trả lời dạng khuôn ===TAG=== (chịu được dấu ngoặc kép, gạch ngang, chữ nghiêng trong sách mà JSON không chịu được).
function parseTagged(text) {
  const grab = tag => { const m = String(text).match(new RegExp("===" + tag + "===[ \\t]*\\n?([\\s\\S]*?)(?=\\n?===[A-Z]+===|$)")); return m ? m[1].trim() : ""; };
  const paras = t => t.split(/\n\s*\n/).map(x => x.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
  return { lang: /zh|chinese|trung|中/i.test(grab("LANG")) ? "zh" : "en", source: paras(grab("SOURCE")), translation: paras(grab("TRANSLATION")), note: grab("NOTE") };
}

async function explain(page, quiet) {
  if (!sample || !db || state.busy || !page) return;

const ERR_VI = { truncated: "Câu trả lời bị cắt giữa chừng vì trang quá dài.",

async function analyze(page) {
  if (!sample || !db || state.busy || !page) return;
  state.busy = true; state.err = false; state.msg = "Claude đang tạo từ vựng và mẫu câu…"; state.ctl = new AbortController(); render();
  try {
    const out = await sample.json(buildAnalysisPrompt(page), { signal: state.ctl.signal, modelTier: "default" });
    const fields = { vocab: (out.vocab || []).filter(v => v && v.w), patterns: (out.patterns || []).filter(x => x && x.name), hard: (out.hard || []).filter(h => h && h.s) };
    await db.collection("pages").doc(`${page.book}-${pad(page.n)}`).update(fields);
    Object.assign(page, fields);
    state.msg = "";
    state.busy = false; render();
    return explain(page, true);
  } catch (e) {
    state.err = true;
    state.msg = `Đã lưu bản dịch. Phần từ vựng và mẫu câu chưa tạo được: ${errVi(e)} Bấm "Tạo từ vựng và mẫu câu" để thử lại.`;
  } finally { state.busy = false; render(); }

// Phát hiện trang đã dịch: so các cụm 5 từ liên tiếp. Hai trang Kindle liền nhau chỉ trùng một hai câu ở mép trang, nên chỉ báo khi trùng từ 60% trở lên.
const shingles = t => { const w = String(t).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean), out = new Set(); for (let i = 0; i + 5 <= w.length; i++) out.add(w.slice(i, i + 5).join(" ")); return out; };
function findDuplicate(text, pages) {
  const mine = shingles(text); if (mine.size < 3) return null;
  let best = null;
  for (const p of pages) {
    const theirs = shingles((p.source || []).join(" ")); let hit = 0;
    for (const x of mine) if (theirs.has(x)) hit++;
    const r = hit / mine.size;
    if (r >= 0.6 && (!best || r > best.ratio)) best = { page: p, ratio: r };
  }
  return best;
}
function showDup(d, pending) {
  state.dup = { n: d.page.n, pct: Math.round(d.ratio * 100), pending: pending || null };
  state.err = true; state.msg = ""; state.busy = false; render();
}

async function savePage(b, next, out) {
  const page = { book: b.id, bookTitle: b.title, bookOriginal: b.original || "", bookAuthor: b.author || "", lang: out.lang === "zh" ? "zh" : "en", n: next,
    label: state.pageLabel.trim(), date: new Date().toISOString().slice(0, 10),
    source: (out.source || []).map(String), translation: out.translation.map(String), note: String(out.note || ""),
    vocab: [], patterns: [], hard: [] };
  await db.collection("pages").doc(`${b.id}-${pad(next)}`).set(page);
  state.result = page; state.draft = ""; store.set("draft", ""); state.file = null; state.pageLabel = ""; state.dup = null;
  state.book = b.id; store.set("book", b.id); state.msg = ""; state.newTitle = ""; state.newOrig = ""; state.newAuthor = "";
  state.busy = false; render();
  return analyze(page);
}

// force = true khi người dùng bấm "Vẫn lưu thành trang mới" sau cảnh báo trùng.
async function translate(force) {
  if (!sample || !db || !isOwner || state.busy) return render();
  const hasImage = !!state.file;
  if (!state.draft.trim() && !hasImage) { state.msg = "Hãy dán nội dung trang hoặc chọn ảnh trước."; state.err = true; return render(); }
  let b = book();
  if (state.book === "__new") {
    const t = state.newTitle.trim();
    if (!t) { state.msg = "Hãy nhập tên sách mới."; state.err = true; return render(); }
    const same = BOOKS.find(x => x.id === slug(t));
    b = same || { id: slug(t), title: t, original: state.newOrig.trim(), author: state.newAuthor.trim(), lang: "en", pages: [] };
  }
  const next = b.pages.length ? b.pages[b.pages.length - 1].n + 1 : 1;
  const prev = b.pages[b.pages.length - 1];
  state.dup = null;
  // Dán chữ: kiểm tra trùng trước khi tốn lượt dùng Claude.
  if (!force && !hasImage) { const d = findDuplicate(state.draft, b.pages); if (d) return showDup(d); }
  state.busy = true; state.err = false; state.result = null; state.msg = "Claude đang đọc và dịch trang…"; state.ctl = new AbortController(); render();
  try {
    const reply = await sample(buildPrompt(b, b.lang, next, prev ? (prev.translation || []).join("\n").slice(-1500) : "", hasImage),
      { signal: state.ctl.signal, ...(hasImage ? { images: [state.file] } : {}),
        onText: ({ text }) => { const el = document.getElementById("status"); if (el) el.textContent = `Claude đang viết… (${text.length} ký tự)`; } });
    const out = parseTagged(reply.text);
    if (!out.translation.length || !out.source.length) throw { code: reply.truncated ? "truncated" : "invalid_json" };
    if (reply.truncated) throw { code: "truncated" };
    // Ảnh: chỉ biết chữ sau khi Claude đọc, nên kiểm tra trùng ở đây và giữ kết quả để khỏi dịch lại nếu người dùng vẫn muốn lưu.
    if (!force) { const d = findDuplicate((out.source || []).join(" "), b.pages); if (d) return showDup(d, { b, next, out }); }
    return await savePage(b, next, out);
  } catch (e) {
    state.err = true; state.msg = errVi(e) + (e && (e.code === "invalid_json" || e.code === "truncated") ? " Bấm dịch lại, hoặc cắt trang làm hai phần rồi dán lần lượt." : "");
  } finally { state.busy = false; render(); }
}

// Thử đọc bộ nhớ tạm ngay trong lần bấm (một số trình duyệt cho phép, iPhone có thể hiện bong bóng "Dán" để bấm).
// Nếu bị chặn thì quay về cách cũ: đưa con trỏ vào ô để người dùng tự dán.
async function pasteFromClipboard() {
  const fallback = why => { state.pasteHint = true; state.pasteWhy = why || ""; render(); };
  const cb = navigator.clipboard;
  if (state.busy) return;
  if (!cb) return fallback("không có quyền đọc bộ nhớ");
  try {
    if (canImage && cb.read) {
      try {
        for (const item of await cb.read()) {
          const type = item.types.find(t => t.startsWith("image/"));
          if (type) { state.file = new File([await item.getType(type)], "trang." + type.split("/")[1], { type }); state.draft = ""; state.pasteHint = false; return translate(); }
          if (item.types.includes("text/plain")) {
            const text = await (await item.getType("text/plain")).text();
            if (text.trim()) { state.draft = text; store.set("draft", text); state.file = null; state.pasteHint = false; return translate(); }
          }
        }
      } catch (e) { if (!cb.readText) throw e; }
    }
    const text = cb.readText ? await cb.readText() : "";
    if (!text.trim()) return fallback("bộ nhớ trống hoặc không đọc được");
    state.draft = text; store.set("draft", text); state.file = null; state.pasteHint = false;
    translate();
  } catch (e) { fallback("bị chặn: " + ((e && e.name) || "lỗi")); }
}

const rdKey = () => "rdpos:" + (book() ? book().id : "") + ":" + state.rdLang;
function readerHTML() {
  const b = book(); if (!b) return "";
  const vocab = items("tu-vung"), lang = state.rdLang;
  return b.pages.map(p => {
    const vt = viTerms(p);
    const src = p.source || [], vi = p.translation || [];
    const body = lang === "both"
      ? Array.from({ length: Math.max(src.length, vi.length) }, (_, i) => (src[i] ? `<p class="rd-src" lang="${esc(b.lang)}">${markNew(src[i], vocab, b.lang)}</p>` : "") + (vi[i] ? `<p>${markVi(vi[i], vt)}</p>` : "")).join("")
      : lang === "src" ? src.map(t => `<p lang="${esc(b.lang)}">${markNew(t, vocab, b.lang)}</p>`).join("") : vi.map(t => `<p>${markVi(t, vt)}</p>`).join("");
    return `<div class="rd-mark">Trang ${pad(p.n)}${p.label ? ` · trang sách ${esc(p.label)}` : ""}</div>${body}`;
  }).join("");
}
function layoutReader(keepFrac) {
  const view = document.getElementById("rdView"), c = document.getElementById("rdContent");
  const frac = keepFrac != null ? keepFrac : state.rdPages > 1 ? state.rdPage / (state.rdPages - 1) : 0;
  const W = view.clientWidth, G = 48;
  c.style.width = W + "px"; c.style.columnWidth = W + "px"; c.style.columnGap = G + "px"; c.style.fontSize = state.rdSize + "px";
  state.rdStep = W + G;
  state.rdPages = Math.max(1, Math.round((c.scrollWidth + G) / state.rdStep));
  goPage(Math.round(frac * (state.rdPages - 1)), false);
}
function goPage(n, anim = true) {
  const c = document.getElementById("rdContent");
  state.rdPage = Math.max(0, Math.min(state.rdPages - 1, n));
  c.classList.toggle("anim", anim);
  c.style.transform = `translateX(${-state.rdPage * state.rdStep}px)`;
  const pct = state.rdPages > 1 ? Math.round(state.rdPage / (state.rdPages - 1) * 100) : 100;
  document.getElementById("rdWhere").textContent = `Trang ${state.rdPage + 1} / ${state.rdPages}`;
  document.getElementById("rdPct").textContent = `${pct}%`;
  store.set(rdKey(), state.rdPages > 1 ? state.rdPage / (state.rdPages - 1) : 0);
}
function updateReader(frac) {
  const r = document.getElementById("reader");
  r.hidden = !state.rdOpen;
  if (!state.rdOpen) return;
  r.querySelectorAll("[data-rdlang]").forEach(x => x.setAttribute("aria-pressed", x.dataset.rdlang === state.rdLang));
  const rl = document.getElementById("rdLookup"); if (rl) rl.setAttribute("aria-pressed", state.rdLookup);
  document.getElementById("rdContent").innerHTML = readerHTML();
  document.getElementById("rdSheet").innerHTML = renderSheet(false) + renderTapSheet(false);
  layoutReader(frac);
}
function openReader() { stopSpeech(); state.rdOpen = true; state.pop = null; updateReader(store.get(rdKey(), 0)); }
document.getElementById("reader").addEventListener("click", e => {
  if (e.target.closest("button, [data-vk], .sheet")) {
    const b = e.target.closest("button");
    if (b && b.id === "rdLookup") { state.rdLookup = !state.rdLookup; store.set("rdLookup", state.rdLookup); b.setAttribute("aria-pressed", state.rdLookup); if (!state.rdLookup) { state.tap = null; state.pop = null; refreshSheets(); } e.stopPropagation(); return; }
    if (b && (b.id === "rdStart" || b.id === "rdEnd")) { e.stopPropagation(); return goPage(b.id === "rdEnd" ? state.rdPages - 1 : 0); }
    if (b && b.id === "closeReader") { state.rdOpen = false; state.pop = null; e.stopPropagation(); return render(); }
    if (b && b.dataset.rdlang) { state.rdLang = b.dataset.rdlang; store.set("rdLang", state.rdLang); e.stopPropagation(); return updateReader(store.get(rdKey(), 0)); }
    if (b && b.dataset.rdsize) { state.rdSize = Math.max(14, Math.min(28, state.rdSize + 2 * b.dataset.rdsize)); store.set("rdSize", state.rdSize); e.stopPropagation(); return layoutReader(); }
    return; // từ mới, nút trong khung giải nghĩa: để bộ xử lý chung lo
  }
  if (!e.target.closest("#rdView")) return;
  if (state.rdLookup) { const pEl = e.target.closest("p[lang]"); if (pEl && tapAt(e, pEl)) return; }
  if (state.pop || state.tap) { state.pop = null; state.tap = null; document.getElementById("rdSheet").innerHTML = ""; return; }
  const box = document.getElementById("rdView").getBoundingClientRect();
  goPage(state.rdPage + (e.clientX - box.left < box.width / 3 ? -1 : 1));
});
let touchX = null;
document.getElementById("rdView").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
document.getElementById("rdView").addEventListener("touchend", e => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 40) { goPage(state.rdPage + (dx < 0 ? 1 : -1)); e.preventDefault(); }
});

    let el = document.getElementById("errbar");
    if (!el) { el = document.createElement("div"); el.id = "errbar"; el.setAttribute("role", "alert"); document.body.appendChild(el); }
    el.innerHTML = `<span>Lỗi: ${esc(msg.slice(0, 160))}</span><button id="errClose" aria-label="Đóng">×</button>`; el.hidden = false;
  } catch (e) {}
}

document.addEventListener("click", e => {

    if (pend) { state.busy = true; state.err = false; state.msg = "Đang lưu…"; render(); return savePage(pend.b, pend.next, pend.out).catch(e => { state.err = true; state.msg = errVi(e); state.busy = false; render(); }); }
    return translate(true);
  }
  if (b.dataset.viewpage) { state.scrollTo = "p-" + b.dataset.viewpage; if (location.hash === "#ban-dich") return render(); location.hash = "#ban-dich"; return; }
  if (b.id === "retryInsight") { const bk = book(); return explain(state.result || (bk && bk.pages[bk.pages.length - 1])); }
  if (b.dataset.explain) return explain(dbPages.find(p => p.dbId === b.dataset.explain));
  if (b.id === "retryAnalyze") { const bk = book(); return analyze(state.result || (bk && bk.pages[bk.pages.length - 1])); }
  if (b.id === "fsUp" || b.id === "fsDown") { rs = Math.round(Math.max(0.8, Math.min(1.8, rs + (b.id === "fsUp" ? 0.1 : -0.1))) * 10) / 10; store.set("rs", rs); return applyRs(); }
  if (b.id === "importBtn") return void document.getElementById("importFile").click();
  if (b.id === "openReader") return openReader();
  if (b.id === "toTop") return window.scrollTo(0, 0);
  if (b.id === "toEnd") { const bk = book(), last = bk && bk.pages[bk.pages.length - 1], el = last && document.getElementById("p-" + last.n); return el ? el.scrollIntoView({ block: "start" }) : undefined; }
  if (b.id === "pasteBtn") return pasteFromClipboard();
  if (b.id === "clearDraft") { state.draft = ""; store.set("draft", ""); state.file = null; state.result = null; state.msg = ""; state.focusAdd = true; }
  if (b.id === "stop") return state.ctl && state.ctl.abort();
  if (b.dataset.view) { state.view = b.dataset.view; store.set("view", state.view); }
  else if (b.dataset.vk) { state.tap = null; state.pop = state.pop === b.dataset.vk ? null : b.dataset.vk; }
  else if (b.id === "closeTap") state.tap = null;
  else if (b.id === "tapAdd") return void addTapWord();
  else if (b.dataset.remember) { toggleKnown(b.dataset.remember, true); state.pop = null; }
  else if (b.id === "closePop") state.pop = null;
  else if (b.id === "dropImg") state.file = null;
  else if (b.dataset.del) {
    if (state.confirmDel !== b.dataset.del) state.confirmDel = b.dataset.del;
    else { state.confirmDel = null; db.collection("pages").doc(b.dataset.del).delete().catch(() => {}); }
  }
  else if (b.dataset.gopt !== undefined) return void gameChoose(+b.dataset.gopt);
  else if (b.id === "gcheck") return void gameCheckType();
  else if (b.id === "gnext") return void gameNext();
  else if (b.dataset.gchip !== undefined) return void gamePick(+b.dataset.gchip);
  else if (b.dataset.gunpick !== undefined) return void gameUnpick(+b.dataset.gunpick);
  else if (b.id === "lookupGo") return void lookupWord();
  else if (b.id === "lookupAdd") return void lookupAdd();
  else if (b.dataset.delword) { db.collection("words").doc(b.dataset.delword).delete().catch(() => {}); return; }
  else if (b.id === "errClose") { const el = document.getElementById("errbar"); if (el) el.hidden = true; return; }
  else if (b.id === "errRetry") { state.game = null; state.deck = null; }
  else if (b.id === "reviewNow") { state.mode[t] = "game"; state.game = null; state.deck = null; }
  else if (b.id === "grestart") startGame(t);
  else if (b.dataset.mode) { state.mode[t] = b.dataset.mode; state.deck = null; state.flipped = false; state.game = null; }
  else if (b.dataset.sort) { state.sort = b.dataset.sort; store.set("sort", state.sort); state.deck = null; state.flipped = false; }
  else if (b.dataset.filter) { state.filter = b.dataset.filter; state.deck = null; state.flipped = false; }
  else if (b.dataset.say) return speak(b.dataset.say);
  else if (b.dataset.known) toggleKnown(b.dataset.known, !known.has(b.dataset.known));
  else if (b.dataset.knownNext) { toggleKnown(b.dataset.knownNext, true); state.flipped = false; if (state.filter === "all") state.idx++; }
  else if (b.id === "again") { state.idx++; state.flipped = false; }

document.addEventListener("change", e => {

document.addEventListener("keydown", e => {

  if (e.target.id === "gtype" && e.key === "Enter") { e.preventDefault(); return gameCheckType(); }
  if (state.rdOpen && !state.pop && (e.key === "ArrowRight" || e.key === "ArrowLeft")) return goPage(state.rdPage + (e.key === "ArrowRight" ? 1 : -1));
  if (state.rdOpen && e.key === "Escape" && !state.pop) { state.rdOpen = false; return render(); }
  if (e.key === "Escape" && (state.pop || state.tap)) { state.pop = null; state.tap = null; return render(); }
  if (e.target.classList && e.target.classList.contains("nw") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.target.click(); return; } if (e.target.id === "card" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); state.flipped = !state.flipped; render(); } });

document.addEventListener("paste", e => {
  if (tab() !== "them-trang" || state.busy) return;
  const f = canImage && [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"))?.getAsFile();

    else setTimeout(() => { state.draft = e.target.value; store.set("draft", state.draft); state.pasteHint = false; state.autoGo ? translate() : render(); });

(async () => {
  const use = n => window.claude ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [d, s, u] = await Promise.all([use("db"), use("sample"), use("user")]);

  try { uid = u && u.id ? await u.id() : null; } catch (e) { uid = null; }
  pullKnown();
  if (s) canImage = !!(await s.limits().catch(() => null))?.images;
  if (db) db.collection("words").onSnapshot(snap => { dbWords = snap.docs.map(x => ({ ...x.data(), dbId: x.id })); render(); }, () => {});
  if (db) db.collection("pages").onSnapshot(snap => { dbPages = snap.docs.map(x => ({ ...x.data(), dbId: x.id })); render(); }, () => {});

// ---- Bản PWA: nạp sách từ IndexedDB, nhập tệp dữ liệu, đăng ký service worker ----
async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    const books = Array.isArray(d) ? d : d.books;
    if (!Array.isArray(books) || !books.length || !books.every(b => b && typeof b.id === "string" && Array.isArray(b.pages))) throw new Error("Tệp không đúng định dạng sổ tay");
    await idb.set("books", books); REPO_BOOKS = books;
    let note = `Đã nhập ${books.length} sách, ${books.reduce((n, b) => n + b.pages.length, 0)} trang.`;
    const pr = d.progress;
    if (pr && typeof pr === "object") {
      if (!known.size && !Object.keys(lv).length) {
        known.clear(); (pr.keys || []).forEach(k => known.add(k));
        lv = thaw(pr.lv); (pr.keys || []).forEach(k => { lv[k] = 3; }); due = thaw(pr.due); daily = thaw(pr.daily);
        touchKnown(); note += " Đã mang theo tiến độ học.";
      } else note += " Giữ nguyên tiến độ học đang có trên máy.";
    }
    if (!REPO_BOOKS.find(x => x.id === state.book)) { state.book = REPO_BOOKS[0].id; store.set("book", state.book); }
    state.notice = note; state.game = null; state.deck = null; render();
    setTimeout(() => { state.notice = ""; render(); }, 6000);
  } catch (e) { state.notice = "Không nhập được: " + (e && e.message ? e.message : "lỗi không rõ"); render(); }
}
if (PWA) {
  document.getElementById("importFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ""; });
  idb.get("books").then(b => { if (Array.isArray(b) && b.length) { REPO_BOOKS = b; if (!REPO_BOOKS.find(x => x.id === state.book)) state.book = REPO_BOOKS[0].id; render(); } }).catch(() => {});
