ame": "Nhấn mạnh bằng 'Even + danh từ'", "src": "Even lowly plankton is on the move"}], "hard": [{"mean": "Đến giữa thế kỷ, loài ve mang bệnh Lyme được dự báo sẽ lan từ vùng hiện chỉ có ở nam Ontario ra phần lớn Canada.", "parts": "Trạng ngữ thời gian: By midcentury. Chủ ngữ: Ixodes scapularis (đồng vị: the Lyme-disease-carrying tick). Vị ngữ: is projected to expand northward. Cụm 'from ... to ...' chỉ điểm xuất phát (chỗ đứng chân hiện nay ở nam Ontario) và điểm đến (phần lớn Canada).", "s": "By midcentury Ixodes scapularis—the Lyme-disease-carrying tick—is projected to expand northward from its current toehold in southern Ontario to much of Canada."}, {"mean": "Ở Biển Bắc, gần hai phần ba số loài cá đã hoặc chuyển lên vĩ độ cao hơn, hoặc lặn xuống vùng nước mát hơn.", "parts": "Trạng ngữ nơi chốn: In the North Sea (kèm đồng vị 'one of the world's most productive fisheries'). Chủ ngữ: nearly two-thirds of all fish species. Vị ngữ: have either shifted north in latitude or sunk down to cooler water depths (hai động từ nối bằng either...or).", "s": "In the North Sea—one of the world's most productive fisheries—nearly two-thirds of all fish species have either shifted north in latitude or sunk down to cooler water depths."}, {"mean": "Đến cuối thế kỷ, cá vược miệng nhỏ, hiện chỉ có gần biên giới Mỹ, sẽ sống đến tận Bắc Băng Dương.", "parts": "Trạng ngữ: By century's end. Chủ ngữ: the smallmouth bass (kèm cụm rút gọn 'today found only near the U.S. border'). Vị ngữ: is projected to live all the way to the Arctic Ocean ('all the way to' = đến tận).", "s": "By century's end the smallmouth bass, today found only near the U.S. border, is projected to live all the way to the Arctic Ocean."}]}, {"n": 11, "date": "2026-10-28", "source": ["years Atlantic warm-water species have pushed northward a staggering ten degrees of latitude—almost seven hundred miles—supplanting cold-water species that are in turn retreating north.", "The Displaced", "The 2007 sea-ice contraction triggered a new wave of public consternation about the future of polar bears, including an environmentalist push in the United States to classify them under the Endangered Species Act. This gesture, ultimately rebuffed by both the Bush and Obama administrations, was largely symbolic (far more polar bears live offshore"], "translation": ["... năm qua, các loài nước ấm ở Đại Tây Dương đã tiến lên phía bắc tới mười độ vĩ tuyến, một con số đáng kinh ngạc, tức gần bảy trăm dặm, và thế chỗ các loài nước lạnh, những loài này đến lượt mình lại phải rút lên phía bắc.", "Những kẻ bị đẩy khỏi nhà", "Việc băng biển thu hẹp năm 2007 đã làm dấy lên một làn sóng lo ngại mới trong công chúng về tương lai của loài gấu Bắc Cực, trong đó có một nỗ lực của các nhà bảo vệ môi trường ở Mỹ nhằm đưa chúng vào danh sách bảo vệ theo Đạo luật Các loài Nguy cấp. Động thái này, cuối cùng bị cả chính quyền Bush lẫn chính quyền Obama bác bỏ, chủ yếu mang tính biểu tượng (số gấu Bắc Cực sống ngoài khơi nhiều hơn rất nhiều ..."], "note": "Trang bị cắt giữa câu ở đầu và cuối nên giữ dấu '...'. 'The Displaced' là tiêu đề mục, nghĩa là những sinh vật (và con người) bị buộc rời nơi sống. Endangered Species Act (ESA) là đạo luật liên bang của Mỹ bảo vệ các loài nguy cấp. Bush và Obama là hai tổng thống Mỹ. Một độ vĩ tuyến xấp xỉ 69 dặm nên mười độ khoảng 700 dặm.", "vocab": [{"ex": "The cost of the project was staggering.", "ipa": "/ˈstæɡərɪŋ/", "mean": "gây choáng, đáng kinh ngạc (về quy mô)", "pos": "tính từ", "vi": "đáng kinh ngạc", "w": "staggering"}, {"ex": "Cities at high latitude have long winters.", "ipa": "/ˈlætɪtjuːd/", "mean": "vĩ độ, vĩ tuyến", "pos": "danh từ", "vi": "vĩ tuyến", "w": "latitude"}, {"ex": "Email has largely supplanted letters.", "ipa": "/səˈplænt/", "mean": "thay thế, chiếm chỗ (thường nhờ ưu thế hơn)", "pos": "động từ", "vi": "thế chỗ", "w": "supplant"}, {"ex": "The glacier is retreating every year.", "ipa": "/rɪˈtriːt/", "mean": "rút lui, lùi về", "pos": "động từ", "vi": "rút lên phía bắc", "w": "retreat"}, {"ex": "Floods left thousands of families displaced.", "ipa": "/dɪsˈpleɪst/", "mean": "bị buộc rời khỏi nơi ở, bị dịch chuyển", "pos": "tính từ", "vi": "bị đẩy khỏi nhà", "w": "displaced"}, {"ex": "The contraction of the economy worried investors.", "ipa": "/kənˈtrækʃn/", "mean": "sự co lại, thu hẹp", "pos": "danh từ", "vi": "thu hẹp", "w": "contraction"}, {"ex": "The news triggered a panic.", "ipa": "/ˈtrɪɡər/", "mean": "gây ra, kích hoạt", "pos": "động từ", "vi": "làm dấy lên", "w": "trigger"}, {"ex": "The sudden decision caused consternation among staff.", "ipa": "/ˌkɑːnstərˈneɪʃn/", "mean": "nỗi hoang mang, lo sợ bàng hoàng", "pos": "danh từ", "vi": "lo ngại", "w": "consternation"}, {"ex": "Environmentalists protested against the dam.", "ipa": "/ɪnˌvaɪrənˈmentəlɪst/", "mean": "nhà bảo vệ môi trường", "pos": "danh từ", "vi": "nhà bảo vệ môi trường", "w": "environmentalist"}, {"ex": "Scientists classify the plant as endangered.", "ipa": "/ˈklæsɪfaɪ/", "mean": "phân loại, xếp vào nhóm", "pos": "động từ", "vi": "đưa chúng vào danh sách", "w": "classify"}, {"ex": "The tiger is an endangered species.", "ipa": "/ɪnˈdeɪndʒərd/", "mean": "có nguy cơ tuyệt chủng", "pos": "tính từ", "vi": "Nguy cấp", "w": "endangered"}, {"ex": "The donation was a generous gesture.", "ipa": "/ˈdʒestʃər/", "mean": "động thái, hành động mang tính biểu thị", "pos": "danh từ", "vi": "động thái", "w": "gesture"}, {"ex": "She rebuffed his offer of help.", "ipa": "/rɪˈbʌf/", "mean": "khước từ, bác bỏ thẳng thừng", "pos": "động từ", "vi": "bác bỏ", "w": "rebuff"}, {"ex": "The new administration changed the policy.", "ipa": "/ədˌmɪnɪˈstreɪʃn/", "mean": "chính quyền (nhiệm kỳ của một tổng thống)", "pos": "danh từ", "vi": "chính quyền", "w": "administration"}, {"ex": "The fine was only symbolic.", "ipa": "/sɪmˈbɑːlɪk/", "mean": "mang tính biểu tượng, chủ yếu để làm dấu hiệu", "pos": "tính từ", "vi": "mang tính biểu tượng", "w": "symbolic"}], "patterns": [{"ex": "Prices rose g đó có nỗ lực ở Mỹ nhằm đưa chúng vào Đạo luật Các loài Nguy cấp.", "parts": "Chủ ngữ: The 2007 sea-ice contraction. Vị ngữ: triggered a new wave of public consternation. Bổ nghĩa: about the future of polar bears. Cụm 'including...' nêu một ví dụ cụ thể của làn sóng đó: an environmentalist push (nỗ lực của giới bảo vệ môi trường) to classify them under the Act (để xếp chúng vào diện được luật bảo vệ).", "s": "The 2007 sea-ice contraction triggered a new wave of public consternation about the future of polar bears, including an environmentalist push in the United States to classify them under the Endangered Species Act."}, {"mean": "Động thái này cuối cùng bị cả hai chính quyền bác bỏ và chủ yếu mang tính biểu tượng (vì số gấu sống ngoài khơi nhiều hơn rất nhiều ...", "parts": "Chủ ngữ: This gesture. Cụm phân từ chèn giữa: ultimately rebuffed by both... administrations (bị cả hai chính quyền bác bỏ). Vị ngữ: was largely symbolic. Trong ngoặc: far more polar bears live offshore... là lời giải thích vì sao nó mang tính biểu tượng, nhưng bị cắt ở cuối trang.", "s": "This gesture, ultimately rebuffed by both the Bush and Obama administrations, was largely symbolic (far more polar bears live offshore"}]}, {"n": 12, "date": "2026-10-28", "source": ["... adapted to live out their lives roaming on top of a frozen ocean. Their home is on the floating sea ice, hunting ringed seals, napping, and occasionally cavorting or mating with one another. Some females go onto land to give birth, but they otherwise spend as much time as possible out on the ice. Unlike other bears they do not hibernate through the winter. The lean time for polar bears is in summer, when the ice disintegrates and retreats. Forced ashore, they mostly fast and wait until it returns.", "There is growing evidence that the waiting and fasting periods are getting longer, leading to skinny bears, strange behavior (like wandering into towns), and even cannibalism. In 2004 biologists confirmed three occurrences of polar bears deliberately hunting and eating each other. In one case a large male bear pounded its forepaws through the den roof of a female, savagely bit into her head and neck, then dragged her off in a trail of blood to be devoured. Her cubs ..."], "translation": ["... đã thích nghi để sống trọn đời lang thang trên một đại dương đóng băng. Nhà của chúng là lớp băng biển trôi nổi, nơi chúng săn hải cẩu vòng, ngủ lơ mơ, và thỉnh thoảng nô đùa hoặc giao phối với nhau. Một số con cái lên đất liền để sinh con, nhưng ngoài việc đó ra thì chúng dành càng nhiều thời gian càng tốt ngoài băng. Không như các loài gấu khác, chúng không ngủ đông suốt mùa đông. Thời kỳ khó khăn của gấu Bắc Cực là mùa hè, khi băng tan rã và rút đi. Bị buộc phải vào bờ, phần lớn chúng nhịn ăn và chờ cho đến khi băng quay trở lại.", "Ngày càng có nhiều bằng chứng cho thấy những giai đoạn chờ đợi và nhịn ăn này đang kéo dài hơn, dẫn đến những con gấu gầy trơ xương, hành vi kỳ lạ (như lang thang vào các thị trấn), và thậm chí cả hiện tượng ăn thịt đồng loại. Năm 2004, các nhà sinh vật học đã xác nhận ba trường hợp gấu Bắc Cực cố ý săn và ăn thịt lẫn nhau. Trong một trường hợp, một con gấu đực to lớn đã đập hai chân trước xuyên qua mái hang của một con cái, cắn xé dã man vào đầu và cổ nó, rồi lôi nó đi để lại một vệt máu dài, để ăn thịt. Đàn con của nó ..."], "note": "Ringed seal (hải cẩu vòng) là con mồi chính của gấu Bắc Cực. 'Den' ở đây là hang gấu cái làm để sinh con (thường đào trong tuyết). Đoạn này tiếp nối ý 'những kẻ bị đẩy khỏi nhà': băng biển thu hẹp làm gấu đói và hành xử bất thường. 'Lean time' nghĩa bóng là thời kỳ thiếu thức ăn.", "vocab": [{"ex": "Dolphins were cavorting in the waves.", "ipa": "/kəˈvɔːrt/", "mean": "nô đùa, nhảy nhót vui vẻ", "pos": "động từ", "vi": "nô đùa", "w": "cavort"}, {"ex": "Some animals hibernate to save energy.", "ipa": "/ˈhaɪbərneɪt/", "mean": "ngủ đông", "pos": "động từ", "vi": "ngủ đông", "w": "hibernate"}, {"ex": "Farmers saved grain for the lean months.", "ipa": "/liːn/", "mean": "khó khăn, thiếu thốn (lean time); gầy", "pos": "tính từ", "vi": "khó khăn", "w": "lean"}, {"ex": "The old bridge began to disintegrate.", "ipa": "/dɪsˈɪntɪɡreɪt/", "mean": "tan rã, vỡ vụn", "pos": "động từ", "vi": "tan rã", "w": "disintegrate"}, {"ex": "Glaciers are retreating every year.", "ipa": "/rɪˈtriːt/", "mean": "rút lui, thu hẹp (về băng, sông băng)", "pos": "động từ", "vi": "rút đi", "w": "retreat"}, {"ex": "Bears fast while waiting for the ice.", "ipa": "/fæst/", "mean": "nhịn ăn", "pos": "động từ", "vi": "nhịn ăn", "w": "fast"}, {"ex": "Cannibalism is rare in most species.", "ipa": "/ˈkænɪbəlɪzəm/", "mean": "hiện tượng ăn thịt đồng loại", "pos": "danh từ", "vi": "hiện tượng ăn thịt đồng loại", "w": "cannibalism"}, {"ex": "Storms are a common occurrence here.", "ipa": "/əˈkɜːrəns/", "mean": "trường hợp xảy ra, sự việc", "pos": "danh từ", "vi": "trường hợp", "w": "occurrence"}, {"ex": "He deliberately ignored the warning.", "ipa": "/dɪˈlɪbərətli/", "mean": "cố ý, có chủ ý", "pos": "trạng từ", "vi": "cố ý", "w": "deliberately"}, {"ex": "Waves pounded the rocks.", "ipa": "/paʊnd/", "mean": "đập mạnh, nện liên tục", "pos": "động từ", "vi": "đập", "w": "pound"}, {"ex": "The cat injured its left forepaw.", "ipa": "/ˈfɔːrpɔː/", "mean": "chân trước (của thú)", "pos": "danh từ", "vi": "chân trước", "w": "forepaw"}, {"ex": "The fox returned to its den.", "ipa": "/den/", "mean": "hang, ổ (của thú dữ)", "pos": "danh từ", "vi": "hang", "w": "den"}, {"ex": "The dog was savagely attacked.", "ipa": "/ˈsævɪdʒli/", "mean": "một cách dã man, hung tợn", "pos": "trạng từ", "vi": "dã man", "w": "savagely"}, {"ex": "The lion devoured its prey.", "ipa": "/dɪˈvaʊər/", "mean": "ngốn ngấu, ăn tươi nuốt sống", "pos": "động từ", "vi": "để ăn thịt", "w": "devour"}], "patterns": [{"ex": "Unlike his brother, she enjoys cold weather.", "exVi": "Không như anh trai, cô ấy thích thời tiết lạnh.", "explain": "'Unlike' (không giống như) nêu sự khác biệt giữa chủ ngữ và đối tượng được so sánh, đứng đầu câu và theo sau là dấu phẩy.", "formula": "Unlike + N, S + V", "name": "Unlike + danh từ (đối lập)", "src": "Unlike other bears they do not hibernate through the winter."}, {"ex": "Trapped by the snow, the hikers waited for help.", "exVi": "Bị kẹt trong tuyết, những người đi bộ đường dài chờ cứu hộ.", "explain": "Rút gọn mệnh đề bị động: 'Because they are forced ashore'. Chủ ngữ của cụm này trùng với chủ ngữ mệnh đề chính.", "formula": "V-ed + trạng ngữ, S + V", "name": "Cụm quá khứ phân từ đầu câu", "src": "Forced ashore, they mostly fast and wait until it returns."}, {"ex": "There is growing evidence that sleep affects memory.", "exVi": "Ngày càng có nhiều bằng chứng cho thấy giấc ngủ ảnh hưởng đến trí nhớ.", "explain": "Cấu trúc học thuật: 'ngày càng có nhiều bằng chứng cho thấy...'. 'growing' diễn tả mức độ tăng dần.", "formula": "There is growing evidence that + mệnh đề", "name": "There is growing evidence that...", "src": "There is growing evidence that the waiting and fasting periods are getting longer"}, {"ex": "Prices rose sharply, leading to protests.", "exVi": "Giá tăng mạnh, dẫn đến các cuộc biểu tình.", "explain": "'leading to' bổ sung kết quả của vế trước, tương đương 'which leads to'. Thường dùng trong văn viết.", "formula": "mệnh đề, V-ing + N", "name": "Phân từ hiện tại chỉ kết quả", "src": "getting longer, leading to skinny bears, strange behavior ... and even cannibalism"}, {"ex": "She spends as much time as possible with her family.", "exVi": "Cô ấy dành càng nhiều thời gian càng tốt cho gia đình.", "explain": "So sánh bằng với 'as ... as possible' nghĩa là 'càng nhiều... càng tốt'.", "formula": "spend as much N as possible + (on/doing)", "name": "spend as much time as possible + V-ing/trạng ngữ", "src": "they otherwise spend as much time as possible out on the ice"}], "hard": [{"mean": "Một con gấu đực lớn đập xuyên mái hang của con cái, cắn nó dã man rồi lôi đi để ăn thịt.", "parts": "Chủ ngữ: a large male bear. Ba động từ nối tiếp cùng chủ ngữ: (1) pounded its forepaws through the den roof of a female (đập chân trước xuyên qua mái hang), (2) savagely bit into her head and neck (cắn dã man vào đầu và cổ), (3) dragged her off in a trail of blood (lôi đi, để lại vệt máu). 'to be devoured' là to-V bị động chỉ mục đích.", "s": "In one case a large male bear pounded its forepaws through the den roof of a female, savagely bit into her head and neck, then dragged her off in a trail of blood to be devoured."}, {"mean": "Thời kỳ khan hiếm thức ăn của gấu Bắc Cực là mùa hè, khi băng tan rã và rút đi.", "parts": "Chủ ngữ: The lean time for polar bears. Vị ngữ: is in summer. Mệnh đề quan hệ chỉ thời gian 'when the ice disintegrates and retreats' bổ nghĩa cho 'summer'.", "s": "The lean time for polar bears is in summer, when the ice disintegrates and retreats."}]}, {"n": 13, "date": "2026-10-28", "source": ["...were buried and suffocated in the rubble. Such behavior had never been seen before during the scientists' thirty-four years of research in the area.", "The problem is that the bears' favorite prey, ringed seals, also require sea ice. They spend their time either resting on top of it (and watching out for polar bears), or swimming beneath it looking for Arctic cod. The Arctic cod lurks under and along the edges of the ice, watching out for ringed seals while chasing amphipods, copepods, and krill. Those little creatures in turn graze on tiny flagellates and diatoms that grow on the underside of the ice, and also bloom profusely in the water alongside its melting edge. This entire food chain—from microscopic phytoplankton to a thousand-pound polar bear—is inextricably linked to the presence of sea ice. Walruses, bearded seals, and other species also use sea ice, though none so specifically as do polar bears, ringed seals, and Arctic cod."], "translation": ["... bị chôn vùi và chết ngạt trong đống đổ nát. Hành vi như vậy chưa từng được ghi nhận trong suốt ba mươi bốn năm nghiên cứu của các nhà khoa học trong khu vực này.", "Vấn đề là con mồi ưa thích của gấu, tức hải cẩu vòng, cũng cần đến băng biển. Chúng dành thời gian hoặc để nghỉ ngơi trên mặt băng (và canh chừng gấu Bắc Cực), hoặc để bơi bên dưới băng tìm cá tuyết Bắc Cực. Cá tuyết Bắc Cực rình rập bên dưới và dọc theo rìa băng, vừa đề phòng hải cẩu vòng vừa đuổi bắt các loài giáp xác chân khác nhau, giáp xác chân chèo và nhuyễn thể. Những sinh vật nhỏ bé đó lại gặm ăn các loài trùng roi và tảo cát li ti mọc ở mặt dưới của băng, và chúng cũng nở rộ ồ ạt trong làn nước dọc theo rìa băng đang tan. Toàn bộ chuỗi thức ăn này, từ thực vật phù du cực nhỏ đến một con gấu Bắc Cực nặng hàng nghìn pound, đều gắn chặt không thể tách rời với sự hiện diện của băng biển. Hải mã, hải cẩu râu và các loài khác cũng sử dụng băng biển, nhưng không loài nào phụ thuộc cụ thể như gấu Bắc Cực, hải cẩu vòng và cá tuyết Bắc Cực."], "note": "Ringed seal = hải cẩu vòng; bearded seal = hải cẩu râu; Arctic cod = cá tuyết Bắc Cực (Boreogadus saida). Amphipod (giáp xác chân khác loài), copepod (giáp xác chân chèo), krill (nhuyễn thể), flagellate (trùng roi), diatom (tảo cát), phytoplankton (thực vật phù du) là thuật ngữ sinh học biển. Một pound ≈ 0,45 kg nên 1.000 pound ≈ 450 kg.", "vocab": [{"ex": "The miners nearly suffocated in the collapsed tunnel.", "ipa": "/ˈsʌfəkeɪt/", "mean": "chết ngạt, làm ngạt thở", "pos": "động từ", "vi": "chết ngạt", "w": "suffocate"}, {"ex": "Rescuers searched the rubble for survivors.", "ipa": "/ˈrʌbl/", "mean": "đống đổ nát, gạch đá vụn", "pos": "danh từ", "vi": "đống đổ nát", "w": "rubble"}, {"ex": "Rabbits are the fox's main prey.", "ipa": "/preɪ/", "mean": "con mồi", "pos": "danh từ", "vi": "con mồi", "w": "prey"}, {"ex": "A crocodile lurked beneath the surface.", "ipa": "/lɜːrk/", "mean": "rình rập, ẩn nấp", "pos": "động từ", "vi": "rình rập", "w": "lurk"}, {"ex": "The dog chased the ball across the yard.", "ipa": "/tʃeɪs/", "mean": "đuổi bắt, săn đuổi", "pos": "động từ", "vi": "đuổi bắt", "w": "chase"}, {"ex": "Amphipods are an important food for many fish.", "ipa": "/ˈæmfɪpɒd/", "mean": "giáp xác chân khác (loài giáp xác nhỏ)", "pos": "danh từ", "vi": "giáp xác chân khác", "w": "amphipod"}, {"ex": "Copepods are among the most numerous animals in the ocean.", "ipa": "/ˈkoʊpɪpɒd/", "mean": "giáp xác chân chèo", "pos": "danh từ", "vi": "giáp xác chân chèo", "w": "copepod"}, {"ex": "Whales filter huge amounts of krill from the water.", "ipa": "/krɪl/", "mean": "nhuyễn thể (loài giáp xác nhỏ giống tôm)", "pos": "danh từ", "vi": "nhuyễn thể", "w": "krill"}, {"ex": "Small animals graze on algae growing on rocks.", "ipa": "/ɡreɪz ɒn/", "mean": "gặm ăn, ăn (cỏ, tảo) liên tục", "pos": "cụm động từ", "vi": "gặm ăn", "w": "graze on"}, {"ex": "Some flagellates can photosynthesize.", "ipa": "/ˈflædʒəlɪt/", "mean": "sinh vật đơn bào có roi, trùng roi", "pos": "danh từ", "vi": "trùng roi", "w": "flagellate"}, {"ex": "Diatoms have cell walls made of silica.", "ipa": "/ˈdaɪətɒm/", "mean": "tảo cát", "pos": "danh từ", "vi": "tảo cát", "w": "diatom"}, {"ex": "Algae bloom in warm, nutrient-rich water.", "ipa": "/bluːm/", "mean": "nở rộ, phát triển bùng nổ (về tảo)", "pos": "động từ", "vi": "nở rộ", "w": "bloom"}, {"ex": "The flowers bloomed profusely in spring.", "ipa": "/prəˈfjuːsli/", "mean": "dồi dào, ồ ạt, rất nhiều", "pos": "trạng từ", "vi": "ồ ạt", "w": "profusely"}, {"ex": "Microscopic organisms live in every drop of seawater.", "ipa": "/ˌmaɪkrəˈskɒpɪk/", "mean": "cực nhỏ, chỉ thấy qua kính hiển vi", "pos": "tính từ", "vi": "cực nhỏ", "w": "microscopic"}, {"ex": "Culture and language are inextricably linked.", "ipa": "/ˌɪnɪkˈstrɪkəbli/", "mean": "không thể tách rời", "pos": "trạng từ", "vi": "không thể tách rời", "w": "inextricably"}], "patterns": [{"ex": "She spends her evenings either reading novels or watching documentaries.", "exVi": "Cô ấy dành các buổi tối hoặc để đọc tiểu thuyết hoặc để xem phim tài liệu.", "explain": "Dùng 'either... or...' để nêu hai hoạt động thay thế nhau; hai vế phải song song (cùng dạng V-ing). 'Spend time + V-ing' nghĩa là dành thời gian làm gì.", "formula": "spend time + either V-ing A, or V-ing B", "name": "Cấu trúc 'either... or...' với V-ing", "src": "They spend their time either resting on top of it..., or swimming beneath it looking for Arctic cod."}, {"ex": "He listened to music while cooking dinner.", "exVi": "Anh ấy vừa nghe nhạc vừa nấu bữa tối.", "explain": "Rút gọn mệnh đề trạng ngữ: chủ ngữ giống nhau nên bỏ chủ ngữ và 'be', giữ 'while + V-ing' để diễn tả hai hành động xảy ra cùng lúc.", "formula": "S + V + while + V-ing", "name": "Cụm phân từ chỉ đồng thời (while + V-ing)", "src": "...watching out for ringed seals while chasing amphipods, copepods, and krill."}, {"ex": "Teachers influence students, who in turn influence their families.", "exVi": "Giáo viên ảnh hưởng đến học sinh, và đến lượt học sinh lại ảnh hưởng đến gia đình mình.", "explain": "'In turn' nghĩa là 'đến lượt chúng, lại', dùng để nối các mắt xích nối tiếp nhau trong chuỗi quan hệ.", "formula": "A..., B in turn + V", "name": "Cụm 'in turn'", "src": "Those little creatures in turn graze on tiny flagellates and diatoms..."}, {"ex": "Many students work hard, though none so diligently as does Mai.", "exVi": "Nhiều học sinh học chăm chỉ, nhưng không ai chăm bằng Mai.", "explain": "Dạng so sánh bằng phủ định rút gọn ('none use sea ice so specifically as do...'). 'As do + S' là đảo ngữ mang tính văn viết sau 'as'.", "formula": "none so + adv + as do + S", "name": "Đảo ngữ sau 'none so... as'", "src": "...though none so specifically as do polar bears, ringed seals, and Arctic cod."}, {"ex": "Economic growth is closely linked to education.", "exVi": "Tăng trưởng kinh tế gắn chặt với giáo dục.", "explain": "Cấu trúc bị động dùng để nói hai thứ có liên hệ; trạng từ như 'inextricably' đặt giữa 'be' và phân từ để nhấn mạnh mức độ.", "formula": "S + be + (adv) + linked to + N", "name": "Bị động với 'be linked to'", "src": "This entire food chain... is inextricably linked to the presence of sea ice."}], "hard": [{"mean": "Trong suốt 34 năm nghiên cứu ở khu vực đó, các nhà khoa học chưa từng thấy hành vi nào như vậy.", "parts": "Chủ ngữ: Such behavior (hành vi như vậy). Vị ngữ: had never been seen before (quá khứ hoàn thành bị động). Trạng ngữ thời gian: during the scientists' thirty-four years of research in the area.", "s": "Such behavior had never been seen before during the scientists' thirty-four years of research in the area."}, {"mean": "Những sinh vật nhỏ đó lại ăn các trùng roi và tảo cát nhỏ xíu, là những loài mọc ở mặt dưới băng và cũng nở rộ ồ ạt trong nước dọc rìa băng đang tan.", "parts": "Chủ ngữ: Those little creatures. Vị ngữ 1: graze on tiny flagellates and diatoms. Mệnh đề quan hệ 'that' có hai động từ song song: (that) grow on the underside of the ice, and also bloom profusely in the water... Chủ ngữ của 'bloom' là flagellates and diatoms, không phải 'creatures'.", "s": "Those little creatures in turn graze on tiny flagellates and diatoms that grow on the underside of the ice, and also bloom profusely in the water alongside its melting edge."}, {"mean": "Toàn bộ chuỗi thức ăn này, từ thực vật phù du cực nhỏ đến gấu Bắc Cực nặng cả nghìn pound, đều gắn chặt với sự tồn tại của băng biển.", "parts": "Chủ ngữ: This entire food chain. Phần chêm giữa hai dấu gạch ngang: from microscopic phytoplankton to a thousand-pound polar bear (nêu phạm vi). Vị ngữ: is inextricably linked to the presence of sea ice.", "s": "This entire food chain—from microscopic phytoplankton to a thousand-pound polar bear—is inextricably linked to the presence of sea ice."}]}, {"n": 14, "date": "2026-10-28", "source": ["Despite growing evidence of stress (like bear cannibalism), none of these species is in immediate risk of extinction. But there is little question that if the summertime sea-ice fades completely, then these amazing creatures will fade right along with it. Government scientists, in a report to aid the Bush administration's decision on the proposed Endangered Species Act listing, estimate that two-thirds of the world's polar bears will be gone by 2050.", "From these and other indications worldwide, climate change is forcing a massive ecological reorganization of the planet, with both extinctions and expansions now under way. Depending on the emission scenario used, one model projects that anywhere from 15% to 37% of the world's species will be committed to climate-change extinction by 2050. If these numbers hold true, they are devastating—roughly comparable to the impacts of deforestation and other direct forms of habitat loss. When combined ..."], "translation": ["Dù có ngày càng nhiều bằng chứng về áp lực sinh tồn (như hiện tượng gấu ăn thịt đồng loại), không loài nào trong số này đang đứng trước nguy cơ tuyệt chủng tức thời. Nhưng gần như chắc chắn rằng nếu băng biển mùa hè tan hẳn, những sinh vật tuyệt vời này cũng sẽ lụi tàn theo nó. Các nhà khoa học chính phủ, trong một báo cáo nhằm hỗ trợ chính quyền Bush ra quyết định về đề xuất đưa vào danh sách của Đạo luật về các loài nguy cấp, ước tính rằng hai phần ba số gấu Bắc Cực trên thế giới sẽ biến mất vào năm 2050.", "Từ những dấu hiệu này và nhiều dấu hiệu khác trên khắp thế giới, biến đổi khí hậu đang buộc hành tinh phải trải qua một cuộc tái tổ chức sinh thái quy mô lớn, trong đó cả sự tuyệt chủng lẫn sự mở rộng của các loài đều đang diễn ra. Tùy vào kịch bản phát thải được dùng, một mô hình dự báo rằng từ 15% đến 37% số loài trên thế giới sẽ bị định sẵn phải tuyệt chủng do biến đổi khí hậu vào năm 2050. Nếu những con số này đúng, chúng thật tàn khốc, gần tương đương với tác động của nạn phá rừng và các hình thức mất môi trường sống trực tiếp khác. Khi kết hợp với ..."], "note": "Bush administration: chính quyền Tổng thống George W. Bush (Mỹ). Endangered Species Act (ESA): Đạo luật về các loài nguy cấp của Mỹ; 'listing' là việc đưa một loài vào danh sách được bảo vệ. 'Committed to extinction' nghĩa là dù loài đó chưa biến mất, các điều kiện hiện tại đã khiến nó chắc chắn tuyệt chủng trong tương lai. 'These species' ở đầu trang nói đến các loài phụ thuộc băng biển ở trang trước (gấu Bắc Cực, hải cẩu vòng, cá tuyết Bắc Cực).", "vocab": [{"ex": "Cannibalism is seen in some fish when food is scarce.", "ipa": "/ˈkænɪbəlɪzəm/", "mean": "hiện tượng ăn thịt đồng loại", "pos": "danh từ", "vi": "ăn thịt đồng loại", "w": "cannibalism"}, {"ex": "Many frogs face extinction because of disease.", "ipa": "/ɪkˈstɪŋkʃn/", "mean": "sự tuyệt chủng", "pos": "danh từ", "vi": "sự tuyệt chủng", "w": "extinction"}, {"ex": "There is no immediate danger to the town.", "ipa": "/ɪˈmiːdiət/", "mean": "tức thời, trước mắt", "pos": "tính từ", "vi": "tức thời", "w": "immediate"}, {"ex": "The colours faded after years in the sun.", "ipa": "/feɪd/", "mean": "mờ dần, tan dần, lụi tàn", "pos": "động từ", "vi": "lụi tàn", "w": "fade"}, {"ex": "The new administration changed the tax policy.", "ipa": "/ədˌmɪnɪˈstreɪʃn/", "mean": "chính quyền (một nhiệm kỳ tổng thống)", "pos": "danh từ", "vi": "chính quyền", "w": "administration"}, {"ex": "The proposed law will protect wetlands.", "ipa": "/prəˈpəʊzd/", "mean": "được đề xuất", "pos": "tính từ", "vi": "đề xuất", "w": "proposed"}, {"ex": "The listing of the species gave it legal protection.", "ipa": "/ˈlɪstɪŋ/", "mean": "việc đưa vào danh sách (bảo vệ)", "pos": "danh từ", "vi": "đưa vào danh sách", "w": "listing"}, {"ex": "Experts estimate that the glacier will vanish by 2100.", "ipa": "/ˈestɪmeɪt/", "mean": "ước tính", "pos": "động từ", "vi": "ước tính", "w": "estimate"}, {"ex": "There are clear indications of a warming trend.", "ipa": "/ˌɪndɪˈkeɪʃn/", "mean": "dấu hiệu, chỉ báo", "pos": "danh từ", "vi": "dấu hiệu", "w": "indication"}, {"ex": "The company announced a major reorganization.", "ipa": "/riːˌɔːɡənaɪˈzeɪʃn/", "mean": "sự tái tổ chức, sắp xếp lại", "pos": "danh từ", "vi": "tái tổ chức", "w": "reorganization"}, {"ex": "The expansion of deserts threatens farmland.", "ipa": "/ɪkˈspænʃn/", "mean": "sự mở rộng (phạm vi phân bố)", "pos": "danh từ", "vi": "sự mở rộng", "w": "expansion"}, {"ex": "Car emissions are a major source of pollution.", "ipa": "/ɪˈmɪʃn/", "mean": "sự phát thải", "pos": "danh từ", "vi": "phát thải", "w": "emission"}, {"ex": "In the worst-case scenario, sea levels rise by a metre.", "ipa": "/səˈnɑːriəʊ/", "mean": "kịch bản", "pos": "danh từ", "vi": "kịch bản", "w": "scenario"}, {"ex": "The model projects higher temperatures next decade.", "ipa": "/prəˈdʒekt/", "mean": "dự báo, dự đoán", "pos": "động từ", "vi": "dự báo", "w": "project"}, {"ex": "Deforestation destroys the homes of many animals.", "ipa": "/diːˌfɒrɪˈsteɪʃn/", "mean": "nạn phá rừng", "pos": "danh từ", "vi": "nạn phá rừng", "w": "deforestation"}, {"ex": "Wetlands are an important habitat for birds.", "ipa": "/ˈhæbɪtæt/", "mean": "môi trường sống", "pos": "danh từ", "vi": "môi trường sống", "w": "habitat"}], "patterns": [{"ex": "Despite the heavy rain, the match went ahead.", "exVi": "Mặc dù mưa lớn, trận đấu vẫn diễn ra.", "explain": "Despite nghĩa là 'mặc dù', theo sau là cụm danh từ hoặc V-ing, không dùng mệnh đề đầy đủ. Diễn tả sự tương phản giữa hai ý.", "formula": "Despite + N/V-ing, mệnh đề chính", "name": "Despite + cụm danh từ (nhượng bộ)", "src": "Despite growing evidence of stress (like bear cannibalism), none of these species is in immediate risk of extinction."}, {"ex": "There is little question that if prices rise, demand will fall.", "exVi": "Gần như chắc chắn rằng nếu giá tăng thì nhu cầu sẽ giảm.", "explain": "'There is little question that...' nghĩa là 'hầu như không có nghi ngờ gì rằng...'. Bên trong là câu điều kiện loại 1 (if + hiện tại, will + động từ) nói về khả năng có thể xảy ra trong tương lai.", "formula": "There is little question that + if + S + V (hiện tại), S + will + V", "name": "Câu điều kiện loại 1 với 'there is little question'", "src": "there is little question that if the summertime sea-ice fades completely, then these amazing creatures will fade right along with it."}, {"ex": "Depending on the weather, we may cancel the trip.", "exVi": "Tùy vào thời tiết, chúng tôi có thể hủy chuyến đi.", "explain": "Cụm phân từ mang nghĩa 'tùy thuộc vào', đặt đầu câu để nêu yếu tố làm kết quả thay đổi. 'Used' là quá khứ phân từ rút gọn, bổ nghĩa cho 'scenario' (được sử dụng).", "formula": "Depending on + N, mệnh đề", "name": "Depending on + danh từ", "src": "Depending on the emission scenario used, one model projects that anywhere from 15% to 37% ..."}, {"ex": "The city is committed to higher sea levels even if emissions stop.", "exVi": "Thành phố đã bị định sẵn phải đối mặt với mực nước biển cao hơn dù khí thải có dừng lại.", "explain": "Ở đây 'be committed to' mang nghĩa bị động: bị định sẵn, chắc chắn sẽ dẫn đến. Khác với nghĩa thông thường 'cam kết, tận tâm'.", "formula": "S + be committed to + N", "name": "Câu bị động với 'be committed to'", "src": "15% to 37% of the world's species will be committed to climate-change extinction by 2050."}, {"ex": "If this result holds true, it is a major breakthrough.", "exVi": "Nếu kết quả này đúng thì đó là một bước đột phá lớn.", "explain": "'Hold true' nghĩa là 'đúng, còn giá trị'. 'Comparable to' nghĩa là 'có thể so sánh với, tương đương với'.", "formula": "If + S + hold true, S + be + adj", "name": "If these numbers hold true (điều kiện loại 1)", "src": "If these numbers hold true, they are devastating—roughly comparable to ..."}], "hard": [{"mean": "Các nhà khoa học chính phủ, trong báo cáo hỗ trợ quyết định của chính quyền Bush về việc đưa gấu Bắc Cực vào danh sách bảo vệ, ước tính hai phần ba số gấu sẽ biến mất vào năm 2050.", "parts": "Chủ ngữ: Government scientists. Cụm xen giữa: in a report to aid the Bush administration's decision on the proposed ... listing (trong một báo cáo nhằm hỗ trợ quyết định...). Vị ngữ: estimate. Mệnh đề danh từ làm tân ngữ: that two-thirds of the world's polar bears will be gone by 2050.", "s": "Government scientists, in a report to aid the Bush administration's decision on the proposed Endangered Species Act listing, estimate that two-thirds of the world's polar bears will be gone by 2050."}, {"mean": "Dựa trên các dấu hiệu đó, biến đổi khí hậu đang buộc hành tinh tái tổ chức sinh thái quy mô lớn, với cả sự tuyệt chủng và sự mở rộng đang diễn ra.", "parts": "Trạng ngữ: From these and other indications worldwide. Chủ ngữ: climate change. Vị ngữ: is forcing a massive ecological reorganization of the planet. Cụm 'with' bổ sung hoàn cảnh đi kèm: with both extinctions and expansions now under way.", "s": "From these and other indications worldwide, climate change is forcing a massive ecological reorganization of the planet, with both extinctions and expansions now under way."}, {"mean": "Nếu các con số này đúng thì chúng thật tàn khốc, gần tương đương tác động của nạn phá rừng và các hình thức mất môi trường sống trực tiếp khác.", "parts": "Mệnh đề điều kiện: If these numbers hold true. Mệnh đề chính: they are devastating. Cụm sau dấu gạch ngang bổ sung: roughly comparable to the impacts of deforestation and other direct forms of habitat loss.", "s": "If these numbers hold true, they are devastating—roughly comparable to the impacts of deforestation and other direct forms of habitat loss."}]}, {"n": 15, "date": "2026-10-28", "source": ["... with all the other species extinctions since the last ice age, they will mark the sixth great mass extinction on Earth—and the first since the Cretaceous-Tertiary extinction that ended the dinosaurs some sixty-five million years ago.", "The mechanisms for climate-change extinction are many. Amphibians and wetland species are especially vulnerable to droughts. As temperatures rise, polar and alpine species have literally nowhere left to go once pushed off the brink of the northernmost coast or highest mountain peak. A less direct mechanism is the decoupling of codependent species within a food web (called \"match-mismatch\" by ecologists) when their respective phenological cycles fall out of whack. Imagine birds migrating to their accustomed nesting area only to find that the caterpillar hatch they were planning to gorge on has already come and gone, for example. Another is that warmer temperatures tend to enable insect pests, invasive species, disease, and robust ..."], "translation": ["... cùng với tất cả các vụ tuyệt chủng loài khác kể từ kỷ băng hà cuối cùng, chúng sẽ đánh dấu cuộc đại tuyệt chủng hàng loạt lần thứ sáu trên Trái Đất, và là lần đầu tiên kể từ vụ tuyệt chủng kỷ Phấn Trắng–Đệ Tam đã chấm dứt thời đại khủng long khoảng sáu mươi lăm triệu năm trước.", "Cơ chế gây tuyệt chủng do biến đổi khí hậu rất đa dạng. Các loài lưỡng cư và loài sống ở vùng đất ngập nước đặc biệt dễ bị tổn thương trước hạn hán. Khi nhiệt độ tăng lên, các loài ở vùng cực và vùng núi cao thực sự không còn nơi nào để đi khi bị đẩy đến bờ vực của bờ biển cực bắc hay đỉnh núi cao nhất. Một cơ chế gián tiếp hơn là sự tách rời giữa các loài phụ thuộc lẫn nhau trong một lưới thức ăn (các nhà sinh thái học gọi là \"lệch pha\" – match-mismatch), khi chu kỳ vật hậu học của chúng không còn khớp nhau. Chẳng hạn, hãy hình dung những con chim di cư đến khu vực làm tổ quen thuộc, rồi phát hiện đợt sâu bướm nở mà chúng định ăn thật no đã qua mất rồi. Một cơ chế khác là nhiệt độ ấm hơn có xu hướng tạo điều kiện cho côn trùng gây hại, loài xâm lấn, dịch bệnh và những ..."], "note": "Cretaceous-Tertiary (K-T) extinction: vụ tuyệt chủng cuối kỷ Phấn Trắng, nay thường gọi là K-Pg. \"Match-mismatch\" là thuật ngữ sinh thái học về sự lệch pha giữa thời điểm của các loài trong chuỗi thức ăn. Câu đầu bị cắt từ trang trước nên giữ dấu \"...\".", "vocab": [{"ex": "The extinction of the dodo happened in the 17th century.", "ipa": "/ɪkˈstɪŋkʃən/", "mean": "sự tuyệt chủng", "pos": "danh từ", "vi": "tuyệt chủng", "w": "extinction"}, {"ex": "Scientists warn of a mass extinction of marine life.", "ipa": "/mæs ɪkˈstɪŋkʃən/", "mean": "đại tuyệt chủng hàng loạt", "pos": "cụm danh từ", "vi": "đại tuyệt chủng hàng loạt", "w": "mass extinction"}, {"ex": "Frogs are amphibians that live on land and in water.", "ipa": "/æmˈfɪbiən/", "mean": "loài lưỡng cư", "pos": "danh từ", "vi": "loài lưỡng cư", "w": "amphibian"}, {"ex": "The wetland protects the town from floods.", "ipa": "/ˈwetlænd/", "mean": "vùng đất ngập nước", "pos": "danh từ", "vi": "vùng đất ngập nước", "w": "wetland"}, {"ex": "Young trees are vulnerable to strong winds.", "ipa": "/ˈvʌlnərəbl/", "mean": "dễ bị tổn thương", "pos": "tính từ", "vi": "dễ bị tổn thương", "w": "vulnerable"}, {"ex": "Alpine flowers bloom briefly in summer.", "ipa": "/ˈælpaɪn/", "mean": "thuộc núi cao", "pos": "tính từ", "vi": "vùng núi cao", "w": "alpine"}, {"ex": "The species is on the brink of extinction.", "ipa": "/brɪŋk/", "mean": "bờ vực, mép", "pos": "danh từ", "vi": "bờ vực", "w": "brink"}, {"ex": "The decoupling of growth from emissions is a key goal.", "ipa": "/diːˈkʌplɪŋ/", "mean": "sự tách rời, mất liên kết", "pos": "danh từ", "vi": "sự tách rời", "w": "decoupling"}, {"ex": "Bees and flowering plants are codependent.", "ipa": "/ˌkoʊdɪˈpendənt/", "mean": "phụ thuộc lẫn nhau", "pos": "tính từ", "vi": "phụ thuộc lẫn nhau", "w": "codependent"}, {"ex": "Phenological changes include earlier flowering in spring.", "ipa": "/ˌfiːnəˈlɒdʒɪkl/", "mean": "thuộc vật hậu học (thời điểm sinh học theo mùa)", "pos": "tính từ", "vi": "vật hậu học", "w": "phenological"}, {"ex": "Her sleep schedule is completely out of whack.", "ipa": "/aʊt əv wæk/", "mean": "lệch lạc, không còn cân bằng", "pos": "thành ngữ (thân mật)", "vi": "không còn khớp nhau", "w": "out of whack"}, {"ex": "The fish feed on the summer mayfly hatch.", "ipa": "/hætʃ/", "mean": "đợt nở (trứng)", "pos": "danh từ", "vi": "đợt sâu bướm nở", "w": "hatch"}, {"ex": "Bears gorge on salmon before winter.", "ipa": "/ɡɔːrdʒ ɑːn/", "mean": "ăn ngấu nghiến, ăn no nê", "pos": "cụm động từ", "vi": "ăn thật no", "w": "gorge on"}, {"ex": "Invasive species can destroy native ecosystems.", "ipa": "/ɪnˈveɪsɪv ˈspiːʃiːz/", "mean": "loài xâm lấn", "pos": "cụm danh từ", "vi": "loài xâm lấn", "w": "invasive species"}, {"ex": "Warm winters enable pests to survive.", "ipa": "/ɪˈneɪbl/", "mean": "tạo điều kiện, giúp cho có thể", "pos": "động từ", "vi": "tạo điều kiện", "w": "enable"}], "patterns": [{"ex": "She rushed to the station only to find the train had left.", "exVi": "Cô ấy vội chạy đến ga để rồi phát hiện tàu đã rời đi.", "explain": "\"only to find/discover\" diễn tả kết quả trái với mong đợi sau một hành động. Dịch là \"để rồi phát hiện ra...\".", "formula": "S + V ..., only to + V (kết quả bất ngờ)", "name": "Cấu trúc mệnh đề rút gọn: only to + V", "src": "Imagine birds migrating to their accustomed nesting area only to find that the caterpillar hatch ... has already come and gone"}, {"ex": "The data cannot be changed once saved.", "exVi": "Dữ liệu không thể thay đổi một khi đã được lưu.", "explain": "\"once pushed\" là dạng rút gọn của \"once they are pushed\". Nghĩa: \"một khi bị...\".", "formula": "S + V + once + V-ed (mệnh đề rút gọn)", "name": "Đảo ngữ nhẹ với 'once + quá khứ phân từ'", "src": "polar and alpine species have literally nowhere left to go once pushed off the brink"}, {"ex": "The refugees had nowhere to stay.", "exVi": "Những người tị nạn không có nơi nào để ở.", "explain": "Cấu trúc \"nowhere to go\" nghĩa là không còn chỗ nào để đi; \"left\" nhấn mạnh là đã hết lựa chọn.", "formula": "have/has nowhere (left) to + V", "name": "Nowhere + (left) + to V", "src": "have literally nowhere left to go"}, {"ex": "The storm that hit the coast last week destroyed many homes.", "exVi": "Cơn bão đổ bộ vào bờ biển tuần trước đã phá hủy nhiều ngôi nhà.", "explain": "Mệnh đề quan hệ \"that ended...\" bổ nghĩa cho \"extinction\", cho biết vụ tuyệt chủng nào.", "formula": "N + that + V (xác định danh từ đứng trước)", "name": "Mệnh đề quan hệ rút gọn với 'that ended'", "src": "the Cretaceous-Tertiary extinction that ended the dinosaurs"}], "hard": [{"mean": "Một cơ chế gián tiếp hơn là việc các loài phụ thuộc lẫn nhau trong lưới thức ăn bị tách rời (các nhà sinh thái học gọi là \"lệch pha\"), xảy ra khi chu kỳ sinh học theo mùa của từng loài không còn ăn khớp.", "parts": "Chủ ngữ: A less direct mechanism. Vị ngữ: is the decoupling of codependent species within a food web. Phần chèn: (called \"match-mismatch\" by ecologists) – cụm quá khứ phân từ bổ nghĩa cho decoupling. Mệnh đề thời gian/điều kiện: when their respective phenological cycles fall out of whack.", "s": "A less direct mechanism is the decoupling of codependent species within a food web (called \"match-mismatch\" by ecologists) when their respective phenological cycles fall out of whack."}, {"mean": "Chẳng hạn, hãy tưởng tượng những con chim di cư đến nơi làm tổ quen thuộc, để rồi thấy đợt sâu bướm nở mà chúng định ăn no nê đã qua mất.", "parts": "Imagine + tân ngữ birds + migrating... (phân từ hiện tại). only to find that + mệnh đề: the caterpillar hatch (they were planning to gorge on) has already come and gone. \"they were planning to gorge on\" là mệnh đề quan hệ lược bỏ that/which. \"for example\" đặt cuối câu.", "s": "Imagine birds migrating to their accustomed nesting area only to find that the caterpillar hatch they were planning to gorge on has already come and gone, for example."}]}, {"n": 16, "date": "2026-10-28", "source": ["...\"generalized\" species (like rats and raccoons) to outcompete specialized ones. Yet another is that the projected rate of climate change is so rapid that some sedentary species (like trees) may not be able to relocate quickly enough, or their escaping climatic comfort zone will shift to a place incompatible for other reasons, like terrain or soil. Some climates, especially in alpine and polar areas, will simply cease to exist. By century's end, under a high carbon emissions scenario, 10%-48% of the world's land surface is projected to \"lose\" its extant climate completely, and 12%-39% will develop new \"novel\" climates that don't exist in the world today (mostly in the tropics and subtropics). These changes will have powerful impacts on world ecosystems and could even render some local conservation efforts obsolete. Finally, because ecosystems and food webs have so many complex interconnections, there will be rippling effects we don't yet know about. All of this is piled on top of an ongoing ..."], "translation": ["... các loài \"phổ tạp\" (như chuột và gấu mèo) cạnh tranh vượt trội so với các loài chuyên biệt. Một cơ chế nữa là tốc độ biến đổi khí hậu được dự báo quá nhanh đến mức một số loài sống định cư (như cây cối) có thể không kịp di chuyển đến nơi khác, hoặc \"vùng khí hậu dễ chịu\" mà chúng cần tìm đến sẽ dịch chuyển sang một nơi không phù hợp vì những lý do khác, chẳng hạn địa hình hay thổ nhưỡng. Một số kiểu khí hậu, đặc biệt ở vùng núi cao và vùng cực, đơn giản là sẽ biến mất. Đến cuối thế kỷ này, trong kịch bản phát thải carbon cao, dự báo 10%-48% diện tích đất liền của thế giới sẽ \"mất hẳn\" kiểu khí hậu hiện có, và 12%-39% sẽ hình thành những kiểu khí hậu \"mới lạ\" chưa từng tồn tại trên thế giới ngày nay (chủ yếu ở vùng nhiệt đới và cận nhiệt đới). Những thay đổi này sẽ tác động mạnh đến các hệ sinh thái trên thế giới và thậm chí có thể khiến một số nỗ lực bảo tồn tại địa phương trở nên lỗi thời. Cuối cùng, vì các hệ sinh thái và lưới thức ăn có vô số mối liên hệ phức tạp, sẽ có những hiệu ứng lan truyền mà chúng ta chưa biết đến. Tất cả những điều này còn chồng thêm lên một ... đang diễn ra"], "note": "Trang bắt đầu và kết thúc giữa câu nên giữ \"...\". \"Generalized species\" (loài phổ tạp) là loài thích nghi được nhiều môi trường, đối lập với \"specialized species\" (loài chuyên biệt). \"Novel climates\" là thuật ngữ khí hậu học chỉ các kiểu khí hậu chưa có trong hiện tại. \"Climatic comfort zone\" là cách nói ẩn dụ: khoảng điều kiện khí hậu mà loài sinh vật thích nghi được.", "vocab": [{"ex": "Invasive weeds can outcompete native plants.", "ipa": "/ˌaʊtkəmˈpiːt/", "mean": "cạnh tranh vượt trội, thắng thế hơn", "pos": "động từ", "vi": "cạnh tranh vượt trội", "w": "outcompete"}, {"ex": "Pandas are specialized feeders that rely on bamboo.", "ipa": "/ˈspeʃəlaɪzd/", "mean": "chuyên biệt (thích nghi với điều kiện hẹp)", "pos": "tính từ", "vi": "chuyên biệt", "w": "specialized"}, {"ex": "Corals are sedentary animals.", "ipa": "/ˈsedntri/", "mean": "định cư, ít di chuyển (ở đây: không tự di chuyển được)", "pos": "tính từ", "vi": "định cư", "w": "sedentary"}, {"ex": "Some birds relocate to cooler regions.", "ipa": "/ˌriːləʊˈkeɪt/", "mean": "di dời, chuyển đến nơi khác", "pos": "động từ", "vi": "chuyển đến nơi khác", "w": "relocate"}, {"ex": "The soil is incompatible with rice farming.", "ipa": "/ˌɪnkəmˈpætəbl/", "mean": "không tương thích, không phù hợp", "pos": "tính từ", "vi": "không phù hợp", "w": "incompatible"}, {"ex": "The rough terrain slowed the hikers.", "ipa": "/təˈreɪn/", "mean": "địa hình", "pos": "danh từ", "vi": "địa hình", "w": "terrain"}, {"ex": "Alpine plants grow above the tree line.", "ipa": "/ˈælpaɪn/", "mean": "thuộc vùng núi cao", "pos": "tính từ", "vi": "vùng núi cao", "w": "alpine"}, {"ex": "The river may cease to flow in summer.", "ipa": "/siːs/", "mean": "chấm dứt, ngừng tồn tại", "pos": "động từ", "vi": "biến mất", "w": "cease"}, {"ex": "Only a few extant species of this family remain.", "ipa": "/ekˈstænt/", "mean": "hiện còn tồn tại", "pos": "tính từ", "vi": "hiện có", "w": "extant"}, {"ex": "Scientists found a novel virus in bats.", "ipa": "/ˈnɒvl/", "mean": "mới lạ, chưa từng có", "pos": "tính từ", "vi": "mới lạ", "w": "novel"}, {"ex": "The flood rendered the road unusable.", "ipa": "/ˈrendə(r)/", "mean": "khiến cho (rơi vào trạng thái nào đó)", "pos": "động từ", "vi": "khiến", "w": "render"}, {"ex": "Wildlife conservation needs long-term funding.", "ipa": "/ˌkɒnsəˈveɪʃn/", "mean": "sự bảo tồn", "pos": "danh từ", "vi": "bảo tồn", "w": "conservation"}, {"ex": "Paper maps are becoming obsolete.", "ipa": "/ˌɒbsəˈliːt/", "mean": "lỗi thời, không còn tác dụng", "pos": "tính từ", "vi": "lỗi thời", "w": "obsolete"}, {"ex": "The factory closure had rippling effects across the town.", "ipa": "/ˈrɪplɪŋ ɪˈfekts/", "mean": "hiệu ứng lan truyền (như gợn sóng)", "pos": "cụm danh từ", "vi": "hiệu ứng lan truyền", "w": "rippling effects"}, {"ex": "New taxes were piled on top of existing costs.", "ipa": "/paɪld ɒn tɒp əv/", "mean": "chồng chất thêm lên", "pos": "cụm động từ", "vi": "chồng thêm lên", "w": "piled on top of"}], "patterns": [{"ex": "The change was so sudden that many animals could not adapt.", "exVi": "Sự thay đổi đột ngột đến mức nhiều loài động vật không thích nghi kịp.", "explain": "Diễn tả mức độ của tính chất dẫn đến một kết quả. Mệnh đề sau \"that\" nêu hậu quả.", "formula": "S + be + so + adj + that + clause", "name": "So... that (quá... đến mức)", "src": "the projected rate of climate change is so rapid that some sedentary species (like trees) may not be able to relocate quickly enough"}, {"ex": "Sea levels are projected to rise by half a metre.", "exVi": "Mực nước biển được dự báo sẽ dâng thêm nửa mét.", "explain": "Dạng bị động dùng trong văn bản khoa học, nghĩa là \"được dự báo sẽ\". Tương tự: be expected to, be predicted to.", "formula": "S + be projected to + V", "name": "Be projected to + V", "src": "10%-48% of the world's land surface is projected to \"lose\" its extant climate completely"}, {"ex": "The new law rendered the old rules meaningless.", "exVi": "Luật mới khiến các quy định cũ trở nên vô nghĩa.", "explain": "\"Render\" mang nghĩa \"làm cho\", trang trọng hơn \"make\". Theo sau là tân ngữ rồi tính từ chỉ trạng thái kết quả.", "formula": "render + tân ngữ + tính từ", "name": "Render + O + adj", "src": "could even render some local conservation efforts obsolete"}, {"ex": "Because the data are limited, there will be errors we cannot predict.", "exVi": "Vì dữ liệu còn hạn chế nên sẽ có những sai sót mà ta không thể dự đoán.", "explain": "Mệnh đề lý do đặt đầu câu, sau đó là mệnh đề chính với \"there will be\". Cụm \"effects we don't yet know about\" là mệnh đề quan hệ rút gọn đại từ (lược \"that\").", "formula": "Finally, because + clause, there will be + N", "name": "Cụm phân từ/ẩn dụ + because mở đầu mệnh đề lý do", "src": "Finally, because ecosystems and food webs have so many complex interconnections, there will be rippling effects we don't yet know about."}], "hard": [{"mean": "Một cơ chế khác là khí hậu đổi quá nhanh nên cây cối có thể không kịp di chuyển, hoặc vùng khí hậu thích hợp mà chúng hướng tới lại dịch chuyển đến nơi không phù hợp vì địa hình, đất đai.", "parts": "Chủ ngữ: \"Yet another\" (một cơ chế nữa, ám chỉ cơ chế tuyệt chủng). Động từ: is. Mệnh ngữ: \"that + mệnh đề\". Trong mệnh đề có cấu trúc so... that; kết quả gồm hai vế nối bằng \"or\": (1) some sedentary species may not be able to relocate quickly enough; (2) their escaping climatic comfort zone will shift to a place incompatible for other reasons (like terrain or soil).", "s": "Yet another is that the projected rate of climate change is so rapid that some sedentary species (like trees) may not be able to relocate quickly enough, or their escaping climatic comfort zone will shift to a place incompatible for other reasons, like terrain or soil."}, {"mean": "Đến cuối thế kỷ, nếu phát thải carbon cao, 10%-48% đất liền sẽ mất hoàn toàn khí hậu hiện có, còn 12%-39% sẽ có khí hậu mới chưa từng có (chủ yếu ở vùng nhiệt đới và cận nhiệt đới).", "parts": "Trạng ngữ: By century's end, under a high carbon emissions scenario. Hai mệnh đề nối bằng \"and\": (1) 10%-48% of the world's land surface is projected to lose its extant climate completely; (2) 12%-39% will develop new \"novel\" climates. \"that don't exist in the world today\" là mệnh đề quan hệ bổ nghĩa cho climates; ngoặc đơn bổ sung vị trí địa lý.", "s": "By century's end, under a high carbon emissions scenario, 10%-48% of the world's land surface is projected to \"lose\" its extant climate completely, and 12%-39% will develop new \"novel\" climates that don't exist in the world today (mostly in the tropics and subtropics)."}, {"mean": "Tất cả những điều này còn chồng thêm lên một ... đang diễn ra (câu chưa hoàn chỉnh).", "parts": "Chủ ngữ: All of this (toàn bộ những điều vừa nêu). Vị ngữ: is piled on top of (bị động, cụm động từ \"pile on top of\"). Tân ngữ: an ongoing ... (câu bị cắt, danh từ nằm ở trang sau).", "s": "All of this is piled on top of an ongoing ..."}]}, {"n": 17, "date": "2026-10-28", "source": ["... \"novel\" climates that don't exist in the world today (mostly in the tropics and subtropics). These changes will have powerful impacts on world ecosystems and could even render some local conservation efforts obsolete. Finally, because ecosystems and food webs have so many complex interconnections, there will be rippling effects we don't yet know about. All of this is piled on top of an ongoing raft of familiar ecological threats, including habitat destruction, invasive species, and pollution.", "Compared with other places, habitat loss and pollution are less severe in Alaska, northern Canada, the Nordic countries, and eastern Russia, where vast boreal forests, tundra, and mountains hold some of the wildest and least-disturbed places left on Earth. However, northern ecosystems also have far simpler food chains and fewer species than, say, the Amazon rain forest. Indeed, much of it is a colonizing landscape, still in the early stages of soil formation and biological ex..."], "translation": ["... những kiểu khí hậu \"mới lạ\" chưa từng tồn tại trên thế giới ngày nay (chủ yếu ở vùng nhiệt đới và cận nhiệt đới). Những thay đổi này sẽ tác động mạnh đến các hệ sinh thái trên thế giới và thậm chí có thể khiến một số nỗ lực bảo tồn tại địa phương trở nên lỗi thời. Cuối cùng, vì các hệ sinh thái và lưới thức ăn có vô số mối liên hệ phức tạp, sẽ có những hiệu ứng lan truyền mà chúng ta chưa biết đến. Tất cả những điều này còn chồng thêm lên một loạt mối đe dọa sinh thái quen thuộc đang diễn ra, bao gồm phá hủy môi trường sống, các loài xâm lấn và ô nhiễm.", "So với những nơi khác, tình trạng mất môi trường sống và ô nhiễm ở Alaska, miền bắc Canada, các nước Bắc Âu và miền đông nước Nga ít nghiêm trọng hơn, nơi những khu rừng phương bắc bao la, lãnh nguyên và núi non còn giữ một số vùng hoang dã và ít bị xáo trộn nhất còn lại trên Trái Đất. Tuy nhiên, các hệ sinh thái phương bắc cũng có chuỗi thức ăn đơn giản hơn nhiều và ít loài hơn, chẳng hạn như so với rừng mưa Amazon. Thật vậy, phần lớn vùng này là một cảnh quan đang được các loài sinh vật đến định cư, vẫn đang ở giai đoạn đầu của quá trình hình thành đất và sự ..."], "note": "Boreal forest = rừng phương bắc (rừng taiga), tundra = lãnh nguyên. Nordic countries gồm Na Uy, Thụy Điển, Phần Lan, Đan Mạch, Iceland. 'biological ex...' bị cắt giữa từ, nhiều khả năng là 'biological expansion/extension' ở trang sau. 'Colonizing landscape' nghĩa là vùng đất mới được thực vật và động vật chiếm cư dần dần (sau khi băng tan).", "vocab": [{"ex": "Scientists proposed a novel way to store solar energy.", "ipa": "/ˈnɒv.əl/", "mean": "mới lạ, chưa từng có (ở đây không phải 'tiểu thuyết')", "pos": "tính từ", "vi": "mới lạ", "w": "novel"}, {"ex": "Citrus fruits grow well in the subtropics.", "ipa": "/ˌsʌbˈtrɒp.ɪks/", "mean": "vùng cận nhiệt đới", "pos": "danh từ (số nhiều)", "vi": "cận nhiệt đới", "w": "subtropics"}, {"ex": "The storm rendered the road impassable.", "ipa": "/ˈren.dər/", "mean": "khiến cho, làm cho (trở nên...)", "pos": "động từ", "vi": "khiến", "w": "render"}, {"ex": "Wildlife conservation needs long-term funding.", "ipa": "/ˌkɒn.səˈveɪ.ʃən/", "mean": "sự bảo tồn", "pos": "danh từ", "vi": "bảo tồn", "w": "conservation"}, {"ex": "Paper maps are becoming obsolete.", "ipa": "/ˌɒb.səˈliːt/", "mean": "lỗi thời, không còn dùng được", "pos": "tính từ", "vi": "lỗi thời", "w": "obsolete"}, {"ex": "Removing one predator can disrupt the whole food web.", "ipa": "/ˈfuːd web/", "mean": "lưới thức ăn", "pos": "danh từ", "vi": "lưới thức ăn", "w": "food web"}, {"ex": "The factory closure had a rippling effect on the town.", "ipa": "/ˈrɪp.lɪŋ ɪˈfekt/", "mean": "hiệu ứng lan truyền (như gợn sóng)", "pos": "cụm danh từ", "vi": "hiệu ứng lan truyền", "w": "rippling effect"}, {"ex": "The government announced a raft of new measures.", "ipa": "/ə rɑːft əv/", "mean": "hàng loạt, một loạt (những thứ)", "pos": "thành ngữ", "vi": "một loạt", "w": "a raft of"}, {"ex": "Deforestation destroys the habitat of many birds.", "ipa": "/ˈhæb.ɪ.tæt/", "mean": "môi trường sống", "pos": "danh từ", "vi": "môi trường sống", "w": "habitat"}, {"ex": "Invasive species can wipe out native plants.", "ipa": "/ɪnˈveɪ.sɪv ˈspiː.ʃiːz/", "mean": "loài xâm lấn", "pos": "cụm danh từ", "vi": "loài xâm lấn", "w": "invasive species"}, {"ex": "Boreal forests stretch across Canada and Siberia.", "ipa": "/ˈbɔː.ri.əl/", "mean": "thuộc phương bắc, ở vùng cận Bắc Cực", "pos": "tính từ", "vi": "rừng phương bắc", "w": "boreal"}, {"ex": "Few trees can grow in the tundra.", "ipa": "/ˈtʌn.drə/", "mean": "lãnh nguyên", "pos": "danh từ", "vi": "lãnh nguyên", "w": "tundra"}, {"ex": "Disturbed land recovers slowly.", "ipa": "/dɪˈstɜːbd/", "mean": "bị xáo trộn, bị tác động (bởi con người)", "pos": "tính từ", "vi": "bị xáo trộn", "w": "disturbed"}, {"ex": "Mosses are colonizing the bare rock.", "ipa": "/ˈkɒl.ə.naɪ.zɪŋ/", "mean": "đang được sinh vật đến chiếm cư, định cư", "pos": "tính từ", "vi": "đến định cư", "w": "colonizing"}], "patterns": [{"ex": "Because the climate is warming, there will be more floods.", "exVi": "Vì khí hậu đang nóng lên nên sẽ có nhiều lũ lụt hơn.", "explain": "Mệnh đề 'because' đứng đầu câu nêu nguyên nhân, mệnh đề chính nêu kết quả. 'there will be' diễn tả sự tồn tại trong tương lai. 'we don't yet know about' là mệnh đề quan hệ rút gọn đại từ (that bị lược).", "formula": "Because + S + V, there will be + N", "name": "Mệnh đề chỉ nguyên nhân 'because' + 'there will be'", "src": "because ecosystems and food webs have so many complex interconnections, there will be rippling effects we don't yet know about."}, {"ex": "Rising prices are piled on top of low wages.", "exVi": "Giá cả tăng được chồng thêm lên mức lương thấp.", "explain": "'on top of' nghĩa là 'ngoài ra, thêm vào đó', diễn tả sự chồng chất thêm vấn đề lên cái đã có.", "formula": "S + be piled on top of + N", "name": "Bị động + 'on top of'", "src": "All of this is piled on top of an ongoing raft of familiar ecological threats"}, {"ex": "Compared with Hanoi, Da Lat is less crowded.", "exVi": "So với Hà Nội, Đà Lạt ít đông đúc hơn.", "explain": "Cụm 'Compared with...' mở đầu câu để so sánh. 'less + adj' là so sánh kém.", "formula": "Compared with + N, S + be + adj-er/less + adj", "name": "So sánh 'Compared with'", "src": "Compared with other places, habitat loss and pollution are less severe in Alaska..."}, {"ex": "He moved to Hue, where his grandparents live.", "exVi": "Anh ấy chuyển đến Huế, nơi ông bà anh sống.", "explain": "'where' bổ nghĩa cho địa điểm đứng trước, thêm thông tin về nơi đó. 'left on Earth' là quá khứ phân từ rút gọn nghĩa 'còn lại'.", "formula": "place, where + S + V", "name": "Mệnh đề quan hệ 'where'", "src": "..., where vast boreal forests, tundra, and mountains hold some of the wildest and least-disturbed places left on Earth."}, {"ex": "This route is far shorter than the old one.", "exVi": "Tuyến đường này ngắn hơn nhiều so với tuyến cũ.", "explain": "'far' nhấn mạnh mức độ chênh lệch (= much). 'say' ở đây nghĩa là 'ví dụ như'.", "formula": "far + adj-er / more + adj + than", "name": "Cấu trúc 'far + so sánh hơn'", "src": "northern ecosystems also have far simpler food chains and fewer species than, say, the Amazon rain forest."}], "hard": [{"mean": "Biến đổi khí hậu là gánh nặng thêm vào những mối đe dọa vốn đã có như mất môi trường sống, loài xâm lấn và ô nhiễm.", "parts": "Chủ ngữ: All of this (toàn bộ những điều trên). Vị ngữ: is piled on top of (bị chồng thêm lên). Tân ngữ của giới từ: an ongoing raft of familiar ecological threats (một loạt mối đe dọa sinh thái quen thuộc đang diễn ra). Cụm 'including...' liệt kê ví dụ.", "s": "All of this is piled on top of an ongoing raft of familiar ecological threats, including habitat destruction, invasive species, and pollution."}, {"mean": "Những vùng phía bắc ít bị mất môi trường sống và ô nhiễm hơn vì còn nhiều vùng hoang dã nhất hành tinh.", "parts": "Trạng ngữ so sánh: Compared with other places. Chủ ngữ: habitat loss and pollution. Vị ngữ: are less severe in + danh sách địa điểm. Mệnh đề quan hệ 'where': chủ ngữ 'vast boreal forests, tundra, and mountains', động từ 'hold', tân ngữ 'some of the wildest and least-disturbed places (that are) left on Earth'.", "s": "Compared with other places, habitat loss and pollution are less severe in Alaska, northern Canada, the Nordic countries, and eastern Russia, where vast boreal forests, tundra, and mountains hold some of the wildest and least-disturbed places left on Earth."}, {"mean": "Phần lớn vùng phương bắc là đất mới được sinh vật đến định cư, vẫn ở giai đoạn đầu hình thành đất và phát triển sinh học.", "parts": "Trạng từ nối: Indeed (thật vậy). Chủ ngữ: much of it (phần lớn vùng này). Vị ngữ: is a colonizing landscape. Cụm bổ sung: still in the early stages of soil formation and biological ex... (câu bị cắt).", "s": "Indeed, much of it is a colonizing landscape, still in the early stages of soil formation and biological ex..."}]}, {"n": 18, "date": "2026-10-28", "source": ["...pansion after being encased and pulverized by glacier ice just eighteen thousand years ago.", "When imagining 2050, I anticipate that a globally unfair assortment of some winners and many more loser species will be very apparent by then. Already the world's plants and animals are in the midst of their biggest extinction challenge in sixty-five million years. Out of perhaps seven million eukaryote species found on Earth, nearly half of all vascular plants and one-third of vertebrates are confined to just twenty-five imperiled \"hot spots,\" mostly in the tropics and comprising just 1.4% of the world's land surface.", "Even in the far North, a specialized ecosystem adapted to frigid cold will be under attack by advancing southern competitors, pests, and disease. It is possible that the vast boreal forest—girdling the northern high latitudes from Canada to Siberia—might convert to a more open, ..."], "translation": ["... mở rộng sau khi bị băng hà bao phủ và nghiền nát chỉ mới mười tám nghìn năm trước.", "Khi hình dung về năm 2050, tôi dự đoán rằng đến lúc đó, một sự phân bổ bất công trên toàn cầu, gồm một số loài thắng cuộc và nhiều loài thua cuộc hơn hẳn, sẽ hiện ra rất rõ. Hiện nay, thực vật và động vật trên thế giới đã đang ở giữa thách thức tuyệt chủng lớn nhất trong sáu mươi lăm triệu năm. Trong số khoảng bảy triệu loài sinh vật nhân thực trên Trái Đất, gần một nửa số thực vật có mạch và một phần ba số động vật có xương sống bị giới hạn trong chỉ hai mươi lăm \"điểm nóng\" đang bị đe dọa, chủ yếu ở vùng nhiệt đới và chỉ chiếm 1,4% diện tích đất liền của thế giới.", "Ngay cả ở vùng viễn Bắc, một hệ sinh thái chuyên biệt thích nghi với giá lạnh khắc nghiệt cũng sẽ bị tấn công bởi các đối thủ cạnh tranh, sâu bệnh và dịch bệnh tiến lên từ phương nam. Có thể khu rừng phương bắc bao la, vắt ngang các vĩ độ cao phía bắc từ Canada đến Siberia, sẽ chuyển thành một dạng thưa thoáng hơn, ..."], "note": "Câu đầu bị cắt giữa từ: \"pansion\" là phần cuối của \"expansion\" (nối với \"sự ...\" ở trang trước, tức \"sự mở rộng\"). \"Boreal forest\" là rừng phương bắc (taiga). \"Eukaryote\" là sinh vật nhân thực. \"Hot spots\" ở đây là các điểm nóng đa dạng sinh học.", "vocab": [{"ex": "The old statue was encased in concrete.", "ipa": "/ɪnˈkeɪs/", "mean": "bao bọc kín, bao phủ hoàn toàn", "pos": "động từ", "vi": "bao phủ", "w": "encase"}, {"ex": "The machine pulverizes rocks into fine powder.", "ipa": "/ˈpʌlvəraɪz/", "mean": "nghiền thành bột, nghiền nát", "pos": "động từ", "vi": "nghiền nát", "w": "pulverize"}, {"ex": "The shop sells an assortment of cheeses.", "ipa": "/əˈsɔːtmənt/", "mean": "tập hợp nhiều loại khác nhau; ở đây là sự phân bổ gồm cả bên thắng lẫn bên thua", "pos": "danh từ", "vi": "sự phân bổ bất công trên toàn cầu", "w": "assortment"}, {"ex": "The effects of the drought soon became apparent.", "ipa": "/əˈpærənt/", "mean": "rõ ràng, dễ nhận thấy", "pos": "tính từ", "vi": "hiện ra rất rõ", "w": "apparent"}, {"ex": "Many amphibians face extinction.", "ipa": "/ɪkˈstɪŋkʃn/", "mean": "sự tuyệt chủng", "pos": "danh từ", "vi": "thách thức tuyệt chủng", "w": "extinction"}, {"ex": "Fungi, plants and animals are all eukaryotes.", "ipa": "/juːˈkæriəʊt/", "mean": "sinh vật nhân thực (tế bào có nhân)", "pos": "danh từ (thuật ngữ sinh học)", "vi": "sinh vật nhân thực", "w": "eukaryote"}, {"ex": "Ferns and trees are vascular plants.", "ipa": "/ˈvæskjələ plɑːnt/", "mean": "thực vật có mạch (có hệ mạch dẫn nước và chất dinh dưỡng)", "pos": "cụm danh từ (thuật ngữ)", "vi": "thực vật có mạch", "w": "vascular plant"}, {"ex": "Fish, birds and mammals are vertebrates.", "ipa": "/ˈvɜːtɪbrət/", "mean": "động vật có xương sống", "pos": "danh từ", "vi": "động vật có xương sống", "w": "vertebrate"}, {"ex": "This rare frog is confined to a single mountain.", "ipa": "/kənˈfaɪnd tuː/", "mean": "bị giới hạn trong, chỉ có ở", "pos": "cụm tính từ", "vi": "bị giới hạn trong", "w": "confined to"}, {"ex": "Imperiled species need urgent protection.", "ipa": "/ɪmˈperəld/", "mean": "đang bị đe dọa, lâm nguy", "pos": "tính từ (học thuật)", "vi": "đang bị đe dọa", "w": "imperiled"}, {"ex": "Madagascar is a biodiversity hot spot.", "ipa": "/ˈhɒt spɒt/", "mean": "điểm nóng (khu vực có đa dạng sinh học cao nhưng bị đe dọa)", "pos": "danh từ", "vi": "điểm nóng", "w": "hot spot"}, {"ex": "They survived the frigid night in a tent.", "ipa": "/ˈfrɪdʒɪd/", "mean": "lạnh buốt, lạnh giá", "pos": "tính từ", "vi": "giá lạnh khắc nghiệt", "w": "frigid"}, {"ex": "A belt of forest girdles the mountain.", "ipa": "/ˈɡɜːdl/", "mean": "bao quanh, vắt ngang như một chiếc đai", "pos": "động từ (văn viết)", "vi": "vắt ngang", "w": "girdle"}, {"ex": "Boreal forests store huge amounts of carbon.", "ipa": "/ˈbɔːriəl/", "mean": "thuộc phương bắc, vùng cận Bắc Cực", "pos": "tính từ (thuật ngữ)", "vi": "phương bắc", "w": "boreal"}], "patterns": [{"ex": "The company is in the midst of a major change.", "exVi": "Công ty đang ở giữa một cuộc thay đổi lớn.", "explain": "Diễn tả đang ở giữa một sự việc hay giai đoạn nào đó, thường là điều lớn hoặc khó khăn.", "formula": "be in the midst of + danh từ", "name": "Ở giữa một quá trình/tình huống", "src": "Already the world's plants and animals are in the midst of their biggest extinction challenge in sixty-five million years."}, {"ex": "Out of fifty students, only five failed the exam.", "exVi": "Trong số năm mươi học sinh, chỉ có năm em trượt kỳ thi.", "explain": "\"Out of\" mở đầu cụm chỉ tổng thể, sau đó nêu phần nhỏ hơn thuộc tổng thể đó. \"Found on Earth\" là quá khứ phân từ rút gọn mệnh đề quan hệ (which are found).", "formula": "Out of + tổng thể, + bộ phận + động từ", "name": "Trong số... (phân số/bộ phận)", "src": "Out of perhaps seven million eukaryote species found on Earth, nearly half of all vascular plants ... are confined to just twenty-five imperiled \"hot spots,\""}, {"ex": "The disease is confined to rural areas.", "exVi": "Căn bệnh chỉ giới hạn ở các vùng nông thôn.", "explain": "Chỉ sự phân bố hay phạm vi bị thu hẹp vào một nơi hoặc một nhóm.", "formula": "be confined to + danh từ", "name": "Bị giới hạn trong", "src": "...are confined to just twenty-five imperiled \"hot spots,\""}, {"ex": "The villages are mostly near the coast and housing about ten thousand people.", "exVi": "Các ngôi làng chủ yếu nằm gần bờ biển và có khoảng mười nghìn dân.", "explain": "\"Comprising\" (gồm, chiếm) mở đầu cụm phân từ bổ nghĩa cho \"hot spots\", nối với cụm \"mostly in the tropics\" bằng \"and\".", "formula": "..., mostly in X and V-ing ...", "name": "Cụm phân từ hiện tại bổ sung thông tin", "src": "...mostly in the tropics and comprising just 1.4% of the world's land surface."}, {"ex": "It is possible that prices might fall next year.", "exVi": "Có thể giá cả sẽ giảm vào năm tới.", "explain": "Hai tầng diễn đạt khả năng (is possible + might) để nhấn mạnh sự thận trọng, không chắc chắn của dự báo.", "formula": "It is possible that + S + might + V", "name": "Khả năng có thể xảy ra", "src": "It is possible that the vast boreal forest ... might convert to a more open, ..."}], "hard": [{"mean": "Khi nghĩ về năm 2050, tác giả dự đoán sẽ có sự phân hóa bất công trên toàn cầu: ít loài được lợi, còn nhiều loài hơn nhiều chịu thiệt, và điều đó sẽ rất rõ vào lúc đó.", "parts": "Mệnh đề trạng ngữ rút gọn: When imagining 2050 (chủ ngữ ngầm là I). Chủ ngữ chính: I. Vị ngữ: anticipate. Mệnh đề danh từ sau that: chủ ngữ \"a globally unfair assortment of some winners and many more loser species\", động từ \"will be\", bổ ngữ \"very apparent by then\".", "s": "When imagining 2050, I anticipate that a globally unfair assortment of some winners and many more loser species will be very apparent by then."}, {"mean": "Có thể khu rừng phương bắc rộng lớn, trải dọc các vĩ độ cao phía bắc từ Canada đến Siberia, sẽ chuyển thành một kiểu (rừng/cảnh quan) thưa thoáng hơn.", "parts": "Chủ ngữ giả: It. Vị ngữ: is possible. Mệnh đề that: chủ ngữ \"the vast boreal forest\", chèn giữa hai dấu gạch ngang là cụm phân từ \"girdling the northern high latitudes from Canada to Siberia\" bổ nghĩa cho forest; động từ \"might convert to\" + \"a more open, ...\" (câu bị cắt, danh từ chưa xuất hiện).", "s": "It is possible that the vast boreal forest—girdling the northern high latitudes from Canada to Siberia—might convert to a more open, ..."}]}, {"n": 19, "date": "2026-10-28", "source": ["... savannah-like state. But total primary productivity—meaning plant biomass, the bottom of the food chain—will be ramping up. Certain mobile southern invaders will enjoy growing viability in a vast new territory that is larger, less fragmented, and less polluted than where they came from. Longer, deeper penetration of sunlight into the sea (owing to less shading by sea ice) will trigger more algal photosynthesis, again increasing primary productivity and reverberating throughout the Arctic marine food web. The end result of this can only be greater overall ocean biomass, more complex food webs, and the invasion of southern marine species at the expense of northern ones.", "The ecology of the North is imperiled and changing. But it will be anything but lifeless.", "Hunters on Thin Ice"], "translation": ["... trạng thái giống thảo nguyên. Nhưng tổng năng suất sơ cấp — tức sinh khối thực vật, tầng đáy của chuỗi thức ăn — sẽ tăng tốc. Một số loài xâm lấn di động từ phương nam sẽ có khả năng sinh tồn ngày càng cao trong một vùng lãnh thổ mới mênh mông, rộng hơn, ít bị chia cắt hơn và ít ô nhiễm hơn nơi chúng xuất phát. Ánh sáng mặt trời xuyên vào biển lâu hơn và sâu hơn (do băng biển che bóng ít đi) sẽ kích thích quá trình quang hợp của tảo mạnh hơn, lại làm tăng năng suất sơ cấp và lan truyền khắp mạng lưới thức ăn biển Bắc Cực. Kết quả cuối cùng của điều này chỉ có thể là sinh khối đại dương tổng thể lớn hơn, mạng lưới thức ăn phức tạp hơn, và sự xâm nhập của các loài biển phương nam gây thiệt hại cho các loài phương bắc.", "Hệ sinh thái phương Bắc đang lâm nguy và biến đổi. Nhưng nó sẽ là bất cứ thứ gì trừ vô sinh.", "Những thợ săn trên lớp băng mỏng"], "note": "Đoạn này tiếp nối câu cuối trang trước (rừng phương bắc chuyển sang dạng thưa thoáng, giống savan). 'Hunters on Thin Ice' là tiêu đề mục mới; 'thin ice' còn mang nghĩa bóng là 'ở thế mong manh, nguy hiểm'. 'The North' chỉ vùng viễn Bắc/Bắc Cực.", "vocab": [{"ex": "Factories are ramping up production before the holidays.", "ipa": "/ræmp ʌp/", "mean": "tăng lên, đẩy mạnh (quy mô, tốc độ)", "pos": "cụm động từ", "vi": "tăng tốc", "w": "ramp up"}, {"ex": "Primary productivity is highest in warm, sunlit waters.", "ipa": "/ˈpraɪməri ˌprɒdʌkˈtɪvəti/", "mean": "lượng chất hữu cơ do sinh vật quang hợp tạo ra", "pos": "danh từ (thuật ngữ sinh thái)", "vi": "năng suất sơ cấp", "w": "primary productivity"}, {"ex": "The forest stores a huge amount of biomass.", "ipa": "/ˈbaɪoʊmæs/", "mean": "tổng khối lượng sinh vật sống", "pos": "danh từ", "vi": "sinh khối", "w": "biomass"}, {"ex": "The zebra mussel is an aggressive invader of lakes.", "ipa": "/ɪnˈveɪdər/", "mean": "loài xâm lấn, sinh vật ngoại lai lấn át", "pos": "danh từ", "vi": "loài xâm lấn", "w": "invader"}, {"ex": "Scientists doubt the viability of the species in warmer water.", "ipa": "/ˌvaɪəˈbɪləti/", "mean": "khả năng tồn tại và phát triển", "pos": "danh từ", "vi": "khả năng sinh tồn", "w": "viability"}, {"ex": "Roads have left the habitat badly fragmented.", "ipa": "/ˈfræɡmentɪd/", "mean": "bị chia nhỏ, manh mún", "pos": "tính từ", "vi": "bị chia cắt", "w": "fragmented"}, {"ex": "Light penetration decreases with water depth.", "ipa": "/ˌpenəˈtreɪʃn/", "mean": "sự xuyên qua, thấm sâu vào", "pos": "danh từ", "vi": "xuyên vào", "w": "penetration"}, {"ex": "Algae produce oxygen through photosynthesis.", "ipa": "/ˌfoʊtoʊˈsɪnθəsɪs/", "mean": "quá trình quang hợp", "pos": "danh từ", "vi": "quang hợp", "w": "photosynthesis"}, {"ex": "The crisis reverberated through the whole economy.", "ipa": "/rɪˈvɜːrbəreɪt/", "mean": "gây tác động lan rộng, vang dội", "pos": "động từ", "vi": "lan truyền", "w": "reverberate"}, {"ex": "Removing one predator can disrupt the entire food web.", "ipa": "/fuːd web/", "mean": "mạng lưới các chuỗi thức ăn đan xen", "pos": "danh từ (thuật ngữ sinh thái)", "vi": "mạng lưới thức ăn", "w": "food web"}, {"ex": "Growth came at the expense of the environment.", "ipa": "/æt ði ɪkˈspens əv/", "mean": "gây thiệt hại cho, hy sinh cái khác", "pos": "cụm giới từ", "vi": "gây thiệt hại cho", "w": "at the expense of"}, {"ex": "Many coastal communities are imperiled by rising seas.", "ipa": "/ɪmˈperəld/", "mean": "lâm nguy, bị đe dọa nghiêm trọng", "pos": "tính từ", "vi": "lâm nguy", "w": "imperiled"}, {"ex": "The desert looked barren and lifeless.", "ipa": "/ˈlaɪfləs/", "mean": "không có sự sống", "pos": "tính từ", "vi": "vô sinh", "w": "lifeless"}], "patterns": [{"ex": "The exam was anything but easy.", "exVi": "Bài thi hoàn toàn không dễ chút nào.", "explain": "'Anything but' nghĩa là 'bất cứ thứ gì trừ...', tức là hoàn toàn không. Câu gốc nghĩa là vùng Bắc sẽ không hề vô sinh, thậm chí đầy sức sống.", "formula": "S + be + anything but + adj/noun", "name": "Anything but (hoàn toàn không)", "src": "But it will be anything but lifeless."}, {"ex": "He built his career at the expense of his health.", "exVi": "Anh ta xây dựng sự nghiệp bằng cái giá là sức khỏe.", "explain": "Diễn tả A có lợi thì B chịu thiệt. 'Ones' thay cho 'species' để tránh lặp từ.", "formula": "A + increase/win + at the expense of + B", "name": "At the expense of (gây thiệt hại cho)", "src": "the invasion of southern marine species at the expense of northern ones"}, {"ex": "The flight was delayed owing to heavy fog.", "exVi": "Chuyến bay bị hoãn do sương mù dày.", "explain": "'Owing to' tương đương 'because of', đi với danh từ chứ không với mệnh đề. Phong cách trang trọng, hay gặp trong văn viết học thuật.", "formula": "owing to + danh từ/cụm danh từ", "name": "Owing to (do, bởi)", "src": "(owing to less shading by sea ice)"}, {"ex": "The new office is brighter, quieter, and cheaper than where we used to work.", "exVi": "Văn phòng mới sáng hơn, yên tĩnh hơn và rẻ hơn nơi chúng tôi từng làm việc.", "explain": "Nhiều tính từ so sánh cùng dùng chung một mốc 'than'. 'Where they came from' là mệnh đề danh từ chỉ nơi chốn, đóng vai trò đối tượng so sánh.", "formula": "larger, less fragmented, and less polluted than ...", "name": "So sánh song song nhiều tính từ", "src": "a vast new territory that is larger, less fragmented, and less polluted than where they came from"}, {"ex": "The factory closed, leaving hundreds jobless and hurting the local economy.", "exVi": "Nhà máy đóng cửa, khiến hàng trăm người thất nghiệp và làm tổn hại kinh tế địa phương.", "explain": "Hai cụm V-ing nối bằng 'and' bổ sung kết quả của hành động ở mệnh đề chính (trigger more algal photosynthesis), ngầm hiểu chủ ngữ là hiện tượng ấy.", "formula": "..., V-ing ... and V-ing ...", "name": "Phân từ hiện tại nối kết quả", "src": "again increasing primary productivity and reverberating throughout the Arctic marine food web"}], "hard": [{"mean": "Các loài từ phương nam di chuyển được sẽ có điều kiện sống thuận lợi hơn ở vùng đất mới phương bắc, vì vùng này rộng, liền mạch và sạch hơn quê hương cũ của chúng.", "parts": "Chủ ngữ: Certain mobile southern invaders (một số loài xâm lấn di động từ phương nam). Vị ngữ: will enjoy growing viability (sẽ hưởng khả năng sinh tồn ngày càng tăng). Trạng ngữ: in a vast new territory. Mệnh đề quan hệ: that is larger, less fragmented, and less polluted than where they came from (rộng hơn, ít chia cắt hơn, ít ô nhiễm hơn nơi chúng xuất phát).", "s": "Certain mobile southern invaders will enjoy growing viability in a vast new territory that is larger, less fragmented, and less polluted than where they came from."}, {"mean": "Băng biển tan nên ít che nắng hơn, ánh sáng vào biển nhiều hơn, tảo quang hợp mạnh hơn, từ đó tăng sinh khối và ảnh hưởng toàn bộ mạng lưới thức ăn.", "parts": "Chủ ngữ: Longer, deeper penetration of sunlight into the sea (ánh sáng xuyên vào biển lâu hơn, sâu hơn). Chú thích trong ngoặc: owing to less shading by sea ice. Vị ngữ: will trigger more algal photosynthesis. Cụm phân từ chỉ kết quả: again increasing... and reverberating throughout...", "s": "Longer, deeper penetration of sunlight into the sea (owing to less shading by sea ice) will trigger more algal photosynthesis, again increasing primary productivity and reverberating throughout the Arctic marine food web."}, {"mean": "Tác giả khẳng định hệ quả tất yếu là biển giàu sinh khối hơn, chuỗi thức ăn phức tạp hơn, nhưng loài phương nam sẽ lấn át loài phương bắc.", "parts": "Chủ ngữ: The end result of this (kết quả cuối cùng của điều này). Vị ngữ: can only be (chỉ có thể là). Bổ ngữ gồm ba cụm danh từ song song: greater overall ocean biomass; more complex food webs; the invasion of southern marine species at the expense of northern ones.", "s": "The end result of this can only be greater overall ocean biomass, more complex food webs, and the invasion of southern marine species at the expense of northern ones."}]}, {"n": 20, "date": "2026-10-28", "source": ["People rely on sea ice too. For millennia the Inuit and Yupik (Eskimo) peoples have lived along the shores of the Arctic Ocean and even out on the ice itself, hunting seals, polar bears, whales, walruses, and fish. It is the platform upon which they travel, whether by snowmobile, dogsled, or on foot. It is the foundation on which they build hunting camps to live in for weeks or months at a time.", "These hunters have watched in astonishment as their sea-ice travel platform—dangerous even in good times—has thinned, become less predictable, and even disappeared. People's snowmobiles and ATVs are crashing through into the freezing ocean. Farther south, they are crashing through the ice covering rivers and lakes. In Sanikiluaq, Canada, I learned that weaker ice and a two- to three-month shorter ice season is impairing people's ability to catch seals and Arctic char. In Pangnirtung a traditional New Year's Day bash celebrated out on..."], "translation": ["Con người cũng dựa vào băng biển. Suốt nhiều thiên niên kỷ, người Inuit và Yupik (Eskimo) đã sống dọc bờ Bắc Băng Dương, thậm chí ngay trên mặt băng, săn hải cẩu, gấu Bắc Cực, cá voi, hải mã và cá. Băng biển là nền tảng để họ di chuyển, dù bằng xe trượt tuyết máy, xe chó kéo hay đi bộ. Đó cũng là nền móng để họ dựng các trại săn và sống ở đó hàng tuần hay hàng tháng liền.", "Những thợ săn này đã kinh ngạc chứng kiến nền tảng di chuyển trên băng biển của mình, vốn nguy hiểm ngay cả vào lúc thuận lợi, mỏng đi, trở nên khó đoán hơn, thậm chí biến mất. Xe trượt tuyết máy và xe địa hình của người dân đang lao thủng xuống đại dương lạnh giá. Xa hơn về phía nam, chúng cũng đang lún thủng lớp băng phủ sông và hồ. Ở Sanikiluaq, Canada, tôi được biết rằng lớp băng yếu hơn và mùa băng ngắn đi hai đến ba tháng đang làm suy giảm khả năng bắt hải cẩu và cá hồi chấm Bắc Cực của người dân. Ở Pangnirtung, một bữa tiệc truyền thống mừng Năm Mới được tổ chức ngoài..."], "note": "Inuit và Yupik là các dân tộc bản địa vùng Bắc Cực (từ 'Eskimo' nay thường bị coi là không phù hợp, tác giả đặt trong ngoặc). Sanikiluaq và Pangnirtung là các cộng đồng Inuit ở Nunavut, Canada. ATV = all-terrain vehicle (xe địa hình). Arctic char là loài cá thuộc họ cá hồi. Câu cuối trang bị cắt giữa chừng.", "vocab": [{"ex": "Rice has been grown here for millennia.", "ipa": "/mɪˈleniə/", "mean": "các thiên niên kỷ, hàng nghìn năm", "pos": "danh từ (số nhiều của millennium)", "vi": "thiên niên kỷ", "w": "millennia"}, {"ex": "The frozen lake served as a platform for the winter market.", "ipa": "/ˈplætfɔːrm/", "mean": "nền, bệ (ở đây: bề mặt để di chuyển và sinh hoạt)", "pos": "danh từ", "vi": "nền tảng để họ di chuyển", "w": "platform"}, {"ex": "He crossed the frozen bay on a snowmobile.", "ipa": "/ˈsnoʊmoʊˌbiːl/", "mean": "xe trượt tuyết có động cơ", "pos": "danh từ", "vi": "xe trượt tuyết máy", "w": "snowmobile"}, {"ex": "The mail was once delivered by dogsled.", "ipa": "/ˈdɔːɡsled/", "mean": "xe trượt tuyết do chó kéo", "pos": "danh từ", "vi": "xe chó kéo", "w": "dogsled"}, {"ex": "Trust is the foundation of any friendship.", "ipa": "/faʊnˈdeɪʃn/", "mean": "nền móng (nghĩa đen và nghĩa bóng)", "pos": "danh từ", "vi
