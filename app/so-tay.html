<style>
/* Layout: one reading column; sticky header with book name + three tabs; cards only for flashcards. */
:root {
  --bg: #eef2f5;        /* frost paper */
  --surface: #ffffff;
  --ink: #17222d;       /* deep polar ink */
  --muted: #5b6b7a;
  --line: #d3dce4;
  --accent: #1f6f8b;    /* glacier blue */
  --accent-soft: #dcebf1;
  --known: #2f7d4f;
  --known-soft: #dff0e5;
  --wrong: #a8322a;
  --wrong-soft: #f9e2df;
  --new: #9a4a00;       /* new-word ink */
  --new-soft: #fbe9cf;
  --font-read: "Literata", "Noto Serif", "Noto Serif SC", Georgia, serif;
  --font-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-ipa: "Noto Sans", "Lucida Sans Unicode", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f161d; --surface: #17212b; --ink: #e3eaf0; --muted: #93a3b2; --line: #2a3744;
  --accent: #6cb8d4; --accent-soft: #1b3341; --known: #7cc99a; --known-soft: #1a3326; --wrong: #f0958d; --wrong-soft: #3b1d1a; --new: #f0b46a; --new-soft: #3a2a14; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f161d; --surface: #17212b; --ink: #e3eaf0; --muted: #93a3b2; --line: #2a3744;
  --accent: #6cb8d4; --accent-soft: #1b3341; --known: #7cc99a; --known-soft: #1a3326; --wrong: #f0958d; --wrong-soft: #3b1d1a; --new: #f0b46a; --new-soft: #3a2a14; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header .wrap { padding-block: 16px 0; display: grid; gap: 10px; }
.book { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.book h1 { margin: 0; font-family: var(--font-read); font-size: 1.5rem; font-weight: 600; text-wrap: balance; }
.book .orig { color: var(--muted); font-size: .9rem; }
.book select { font: inherit; font-size: .85rem; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs a { padding: 8px 12px 10px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a .n { font-size: .75rem; margin-left: 4px; padding: 1px 6px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { font-size: calc(15px * var(--rs, 1)); }
main .wrap { padding-block: 20px 48px; }
.fs { display: inline-flex; margin-left: auto; }
.fs button { padding: 4px 10px; font-size: .85rem; }
.fs button + button { border-left: 0; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
button { font: inherit; font-size: .88rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button.good { background: var(--known); border-color: var(--known); color: var(--bg); }
#jump { font: inherit; font-size: .88rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
input[type="search"] { font: inherit; font-size: .88rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); flex: 1 1 160px; min-width: 0; }
.stat { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Bản dịch */
.page { padding-block: 8px 24px; border-bottom: 1px solid var(--line); }
.page + .page { padding-top: 24px; }
.page-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.page p { font-family: var(--font-read); font-size: 1.15em; line-height: 1.75; margin: 0 0 .9em; max-width: 65ch; }
.page .src p { color: var(--muted); font-size: 1.05em; }
.page .note { font-size: .88rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.src { margin-bottom: 12px; }

/* Danh sách */
.items { display: grid; gap: 0; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item > div { min-width: 0; }
.item .w { font-family: var(--font-read); font-size: 1.15rem; font-weight: 600; }
.item .ipa, .card .ipa { font-family: var(--font-ipa); color: var(--muted); font-size: .9rem; }
.item .pos { font-size: .75rem; color: var(--accent); margin-left: 6px; }
.item .mean { margin-top: 2px; }
.item .ex { font-family: var(--font-read); font-style: italic; color: var(--muted); font-size: .95rem; }
.item .acts { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.item.known .w::after { content: "Đã thuộc"; font-family: var(--font-ui); font-size: .7rem; font-weight: 600; color: var(--known); background: var(--known-soft); padding: 1px 6px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }
.formula { font-family: var(--font-ui); font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; display: inline-block; margin: 4px 0; font-size: .9rem; overflow-wrap: anywhere; }
.quote { font-family: var(--font-read); border-left: 2px solid var(--accent); padding-left: 10px; margin: 6px 0; }
.pg { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Thẻ ghi nhớ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 22px; min-height: 260px; display: grid; align-content: center; gap: 10px; text-align: center; cursor: pointer; box-shadow: 0 1px 2px rgba(15, 30, 45, .06); }
.card .big { font-family: var(--font-read); font-size: 1.9rem; font-weight: 600; overflow-wrap: anywhere; }
.card .hint { font-size: .8rem; color: var(--muted); }
.card .back { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 12px; }
.card .ex { font-family: var(--font-read); font-style: italic; color: var(--muted); }
.card-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.empty { padding: 32px 0; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
.card:hover { border-color: var(--accent); }

/* Từ mới trong bản gốc */
.nw { color: var(--new); background: var(--new-soft); border-bottom: 1.5px dotted var(--new); border-radius: 3px; padding: 0 2px; cursor: pointer; }
.nw:hover, .nw[aria-expanded="true"] { background: var(--new); color: var(--surface); }
.src .legend { font-family: var(--font-ui); font-size: .8rem; color: var(--muted); margin: 0 0 8px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(10, 20, 30, .18);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet .in { max-width: 760px; margin: 0 auto; display: grid; gap: 6px; }
.sheet .w { font-family: var(--font-read); font-size: 1.4rem; font-weight: 600; }
.sheet .ex { font-family: var(--font-read); font-style: italic; color: var(--muted); }
.sheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* Đọc kiểu Kindle: trang cố định, lật trái/phải bằng cột CSS */
#reader { position: fixed; inset: 0; z-index: 30; background: var(--surface); color: var(--ink); display: grid; grid-template-rows: auto 1fr auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.rd-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.rd-bar .seg button { padding: 5px 10px; }
.rd-view { position: relative; overflow: hidden; margin: 18px max(24px, env(safe-area-inset-right, 0px)) 8px max(24px, env(safe-area-inset-left, 0px)); max-width: 680px; width: calc(100% - 48px); justify-self: center; touch-action: pan-y; }
.rd-content { position: absolute; top: 0; left: 0; height: 100%; column-fill: auto; font-family: var(--font-read); line-height: 1.7; text-align: justify; }
@media (prefers-reduced-motion: no-preference) { .rd-content.anim { transition: transform .25s ease; } }
.rd-content p { margin: 0 0 .8em; text-indent: 1.2em; }
@media (max-width: 520px) { .rd-content { text-align: left; } }
.rd-content .rd-mark { font-family: var(--font-ui); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-indent: 0; margin: .6em 0 .4em; }
.rd-content .rd-src { color: var(--muted); font-size: .92em; }
.rd-foot { display: flex; justify-content: space-between; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
#rdSheet .sheet { z-index: 40; }
#reader[hidden] { display: none; }

/* Nút nổi: lên đầu / đến trang cuối trong tab Bản dịch */
#fab { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 8; display: grid; gap: 8px; }
#fab[hidden] { display: none; }
#fab button { box-shadow: 0 2px 10px rgba(10, 20, 30, .22); border-radius: 20px; padding: 8px 14px; font-weight: 600; }
#fab #toEnd { background: var(--accent); border-color: var(--accent); color: var(--bg); }

/* Trò chơi ôn tập */
.freq { font-size: .72rem; color: var(--new); background: var(--new-soft); border-radius: 10px; padding: 1px 7px; margin-left: 6px; white-space: nowrap; font-weight: 600; }
.reviewbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; padding: 10px 12px; margin-bottom: 14px; background: var(--accent-soft); border-radius: 12px; }
.rv-text { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .88rem; }
.lookup input[type="text"] { font: inherit; flex: 1 1 160px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.lookup .res { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.dots { font-size: .7rem; letter-spacing: .12em; color: var(--accent); margin-left: 6px; white-space: nowrap; }
.mini { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mini > span { min-width: 0; overflow-wrap: anywhere; }
.game { display: grid; gap: 12px; }
.ghead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.gbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.gbar i { display: block; height: 100%; background: var(--accent); }
.gq { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 16px; display: grid; gap: 12px; }
.gq .big { font-family: var(--font-read); font-size: 1.7rem; font-weight: 600; overflow-wrap: anywhere; }
.gq input[type="text"] { font: inherit; flex: 1 1 140px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.game .help { font-size: .85rem; color: var(--muted); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 12px 14px; font-size: 1rem; line-height: 1.4; overflow-wrap: anywhere; }
.opt .sub { display: block; font-size: .8rem; color: var(--muted); margin-top: 2px; }
.opt.right, .gans.right { background: var(--known-soft); border-color: var(--known); }
.opt.wrong, .gans.wrong { background: var(--wrong-soft); border-color: var(--wrong); }
.gfb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; border: 1px solid var(--line); background: var(--surface); }
.gfb.right { background: var(--known-soft); border-color: var(--known); }
.gfb.wrong { background: var(--wrong-soft); border-color: var(--wrong); }
.gfb .ex { font-family: var(--font-read); font-style: italic; color: var(--muted); }
.chips, .gans { display: flex; flex-wrap: wrap; gap: 8px; }
.gans { min-height: 52px; padding: 8px; border: 1px dashed var(--line); border-radius: 10px; align-items: center; }
.chip { font-family: var(--font-read); font-size: 1rem; padding: 8px 12px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); }
.chip:disabled:not(.on) { opacity: .35; }

/* Thêm trang */
.add { display: grid; gap: 14px; }
.add .field { display: grid; gap: 6px; }
.add textarea { font-family: var(--font-read); font-size: 1rem; line-height: 1.6; min-height: 220px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); resize: vertical; width: 100%; }
.add input[type="text"], .add select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.add .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add .help { font-size: .85rem; color: var(--muted); }
.thumb { max-height: 160px; border: 1px solid var(--line); border-radius: 8px; }
.status { padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: .9rem; white-space: pre-wrap; }
.insight p { font-family: var(--font-read); font-size: 1.05em; line-height: 1.7; margin: 0 0 .8em; max-width: 65ch; border-left: 2px solid var(--accent); padding-left: 12px; }
.status.warn { background: var(--new-soft); border: 1px solid var(--new); }
.status.err { background: var(--surface); border: 1px solid var(--line); }
details.hard { margin-top: 6px; }
details.hard summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
details.hard li { margin-bottom: 8px; }
.result h3 { font-size: .95rem; margin: 16px 0 6px; }
.danger { color: var(--muted); font-size: .8rem; padding: 2px 8px; }
</style>

  <div class="wrap">

<script>
const REPO_BOOKS = [{"id": "the-gioi-2050", "title": "Thế giới 2050", "original": "The World in 2050", "author": "Laurence C. Smith", "lang": "en", "pages": [{"n": 1, "date": "2026-10-28", "source": ["...winter. The name was popularized in a book by Fiona Hill and Clifford Gaddy of the Brookings Institution, but the concept is as ancient as life itself. When it arrives, the birds depart, the ground cracks, frogs freeze solid in their mud beds. At the extreme end, if temperatures plunge to -40°F (or -40°C, the Fahrenheit and Celsius temperature scales converge at this number) steel breaks, engines fail, and manual work becomes virtually impossible. Human enterprise grinds to a halt.", "Regardless of country, all NORC northerners seem to..."], "translation": ["...mùa đông. Cái tên này trở nên phổ biến nhờ một cuốn sách của Fiona Hill và Clifford Gaddy thuộc Viện Brookings, nhưng bản thân khái niệm này thì cổ xưa như chính sự sống. Khi nó đến, chim chóc bay đi, mặt đất nứt nẻ, ếch đông cứng trong những ổ bùn của chúng. Ở mức khắc nghiệt nhất, nếu nhiệt độ tụt xuống -40°F (hay -40°C, vì thang nhiệt độ Fahrenheit và Celsius trùng nhau đúng ở con số này), thép gãy vỡ, động cơ chết máy, và lao động chân tay gần như không thể thực hiện được. Mọi hoạt động của con người đều đình trệ.", "Bất kể ở quốc gia nào, tất cả người dân miền bắc thuộc các nước NORC dường như..."], "note": "NORC (Northern Rim Countries): các nước vành đai phương Bắc gồm Mỹ, Canada, Iceland, Greenland, Na Uy, Thụy Điển, Phần Lan, Nga.", "vocab": [{"w": "popularize", "ipa": "/ˈpɒpjələraɪz/", "pos": "v", "mean": "làm cho phổ biến, phổ cập", "ex": "The idea was popularized by a TV series.", "vi": "trở nên phổ biến"}, {"w": "concept", "ipa": "/ˈkɒnsept/", "pos": "n", "mean": "khái niệm", "ex": "The concept of time is hard to explain.", "vi": "khái niệm"}, {"w": "ancient", "ipa": "/ˈeɪnʃənt/", "pos": "adj", "mean": "cổ xưa, lâu đời", "ex": "an ancient tradition", "vi": "cổ xưa"}, {"w": "depart", "ipa": "/dɪˈpɑːt/", "pos": "v", "mean": "rời đi (trang trọng hơn leave)", "ex": "The train departs at 9 a.m.", "vi": "bay đi"}, {"w": "freeze solid", "ipa": "/friːz ˈsɒlɪd/", "pos": "v phr", "mean": "đông cứng hoàn toàn", "ex": "The lake froze solid overnight.", "vi": "đông cứng"}, {"w": "mud bed", "ipa": "/mʌd bed/", "pos": "n", "mean": "ổ bùn, lớp bùn (nơi ếch ngủ đông)", "ex": "Frogs hibernate in mud beds.", "vi": "ổ bùn"}, {"w": "at the extreme end", "ipa": "/ɪkˈstriːm/", "pos": "phr", "mean": "ở mức cực đoan nhất, ở thái cực", "ex": "At the extreme end, some people work 80 hours a week.", "vi": "Ở mức khắc nghiệt nhất"}, {"w": "plunge", "ipa": "/plʌndʒ/", "pos": "v", "mean": "tụt mạnh, lao xuống đột ngột", "ex": "Prices plunged by 30%.", "vi": "tụt xuống"}, {"w": "converge", "ipa": "/kənˈvɜːdʒ/", "pos": "v", "mean": "hội tụ, gặp nhau tại một điểm", "ex": "The two roads converge near the river.", "vi": "trùng nhau"}, {"w": "temperature scale", "ipa": "/ˈtemprətʃə skeɪl/", "pos": "n", "mean": "thang đo nhiệt độ", "ex": "the Celsius temperature scale", "vi": "thang nhiệt độ"}, {"w": "manual work", "ipa": "/ˈmænjuəl wɜːk/", "pos": "n", "mean": "lao động chân tay", "ex": "Manual work is tiring in hot weather.", "vi": "lao động chân tay"}, {"w": "virtually", "ipa": "/ˈvɜːtʃuəli/", "pos": "adv", "mean": "gần như, hầu như (= almost)", "ex": "It's virtually impossible to finish today.", "vi": "gần như"}, {"w": "enterprise", "ipa": "/ˈentəpraɪz/", "pos": "n", "mean": "hoạt động, công cuộc (ở đây không phải \"doanh nghiệp\")", "ex": "Human enterprise depends on cheap energy.", "vi": "hoạt động của con người"}, {"w": "grind to a halt", "ipa": "/ɡraɪnd tu ə hɔːlt/", "pos": "idiom", "mean": "dần dần ngừng hẳn, đình trệ", "ex": "Traffic ground to a halt after the accident.", "vi": "đình trệ"}, {"w": "regardless of", "ipa": "/rɪˈɡɑːdləs əv/", "pos": "prep", "mean": "bất kể, không phân biệt", "ex": "Everyone is welcome regardless of age.", "vi": "Bất kể"}, {"w": "northerner", "ipa": "/ˈnɔːðənə/", "pos": "n", "mean": "người miền bắc", "ex": "Northerners are used to long winters.", "vi": "người dân miền bắc"}], "patterns": [{"name": "Bị động có \"by\"", "formula": "S + was/were + V3 + (in N) + by + người", "src": "The name was popularized in a book by Fiona Hill and Clifford Gaddy.", "explain": "Nhấn mạnh sự việc thay vì người làm. Ở đây \"by\" đi với \"a book\" (sách của ai), không đi với động từ.", "ex": "The theory was made famous in a lecture by Einstein.", "exVi": "Lý thuyết này trở nên nổi tiếng qua một bài giảng của Einstein."}, {"name": "So sánh bằng + \"itself\"", "formula": "as + adj + as + N + itself", "src": "The concept is as ancient as life itself.", "explain": "\"itself\" đứng sau danh từ để nhấn mạnh: \"chính\" cái đó, tức là ở mức tối đa.", "ex": "This problem is as old as the city itself.", "exVi": "Vấn đề này cũ như chính thành phố này."}, {"name": "Câu điều kiện loại 0", "formula": "If + hiện tại đơn, hiện tại đơn", "src": "If temperatures plunge to -40°F, steel breaks, engines fail.", "explain": "Dùng cho quy luật tự nhiên, sự thật luôn đúng; cả hai vế đều chia hiện tại đơn, không dùng \"will\".", "ex": "If you heat ice, it melts.", "exVi": "Nếu bạn làm nóng băng, nó tan chảy."}, {"name": "Liệt kê không dùng \"and\"", "formula": "Clause, clause, clause.", "src": "When it arrives, the birds depart, the ground cracks, frogs freeze solid in their mud beds.", "explain": "Các mệnh đề ngắn nối bằng dấu phẩy, tạo nhịp nhanh và gây ấn tượng. Hợp văn miêu tả; không nên lạm dụng trong IELTS Writing.", "ex": "The bell rings, the doors open, the children run out.", "exVi": "Chuông reo, cửa mở, lũ trẻ chạy ùa ra."}, {"name": "regardless of / seem to", "formula": "Regardless of + N/V-ing, S + seem(s) to + V", "src": "Regardless of country, all NORC northerners seem to...", "explain": "\"regardless of\" = bất kể; \"seem to + V nguyên mẫu\" = dường như.", "ex": "Regardless of the weather, she seems to enjoy running every morning.", "exVi": "Bất kể thời tiết thế nào, cô ấy dường như vẫn thích chạy bộ mỗi sáng."}]}, {"n": 2, "date": "2026-10-28", "source": ["...hold something in common when it comes to this special temperature: \"Minus forties,\" as such days are known, are universally despised. The shutdown of activity it commands has been described to me by restaurateurs in Whitehorse, Cree trappers in Alberta, truck drivers in Russia, and retirees in Helsinki. And while they otherwise express varying opinions about the problems or benefits posed to them by climate change, the one sentiment they all seem to agree on is relief that \"minus forties\" are becoming increasingly rare."], "translation": ["...có một điểm chung khi nói đến mức nhiệt độ đặc biệt này: những ngày \"âm bốn mươi\", như cách người ta gọi chúng, bị mọi người ghét bỏ. Sự đình trệ hoạt động mà nó áp đặt đã được những chủ nhà hàng ở Whitehorse, những người đặt bẫy thú người Cree ở Alberta, các tài xế xe tải ở Nga và những người về hưu ở Helsinki mô tả cho tôi nghe. Và dù ở các khía cạnh khác, họ bày tỏ nhiều quan điểm khác nhau về những vấn đề hay lợi ích mà biến đổi khí hậu mang lại cho họ, thì cảm xúc duy nhất họ dường như đều đồng tình là sự nhẹ nhõm vì những ngày \"âm bốn mươi\" đang ngày càng hiếm đi."], "note": "Whitehorse là thủ phủ của vùng Yukon (Canada). Cree là một dân tộc bản địa ở Canada. Alberta là tỉnh miền tây Canada. Helsinki là thủ đô Phần Lan. \"Minus forties\" chỉ những ngày nhiệt độ xuống -40 độ. Câu mở đầu bị cắt từ trang trước, chủ ngữ là người dân miền bắc các nước NORC. Trong ảnh, \"forties\"are thiếu dấu cách, đã giữ nguyên theo bản gốc.", "vocab": [{"ex": "The film was universally praised by critics.", "ipa": "/ˌjuːnɪˈvɜːsəli/", "mean": "một cách phổ biến, ở mọi nơi, bởi tất cả mọi người", "pos": "trạng từ", "vi": "mọi người", "w": "universally"}, {"ex": "He despises people who lie.", "ipa": "/dɪˈspaɪz/", "mean": "khinh ghét, ghét cay ghét đắng", "pos": "động từ", "vi": "ghét bỏ", "w": "despise"}, {"ex": "The storm caused a shutdown of the airport.", "ipa": "/ˈʃʌtdaʊn/", "mean": "sự ngừng hoạt động, sự đình trệ", "pos": "danh từ", "vi": "sự đình trệ", "w": "shutdown"}, {"ex": "The strong winter commands respect from every traveler.", "ipa": "/kəˈmɑːnd/", "mean": "đòi hỏi, áp đặt (nghĩa bóng trong câu)", "pos": "động từ", "vi": "áp đặt", "w": "command"}, {"ex": "The restaurateur opened a second branch last year.", "ipa": "/ˌrestərəˈtɜː/", "mean": "chủ nhà hàng", "pos": "danh từ", "vi": "chủ nhà hàng", "w": "restaurateur"}, {"ex": "The trapper spent the winter in the forest.", "ipa": "/ˈtræpə/", "mean": "người đặt bẫy bắt thú (lấy lông)", "pos": "danh từ", "vi": "người đặt bẫy thú", "w": "trapper"}, {"ex": "Many retirees move to warmer countries.", "ipa": "/rɪˌtaɪəˈriː/", "mean": "người đã về hưu", "pos": "danh từ", "vi": "người về hưu", "w": "retiree"}, {"ex": "The room was small but otherwise comfortable.", "ipa": "/ˈʌðəwaɪz/", "mean": "ở các khía cạnh khác (nghĩa trong câu)", "pos": "trạng từ", "vi": "ở các khía cạnh khác", "w": "otherwise"}, {"ex": "Rising seas pose a threat to coastal cities.", "ipa": "/pəʊz/", "mean": "gây ra, đặt ra (vấn đề, mối đe dọa)", "pos": "động từ", "vi": "mang lại", "w": "pose"}, {"ex": "Public sentiment turned against the plan.", "ipa": "/ˈsentɪmənt/", "mean": "cảm xúc, quan điểm chung", "pos": "danh từ", "vi": "cảm xúc", "w": "sentiment"}, {"ex": "She felt great relief when the exam ended.", "ipa": "/rɪˈliːf/", "mean": "sự nhẹ nhõm, sự an tâm", "pos": "danh từ", "vi": "sự nhẹ nhõm", "w": "relief"}], "patterns": [{"ex": "When it comes to cooking, my father is an expert.", "exVi": "Khi nói đến nấu ăn, bố tôi là một chuyên gia.", "explain": "Dùng để giới thiệu chủ đề đang được bàn tới, nghĩa là \"về vấn đề...\", \"khi nói đến...\". Sau to là danh từ hoặc V-ing.", "formula": "when it comes to + danh từ/V-ing", "name": "Khi nói đến...", "src": "hold something in common when it comes to this special temperature"}, {"ex": "The book she recommended has been translated into ten languages.", "exVi": "Cuốn sách cô ấy giới thiệu đã được dịch sang mười thứ tiếng.", "explain": "\"it commands\" là mệnh đề quan hệ lược bỏ that/which: the shutdown (that) it commands. Cả cụm làm chủ ngữ của thì hiện tại hoàn thành bị động has been described.", "formula": "danh từ + V3/-ed (+ by...)", "name": "Mệnh đề quan hệ rút gọn bị động", "src": "The shutdown of activity it commands has been described to me by restaurateurs"}, {"ex": "While I like the city, I prefer living in the countryside.", "exVi": "Dù tôi thích thành phố, tôi vẫn thích sống ở nông thôn hơn.", "explain": "While ở đầu câu mang nghĩa \"mặc dù/trong khi\", nêu sự tương phản: vế đầu là điểm khác biệt, vế sau là điểm chung.", "formula": "While + mệnh đề 1, mệnh đề 2", "name": "While nhượng bộ", "src": "And while they otherwise express varying opinions ... the one sentiment they all seem to agree on is relief"}, {"ex": "The students seem to enjoy the new course.", "exVi": "Các sinh viên có vẻ thích khóa học mới.", "explain": "Seem to diễn đạt nhận định mang tính phỏng đoán, giảm mức chắc chắn. Lưu ý agree on đi kèm giới từ on, được đẩy ra cuối mệnh đề quan hệ.", "formula": "S + seem(s) to + V", "name": "Seem + to V", "src": "the one sentiment they all seem to agree on"}, {"ex": "Fresh water is becoming increasingly scarce.", "exVi": "Nước ngọt đang ngày càng khan hiếm.", "explain": "Increasingly nghĩa là \"ngày càng\", diễn tả sự thay đổi tăng dần theo thời gian.", "formula": "become + increasingly + adj", "name": "Increasingly + tính từ", "src": "are becoming increasingly rare"}], "hard": [{"mean": "Tác giả nghe những người ở nhiều nơi và nhiều nghề khác nhau đều kể về việc cái lạnh -40 độ làm mọi hoạt động đình trệ.", "parts": "Chủ ngữ: The shutdown of activity (it commands) - sự đình trệ hoạt động mà nó áp đặt. Vị ngữ: has been described to me - đã được mô tả cho tôi. Tác nhân: by + bốn nhóm người ở bốn nơi (chủ nhà hàng, người đặt bẫy, tài xế, người về hưu).", "s": "The shutdown of activity it commands has been described to me by restaurateurs in Whitehorse, Cree trappers in Alberta, truck drivers in Russia, and retirees in Helsinki."}, {"mean": "Dù ý kiến của họ về tác động của biến đổi khí hậu khác nhau, điểm họ đồng thuận duy nhất là cảm thấy nhẹ nhõm vì những ngày lạnh -40 độ ngày càng hiếm.", "parts": "Mệnh đề nhượng bộ: while they otherwise express varying opinions about the problems or benefits (posed to them by climate change) - rút gọn bị động bổ nghĩa cho problems or benefits. Mệnh đề chính: the one sentiment (they all seem to agree on) is relief. Mệnh đề đồng vị: that \"minus forties\" are becoming increasingly rare giải thích nội dung của relief.", "s": "And while they otherwise express varying opinions about the problems or benefits posed to them by climate change, the one sentiment they all seem to agree on is relief that \"minus forties\" are becoming increasingly rare."}]}, {"n": 3, "date": "2026-10-28", "source": ["The most crushing cold rolls each year through eastern Siberia. On a typical January day in the town of Verkhoyansk, temperatures average around -48°C (-54°F). That is far colder than the North Pole, even though Verkhoyansk lies fifteen hundred miles south of it. Such frigidity stirs up images of hardy Russians bundled in furs, trudging home with some fire-wood or vodka to beat back the elements. A less familiar image is Verkhoyansk in July, when average daytime temperatures soar to nearly +21°C (+70°F). Our same Russian friends now stroll in..."], "translation": ["Mỗi năm, đợt lạnh khắc nghiệt nhất lại quét qua miền đông Siberia. Vào một ngày tháng Một điển hình ở thị trấn Verkhoyansk, nhiệt độ trung bình vào khoảng -48°C (-54°F). Con số đó lạnh hơn Bắc Cực rất nhiều, mặc dù Verkhoyansk nằm cách Bắc Cực một nghìn năm trăm dặm về phía nam. Cái giá lạnh như vậy gợi lên hình ảnh những người Nga cứng cỏi, bọc kín trong lớp lông thú, nặng nhọc lê bước về nhà với ít củi hoặc rượu vodka để chống chọi với thời tiết khắc nghiệt. Một hình ảnh ít quen thuộc hơn là Verkhoyansk vào tháng Bảy, khi nhiệt độ ban ngày trung bình vọt lên gần +21°C (+70°F). Những người bạn Nga của chúng ta lúc này lại dạo bước trong..."], "note": "Verkhoyansk là thị trấn ở vùng Yakutia (Sakha), miền đông Siberia, nổi tiếng là một trong những nơi có biên độ nhiệt giữa mùa đông và mùa hè lớn nhất thế giới. 1 dặm (mile) ≈ 1,6 km nên 1.500 dặm ≈ 2.400 km. Tác giả dùng 'hình ảnh quen thuộc' (người Nga trong giá rét) để tạo tương phản với mùa hè nóng ở đây. Đoạn văn bị cắt ở cuối câu nên giữ dấu '...'.", "vocab": [{"ex": "The team suffered a crushing defeat.", "ipa": "/ˈkrʌʃɪŋ/", "mean": "khắc nghiệt, nặng nề, áp đảo (ở đây: lạnh khủng khiếp)", "pos": "tính từ", "vi": "khắc nghiệt", "w": "crushing"}, {"ex": "The frigidity of the lake surprised the swimmers.", "ipa": "/frɪˈdʒɪdəti/", "mean": "cái giá lạnh cực độ", "pos": "danh từ", "vi": "Cái giá lạnh", "w": "frigidity"}, {"ex": "The old song stirred up memories of my childhood.", "ipa": "/stɜːr ʌp/", "mean": "khơi gợi, gợi lên (hình ảnh, cảm xúc)", "pos": "cụm động từ", "vi": "gợi lên", "w": "stir up"}, {"ex": "Only hardy plants survive on the mountain.", "ipa": "/ˈhɑːrdi/", "mean": "cứng cỏi, chịu đựng giỏi", "pos": "tính từ", "vi": "cứng cỏi", "w": "hardy"}, {"ex": "The children were bundled in thick coats.", "ipa": "/ˈbʌndld/", "mean": "mặc dày, quấn kín để giữ ấm", "pos": "tính từ / động từ (bundle up)", "vi": "bọc kín", "w": "bundled"}, {"ex": "She wore a coat trimmed with fur.", "ipa": "/fɜːr/", "mean": "lông thú, áo lông", "pos": "danh từ", "vi": "lông thú", "w": "fur"}, {"ex": "We trudged through the snow for an hour.", "ipa": "/trʌdʒ/", "mean": "lê bước nặng nhọc", "pos": "động từ", "vi": "nặng nhọc lê bước", "w": "trudge"}, {"ex": "Firefighters beat back the flames.", "ipa": "/biːt bæk/", "mean": "đẩy lùi, chống lại", "pos": "cụm động từ", "vi": "chống chọi", "w": "beat back"}, {"ex": "The tent protected us from the elements.", "ipa": "/ði ˈelɪmənts/", "mean": "thời tiết khắc nghiệt (mưa, gió, giá rét)", "pos": "danh từ (số nhiều)", "vi": "thời tiết khắc nghiệt", "w": "the elements"}, {"ex": "Prices soared after the drought.", "ipa": "/sɔːr/", "mean": "vọt lên, tăng vọt", "pos": "động từ", "vi": "vọt lên", "w": "soar"}, {"ex": "They strolled along the river after dinner.", "ipa": "/stroʊl/", "mean": "đi dạo thong thả", "pos": "động từ", "vi": "dạo bước", "w": "stroll"}], "patterns": [{"ex": "He felt tired, even though he had slept ten hours.", "exVi": "Anh ấy thấy mệt, mặc dù đã ngủ mười tiếng.", "explain": "'Even though' nhấn mạnh sự trái ngược với điều ta mong đợi: lẽ ra nằm xa Bắc Cực hơn thì phải ấm hơn, nhưng thực tế lại lạnh hơn.", "formula": "S1 + V1, even though + S2 + V2", "name": "Mệnh đề nhượng bộ với 'even though'", "src": "That is far colder than the North Pole, even though Verkhoyansk lies fifteen hundred miles south of it."}, {"ex": "This route is far shorter than the old one.", "exVi": "Tuyến đường này ngắn hơn tuyến cũ rất nhiều.", "explain": "'Far' đứng trước dạng so sánh hơn để nhấn mạnh mức chênh lệch lớn (tương tự 'much', 'a lot').", "formula": "far + tính từ so sánh hơn + than", "name": "So sánh hơn có từ nhấn mạnh 'far'", "src": "far colder than the North Pole"}, {"ex": "I saw a man sitting alone, wrapped in a blanket.", "exVi": "Tôi thấy một người đàn ông ngồi một mình, quấn trong tấm chăn.", "explain": "Cụm 'bundled in furs' (quá khứ phân từ, bị động) và 'trudging home...' (hiện tại phân từ, chủ động) bổ nghĩa cho 'Russians', miêu tả hình ảnh mà không cần mệnh đề quan hệ.", "formula": "danh từ + V-ing + ...", "name": "Cụm phân từ hiện tại bổ nghĩa", "src": "hardy Russians bundled in furs, trudging home with some fire-wood or vodka"}, {"ex": "We visit Hue in April, when the weather is mild.", "exVi": "Chúng tôi đến Huế vào tháng Tư, khi thời tiết dịu mát.", "explain": "'When' sau dấu phẩy bổ sung thông tin về thời điểm (July) được nhắc đến trước đó.", "formula": "danh từ chỉ thời gian + , when + S + V", "name": "Mệnh đề quan hệ chỉ thời gian 'when'", "src": "Verkhoyansk in July, when average daytime temperatures soar to nearly +21°C"}], "hard": [{"mean": "Cái lạnh như thế gợi ra hình ảnh người Nga cứng cỏi, mặc kín lông thú, mang củi hoặc vodka về nhà để chống lại giá rét.", "parts": "Chủ ngữ: Such frigidity (cái giá lạnh như vậy). Vị ngữ: stirs up images of... (gợi lên những hình ảnh về...). Tân ngữ: images of hardy Russians. Cụm phân từ bổ nghĩa cho Russians: bundled in furs (bọc trong lông thú), trudging home with some fire-wood or vodka (lê bước về nhà với củi hoặc vodka). Cụm mục đích: to beat back the elements (để chống chọi với thời tiết khắc nghiệt).", "s": "Such frigidity stirs up images of hardy Russians bundled in furs, trudging home with some fire-wood or vodka to beat back the elements."}, {"mean": "Hình ảnh ít người biết hơn là Verkhoyansk vào tháng Bảy, khi nhiệt độ ban ngày trung bình tăng lên gần 21°C.", "parts": "Chủ ngữ: A less familiar image (một hình ảnh ít quen thuộc hơn). Động từ: is. Vị ngữ: Verkhoyansk in July (Verkhoyansk vào tháng Bảy). Mệnh đề quan hệ: when average daytime temperatures soar to nearly +21°C (khi nhiệt độ ban ngày trung bình tăng vọt lên gần +21°C).", "s": "A less familiar image is Verkhoyansk in July, when average daytime temperatures soar to nearly +21°C (+70°F)."}]}, {"n": 4, "date": "2026-10-28", "source": ["short-sleeved shirts and halter tops, licking delicious precast ice-cream cones that taste like pure vanilla cream.", "“So . . . what are you doing this summer?” I am asked this question twenty or so times per year. Invariably—after responding I’m going to Siberia, or Iceland, or Alaska—I win a puzzled look, followed by a nodding smile and the advice to not forget my parka and snow boots. When I explain I’ll actually require sunscreen, DEET, and plenty of white T-shirts, I get another puzzled look."], "translation": ["... áo sơ mi ngắn tay và áo hở lưng buộc cổ, liếm những chiếc kem ốc quế đúc sẵn thơm ngon, có vị như kem vani nguyên chất.", "“Vậy... mùa hè này bạn định làm gì?” Một năm tôi được hỏi câu này khoảng hai mươi lần. Lần nào cũng vậy: sau khi tôi trả lời là sẽ đi Siberia, hoặc Iceland, hoặc Alaska, tôi đều nhận về một ánh nhìn khó hiểu, rồi đến một nụ cười gật gù cùng lời khuyên đừng quên mang áo parka và ủng đi tuyết. Khi tôi giải thích rằng thực ra mình sẽ cần kem chống nắng, thuốc chống muỗi DEET và thật nhiều áo phông trắng, tôi lại nhận thêm một ánh nhìn khó hiểu nữa."], "note": "Đoạn đầu nối tiếp trang trước (người Nga ở Verkhoyansk dạo bước ngày hè), nên giữ mạch '...' ở đầu. Tác giả xưng 'I' nên dịch là 'tôi', người đối thoại là 'bạn'. DEET là hoạt chất phổ biến trong thuốc xịt chống muỗi/côn trùng. Parka là áo khoác dày có mũ lông. 'Precast' ở đây chỉ kem ốc quế làm sẵn, đúc sẵn (từ gốc xây dựng: bê tông đúc sẵn), dùng với sắc thái hài hước.", "vocab": [{"ex": "She wore a halter top to the beach.", "ipa": "/ˈhɔːltər tɒp/", "mean": "áo hở lưng buộc dây ở cổ", "pos": "danh từ (cụm)", "vi": "áo hở lưng buộc cổ", "w": "halter top"}, {"ex": "The bridge was built with precast concrete.", "ipa": "/ˌpriːˈkæst/", "mean": "đúc sẵn, làm sẵn từ trước", "pos": "tính từ", "vi": "đúc sẵn", "w": "precast"}, {"ex": "Invariably, he arrives ten minutes late.", "ipa": "/ɪnˈveəriəbli/", "mean": "luôn luôn, lần nào cũng vậy", "pos": "trạng từ", "vi": "lần nào cũng vậy", "w": "invariably"}, {"ex": "She gave me a puzzled look.", "ipa": "/ˈpʌzld/", "mean": "bối rối, khó hiểu", "pos": "tính từ", "vi": "khó hiểu", "w": "puzzled"}, {"ex": "He gave a nodding approval to the plan.", "ipa": "/ˈnɒdɪŋ/", "mean": "gật đầu (tỏ vẻ hiểu hoặc đồng tình)", "pos": "tính từ (V-ing)", "vi": "gật gù", "w": "nodding"}, {"ex": "Bring a parka for the winter trip.", "ipa": "/ˈpɑːkə/", "mean": "áo khoác dày có mũ, chống lạnh", "pos": "danh từ", "vi": "áo parka", "w": "parka"}, {"ex": "Spray DEET on your skin before the hike.", "ipa": "/diːt/", "mean": "hoạt chất chống muỗi và côn trùng", "pos": "danh từ", "vi": "thuốc chống muỗi DEET", "w": "DEET"}, {"ex": "This job requires patience.", "ipa": "/rɪˈkwaɪər/", "mean": "cần, đòi hỏi", "pos": "động từ", "vi": "cần", "w": "require"}, {"ex": "His joke won him a few laughs.", "ipa": "/wɪn/", "mean": "nhận được, khiến người khác dành cho (một phản ứng)", "pos": "động từ (nghĩa bóng)", "vi": "nhận về", "w": "win (a look)"}], "patterns": [{"ex": "She walked along the beach, eating an ice cream.", "exVi": "Cô ấy đi dọc bờ biển, vừa đi vừa ăn kem.", "explain": "Cụm V-ing bổ sung một hành động xảy ra cùng lúc với hành động chính, có thể hiểu là 'vừa... vừa...'.", "formula": "S + V, V-ing + O", "name": "Phân từ hiện tại chỉ hành động đồng thời", "src": "licking delicious precast ice-cream cones"}, {"ex": "I love soups that taste like home.", "exVi": "Tôi thích những món súp có vị như ở nhà.", "explain": "'That' mở đầu mệnh đề quan hệ bổ nghĩa cho danh từ đứng trước; 'taste like' nghĩa là 'có vị giống'.", "formula": "N + that + V + (like + N)", "name": "Mệnh đề quan hệ với 'that' (cụm danh từ + that + V)", "src": "ice-cream cones that taste like pure vanilla cream"}, {"ex": "Usually—after finishing his homework—he plays chess.", "exVi": "Thường thì, sau khi làm xong bài tập, cậu ấy chơi cờ.", "explain": "Dấu gạch ngang tách một cụm giải thích chen giữa; 'after + V-ing' chỉ thời điểm xảy ra trước hành động chính.", "formula": "Invariably—after + V-ing + clause—S + V", "name": "Cụm trạng ngữ chen giữa bằng dấu gạch ngang", "src": "Invariably—after responding I’m going to Siberia, or Iceland, or Alaska—I win a puzzled look"}, {"ex": "She gave me the advice to save more money.", "exVi": "Cô ấy khuyên tôi nên tiết kiệm nhiều tiền hơn.", "explain": "'Advice' + to-V diễn đạt nội dung lời khuyên; phủ định dùng 'not to + V'.", "formula": "the advice + (not) to + V", "name": "Câu khuyên 'advice to + V'", "src": "the advice to not forget my parka and snow boots"}, {"ex": "When I mention my job, people look surprised.", "exVi": "Khi tôi nhắc đến công việc của mình, mọi người đều ngạc nhiên.", "explain": "Mệnh đề thời gian với 'when' chỉ lúc sự việc xảy ra; ở đây còn mang nghĩa thói quen lặp lại.", "formula": "When + S + V, S + V", "name": "Mệnh đề 'When' + mệnh đề chính", "src": "When I explain I’ll actually require sunscreen, DEET, and plenty of white T-shirts, I get another puzzled look."}], "hard": [{"mean": "Mỗi khi tôi nói sẽ đi những nơi lạnh giá, người ta đều ngơ ngác, rồi mỉm cười gật đầu và dặn tôi mang đồ chống lạnh, vì họ nghĩ những nơi đó chỉ có tuyết.", "parts": "Trạng từ: Invariably (lần nào cũng vậy). Cụm chen giữa: after responding (I’m going to Siberia, or Iceland, or Alaska) = sau khi trả lời rằng tôi sẽ đi... Chủ ngữ: I. Vị ngữ: win a puzzled look. Cụm phân từ: followed by a nodding smile and the advice to not forget... = tiếp theo là nụ cười gật gù và lời khuyên đừng quên...", "s": "Invariably—after responding I’m going to Siberia, or Iceland, or Alaska—I win a puzzled look, followed by a nodding smile and the advice to not forget my parka and snow boots."}, {"mean": "Khi tôi giải thích rằng mùa hè ở đó nóng và nhiều muỗi nên tôi cần kem chống nắng, thuốc chống muỗi và áo phông trắng, người ta lại càng khó hiểu hơn.", "parts": "Mệnh đề trạng ngữ: When I explain (that) I’ll actually require... (that được lược bỏ). Tân ngữ: sunscreen, DEET, and plenty of white T-shirts. Mệnh đề chính: I get another puzzled look.", "s": "When I explain I’ll actually require sunscreen, DEET, and plenty of white T-shirts, I get another puzzled look."}]}, {"n": 5, "date": "2026-10-28", "source": ["In summer, even on the high Arctic tundra, there is muggy heat, hordes of buzzing insects, and water running everywhere. Yes, there are stunted trees, tundra mosses, and no raccoons, but these things are the result of cold winters, not summers. In summer the sun circles the sky day and night. Everything is bathed in heat and light. The ground thaws, flowers bloom, and rodents teem. While driving through Fairbanks, Alaska, I noticed people starting softball games at midnight. The place simply explodes with pent-up life in fantastic overdrive."], "translation": ["Vào mùa hè, ngay cả trên vùng lãnh nguyên Bắc Cực cao, vẫn có cái nóng oi bức, từng đàn côn trùng vo ve và nước chảy khắp nơi. Đúng là ở đó có những cây còi cọc, rêu lãnh nguyên và không có gấu mèo, nhưng những điều này là kết quả của mùa đông giá lạnh chứ không phải của mùa hè. Vào mùa hè, mặt trời quay vòng quanh bầu trời cả ngày lẫn đêm. Mọi thứ đắm mình trong hơi nóng và ánh sáng. Mặt đất tan băng, hoa nở rộ, và loài gặm nhấm sinh sôi dày đặc. Khi lái xe qua Fairbanks, Alaska, tôi để ý thấy người ta bắt đầu các trận bóng mềm vào lúc nửa đêm. Nơi này đơn giản là bùng nổ sức sống bị dồn nén bấy lâu, trong một trạng thái hoạt động cực độ đến kinh ngạc."], "note": "Tundra (lãnh nguyên) là vùng đất lạnh, không có cây cao, nền đất đóng băng vĩnh cửu. Fairbanks là thành phố ở nội địa Alaska, nơi mùa hè có gần như 24 giờ ánh sáng ban ngày. Softball (bóng mềm) là môn gần giống bóng chày. Raccoon là gấu mèo Bắc Mỹ; tác giả dùng ví dụ này để nói rằng việc không có chúng là do mùa đông chứ không phải mùa hè.", "vocab": [{"ex": "It was a muggy afternoon before the storm.", "ipa": "/ˈmʌɡi/", "mean": "oi bức, ẩm ướt và nóng", "pos": "tính từ", "vi": "oi bức", "w": "muggy"}, {"ex": "Hordes of tourists visit the old town in July.", "ipa": "/hɔːrdz əv/", "mean": "đám đông, từng đàn (thường rất nhiều và gây phiền)", "pos": "cụm danh từ", "vi": "từng đàn", "w": "hordes of"}, {"ex": "Poor soil left the plants stunted.", "ipa": "/ˈstʌntɪd/", "mean": "còi cọc, không phát triển đầy đủ", "pos": "tính từ", "vi": "còi cọc", "w": "stunted"}, {"ex": "Few trees can grow on the tundra.", "ipa": "/ˈtʌndrə/", "mean": "lãnh nguyên", "pos": "danh từ", "vi": "lãnh nguyên", "w": "tundra"}, {"ex": "Arctic foxes change color with the seasons.", "ipa": "/ˈɑːrktɪk/", "mean": "thuộc Bắc Cực", "pos": "tính từ", "vi": "Bắc Cực", "w": "Arctic"}, {"ex": "The valley was bathed in golden light.", "ipa": "/beɪðd ɪn/", "mean": "được tắm trong, ngập tràn (ánh sáng, hơi ấm)", "pos": "cụm động từ (bị động)", "vi": "đắm mình", "w": "bathed in"}, {"ex": "The river begins to thaw in April.", "ipa": "/θɔː/", "mean": "tan băng, tan chảy", "pos": "động từ", "vi": "tan băng", "w": "thaw"}, {"ex": "Rodents can damage stored grain.", "ipa": "/ˈroʊdnt/", "mean": "loài gặm nhấm (chuột, sóc...)", "pos": "danh từ", "vi": "loài gặm nhấm", "w": "rodent"}, {"ex": "The pond teems with tiny fish.", "ipa": "/tiːm/", "mean": "nhung nhúc, sinh sôi dày đặc", "pos": "động từ", "vi": "sinh sôi dày đặc", "w": "teem"}, {"ex": "He released his pent-up anger by running.", "ipa": "/ˌpent ˈʌp/", "mean": "bị dồn nén, kìm nén lâu", "pos": "tính từ", "vi": "bị dồn nén", "w": "pent-up"}, {"ex": "The garden explodes with color in May.", "ipa": "/ɪkˈsploʊd wɪð/", "mean": "bùng nổ với (sức sống, màu sắc...)", "pos": "cụm động từ", "vi": "bùng nổ", "w": "explode with"}, {"ex": "The city goes into overdrive during the festival.", "ipa": "/ˈoʊvərdraɪv/", "mean": "trạng thái hoạt động cực mạnh, hết công suất", "pos": "danh từ", "vi": "trạng thái hoạt động cực độ", "w": "overdrive"}], "patterns": [{"ex": "Yes, the test was hard, but I still passed.", "exVi": "Đúng là bài kiểm tra khó, nhưng tôi vẫn đỗ.", "explain": "Tác giả thừa nhận một điều đúng rồi chuyển sang điểm chính của mình bằng 'but'.", "formula": "Yes, + mệnh đề thừa nhận, but + mệnh đề phản bác", "name": "Nhấn mạnh nhượng bộ với 'Yes, ... but ...'", "src": "Yes, there are stunted trees, tundra mosses, and no raccoons, but these things are the result of cold winters, not summers."}, {"ex": "Her success is the result of hard work, not luck.", "exVi": "Thành công của cô ấy là kết quả của sự chăm chỉ chứ không phải may mắn.", "explain": "'not' đứng sau dấu phẩy để phủ định và đối chiếu với vế đầu, làm rõ nguyên nhân thật.", "formula": "be the result of + A, not B", "name": "Cấu trúc 'A, not B' để đối lập", "src": "these things are the result of cold winters, not summers"}, {"ex": "While walking home, she met an old friend.", "exVi": "Trong lúc đi bộ về nhà, cô ấy gặp một người bạn cũ.", "explain": "Chủ ngữ của mệnh đề trạng ngữ trùng với chủ ngữ chính (I) nên được lược bỏ, giữ 'While + V-ing'.", "formula": "While + V-ing, S + V", "name": "Rút gọn mệnh đề trạng ngữ bằng V-ing", "src": "While driving through Fairbanks, Alaska, I noticed people starting softball games at midnight."}, {"ex": "I noticed him leaving the room.", "exVi": "Tôi để ý thấy anh ấy rời khỏi phòng.", "explain": "Dùng V-ing sau tân ngữ để nói đã thấy hành động đang diễn ra.", "formula": "notice + O + V-ing", "name": "Động từ tri giác + O + V-ing", "src": "I noticed people starting softball games at midnight."}], "hard": [{"mean": "Nơi này bùng nổ sức sống bị kìm nén lâu ngày, hoạt động hết công suất một cách đáng kinh ngạc.", "parts": "Chủ ngữ: The place. Trạng từ: simply. Vị ngữ: explodes with pent-up life. Cụm giới từ chỉ trạng thái: in fantastic overdrive.", "s": "The place simply explodes with pent-up life in fantastic overdrive."}, {"mean": "Dù có cây còi cọc, rêu và không có gấu mèo, đó là do mùa đông lạnh chứ không phải do mùa hè.", "parts": "Vế 1 (nhượng bộ): there are stunted trees, tundra mosses, and no raccoons. Vế 2 (chính): these things are the result of cold winters. Phần đối lập: not summers.", "s": "Yes, there are stunted trees, tundra mosses, and no raccoons, but these things are the result of cold winters, not summers."}]}, {"n": 6, "date": "2026-10-28", "source": ["games at midnight. The place simply explodes with pent-up life in fantastic overdrive.", "There is now overwhelming evidence that northern winters are becoming milder and growing seasons are getting longer. From weather station data, we know that air temperatures rose throughout the northern high latitudes during most of the last century, and especially after 1966. There was a short cooling snap lasting from about 1946 to 1965, but even then large areas of southern Canada and southern Eurasia continued to warm. After 1966, temperatures took off sharply, especially in the northern Eurasian and northwestern North Ameri..."], "translation": ["... các trận bóng vào lúc nửa đêm. Nơi này đơn giản là bùng nổ sức sống bị dồn nén bấy lâu, trong một trạng thái hoạt động cực độ đến kinh ngạc.", "Hiện nay đã có bằng chứng áp đảo cho thấy mùa đông ở phương bắc đang trở nên ôn hòa hơn và các mùa sinh trưởng đang dài ra. Từ dữ liệu của các trạm khí tượng, chúng ta biết rằng nhiệt độ không khí đã tăng khắp các vĩ độ cao phía bắc trong phần lớn thế kỷ trước, và đặc biệt là sau năm 1966. Từng có một đợt lạnh ngắn kéo dài từ khoảng năm 1946 đến 1965, nhưng ngay cả khi đó, nhiều khu vực rộng lớn ở miền nam Canada và miền nam Á-Âu vẫn tiếp tục ấm lên. Sau năm 1966, nhiệt độ tăng vọt mạnh mẽ, đặc biệt ở vùng bắc Á-Âu và tây bắc Bắc Mỹ..."], "note": "Eurasia = Á-Âu (lục địa Âu và Á gộp lại). High latitudes = các vĩ độ cao, tức vùng gần Bắc Cực. Growing season = mùa sinh trưởng (khoảng thời gian trong năm đủ ấm để cây phát triển). Câu đầu của trang là phần cuối của câu ở trang trước (softball games at midnight), còn câu cuối bị cắt giữa chữ 'American'.", "vocab": [{"ex": "He released his pent-up anger by running.", "ipa": "/ˌpent ˈʌp/", "mean": "bị dồn nén, bị kìm nén lâu ngày", "pos": "tính từ", "vi": "bị dồn nén", "w": "pent-up"}, {"ex": "After the deadline was moved up, the team went into overdrive.", "ipa": "/ˈəʊvədraɪv/", "mean": "trạng thái hoạt động cực độ, hết công suất", "pos": "danh từ", "vi": "trạng thái hoạt động cực độ", "w": "overdrive"}, {"ex": "The garden explodes with color in spring.", "ipa": "/ɪkˈspləʊd wɪð/", "mean": "bùng nổ với (sức sống, cảm xúc)", "pos": "cụm động từ", "vi": "bùng nổ", "w": "explode with"}, {"ex": "There was overwhelming support for the new law.", "ipa": "/ˌəʊvəˈwelmɪŋ/", "mean": "áp đảo, quá lớn", "pos": "tính từ", "vi": "áp đảo", "w": "overwhelming"}, {"ex": "Scientists found clear evidence of rising sea levels.", "ipa": "/ˈevɪdəns/", "mean": "bằng chứng", "pos": "danh từ", "vi": "bằng chứng", "w": "evidence"}, {"ex": "The region has mild winters.", "ipa": "/maɪld/", "mean": "ôn hòa, ấm áp (thời tiết)", "pos": "tính từ", "vi": "ôn hòa", "w": "mild"}, {"ex": "Countries at high latitudes have long winters.", "ipa": "/ˈlætɪtjuːd/", "mean": "vĩ độ", "pos": "danh từ", "vi": "vĩ độ", "w": "latitude"}, {"ex": "A brief cooling snap damaged the crops.", "ipa": "/ˈkuːlɪŋ snæp/", "mean": "đợt lạnh đột ngột, ngắn", "pos": "danh từ (cụm)", "vi": "đợt lạnh ngắn", "w": "cooling snap"}, {"ex": "Eurasia is the largest landmass on Earth.", "ipa": "/jʊəˈreɪʒə/", "mean": "lục địa Á-Âu", "pos": "danh từ riêng", "vi": "Á-Âu", "w": "Eurasia"}, {"ex": "Sales took off after the advertising campaign.", "ipa": "/teɪk ɒf/", "mean": "tăng vọt, cất cánh (về số liệu)", "pos": "cụm động từ", "vi": "tăng vọt", "w": "take off"}, {"ex": "Prices rose sharply last year.", "ipa": "/ˈʃɑːpli/", "mean": "mạnh, đột ngột", "pos": "trạng từ", "vi": "mạnh mẽ", "w": "sharply"}, {"ex": "The disease spread throughout the country.", "ipa": "/θruːˈaʊt/", "mean": "khắp, suốt", "pos": "giới từ", "vi": "khắp", "w": "throughout"}], "patterns": [{"ex": "There is strong evidence that exercise improves memory.", "exVi": "Có bằng chứng mạnh mẽ cho thấy tập thể dục cải thiện trí nhớ.", "explain": "Dùng 'evidence that...' để nêu luận điểm được dữ liệu ủng hộ. Mệnh đề sau 'that' giải thích nội dung của bằng chứng.", "formula": "There is + evidence + that + mệnh đề", "name": "Hiện tại hoàn thành tiếp diễn mang nghĩa 'có bằng chứng rằng'", "src": "There is now overwhelming evidence that northern winters are becoming milder"}, {"ex": "The days are getting shorter in autumn.", "exVi": "Ngày đang ngắn dần vào mùa thu.", "explain": "Dùng become/get + so sánh hơn để nói một xu hướng đang thay đổi dần theo thời gian.", "formula": "be/become/get + tính từ so sánh hơn (+ and + so sánh hơn)", "name": "So sánh hơn diễn tả sự thay đổi dần", "src": "winters are becoming milder and growing seasons are getting longer"}, {"ex": "There was a storm lasting from Monday to Wednesday.", "exVi": "Đã có một cơn bão kéo dài từ thứ Hai đến thứ Tư.", "explain": "'lasting' rút gọn mệnh đề quan hệ 'that lasted', bổ nghĩa cho danh từ đứng trước.", "formula": "danh từ + V-ing + from... to...", "name": "Phân từ hiện tại làm định ngữ rút gọn", "src": "a short cooling snap lasting from about 1946 to 1965"}, {"ex": "He apologized, but even then she refused to talk to him.", "exVi": "Anh ấy đã xin lỗi, nhưng ngay cả khi đó cô ấy vẫn không chịu nói chuyện với anh.", "explain": "'Even then' nghĩa là 'ngay cả khi đó', nhấn mạnh điều xảy ra bất chấp hoàn cảnh vừa nêu.", "formula": "..., but even then + mệnh đề", "name": "Even then (nhượng bộ)", "src": "but even then large areas of southern Canada ... continued to warm"}], "hard": [{"mean": "Dù từng có một đợt lạnh ngắn từ khoảng 1946 đến 1965, nhiều vùng rộng lớn ở nam Canada và nam Á-Âu vẫn tiếp tục ấm lên.", "parts": "Mệnh đề 1: There was a short cooling snap (có một đợt lạnh ngắn) + lasting from 1946 to 1965 (rút gọn, bổ nghĩa cho snap). Mệnh đề 2: large areas of southern Canada and southern Eurasia (chủ ngữ) + continued to warm (vị ngữ), mở đầu bằng 'but even then' (nhưng ngay cả khi đó).", "s": "There was a short cooling snap lasting from about 1946 to 1965, but even then large areas of southern Canada and southern Eurasia continued to warm."}, {"mean": "Từ dữ liệu trạm khí tượng, ta biết nhiệt độ không khí tăng khắp các vĩ độ cao phía bắc trong phần lớn thế kỷ trước, nhất là sau 1966.", "parts": "Trạng ngữ nguồn: From weather station data. Chủ ngữ: we. Vị ngữ: know. Mệnh đề danh từ sau that: air temperatures (chủ ngữ) rose (động từ) throughout the northern high latitudes (nơi chốn) during most of the last century (thời gian), and especially after 1966 (nhấn mạnh).", "s": "From weather station data, we know that air temperatures rose throughout the northern high latitudes during most of the last century, and especially after 1966."}]}, {"n": 7, "date": "2026-10-28", "source": ["can interiors, where annual air temperatures have been rising at least 1° to 2°C per decade on average. That’s about ten times faster than the global average, and it’s being driven almost completely by warmer springs and winters.", "The New Arrivals", "As you might imagine, the biological response to this has been brisk. By the 1990s, a greening up of northern plant cover was spotted by satellites. Down on the ground, trees grew taller and barren tundra began sprouting up shrubs. All of this is consistent with the temperature increases recorded by weather stations. Not..."], "translation": ["... vùng nội địa, nơi nhiệt độ không khí trung bình hằng năm đã và đang tăng ít nhất 1° đến 2°C mỗi thập kỷ. Con số đó nhanh gấp khoảng mười lần mức trung bình toàn cầu, và nó gần như hoàn toàn do mùa xuân và mùa đông ấm lên thúc đẩy.", "Những cư dân mới", "Như bạn có thể hình dung, phản ứng sinh học trước điều này diễn ra khá nhanh. Đến thập niên 1990, vệ tinh đã phát hiện thảm thực vật phương bắc đang xanh lên. Dưới mặt đất, cây cối mọc cao hơn và vùng lãnh nguyên cằn cỗi bắt đầu mọc lên những bụi cây. Tất cả những điều này phù hợp với mức tăng nhiệt độ mà các trạm khí tượng ghi nhận được. Không chỉ..."], "note": "Đoạn đầu bị cắt giữa câu, có thể đang nói về vùng nội địa (interiors) của Bắc Mỹ hoặc Á-Âu ở vĩ độ cao. 'The New Arrivals' là tiêu đề mục, ở đây ám chỉ các loài thực vật, động vật mới di chuyển lên phương bắc (tôi dịch là 'Những cư dân mới', có thể chỉnh lại theo mạch sách). Tundra (lãnh nguyên) là vùng đất lạnh, không có cây cao, đất đóng băng vĩnh cửu bên dưới.", "vocab": [{"ex": "The interior of the continent is much drier than the coast.", "ipa": "/ɪnˈtɪəriə(r)/", "mean": "vùng nội địa, phần sâu trong đất liền", "pos": "danh từ", "vi": "vùng nội địa", "w": "interior"}, {"ex": "The annual rainfall here is very low.", "ipa": "/ˈænjuəl/", "mean": "hằng năm", "pos": "tính từ", "vi": "hằng năm", "w": "annual"}, {"ex": "On average, students read two books a month.", "ipa": "/ɒn ˈævərɪdʒ/", "mean": "tính trung bình", "pos": "cụm từ", "vi": "trung bình", "w": "on average"}, {"ex": "The change is driven by new technology.", "ipa": "/ˈdrɪvn baɪ/", "mean": "được thúc đẩy bởi, do... gây ra", "pos": "cụm động từ (bị động)", "vi": "thúc đẩy", "w": "driven by"}, {"ex": "Scientists studied the biological effects of the drug.", "ipa": "/ˌbaɪəˈlɒdʒɪkl/", "mean": "thuộc sinh học", "pos": "tính từ", "vi": "sinh học", "w": "biological"}, {"ex": "Sales were brisk during the holiday season.", "ipa": "/brɪsk/", "mean": "nhanh, mạnh mẽ, sôi nổi", "pos": "tính từ", "vi": "nhanh", "w": "brisk"}, {"ex": "The greening up of the hills begins in April.", "ipa": "/ˈɡriːnɪŋ ʌp/", "mean": "sự xanh lên của thảm thực vật", "pos": "danh động từ (cụm động từ green up)", "vi": "xanh lên", "w": "greening up"}, {"ex": "Forest cover has declined sharply since 1990.", "ipa": "/ˈkʌvə(r)/", "mean": "lớp phủ (thực vật)", "pos": "danh từ", "vi": "thảm thực vật", "w": "cover (plant cover)"}, {"ex": "She spotted a mistake in the report.", "ipa": "/spɒt/", "mean": "nhận thấy, phát hiện", "pos": "động từ", "vi": "phát hiện", "w": "spot"}, {"ex": "The barren land could grow nothing.", "ipa": "/ˈbærən/", "mean": "cằn cỗi, không sinh sản được", "pos": "tính từ", "vi": "cằn cỗi", "w": "barren"}, {"ex": "Reindeer roam across the Arctic tundra.", "ipa": "/ˈtʌndrə/", "mean": "lãnh nguyên", "pos": "danh từ", "vi": "lãnh nguyên", "w": "tundra"}, {"ex": "New cafés have sprouted up all over the city.", "ipa": "/spraʊt ʌp/", "mean": "mọc lên, nảy ra", "pos": "cụm động từ", "vi": "mọc lên", "w": "sprout up"}, {"ex": "He planted shrubs along the fence.", "ipa": "/ʃrʌb/", "mean": "cây bụi", "pos": "danh từ", "vi": "bụi cây", "w": "shrub"}, {"ex": "The results are consistent with earlier studies.", "ipa": "/kənˈsɪstənt wɪð/", "mean": "phù hợp với, nhất quán với", "pos": "tính từ + giới từ", "vi": "phù hợp với", "w": "consistent with"}], "patterns": [{"ex": "This train is three times faster than the bus.", "exVi": "Chuyến tàu này nhanh gấp ba lần xe buýt.", "explain": "Dùng 'số + times' trước tính từ/trạng từ so sánh hơn để nói gấp bao nhiêu lần.", "formula": "X times + so sánh hơn + than + N", "name": "Cấu trúc nhấn mạnh so sánh gấp bội", "src": "about ten times faster than the global average"}, {"ex": "Prices have been rising since last year.", "exVi": "Giá cả đã tăng liên tục từ năm ngoái.", "explain": "Diễn tả quá trình bắt đầu trong quá khứ và vẫn tiếp tục đến hiện tại, nhấn mạnh sự liên tục.", "formula": "have/has been + V-ing", "name": "Thì hiện tại hoàn thành tiếp diễn", "src": "annual air temperatures have been rising"}, {"ex": "The bridge is being repaired by workers.", "exVi": "Cây cầu đang được công nhân sửa chữa.", "explain": "Thể bị động của thì tiếp diễn, diễn tả hành động đang xảy ra mà chủ ngữ chịu tác động.", "formula": "S + be being + V3 (+ by agent)", "name": "Bị động tiếp diễn với 'being + V3'", "src": "it’s being driven almost completely by warmer springs and winters"}, {"ex": "The signal was detected by a small telescope.", "exVi": "Tín hiệu được phát hiện bởi một kính thiên văn nhỏ.", "explain": "Nhấn mạnh sự việc được phát hiện hơn là người phát hiện; tác nhân đứng sau 'by'.", "formula": "S + was/were + V3 + by + agent", "name": "Câu bị động quá khứ", "src": "a greening up of northern plant cover was spotted by satellites"}, {"ex": "The data collected by students were useful.", "exVi": "Dữ liệu do sinh viên thu thập rất hữu ích.", "explain": "'recorded by...' là mệnh đề quan hệ bị động rút gọn (= that were recorded by...).", "formula": "N + V3 (+ by ...)", "name": "Mệnh đề quan hệ rút gọn / Phân từ sau danh từ", "src": "the temperature increases recorded by weather stations"}], "hard": [{"mean": "Tốc độ ấm lên này nhanh gấp khoảng mười lần mức trung bình toàn cầu, và nguyên nhân gần như hoàn toàn đến từ mùa xuân và mùa đông ấm hơn.", "parts": "Câu ghép gồm 2 mệnh đề nối bằng 'and'. Mệnh đề 1: 'That' (chủ ngữ, chỉ tốc độ tăng nhiệt) + 's (is) + about ten times faster than the global average (vị ngữ so sánh). Mệnh đề 2: 'it' (chủ ngữ) + is being driven (bị động tiếp diễn) + almost completely by warmer springs and winters (tác nhân).", "s": "That’s about ten times faster than the global average, and it’s being driven almost completely by warmer springs and winters."}, {"mean": "Dưới mặt đất, cây cối cao lớn hơn và vùng lãnh nguyên cằn cỗi bắt đầu mọc lên các bụi cây.", "parts": "Trạng ngữ chỉ nơi chốn: 'Down on the ground'. Mệnh đề 1: trees (chủ ngữ) + grew taller (vị ngữ + bổ ngữ tính từ). Mệnh đề 2: barren tundra (chủ ngữ) + began sprouting up (vị ngữ) + shrubs (tân ngữ). Ở đây 'sprout up' dùng như ngoại động từ theo nghĩa 'mọc ra, cho ra'.", "s": "Down on the ground, trees grew taller and barren tundra began sprouting up shrubs."}, {"mean": "Tất cả những điều này phù hợp với mức tăng nhiệt độ do các trạm khí tượng ghi nhận.", "parts": "Chủ ngữ: All of this. Vị ngữ: is consistent with (phù hợp với). Tân ngữ của giới từ: the temperature increases + 'recorded by weather stations' (cụm quá khứ phân từ bổ nghĩa cho danh từ).", "s": "All of this is consistent with the temperature increases recorded by weather stations."}]}, {"n": 8, "date": "2026-10-28", "source": ["... surprisingly, ecosystem models project plant growth to continue rising right alongside the projected increases in air temperature and growing season length. Even under the \"optimistic\" emissions scenario shown earlier, Arctic net primary productivity (a measure of overall plant biomass growth) is projected to almost double by the 2080s.", "Wildlife is also on the move. From my travels and interviews the appearance of \"southern\" creatures in northern places was a prevailing theme. I heard repeatedly about raccoons, white-tailed deer, beavers, and even a mountain lion spotted in places they'd never been seen before. My uncle, a ..."], "translation": ["... đáng ngạc nhiên là các mô hình hệ sinh thái dự báo sự phát triển của thực vật sẽ tiếp tục tăng song song với mức tăng dự kiến của nhiệt độ không khí và độ dài mùa sinh trưởng. Ngay cả trong kịch bản phát thải \"lạc quan\" đã trình bày ở phần trước, năng suất sơ cấp ròng của vùng Bắc Cực (một thước đo mức tăng trưởng sinh khối thực vật nói chung) được dự báo sẽ tăng gần gấp đôi vào những năm 2080.", "Động vật hoang dã cũng đang di chuyển. Qua các chuyến đi và các cuộc phỏng vấn của tôi, sự xuất hiện của những loài vật \"phương nam\" ở các vùng phương bắc là một chủ đề xuyên suốt. Tôi nghe đi nghe lại về gấu mèo Bắc Mỹ, hươu đuôi trắng, hải ly, và thậm chí cả một con sư tử núi được phát hiện ở những nơi chúng chưa từng xuất hiện trước đây. Chú của tôi, một ..."], "note": "\"Net primary productivity\" (NPP) là thuật ngữ sinh thái học: lượng chất hữu cơ mà thực vật tạo ra sau khi trừ phần chúng dùng cho hô hấp. \"Mountain lion\" còn gọi là cougar hay puma (sư tử núi). \"Raccoon\" là gấu mèo Bắc Mỹ (khác với gấu trúc). \"2080s\" nghĩa là giai đoạn 2080–2089. Đoạn đầu bị cắt giữa câu, đoạn cuối cũng bị cắt giữa câu.", "vocab": [{"ex": "Pollution can damage a fragile ecosystem.", "ipa": "/ˈiːkoʊˌsɪstəm/", "mean": "hệ sinh thái", "pos": "danh từ", "vi": "hệ sinh thái", "w": "ecosystem"}, {"ex": "Experts project that sales will double next year.", "ipa": "/prəˈdʒekt/", "mean": "dự báo, ước tính (dựa trên dữ liệu hiện có)", "pos": "động từ", "vi": "dự báo", "w": "project (v.)"}, {"ex": "Prices rose alongside wages.", "ipa": "/əˌlɒŋˈsaɪd/", "mean": "song song với, cùng với", "pos": "giới từ", "vi": "song song với", "w": "alongside"}, {"ex": "A longer growing season helps farmers.", "ipa": "/ˈɡroʊɪŋ ˈsiːzən/", "mean": "mùa sinh trưởng (thời gian trong năm cây có thể phát triển)", "pos": "cụm danh từ", "vi": "mùa sinh trưởng", "w": "growing season"}, {"ex": "The city wants to cut carbon emissions.", "ipa": "/ɪˈmɪʃənz/", "mean": "lượng khí thải", "pos": "danh từ (số nhiều)", "vi": "phát thải", "w": "emissions"}, {"ex": "In the worst-case scenario, the crops would fail.", "ipa": "/səˈnɑːrioʊ/", "mean": "kịch bản", "pos": "danh từ", "vi": "kịch bản", "w": "scenario"}, {"ex": "The new method improved productivity.", "ipa": "/ˌprɒdʌkˈtɪvəti/", "mean": "năng suất", "pos": "danh từ", "vi": "năng suất", "w": "productivity"}, {"ex": "Forest biomass stores a lot of carbon.", "ipa": "/ˈbaɪoʊmæs/", "mean": "sinh khối (tổng khối lượng sinh vật sống)", "pos": "danh từ", "vi": "sinh khối", "w": "biomass"}, {"ex": "The reserve protects local wildlife.", "ipa": "/ˈwaɪldlaɪf/", "mean": "động vật hoang dã", "pos": "danh từ", "vi": "động vật hoang dã", "w": "wildlife"}, {"ex": "Many species are on the move as the climate warms.", "ipa": "/ɒn ðə muːv/", "mean": "đang di chuyển, đang dịch chuyển", "pos": "thành ngữ", "vi": "đang di chuyển", "w": "on the move"}, {"ex": "Strange creatures live in the deep sea.", "ipa": "/ˈkriːtʃər/", "mean": "sinh vật, loài vật", "pos": "danh từ", "vi": "loài vật", "w": "creature"}, {"ex": "The prevailing mood was one of optimism.", "ipa": "/prɪˈveɪlɪŋ/", "mean": "phổ biến, chủ đạo, bao trùm", "pos": "tính từ", "vi": "xuyên suốt", "w": "prevailing"}, {"ex": "A rare bird was spotted near the lake.", "ipa": "/ˈspɒtɪd/", "mean": "được phát hiện, được trông thấy", "pos": "quá khứ phân từ (spot: động từ)", "vi": "được phát hiện", "w": "spotted"}], "patterns": [{"ex": "Global population is projected to reach 10 billion by 2060.", "exVi": "Dân số toàn cầu được dự báo sẽ đạt 10 tỷ người vào năm 2060.", "explain": "Dùng để nói điều gì được dự báo sẽ xảy ra. Chủ ngữ là đối tượng được dự báo, theo sau là to + động từ nguyên mẫu. Rất phổ biến trong văn bản khoa học và báo cáo.", "formula": "S + be + projected/expected/predicted + to V", "name": "Cấu trúc bị động với động từ dự báo", "src": "Arctic net primary productivity ... is projected to almost double by the 2080s."}, {"ex": "Analysts project prices to keep climbing.", "exVi": "Các nhà phân tích dự báo giá sẽ tiếp tục tăng.", "explain": "Chủ động: mô hình/chuyên gia dự báo điều gì sẽ tiếp tục diễn ra. Ở đây \"plant growth\" là tân ngữ, \"to continue rising\" là điều được dự báo.", "formula": "S + project + N + to + continue/V", "name": "Project + tân ngữ + to V (tiếp diễn)", "src": "ecosystem models project plant growth to continue rising"}, {"ex": "Even under ideal conditions, the trip would take two days.", "exVi": "Ngay cả trong điều kiện lý tưởng, chuyến đi cũng mất hai ngày.", "explain": "\"Even under\" nghĩa là ngay cả trong điều kiện/trường hợp (tốt nhất) thì kết quả vẫn vậy. Nhấn mạnh rằng kết luận đúng trong cả tình huống thuận lợi nhất.", "formula": "Even under + N, S + V", "name": "Even under/if để nhấn mạnh nhượng bộ", "src": "Even under the \"optimistic\" emissions scenario shown earlier, ..."}, {"ex": "The wolf seen near the village was very thin.", "exVi": "Con sói được nhìn thấy gần làng trông rất gầy.", "explain": "\"spotted\" rút gọn từ \"which was spotted\". Dùng quá khứ phân từ để bổ nghĩa cho danh từ theo nghĩa bị động.", "formula": "N + V-ed + (nơi chốn/cụm từ)", "name": "Mệnh đề quan hệ rút gọn với quá khứ phân từ", "src": "a mountain lion spotted in places they'd never been seen before"}, {"ex": "He visited a town he had never heard of before.", "exVi": "Anh ấy đã ghé thăm một thị trấn mà trước đó anh chưa từng nghe tên.", "explain": "Past perfect (had never been seen) diễn tả điều chưa từng xảy ra trước thời điểm được nhắc tới trong quá khứ (lúc chúng được phát hiện). Đại từ quan hệ \"that\" bị lược bỏ.", "formula": "places + (that) + S + had never been + V-ed + before", "name": "Past perfect trong mệnh đề quan hệ", "src": "places they'd never been seen before"}], "hard": [{"mean": "Các mô hình dự báo thực vật sẽ vẫn tiếp tục phát triển mạnh hơn cùng lúc với việc khí hậu ấm lên và mùa sinh trưởng dài ra, điều này trái với kỳ vọng thông thường.", "parts": "Trạng từ: surprisingly (đáng ngạc nhiên là). Chủ ngữ: ecosystem models. Vị ngữ: project. Tân ngữ: plant growth. Bổ ngữ: to continue rising (tiếp tục tăng). Trạng ngữ: right alongside the projected increases in air temperature and growing season length (ngay song song với mức tăng dự kiến của nhiệt độ không khí và độ dài mùa sinh trưởng). \"Right\" ở đây nhấn mạnh \"alongside\".", "s": "surprisingly, ecosystem models project plant growth to continue rising right alongside the projected increases in air temperature and growing season length."}, {"mean": "Ngay cả khi lượng phát thải ở mức \"lạc quan\", năng suất sơ cấp ròng của Bắc Cực vẫn được dự báo tăng gần gấp đôi vào những năm 2080.", "parts": "Trạng ngữ nhượng bộ: Even under the \"optimistic\" emissions scenario shown earlier (shown earlier rút gọn bổ nghĩa cho scenario). Chủ ngữ: Arctic net primary productivity, kèm đồng vị ngữ trong ngoặc giải thích thuật ngữ. Vị ngữ bị động: is projected to almost double. Trạng ngữ thời gian: by the 2080s.", "s": "Even under the \"optimistic\" emissions scenario shown earlier, Arctic net primary productivity (a measure of overall plant biomass growth) is projected to almost double by the 2080s."}, {"mean": "Trong các chuyến đi và phỏng vấn của tác giả, việc các loài vật vốn ở phương nam xuất hiện ở phương bắc là điều được nhắc đến nhiều nhất.", "parts": "Trạng ngữ nguồn: From my travels and interviews (qua các chuyến đi và phỏng vấn). Chủ ngữ: the appearance of \"southern\" creatures in northern places. Vị ngữ: was. Bổ ngữ: a prevailing theme.", "s": "From my travels and interviews the appearance of \"southern\" creatures in northern places was a prevailing theme."}]}, {"n": 9, "date": "2026-10-28", "source": ["... longtime outdoorsman in northern New York State, noticed gray squirrels and opossums moving in, along with some crazy disruptions to the spring harvest of maple syrup. The Mountain Pine Beetle, normally kept in check by winter-kill, is now devastating Canadian forests. Other biological examples published in the scientific literature include the common buzzard Buteo buteo wintering near Moscow, nearly a thousand kilometers north of normal; a northward shift in Japan's Greater White-fronted Goose, Anser albifrons; and Sweden's Brown Hare, Lepus europaeus, infiltrating the territory of (and possibly hybridizing with) Lepus timidus, the Mountain Hare. Red foxes are displacing ..."], "translation": ["... một người ưa hoạt động ngoài trời lâu năm ở miền bắc bang New York, đã nhận thấy sóc xám và thú opossum chuyển đến, cùng với một số xáo trộn kỳ lạ đối với vụ thu hoạch xi-rô phong vào mùa xuân. Loài bọ thông núi (Mountain Pine Beetle), vốn thường bị kiềm chế nhờ cái chết hàng loạt do giá rét mùa đông, nay đang tàn phá các khu rừng ở Canada. Những ví dụ sinh học khác được công bố trong các tài liệu khoa học gồm: loài diều hâu buzzard thường (Buteo buteo) trú đông gần Moscow, cách xa nơi chúng thường trú đông gần một nghìn km về phía bắc; sự dịch chuyển lên phía bắc của loài ngỗng trán trắng lớn (Anser albifrons) ở Nhật Bản; và loài thỏ rừng nâu (Lepus europaeus) của Thụy Điển đang xâm nhập vào lãnh thổ của (và có thể lai giống với) loài thỏ rừng núi (Lepus timidus). Cáo đỏ đang chiếm chỗ ..."], "note": "Đoạn mở đầu nối tiếp câu 'Chú của tôi, một ...' ở trang trước. Opossum là thú có túi ở châu Mỹ (khác với possum ở Úc). 'Buzzard' ở Anh/châu Âu là diều hâu thuộc chi Buteo (ở Mỹ buzzard thường chỉ kền kền). Tên khoa học viết nghiêng bằng tiếng Latin. Winter-kill là hiện tượng sinh vật chết do mùa đông quá lạnh, giúp kiểm soát số lượng bọ.", "vocab": [{"ex": "My grandfather was a keen outdoorsman all his life.", "ipa": "/ˈaʊtdɔːrzmən/", "mean": "người ưa hoạt động ngoài trời (săn bắn, câu cá, leo núi...)", "pos": "danh từ", "vi": "người ưa hoạt động ngoài trời", "w": "outdoorsman"}, {"ex": "An opossum was hiding under our porch.", "ipa": "/əˈpɑːsəm/", "mean": "thú opossum, loài thú có túi ở châu Mỹ", "pos": "danh từ", "vi": "thú opossum", "w": "opossum"}, {"ex": "The storm caused major disruption to flights.", "ipa": "/dɪsˈrʌpʃn/", "mean": "sự xáo trộn, gián đoạn", "pos": "danh từ", "vi": "xáo trộn", "w": "disruption"}, {"ex": "Wolves keep the deer population in check.", "ipa": "/kept ɪn tʃek/", "mean": "được kiềm chế, kiểm soát", "pos": "thành ngữ (bị động)", "vi": "kiềm chế", "w": "kept in check"}, {"ex": "Heavy winter-kill reduced the number of insects.", "ipa": "/ˈwɪntər kɪl/", "mean": "sự chết hàng loạt của sinh vật do mùa đông giá rét", "pos": "danh từ", "vi": "cái chết hàng loạt do giá rét mùa đông", "w": "winter-kill"}, {"ex": "The fire devastated thousands of hectares of forest.", "ipa": "/ˈdevəsteɪt/", "mean": "tàn phá nặng nề", "pos": "động từ", "vi": "tàn phá", "w": "devastate"}, {"ex": "She reviewed the literature on sleep and memory.", "ipa": "/ˈlɪtrətʃər/", "mean": "tài liệu, các công trình nghiên cứu (trong ngữ cảnh học thuật)", "pos": "danh từ", "vi": "tài liệu", "w": "literature"}, {"ex": "Many birds winter in warmer regions.", "ipa": "/ˈwɪntər/", "mean": "trú đông, qua mùa đông", "pos": "động từ", "vi": "trú đông", "w": "winter (v.)"}, {"ex": "There has been a shift in public opinion.", "ipa": "/ʃɪft/", "mean": "sự dịch chuyển, thay đổi", "pos": "danh từ", "vi": "sự dịch chuyển", "w": "shift"}, {"ex": "Weeds began to infiltrate the garden.", "ipa": "/ˈɪnfɪltreɪt/", "mean": "xâm nhập, thâm nhập dần", "pos": "động từ", "vi": "xâm nhập", "w": "infiltrate"}, {"ex": "Tigers mark their territory with scent.", "ipa": "/ˈterətɔːri/", "mean": "lãnh thổ, vùng sinh sống của loài vật", "pos": "danh từ", "vi": "lãnh thổ", "w": "territory"}, {"ex": "The two plant species can hybridize naturally.", "ipa": "/ˈhaɪbrɪdaɪz/", "mean": "lai giống", "pos": "động từ", "vi": "lai giống", "w": "hybridize"}, {"ex": "Invasive species may displace native ones.", "ipa": "/dɪsˈpleɪs/", "mean": "chiếm chỗ, đẩy khỏi vị trí vốn có", "pos": "động từ", "vi": "chiếm chỗ", "w": "displace"}], "patterns": [{"ex": "Scientists observed seals breeding on the northern coast.", "exVi": "Các nhà khoa học quan sát thấy những con hải cẩu sinh sản ở bờ biển phía bắc.", "explain": "V-ing đứng sau danh từ để mô tả hành động đang diễn ra hoặc tình trạng của danh từ đó, tương đương mệnh đề quan hệ rút gọn (that winters near Moscow).", "formula": "Danh từ + V-ing + (địa điểm/mức độ)", "name": "Cụm phân từ hiện tại bổ nghĩa danh từ", "src": "the common buzzard Buteo buteo wintering near Moscow"}, {"ex": "The river, usually fed by melting snow, has dried up.", "exVi": "Con sông, thường được nuôi dưỡng bởi tuyết tan, đã cạn khô.", "explain": "Cụm 'normally kept in check by...' là mệnh đề quan hệ bị động rút gọn, đặt giữa hai dấu phẩy để bổ sung thông tin về chủ ngữ.", "formula": "N, + adv + V3 + by ..., + is/are ...", "name": "Trạng từ + quá khứ phân từ (rút gọn bị động)", "src": "The Mountain Pine Beetle, normally kept in check by winter-kill, is now devastating Canadian forests."}, {"ex": "Her duties include teaching classes; writing reports; and training new staff.", "exVi": "Nhiệm vụ của cô ấy gồm giảng dạy; viết báo cáo; và đào tạo nhân viên mới.", "explain": "Dùng dấu chấm phẩy để ngăn cách các mục dài, phức tạp trong danh sách; các mục phải song song về chức năng (đều là danh từ/cụm danh từ).", "formula": "X include + A; B; and C", "name": "Liệt kê song song sau 'include'", "src": "examples ... include the common buzzard ...; a northward shift ...; and Sweden's Brown Hare ..."}, {"ex": "They visited (and later moved to) the small island.", "exVi": "Họ đã đến thăm (và sau đó chuyển tới) hòn đảo nhỏ.", "explain": "Phần trong ngoặc là thông tin bổ sung, mức độ không chắc chắn (possibly); có thể đọc bỏ ngoặc vẫn đúng ngữ pháp, nhưng hai cụm V-ing dùng chung tân ngữ.", "formula": "V-ing + A (and possibly + V-ing + B)", "name": "Thông tin chen trong ngoặc đơn", "src": "infiltrating the territory of (and possibly hybridizing with) Lepus timidus"}], "hard": [{"mean": "Các ví dụ sinh học khác trong y văn khoa học gồm ba trường hợp: diều hâu buzzard trú đông xa về phía bắc, ngỗng trán trắng lớn dịch chuyển lên bắc, và thỏ rừng nâu Thụy Điển xâm nhập lãnh thổ thỏ rừng núi.", "parts": "Chủ ngữ: Other biological examples (published in the scientific literature = phân từ quá khứ rút gọn). Vị ngữ: include. Tân ngữ gồm 3 mục ngăn bằng dấu chấm phẩy: (1) the common buzzard ... wintering near Moscow, nearly a thousand kilometers north of normal; (2) a northward shift in Japan's Greater White-fronted Goose; (3) Sweden's Brown Hare ... infiltrating the territory of Lepus timidus, the Mountain Hare (đồng vị ngữ giải thích tên loài).", "s": "Other biological examples published in the scientific literature include the common buzzard Buteo buteo wintering near Moscow, nearly a thousand kilometers north of normal; a northward shift in Japan's Greater White-fronted Goose, Anser albifrons; and Sweden's Brown Hare, Lepus europaeus, infiltrating the territory of (and possibly hybridizing with) Lepus timidus, the Mountain Hare."}, {"mean": "Bọ thông núi, vốn bị cái lạnh mùa đông kiềm chế, nay đang tàn phá rừng Canada.", "parts": "Chủ ngữ: The Mountain Pine Beetle. Cụm chen: normally kept in check by winter-kill (bị động rút gọn). Vị ngữ: is now devastating (hiện tại tiếp diễn). Tân ngữ: Canadian forests.", "s": "The Mountain Pine Beetle, normally kept in check by winter-kill, is now devastating Canadian forests."}]}, {"n": 10, "date": "2026-10-28", "source": ["... Arctic foxes. Beavers are pushing north, and model projections suggest they will also become denser inside their current range.", "By midcentury Ixodes scapularis—the Lyme-disease-carrying tick—is projected to expand northward from its current toehold in southern Ontario to much of Canada. By century's end the smallmouth bass, today found only near the U.S. border, is projected to live all the way to the Arctic Ocean. In the North Sea—one of the world's most productive fisheries—nearly two-thirds of all fish species have either shifted north in latitude or sunk down to cooler water depths. Even lowly plankton is on the move: In the past forty ..."], "translation": ["... cáo Bắc Cực. Hải ly đang tiến dần lên phía bắc, và các dự báo từ mô hình cho thấy chúng cũng sẽ trở nên dày đặc hơn trong phạm vi phân bố hiện tại của mình.", "Đến giữa thế kỷ, loài ve Ixodes scapularis, loài mang bệnh Lyme, được dự báo sẽ mở rộng lên phía bắc, từ chỗ bám trụ hiện nay ở miền nam Ontario ra phần lớn lãnh thổ Canada. Đến cuối thế kỷ, cá vược miệng nhỏ, hiện chỉ xuất hiện gần biên giới Mỹ, được dự báo sẽ sống trải dài đến tận Bắc Băng Dương. Ở Biển Bắc, một trong những ngư trường năng suất nhất thế giới, gần hai phần ba số loài cá đã dịch chuyển lên vĩ độ cao hơn hoặc lặn xuống các tầng nước mát hơn. Ngay cả sinh vật phù du bé nhỏ cũng đang di chuyển: Trong bốn mươi năm qua ..."], "note": "Arctic fox = cáo Bắc Cực. Ixodes scapularis là tên khoa học của ve chân đen (blacklegged tick/deer tick), vật trung gian truyền bệnh Lyme ở Bắc Mỹ. Smallmouth bass = cá vược miệng nhỏ (cá nước ngọt, được câu thể thao). Ontario là tỉnh của Canada. Page bắt đầu bằng phần cuối câu về cáo đỏ ở trang trước (red fox đang chiếm chỗ cáo Bắc Cực). Cách xưng hô: văn phong khoa học phổ biến, trung tính, không xưng hô.", "vocab": [{"ex": "The projections show sea levels rising by half a metre.", "ipa": "/prəˈdʒekʃn/", "mean": "dự báo, ước tính (dựa trên mô hình/số liệu)", "pos": "danh từ", "vi": "dự báo", "w": "projection"}, {"ex": "Demand is projected to double by 2040.", "ipa": "/prəˈdʒektɪd/", "mean": "được dự báo, dự kiến (is projected to + V)", "pos": "tính từ / quá khứ phân từ", "vi": "được dự báo", "w": "projected"}, {"ex": "The forest grew denser near the river.", "ipa": "/ˈdensər/", "mean": "dày đặc hơn, mật độ cao hơn", "pos": "tính từ (so sánh hơn)", "vi": "dày đặc hơn", "w": "denser"}, {"ex": "The bird's range extends from Spain to Iran.", "ipa": "/reɪndʒ/", "mean": "phạm vi p
