địa, khoa học và y tế công cộng, còn rất dài. Đúng là những vấn đề hóc búa nhất, như an ninh quốc gia, chủ quyền và biên giới, đã (và vẫn đang)348 được né tránh một cách cẩn trọng. Nhưng khác với trước kia, Bắc Cực ngày nay không còn là nơi của những người láng giềng nghi kỵ nhau, vũ trang đến tận răng và không nói chuyện với nhau. Thay vào đó, đã hình thành một mạng lưới quốc tế hết sức văn minh, vận hành hợp tác và hiệu quả ở nhiều cấp độ quản trị.", "Pháp quyền", "Lý do thứ hai để nghi ngờ khả năng bùng nổ một cuộc chiến ở Bắc Cực nằm ở UNCLOS, tức Công ước Liên Hợp Quốc về Luật Biển. Trái với nhận thức phổ biến, Bắc Cực không phải là một chiếc piñata đã bị đập vỡ. Trên đất liền, biên giới chính trị quốc tế của khu vực này không bị tranh chấp. Còn với Bắc Băng Dương, hiện đã có những quy tắc thủ tục rõ ràng để yêu sách đối với đáy biển của nó, và thực tế là bất kỳ..."], "note": "UNCLOS: Công ước Liên Hợp Quốc về Luật Biển (1982). \"Ruptured piñata\" là hình ảnh ẩn dụ: piñata là chiếc bình giấy đựng kẹo, đập vỡ thì ai cũng nhào vào lấy; ý tác giả là Bắc Cực không phải miền vô chủ để các nước tranh giành. \"Armed to the teeth\": vũ trang đến tận răng. Các số 347, 348 là số chú thích cuối sách, giữ nguyên.", "vocab": [{"ex": "The two countries were adversaries for decades.", "ipa": "/ˈædvərseri/", "mean": "đối thủ, kẻ thù", "pos": "danh từ", "vi": "đối thủ", "w": "adversary"}, {"ex": "She scrupulously avoided any conflict of interest.", "ipa": "/ˈskruːpjələsli/", "mean": "một cách cẩn trọng, tỉ mỉ, nghiêm ngặt", "pos": "trạng từ", "vi": "một cách cẩn trọng", "w": "scrupulously"}, {"ex": "Border disputes remain a thorny issue.", "ipa": "/ˈθɔːrni/", "mean": "hóc búa, gai góc (vấn đề)", "pos": "tính từ", "vi": "hóc búa", "w": "thorny"}, {"ex": "The island's sovereignty is disputed.", "ipa": "/ˈsɑːvrənti/", "mean": "chủ quyền", "pos": "danh từ", "vi": "chủ quyền", "w": "sovereignty"}, {"ex": "Both sides were armed to the teeth.", "ipa": "/ɑːrmd tə ðə tiːθ/", "mean": "vũ trang đến tận răng", "pos": "thành ngữ", "vi": "vũ trang đến tận răng", "w": "armed to the teeth"}, {"ex": "They kept the discussion civil despite disagreements.", "ipa": "/ˈsɪvl/", "mean": "văn minh, lịch sự, hòa nhã", "pos": "tính từ", "vi": "văn minh", "w": "civil"}, {"ex": "Good governance builds public trust.", "ipa": "/ˈɡʌvərnəns/", "mean": "quản trị, cách điều hành", "pos": "danh từ", "vi": "quản trị", "w": "governance"}, {"ex": "Experts fear an eruption of violence.", "ipa": "/ɪˈrʌpʃn/", "mean": "sự bùng nổ, phun trào", "pos": "danh từ", "vi": "bùng nổ", "w": "eruption"}, {"ex": "The result of the election was contested.", "ipa": "/kənˈtestɪd/", "mean": "bị tranh chấp, bị phản đối", "pos": "tính từ", "vi": "bị tranh chấp", "w": "contested"}, {"ex": "Several nations lay claim to the territory.", "ipa": "/leɪ kleɪm tuː/", "mean": "đưa ra yêu sách đối với, tuyên bố sở hữu", "pos": "cụm động từ", "vi": "yêu sách đối với", "w": "lay claim to"}, {"ex": "Oil was found beneath the seabed.", "ipa": "/ˈsiːbed/", "mean": "đáy biển", "pos": "danh từ", "vi": "đáy biển", "w": "seabed"}, {"ex": "Kids took turns hitting the piñata.", "ipa": "/pɪnˈjɑːtə/", "mean": "piñata, vật trang trí đập vỡ để lấy quà (ẩn dụ: thứ ai cũng có thể chia phần)", "pos": "danh từ", "vi": "piñata", "w": "piñata"}], "patterns": [{"ex": "The town is no longer a quiet fishing village.", "exVi": "Thị trấn này không còn là một làng chài yên tĩnh nữa.", "explain": "Nhấn mạnh tình trạng trước đây có nhưng bây giờ đã chấm dứt.", "formula": "S + be + no longer + N/adj", "name": "Không còn... nữa (no longer)", "src": "the Arctic today is no longer a place of suspicious neighbors"}, {"ex": "Contrary to popular belief, bats are not blind.", "exVi": "Trái với niềm tin phổ biến, dơi không bị mù.", "explain": "Dùng để bác bỏ quan niệm hay niềm tin phổ biến.", "formula": "Contrary to + N, S + V", "name": "Trái với... (Contrary to)", "src": "Contrary to popular perception the Arctic is not a ruptured piñata."}, {"ex": "Unlike last year, prices are falling.", "exVi": "Khác với năm ngoái, giá cả đang giảm.", "explain": "So sánh đối lập giữa hiện tại và quá khứ hoặc giữa hai đối tượng.", "formula": "Unlike + N/thời điểm, mệnh đề chính", "name": "Unlike + N, S + V", "src": "But unlike the past, the Arctic today is..."}, {"ex": "To be sure, the plan is costly, but it will pay off.", "exVi": "Đúng là kế hoạch tốn kém, nhưng nó sẽ đem lại lợi ích.", "explain": "'To be sure' thừa nhận một điểm trước khi đưa ra quan điểm đối lập chính.", "formula": "To be sure, A; but B", "name": "Đảo ngữ nhấn mạnh với Instead / To be sure", "src": "To be sure, the thorniest matters... have been avoided. But unlike the past..."}], "hard": [{"mean": "Đúng là những vấn đề hóc búa nhất, gồm an ninh quốc gia, chủ quyền và biên giới, đã và vẫn đang được né tránh rất cẩn trọng.", "parts": "Trạng ngữ thừa nhận: To be sure. Chủ ngữ: the thorniest matters (đồng vị ngữ trong gạch ngang: national security, sovereignty, and borders). Vị ngữ: have been scrupulously avoided (bị động, hiện tại hoàn thành). Phần chèn: (and continue to be) bổ sung rằng việc né tránh vẫn tiếp diễn.", "s": "To be sure, the thorniest matters—national security, sovereignty, and borders—have been (and continue to be) scrupulously avoided."}, {"mean": "Thay vào đó, đã có sẵn một mạng lưới quốc tế hết sức văn minh, vận hành hợp tác và hiệu quả ở nhiều cấp quản trị.", "parts": "Cấu trúc 'there is in place + N' (có sẵn, đã được thiết lập): a remarkably civil international network. 'one that...' là mệnh đề quan hệ đồng vị bổ nghĩa cho network: is working cooperatively and effectively at many levels of governance.", "s": "Instead, there is in place a remarkably civil international network, one that is working cooperatively and effectively at many levels of governance."}], "insight": "Tác giả đang phản bác quan niệm phổ biến rằng Bắc Cực sẽ là nơi nổ ra một cuộc chiến vì tài nguyên khi băng tan. Ông đưa ra hai lý do để nghi ngờ viễn cảnh đó. Lý do thứ nhất là các quốc gia ở đây đã xây dựng được mạng lưới hợp tác thực tế trong những việc ít gây tranh cãi như tìm kiếm cứu nạn, bảo vệ môi trường, khoa học và y tế. Lý do thứ hai là luật pháp quốc tế, cụ thể là UNCLOS, đã cung cấp quy trình rõ ràng để các nước đưa ra yêu sách về đáy biển. Lập luận này khá thận trọng: tác giả thừa nhận các vấn đề nhạy cảm nhất như an ninh, chủ quyền và biên giới vẫn bị tránh né, tức là hợp tác không có nghĩa là mọi mâu thuẫn đã được giải quyết.\n\nVề bối cảnh, UNCLOS là Công ước Liên Hợp Quốc về Luật Biển, quy định các quyền của quốc gia đối với vùng biển và thềm lục địa, nên nó là cơ sở để giải quyết tranh chấp bằng thủ tục thay vì vũ lực. Hình ảnh \"chiếc piñata bị đập vỡ\" là một ẩn dụ: piñata là món đồ chơi chứa kẹo trong các lễ hội, ai cũng lao vào giành khi nó vỡ. Tác giả dùng hình ảnh này để chỉ cách nhiều người tưởng tượng Bắc Cực, như một kho báu vô chủ mà các nước sẽ tranh giành hỗn loạn. Ông cho rằng thực tế có trật tự hơn nhiều, vì biên giới trên đất liền không bị tranh chấp và biển đã có quy tắc. Điều đáng suy ngẫm là những thay đổi lớn về môi trường không tự động dẫn đến xung đột, mà kết quả còn phụ thuộc vào thể chế và thói quen hợp tác đã có sẵn.", "insightDone": true}, {"n": 49, "date": "2026-10-31", "source": ["...longer a place of suspicious neighbors, armed to the teeth, who don't talk to each other. Instead, there is in place a remarkably civil international network, one that is working cooperatively and effectively at many levels of governance.", "The Rule of Law", "The second reason to doubt the eruption of an Arctic War lies in UNCLOS, the United Nations Convention on the Law of the Sea. Contrary to popular perception the Arctic is not a ruptured piñata. On land, its international political borders are uncontested. For the Arctic Ocean, there are now clear procedural rules for laying claim to its seabed, and indeed any other seabed. Most importantly, just about every country in the world seems to be following them.", "UNCLOS was negotiated over a nine-year period from 1973 to 1982 and has emerged as one of the most sweeping, stabilizing international treaties in the world. As of 2009 it was ratified by 158 countries, with many more in various stages of doing so. Of the eight NORC countries, seven have ratified UNCLOS."], "translation": ["...còn là nơi của những người láng giềng nghi kỵ nhau, vũ trang đến tận răng và không nói chuyện với nhau. Thay vào đó, đã hình thành một mạng lưới quốc tế hết sức văn minh, vận hành hợp tác và hiệu quả ở nhiều cấp độ quản trị.", "Pháp quyền", "Lý do thứ hai để nghi ngờ khả năng bùng nổ một cuộc chiến ở Bắc Cực nằm ở UNCLOS, tức Công ước Liên Hợp Quốc về Luật Biển. Trái với nhận thức phổ biến, Bắc Cực không phải là một chiếc piñata đã bị đập vỡ. Trên đất liền, biên giới chính trị quốc tế của khu vực này không bị tranh chấp. Còn với Bắc Băng Dương, hiện đã có những quy tắc thủ tục rõ ràng để yêu sách đối với đáy biển của nó, và thực ra là đối với bất kỳ đáy biển nào khác. Quan trọng nhất là hầu như mọi quốc gia trên thế giới dường như đều đang tuân theo các quy tắc đó.", "UNCLOS được đàm phán trong khoảng chín năm, từ 1973 đến 1982, và đã trở thành một trong những điều ước quốc tế có phạm vi bao quát nhất và có tác dụng ổn định nhất trên thế giới. Tính đến năm 2009, công ước đã được 158 quốc gia phê chuẩn, và nhiều quốc gia khác đang ở các giai đoạn phê chuẩn khác nhau. Trong tám nước NORC, bảy nước đã phê chuẩn UNCLOS."], "note": "UNCLOS: Công ước Liên Hợp Quốc về Luật Biển (United Nations Convention on the Law of the Sea). NORC: nhóm các nước ven Bắc Băng Dương (Northern Rim Countries) theo cách gọi của tác giả. \"Ruptured piñata\": hình ảnh ẩn dụ chỉ một thứ đã bị đập vỡ cho mọi người xô vào giành phần. \"Laying claim\": yêu sách, đòi chủ quyền. \"Ratify\": phê chuẩn.", "vocab": [{"ex": "The rebels were armed to the teeth when they entered the town.", "ipa": "/ɑːmd tə ðə tiːθ/", "mean": "vũ trang tận răng, trang bị vũ khí rất đầy đủ", "pos": "thành ngữ", "vi": "vũ trang đến tận răng", "w": "armed to the teeth"}, {"ex": "She recovered remarkably quickly after the surgery.", "ipa": "/rɪˈmɑːkəbli/", "mean": "đáng kể, hết sức (nhấn mạnh mức độ gây ngạc nhiên)", "pos": "trạng từ", "vi": "hết sức", "w": "remarkably"}, {"ex": "They kept the discussion civil despite their disagreement.", "ipa": "/ˈsɪvl/", "mean": "văn minh, lịch sự, hòa nhã", "pos": "tính từ", "vi": "văn minh", "w": "civil"}, {"ex": "Good governance is essential for economic growth.", "ipa": "/ˈɡʌvənəns/", "mean": "quản trị, cách điều hành, cai quản", "pos": "danh từ", "vi": "quản trị", "w": "governance"}, {"ex": "The eruption of violence shocked the whole city.", "ipa": "/ɪˈrʌpʃn/", "mean": "sự bùng nổ, sự phun trào", "pos": "danh từ", "vi": "bùng nổ", "w": "eruption"}, {"ex": "Contrary to expectations, the project finished early.", "ipa": "/ˈkɒntrəri tuː/", "mean": "trái với", "pos": "cụm giới từ", "vi": "Trái với", "w": "contrary to"}, {"ex": "A ruptured pipe flooded the basement.", "ipa": "/ˈrʌptʃəd/", "mean": "bị vỡ, bị đứt, bị rách", "pos": "tính từ", "vi": "bị đập vỡ", "w": "ruptured"}, {"ex": "Her right to the land was uncontested.", "ipa": "/ˌʌnkənˈtestɪd/", "mean": "không bị tranh chấp, không bị phản đối", "pos": "tính từ", "vi": "không bị tranh chấp", "w": "uncontested"}, {"ex": "Several countries lay claim to the islands.", "ipa": "/leɪ kleɪm tuː/", "mean": "yêu sách, đòi quyền sở hữu", "pos": "cụm động từ", "vi": "yêu sách", "w": "lay claim to"}, {"ex": "The company searched the seabed for oil.", "ipa": "/ˈsiːbed/", "mean": "đáy biển", "pos": "danh từ", "vi": "đáy biển", "w": "seabed"}, {"ex": "The government announced sweeping reforms.", "ipa": "/ˈswiːpɪŋ/", "mean": "bao quát, toàn diện, có phạm vi rộng", "pos": "tính từ", "vi": "có phạm vi bao quát", "w": "sweeping"}, {"ex": "The senate voted to ratify the treaty.", "ipa": "/ˈrætɪfaɪ/", "mean": "phê chuẩn (điều ước, hiệp ước)", "pos": "động từ", "vi": "phê chuẩn", "w": "ratify"}], "patterns": [{"ex": "There is now a system, one that protects every user's data.", "exVi": "Hiện nay có một hệ thống, một hệ thống bảo vệ dữ liệu của mọi người dùng.", "explain": "'There is' dùng để giới thiệu sự tồn tại; 'in place' chen giữa; cụm đồng vị 'one that...' bổ sung thông tin cho danh từ phía trước.", "formula": "Instead, there is + N + (mệnh đề quan hệ rút gọn / one that...)", "name": "Cấu trúc nhấn mạnh với 'Instead, there is...' (đảo ngữ tồn tại)", "src": "Instead, there is in place a remarkably civil international network, one that is working cooperatively and effectively..."}, {"ex": "Contrary to popular belief, bats are not blind.", "exVi": "Trái với niềm tin phổ biến, dơi không bị mù.", "explain": "Dùng để bác bỏ quan niệm phổ biến, đặt ở đầu câu để nhấn mạnh sự đối lập.", "formula": "Contrary to + popular perception/belief, S + V", "name": "Contrary to + N, S + V", "src": "Contrary to popular perception the Arctic is not a ruptured piñata."}, {"ex": "The main reason to trust her lies in her track record.", "exVi": "Lý do chính để tin cô ấy nằm ở thành tích của cô.", "explain": "'Lie in' nghĩa là 'nằm ở'; to-V sau 'reason' bổ nghĩa cho danh từ, nêu lý do cho một hành động.", "formula": "The + (số thứ tự) + reason to + V + lies in + N", "name": "Cấu trúc 'The + reason to doubt + N + lies in + N'", "src": "The second reason to doubt the eruption of an Arctic War lies in UNCLOS..."}, {"ex": "As of 2020, the app was downloaded by ten million people.", "exVi": "Tính đến năm 2020, ứng dụng đã được mười triệu người tải về.", "explain": "'As of' chỉ mốc thời gian tính đến thời điểm đó; thể bị động nhấn mạnh đối tượng được phê chuẩn.", "formula": "As of + năm, S + be + V3 + by + N", "name": "Thể bị động hoàn thành với mốc thời gian", "src": "As of 2009 it was ratified by 158 countries..."}], "hard": [{"mean": "Điều quan trọng nhất là gần như mọi nước đều có vẻ đang tuân thủ các quy tắc đó.", "parts": "Trạng ngữ: Most importantly (quan trọng nhất là). Chủ ngữ: just about every country in the world (hầu như mọi quốc gia trên thế giới). Vị ngữ: seems to be following them (dường như đang tuân theo chúng). 'them' = các quy tắc thủ tục.", "s": "Most importantly, just about every country in the world seems to be following them."}, {"mean": "UNCLOS được đàm phán suốt chín năm (1973–1982) và đã trở thành một trong những hiệp ước quốc tế toàn diện và có tác dụng ổn định nhất thế giới.", "parts": "Chủ ngữ: UNCLOS. Hai vị ngữ nối bằng 'and': (1) was negotiated over a nine-year period from 1973 to 1982 (được đàm phán trong chín năm); (2) has emerged as one of the most sweeping, stabilizing international treaties (đã nổi lên như một trong những điều ước quốc tế bao quát và ổn định nhất). Hai tính từ 'sweeping, stabilizing' cùng bổ nghĩa cho 'treaties'.", "s": "UNCLOS was negotiated over a nine-year period from 1973 to 1982 and has emerged as one of the most sweeping, stabilizing international treaties in the world."}], "insight": "Tác giả đang phản bác quan niệm phổ biến rằng Bắc Cực sẽ trở thành chiến trường vì tài nguyên dưới đáy biển. Lập luận của ông có hai tầng: thứ nhất, các nước quanh Bắc Cực đã có mạng lưới hợp tác quốc tế hoạt động tốt; thứ hai, như trang này nêu, đã có khung pháp lý rõ ràng là UNCLOS. Ý then chốt là xung đột thường nảy sinh khi thiếu luật chơi, còn ở đây các bên đều có một quy trình chung để theo đuổi yêu sách của mình.\n\nVề bối cảnh: UNCLOS (Công ước Liên Hợp Quốc về Luật Biển) quy định quyền của các quốc gia đối với vùng biển và thềm lục địa, và đặt ra thủ tục để một nước nộp hồ sơ yêu sách đáy biển lên cơ quan chuyên môn của Liên Hợp Quốc xem xét. Hình ảnh \"ruptured piñata\" là một phép ẩn dụ: piñata là chiếc bình giấy đựng kẹo mà trẻ con đập vỡ để tranh nhau, ám chỉ cách nhiều người hình dung Bắc Cực như kho báu vô chủ ai cũng lao vào giành. Tác giả bác bỏ hình ảnh đó. \"NORC\" ở đây là nhóm các nước có bờ biển Bắc Cực mà sách đang bàn tới; việc bảy trong tám nước đã phê chuẩn cho thấy sự tuân thủ rộng rãi, dù tôi không khẳng định chi tiết về nước nào chưa phê chuẩn từ trang này.\n\nĐiều đáng suy ngẫm là cách nhìn của sách: tương lai không chỉ do cạnh tranh sức mạnh quyết định mà còn do thể chế và luật lệ quốc tế định hình. Giọng văn mang tính phản biện, cố ý đi ngược nỗi lo thường thấy trên báo chí, nhưng cần nhớ số liệu (như 158 nước) chỉ đúng đến năm 2009 nên hiện nay đã thay đổi.", "insightDone": true}, {"n": 50, "date": "2026-10-31", "source": ["...and other resource pressures and disputes in the world's coastal oceans. That's not to say UNCLOS is perfect. Now, disputes break out over island specks because they anchor a claim to a 200 nm radius circle on the surrounding seafloor. Tiny Rockall—literally a barren rock peeking out of the North Atlantic—has been claimed by the United Kingdom, Ireland, Iceland, and Denmark. Denmark is also tussling with Canada over Hans Island, another speck sitting between the two countries in the Nares Strait off Greenland. The convoluted coastlines of Russia and Alaska open a doughnut hole of high seas in the midst of their Exclusive Economic Zones, into which Japan, South Korea, Taiwan, and Poland pour fishing trawlers.349 Finally, border disputes arise over how the two-hundred-nautical-mile extension is to be drawn with respect to other boundaries. Canada, for example, extends the ocean border as a straight-line extension of its land border with Alaska, whereas the United States draws the line at right angles to its coastline. This creates a smallish disputed triangle (about 6,250 square miles) of overlapping claims to the Beaufort Sea. In the Barents Sea, Norway and..."], "translation": ["...và các áp lực khác về tài nguyên cũng như những tranh chấp tại vùng biển ven bờ của thế giới. Điều đó không có nghĩa là UNCLOS hoàn hảo. Hiện nay, tranh chấp nổ ra xung quanh những hòn đảo nhỏ xíu vì chúng là điểm neo cho yêu sách đối với vùng đáy biển trong bán kính 200 hải lý xung quanh. Đảo Rockall bé tí, thực chất chỉ là một mỏm đá trơ trụi nhô lên giữa Bắc Đại Tây Dương, đã bị Vương quốc Anh, Ireland, Iceland và Đan Mạch cùng đòi chủ quyền. Đan Mạch cũng đang giằng co với Canada về đảo Hans, một mỏm đá nhỏ khác nằm giữa hai nước ở eo biển Nares, ngoài khơi Greenland. Đường bờ biển ngoằn ngoèo của Nga và Alaska tạo ra một \"lỗ hổng bánh vòng\" thuộc vùng biển quốc tế nằm giữa các Vùng đặc quyền kinh tế của hai bên, và tàu đánh cá của Nhật Bản, Hàn Quốc, Đài Loan và Ba Lan ồ ạt kéo vào khu vực này.349 Cuối cùng, tranh chấp biên giới nảy sinh từ việc phần mở rộng 200 hải lý phải được vạch ra như thế nào so với các ranh giới khác. Chẳng hạn, Canada kéo dài đường biên giới trên biển theo đường thẳng nối tiếp biên giới đất liền của mình với Alaska, trong khi Hoa Kỳ vạch đường này vuông góc với đường bờ biển của họ. Điều này tạo ra một vùng tam giác tranh chấp khá nhỏ (khoảng 6.250 dặm vuông) nơi các yêu sách chồng lấn lên nhau ở biển Beaufort. Ở biển Barents, Na Uy và..."], "note": "UNCLOS: Công ước Liên Hợp Quốc về Luật Biển. 200 nm = 200 hải lý (nautical miles). Exclusive Economic Zone (EEZ): Vùng đặc quyền kinh tế. \"Doughnut hole\" là cách nói hình ảnh, chỉ vùng biển quốc tế bị vây quanh bởi các vùng đặc quyền kinh tế. Tên riêng: Rockall (đảo Rockall), Hans Island (đảo Hans), Nares Strait (eo biển Nares), Beaufort Sea (biển Beaufort), Barents Sea (biển Barents). \"349\" là số chú thích cuối trang. 6.250 dặm vuông ≈ 16.200 km².", "vocab": [{"ex": "The island is just a speck on the map.", "ipa": "/spek/", "mean": "chấm nhỏ, hòn đảo bé tí", "pos": "danh từ", "vi": "những hòn đảo nhỏ xíu", "w": "speck"}, {"ex": "The treaty anchors their claim to the territory.", "ipa": "/ˈæŋkər/", "mean": "làm điểm neo, làm cơ sở vững chắc cho", "pos": "động từ", "vi": "điểm neo", "w": "anchor"}, {"ex": "The barren land could not support any crops.", "ipa": "/ˈbærən/", "mean": "cằn cỗi, trơ trụi", "pos": "tính từ", "vi": "trơ trụi", "w": "barren"}, {"ex": "The sun peeked out of the clouds.", "ipa": "/piːk aʊt əv/", "mean": "nhô ra, ló ra", "pos": "cụm động từ", "vi": "nhô lên", "w": "peek out of"}, {"ex": "The two firms are tussling over the contract.", "ipa": "/ˈtʌsl/", "mean": "giằng co, tranh giành", "pos": "động từ", "vi": "giằng co", "w": "tussle"}, {"ex": "The convoluted plot confused many viewers.", "ipa": "/ˈkɒnvəluːtɪd/", "mean": "ngoằn ngoèo, phức tạp", "pos": "tính từ", "vi": "ngoằn ngoèo", "w": "convoluted"}, {"ex": "Each coastal state manages fishing in its Exclusive Economic Zone.", "ipa": "/ɪkˌskluːsɪv iːkəˈnɒmɪk zoʊn/", "mean": "Vùng đặc quyền kinh tế", "pos": "danh từ (thuật ngữ)", "vi": "Vùng đặc quyền kinh tế", "w": "Exclusive Economic Zone"}, {"ex": "A trawler returned to port with a full catch.", "ipa": "/ˈtrɔːlər/", "mean": "tàu đánh cá lưới kéo", "pos": "danh từ", "vi": "tàu đánh cá", "w": "trawler"}, {"ex": "Tourists pour into the city every summer.", "ipa": "/pɔːr/", "mean": "đổ dồn vào, ồ ạt kéo đến", "pos": "động từ", "vi": "ồ ạt kéo vào", "w": "pour"}, {"ex": "The road runs at right angles to the river.", "ipa": "/æt raɪt ˈæŋɡlz tuː/", "mean": "vuông góc với", "pos": "cụm giới từ", "vi": "vuông góc với", "w": "at right angles to"}, {"ex": "The two teams have overlapping responsibilities.", "ipa": "/ˌoʊvərˈlæpɪŋ/", "mean": "chồng lấn", "pos": "tính từ", "vi": "chồng lấn lên nhau", "w": "overlapping"}, {"ex": "There are strict rules with respect to safety.", "ipa": "/wɪð rɪˈspekt tuː/", "mean": "đối với, liên quan đến", "pos": "cụm giới từ", "vi": "so với", "w": "with respect to"}], "patterns": [{"ex": "That's not to say the plan will fail.", "exVi": "Điều đó không có nghĩa là kế hoạch sẽ thất bại.", "explain": "Dùng để rào đón, tránh người đọc hiểu quá mức điều vừa nói.", "formula": "That's not to say + (that) + mệnh đề", "name": "Không có nghĩa là... (That's not to say)", "src": "That's not to say UNCLOS is perfect."}, {"ex": "Prices rose because demand increased.", "exVi": "Giá tăng vì nhu cầu tăng.", "explain": "Because giới thiệu lý do; mệnh đề sau chứa động từ chia theo chủ ngữ mới (they).", "formula": "Mệnh đề chính + because + S + V", "name": "Liên từ chỉ nguyên nhân 'because' nối mệnh đề", "src": "disputes break out over island specks because they anchor a claim to a 200 nm radius circle"}, {"ex": "Anna prefers tea, whereas Tom likes coffee.", "exVi": "Anna thích trà, trong khi Tom thích cà phê.", "explain": "Whereas nối hai vế đối lập nhau, tương tự 'trong khi'.", "formula": "Mệnh đề A, whereas mệnh đề B", "name": "Đối chiếu với 'whereas'", "src": "Canada... extends the ocean border as a straight-line extension..., whereas the United States draws the line at right angles"}, {"ex": "The house standing on the hill is old.", "exVi": "Ngôi nhà nằm trên đồi đã cũ.", "explain": "V-ing rút gọn mệnh đề quan hệ (which sits), bổ nghĩa cho danh từ đứng trước.", "formula": "Danh từ + V-ing + nơi chốn", "name": "Cụm phân từ hiện tại bổ nghĩa danh từ", "src": "another speck sitting between the two countries"}], "hard": [{"mean": "Đường bờ biển ngoằn ngoèo của Nga và Alaska tạo ra một vùng biển quốc tế hình bánh vòng giữa các vùng đặc quyền kinh tế, và các nước khác đưa tàu cá vào đó.", "parts": "Chủ ngữ: The convoluted coastlines of Russia and Alaska. Vị ngữ: open a doughnut hole of high seas in the midst of their EEZs. Mệnh đề quan hệ: into which... pour fishing trawlers (đảo ngữ giới từ + which; 'into which' = vào khu vực đó; chủ ngữ Japan, South Korea, Taiwan, and Poland, động từ pour, tân ngữ fishing trawlers).", "s": "The convoluted coastlines of Russia and Alaska open a doughnut hole of high seas in the midst of their Exclusive Economic Zones, into which Japan, South Korea, Taiwan, and Poland pour fishing trawlers."}, {"mean": "Canada kéo dài đường biên trên biển theo đường thẳng nối tiếp biên giới đất liền, còn Hoa Kỳ vạch đường vuông góc với bờ biển.", "parts": "Vế 1: Canada (chủ ngữ), extends (vị ngữ), the ocean border (tân ngữ), as a straight-line extension of its land border (như một phần kéo dài thẳng). Vế 2 sau whereas: the United States (chủ ngữ), draws the line (vị ngữ), at right angles to its coastline (trạng ngữ cách thức).", "s": "Canada, for example, extends the ocean border as a straight-line extension of its land border with Alaska, whereas the United States draws the line at right angles to its coastline."}], "insight": "Tác giả muốn chỉ ra một nghịch lý: Công ước Liên Hợp Quốc về Luật Biển (UNCLOS) đã giúp giảm xung đột trên biển bằng cách chia vùng biển ven bờ thành các Vùng đặc quyền kinh tế (EEZ) rộng 200 hải lý, nhưng chính quy tắc rõ ràng ấy lại tạo ra những kiểu tranh chấp mới. Vì một hòn đảo, dù chỉ là mỏm đá trơ trọi, cũng có thể làm \"điểm neo\" cho cả một vòng tròn đáy biển bán kính 200 hải lý (với cá, dầu khí, khoáng sản bên dưới), nên các quốc gia tranh nhau những thứ nhỏ xíu như Rockall hay đảo Hans. Giá trị thật nằm ở vùng biển xung quanh chứ không phải ở bản thân mỏm đá. Giọng văn của tác giả hơi mỉa mai khi dùng các từ như \"speck\" (hạt bụi, chấm nhỏ) để làm nổi bật sự chênh lệch giữa kích thước hòn đảo và lợi ích bị đặt cược.\n\nVài điểm nền đáng biết: \"hải lý\" (nautical mile) bằng khoảng 1,85 km, nên 200 hải lý là khoảng 370 km. Trong EEZ, quốc gia ven biển có quyền độc quyền khai thác tài nguyên, còn vùng \"biển quốc tế\" (high seas) bên ngoài thì mọi nước đều được vào đánh bắt. \"Lỗ hổng bánh vòng\" (doughnut hole) là cách nói ví von cho một vùng biển quốc tế bị bao quanh bởi các EEZ, nên tàu đánh cá nhiều nước đổ vào khai thác rất mạnh. Ví dụ Canada và Mỹ ở biển Beaufort cho thấy tranh chấp còn nảy sinh từ cách vẽ đường ranh: một bên kéo thẳng đường biên đất liền, bên kia vạch vuông góc với bờ biển, và hai cách đó cho ra một tam giác chồng lấn.\n\nĐiều đáng suy ngẫm là luật quốc tế có thể giảm xung đột nhưng không xóa được nó, vì mỗi quy tắc lại tạo ra động cơ mới để tranh giành. Điều này gắn với chủ đề chung của cuốn sách, vốn bàn về việc tài nguyên, địa lý và ranh giới sẽ định hình quan hệ giữa các quốc gia trong tương lai.", "insightDone": true}, {"n": 51, "date": "2026-11-01", "source": ["...from the Healy icebreaker, work led by Larry Mayer at the University of New Hampshire.", "After all this work and expense, small wonder that these five countries—Russia, Denmark, Canada, Norway, and the United States—recently banded together to issue the \"Ilulissat Declaration,\" an assertion that existing international laws are perfectly sufficient for working out their territorial disputes in the region. Everything's cool, no new Arctic treaties are needed—or wanted. Now, would everyone else—like the European Union—kindly butt out?", "These five powers are signaling that UNCLOS is the law of the Arctic Ocean, just like any other ocean. They are heeding its procedures for sovereignty claims to its seafloor, in the same manner as the many other Article 76 claims inching forward around the world. None are interested in relinquishing their existing right to make these claims. There will be no new \"Arctic Treaty\" with shared international governance, as exists in Antarctica. And centuries of legal precedent tell us that once the boundary lines get set, they will stay set. In Southern California today, property lines set by early ranchos have persisted..."], "translation": ["...từ tàu phá băng Healy, công trình do Larry Mayer của Đại học New Hampshire dẫn dắt.", "Sau ngần ấy công sức và tiền bạc, chẳng có gì lạ khi năm quốc gia này, gồm Nga, Đan Mạch, Canada, Na Uy và Hoa Kỳ, gần đây đã cùng nhau ra \"Tuyên bố Ilulissat\", khẳng định rằng luật pháp quốc tế hiện hành hoàn toàn đủ để giải quyết các tranh chấp lãnh thổ của họ trong khu vực. Mọi chuyện đều ổn cả, không cần, mà cũng không muốn, có thêm hiệp ước Bắc Cực nào. Vậy nên, những bên khác, chẳng hạn như Liên minh châu Âu, làm ơn đừng xen vào nhé?", "Năm cường quốc này đang ngầm cho thấy rằng UNCLOS chính là luật của Bắc Băng Dương, giống như ở bất kỳ đại dương nào khác. Họ tuân theo các thủ tục của công ước này khi đòi chủ quyền đối với đáy biển, theo cùng cách như nhiều yêu sách theo Điều 76 khác đang từng bước tiến triển trên khắp thế giới. Không bên nào muốn từ bỏ quyền hiện có của mình để đưa ra những yêu sách đó. Sẽ không có một \"Hiệp ước Bắc Cực\" mới với cơ chế quản trị quốc tế chung như ở Nam Cực. Và hàng thế kỷ tiền lệ pháp lý cho ta biết rằng một khi đường ranh giới đã được xác lập thì chúng sẽ giữ nguyên như vậy. Ngày nay ở Nam California, các ranh giới đất đai do những trang trại rancho thuở đầu thiết lập vẫn tồn tại..."], "note": "Healy: tàu phá băng của Cảnh sát biển Hoa Kỳ. Ilulissat Declaration (Tuyên bố Ilulissat, 2008): do năm quốc gia ven Bắc Băng Dương ký tại Ilulissat, Greenland. UNCLOS: Công ước Liên Hợp Quốc về Luật Biển. Article 76: Điều 76, quy định việc xác định thềm lục địa mở rộng. \"Kindly butt out\" là cách nói suồng sã, mỉa mai, nghĩa là \"làm ơn đừng can thiệp\". Rancho: trang trại chăn nuôi lớn thời Tây Ban Nha và Mexico ở California.", "vocab": [{"ex": "The icebreaker cleared a path for the cargo ships.", "ipa": "/ˈaɪsˌbreɪkər/", "mean": "tàu phá băng, loại tàu có thân gia cố để mở đường qua vùng biển đóng băng", "pos": "danh từ", "vi": "tàu phá băng", "w": "icebreaker"}, {"ex": "Local farmers banded together to protest the new tax.", "ipa": "/bænd təˈɡeðər/", "mean": "đoàn kết, cùng nhau hợp lực vì một mục đích chung", "pos": "cụm động từ", "vi": "cùng nhau", "w": "band together"}, {"ex": "The two leaders signed a joint declaration on climate.", "ipa": "/ˌdekləˈreɪʃn/", "mean": "tuyên bố, văn bản công bố chính thức", "pos": "danh từ", "vi": "Tuyên bố", "w": "declaration"}, {"ex": "His assertion that the plan was safe turned out to be false.", "ipa": "/əˈsɜːrʃn/", "mean": "sự khẳng định mạnh mẽ (thường chưa chứng minh)", "pos": "danh từ", "vi": "khẳng định", "w": "assertion"}, {"ex": "The territorial dispute has lasted for decades.", "ipa": "/ˌterəˈtɔːriəl dɪˈspjuːt/", "mean": "tranh chấp lãnh thổ", "pos": "cụm danh từ", "vi": "tranh chấp lãnh thổ", "w": "territorial dispute"}, {"ex": "This is a private matter, so please butt out.", "ipa": "/bʌt aʊt/", "mean": "đừng xen vào chuyện không liên quan đến mình", "pos": "cụm động từ (thân mật)", "vi": "đừng xen vào", "w": "butt out"}, {"ex": "She failed to heed the doctor's warning.", "ipa": "/hiːd/", "mean": "chú ý và làm theo (lời khuyên, quy định)", "pos": "động từ", "vi": "tuân theo", "w": "heed"}, {"ex": "The island's sovereignty is disputed by two nations.", "ipa": "/ˈsɑːvrɪnti/", "mean": "chủ quyền, quyền tối cao đối với một vùng lãnh thổ", "pos": "danh từ", "vi": "chủ quyền", "w": "sovereignty"}, {"ex": "Negotiations are inching forward after months of delay.", "ipa": "/ɪntʃ ˈfɔːrwərd/", "mean": "tiến triển rất chậm, từng chút một", "pos": "cụm động từ", "vi": "từng bước tiến triển", "w": "inch forward"}, {"ex": "He refused to relinquish control of the company.", "ipa": "/rɪˈlɪŋkwɪʃ/", "mean": "từ bỏ (quyền, quyền lực, sự kiểm soát)", "pos": "động từ", "vi": "từ bỏ", "w": "relinquish"}, {"ex": "The court's ruling set a precedent for similar cases.", "ipa": "/ˈpresɪdənt/", "mean": "tiền lệ, trường hợp trước đây làm căn cứ cho quyết định sau này", "pos": "danh từ", "vi": "tiền lệ pháp lý", "w": "precedent"}, {"ex": "Old customs persist in many rural villages.", "ipa": "/pərˈsɪst/", "mean": "tiếp tục tồn tại, kéo dài", "pos": "động từ", "vi": "vẫn tồn tại", "w": "persist"}], "patterns": [{"ex": "Small wonder that he is tired after working all night.", "exVi": "Chẳng có gì lạ khi anh ấy mệt sau khi làm việc cả đêm.", "explain": "Cách nói thân mật, bỏ 'it is' ở đầu câu, nghĩa là điều đó hoàn toàn dễ hiểu.", "formula": "Small wonder + (that) + mệnh đề", "name": "Small wonder (that)...: chẳng có gì lạ khi", "src": "After all this work and expense, small wonder that these five countries... recently banded together"}, {"ex": "She handled the complaint in the same manner as her predecessor.", "exVi": "Cô ấy xử lý khiếu nại theo cùng cách như người tiền nhiệm.", "explain": "Dùng để so sánh cách thức hai hành động giống nhau, trang trọng hơn 'in the same way as'.", "formula": "V + in the same manner as + danh từ", "name": "In the same manner as: theo cùng cách như", "src": "in the same manner as the many other Article 76 claims"}, {"ex": "Would you kindly stop talking during the film?", "exVi": "Làm ơn đừng nói chuyện trong lúc xem phim nhé?", "explain": "'Kindly' dùng để yêu cầu một cách tỏ ra lịch sự nhưng thực chất mang tính mỉa mai hoặc ra lệnh.", "formula": "Now, would + chủ ngữ + kindly + V nguyên mẫu?", "name": "Câu hỏi tu từ lịch sự mỉa mai", "src": "Now, would everyone else—like the European Union—kindly butt out?"}, {"ex": "Once the contract is signed, it cannot be changed.", "exVi": "Một khi hợp đồng đã được ký, nó không thể thay đổi.", "explain": "'Once' nghĩa là 'một khi', nêu điều kiện dẫn đến một kết quả chắc chắn.", "formula": "Once + S + V (hiện tại hoàn thành/đơn), S + will + V", "name": "Once + mệnh đề, mệnh đề chính", "src": "once the boundary lines get set, they will stay set"}], "hard": [{"mean": "Sau ngần ấy công sức và tiền bạc, không lạ gì khi năm nước này cùng ra Tuyên bố Ilulissat, khẳng định luật quốc tế hiện hành đã hoàn toàn đủ để giải quyết tranh chấp lãnh thổ của họ.", "parts": "Trạng ngữ: After all this work and expense. Cấu trúc: small wonder that + mệnh đề. Chủ ngữ: these five countries (đồng vị ngữ liệt kê trong dấu gạch ngang). Vị ngữ: recently banded together to issue the 'Ilulissat Declaration'. Đồng vị ngữ: an assertion that... (giải thích Tuyên bố là gì). Mệnh đề that: existing international laws are perfectly sufficient for working out their territorial disputes.", "s": "After all this work and expense, small wonder that these five countries—Russia, Denmark, Canada, Norway, and the United States—recently banded together to issue the \"Ilulissat Declaration,\" an assertion that existing international laws are perfectly sufficient for working out their territorial disputes in the region."}, {"mean": "Hàng thế kỷ tiền lệ pháp lý cho thấy rằng ranh giới một khi đã được xác lập thì sẽ giữ nguyên.", "parts": "Chủ ngữ: centuries of legal precedent. Vị ngữ: tell us. Mệnh đề that: (trạng ngữ once the boundary lines get set), they will stay set. 'get set' là bị động thân mật; 'stay set' nghĩa là giữ nguyên, không đổi.", "s": "And centuries of legal precedent tell us that once the boundary lines get set, they will stay set."}], "insight": "Tác giả (Laurence Smith) cho thấy năm quốc gia ven Bắc Băng Dương đang dùng chính khuôn khổ luật hiện có, cụ thể là Công ước Liên Hợp Quốc về Luật Biển (UNCLOS), để hợp pháp hóa việc chia nhau đáy biển. Công sức khảo sát đáy biển (như chuyến đi của tàu phá băng Healy) chính là để thu thập bằng chứng khoa học phục vụ các yêu sách. Giọng văn mỉa mai nhẹ: câu \"Mọi chuyện đều ổn cả... làm ơn đừng xen vào nhé?\" nhại lại thái độ của năm nước, ngầm chỉ ra rằng \"luật đã đủ\" cũng là cách để loại các bên ngoài như Liên minh châu Âu ra khỏi cuộc chơi.\n\nBối cảnh nên biết: Điều 76 của UNCLOS cho phép một nước đòi mở rộng quyền đối với thềm lục địa nếu chứng minh được đáy biển là phần kéo dài tự nhiên của lục địa mình, nên dữ liệu địa chất và bản đồ đáy biển có giá trị pháp lý. Nam Cực thì khác: nó được quản trị chung theo Hiệp ước Nam Cực, nên không có yêu sách chủ quyền theo kiểu này. Ví dụ về các ranh giới đất ở Nam California là phép so sánh để lập luận rằng một khi biên giới đã được xác lập thì rất bền vững, vì vậy việc giành phần ngay từ bây giờ mới quan trọng.\n\nĐiều đáng suy ngẫm: khi băng tan mở ra tài nguyên và tuyến hàng hải mới, cuộc cạnh tranh ở Bắc Cực diễn ra bằng thủ tục pháp lý và khoa học hơn là xung đột, và ai đặt yêu sách sớm, có bằng chứng tốt sẽ có lợi thế lâu dài. Điều này gắn với chủ đề chung của cuốn sách về cách biến đổi khí hậu và các lực lượng toàn cầu định hình lại bản đồ quyền lực.", "insightDone": true}, {"n": 52, "date": "2026-11-01", "source": ["...through centuries of rule first by Spain, then Mexico, then the United States.", "So how will it all pan out? The bathymetric and geological data are still being collected, but Russia has the longest coastline and the broadest continental shelf in the Arctic Ocean. This optimal geography will win sovereignty over very large tracts of seabed and most of the natural gas promised by the U.S. Geological Survey assessment. Canada is positioned to more than double its offshore holdings northwest of Queen Elizabeth Island. The United States will expand dominion in a triangular wedge extending due north of Alaska's North Slope, winning control of some of the Arctic Ocean's most promising oil-bearing rocks. Norway has secured chunks of the Norwegian and Barents seas and will share claims with Russia in the gas-rich Barents Sea.", "But Norway has no shot at the North Pole and neither does the United States. That prize—if it is a prize—hinges on the Lomonosov Ridge mentioned earlier in the chapter. This thousand-mile undersea mountain chain, roughly bisecting the abyss of the central Arctic Ocean, is the only hope for a continental shelf extension claim extending as far as the..."], "translation": ["...qua nhiều thế kỷ cai trị, đầu tiên là Tây Ban Nha, rồi đến Mexico, rồi đến Hoa Kỳ.", "Vậy rốt cuộc mọi chuyện sẽ ra sao? Dữ liệu đo sâu và dữ liệu địa chất vẫn đang được thu thập, nhưng Nga có đường bờ biển dài nhất và thềm lục địa rộng nhất ở Bắc Băng Dương. Lợi thế địa lý tối ưu này sẽ giúp Nga giành được chủ quyền đối với những vùng đáy biển rất rộng lớn, cùng phần lớn lượng khí đốt tự nhiên mà bản đánh giá của Cục Khảo sát Địa chất Hoa Kỳ đã nêu. Canada đang ở vị thế có thể tăng hơn gấp đôi phần lãnh thổ ngoài khơi ở phía tây bắc đảo Queen Elizabeth. Hoa Kỳ sẽ mở rộng quyền kiểm soát trên một vùng hình tam giác kéo dài thẳng về phía bắc từ North Slope của Alaska, qua đó nắm quyền kiểm soát một số tầng đá chứa dầu triển vọng nhất của Bắc Băng Dương. Na Uy đã giành được nhiều mảng của biển Na Uy và biển Barents, và sẽ cùng Nga chia sẻ các yêu sách ở biển Barents giàu khí đốt.", "Nhưng Na Uy không có cơ hội nào với Bắc Cực, và Hoa Kỳ cũng vậy. Phần thưởng đó, nếu quả thật nó là phần thưởng, phụ thuộc vào dãy Lomonosov đã được nhắc đến ở phần trước của chương. Dãy núi ngầm dài khoảng một nghìn dặm này, chia đôi vực thẳm ở trung tâm Bắc Băng Dương, là hy vọng duy nhất để có một yêu sách mở rộng thềm lục địa vươn xa tới tận..."], "note": "Bathymetric: thuộc về đo sâu đáy biển. Continental shelf: thềm lục địa. Sovereignty: chủ quyền. Lomonosov Ridge: dãy Lomonosov (dãy núi ngầm ở Bắc Băng Dương). North Slope: vùng sườn bắc của Alaska, giàu dầu mỏ. Queen Elizabeth Island(s): quần đảo/đảo Queen Elizabeth của Canada. \"How will it all pan out\": rốt cuộc sẽ diễn ra thế nào. \"No shot\": không có cơ hội nào.", "vocab": [{"ex": "Not all plans pan out as expected.", "ipa": "/pæn aʊt/", "mean": "diễn biến, kết thúc theo một hướng nào đó", "pos": "cụm động từ", "vi": "ra sao", "w": "pan out"}, {"ex": "The ship produced a bathymetric map of the bay.", "ipa": "/ˌbæθɪˈmetrɪk/", "mean": "thuộc đo độ sâu đáy biển", "pos": "tính từ", "vi": "đo sâu", "w": "bathymetric"}, {"ex": "Fish are abundant on the continental shelf.", "ipa": "/ˌkɒntɪˈnentl ʃelf/", "mean": "thềm lục địa, phần đáy biển nông kéo dài từ lục địa", "pos": "danh từ", "vi": "thềm lục địa", "w": "continental shelf"}, {"ex": "The island's sovereignty is disputed.", "ipa": "/ˈsɒvrɪnti/", "mean": "chủ quyền", "pos": "danh từ", "vi": "chủ quyền", "w": "sovereignty"}, {"ex": "A large tract of forest was protected.", "ipa": "/trækt/", "mean": "vùng, dải đất hoặc biển rộng", "pos": "danh từ", "vi": "vùng", "w": "tract"}, {"ex": "Cables run along the seabed.", "ipa": "/ˈsiːbed/", "mean": "đáy biển", "pos": "danh từ", "vi": "đáy biển", "w": "seabed"}, {"ex": "They invested in offshore wind farms.", "ipa": "/ˌɒfˈʃɔː/", "mean": "ngoài khơi", "pos": "tính từ", "vi": "ngoài khơi", "w": "offshore"}, {"ex": "The empire extended its dominion over the region.", "ipa": "/dəˈmɪniən/", "mean": "quyền thống trị, lãnh thổ chịu sự cai quản", "pos": "danh từ", "vi": "quyền kiểm soát", "w": "dominion"}, {"ex": "A wedge of land separates the two rivers.", "ipa": "/wedʒ/", "mean": "hình nêm, mảng hình tam giác", "pos": "danh từ", "vi": "vùng hình tam giác", "w": "wedge"}, {"ex": "The deal hinges on the final vote.", "ipa": "/hɪndʒ ɒn/", "mean": "phụ thuộc hoàn toàn vào", "pos": "cụm động từ", "vi": "phụ thuộc vào", "w": "hinge on"}, {"ex": "A highway bisects the city.", "ipa": "/baɪˈsekt/", "mean": "chia đôi", "pos": "động từ", "vi": "chia đôi", "w": "bisect"}, {"ex": "Strange creatures live in the abyss.", "ipa": "/əˈbɪs/", "mean": "vực thẳm, vùng biển cực sâu", "pos": "danh từ", "vi": "vực thẳm", "w": "abyss"}], "patterns": [{"ex": "She doesn't eat meat, and neither does her brother.", "exVi": "Cô ấy không ăn thịt, và anh trai cô ấy cũng vậy.", "explain": "'Neither' + trợ động từ + chủ ngữ để nói điều phủ định cũng đúng với người/vật khác.", "formula": "S1 + have no... and neither + do/does + S2", "name": "Câu đảo ngữ nhấn mạnh với 'neither'", "src": "But Norway has no shot at the North Pole and neither does the United States."}, {"ex": "The result—if we can call it that—surprised everyone.", "exVi": "Kết quả đó, nếu có thể gọi như vậy, đã làm mọi người bất ngờ.", "explain": "Mệnh đề 'if...' chen giữa hai gạch ngang để thể hiện sự hoài nghi của tác giả.", "formula": "N — if it is a N — verb...", "name": "Cụm đồng vị/chêm trong dấu gạch ngang", "src": "That prize—if it is a prize—hinges on the Lomonosov Ridge"}, {"ex": "The company is positioned to lead the market.", "exVi": "Công ty đang ở vị thế có thể dẫn đầu thị trường.", "explain": "Ở vị thế thuận lợi để làm gì; 'more than double' nghĩa là tăng hơn gấp đôi.", "formula": "S + be positioned to + động từ nguyên mẫu", "name": "Be positioned to + V", "src": "Canada is positioned to more than double its offshore holdings"}, {"ex": "He signed the deal, securing his future.", "exVi": "Anh ký thỏa thuận, qua đó đảm bảo tương lai của mình.", "explain": "Cụm V-ing diễn tả kết quả đi kèm hành động chính.", "formula": "..., V-ing + O", "name": "Phân từ hiện tại làm trạng ngữ", "src": "winning control of some of the Arctic Ocean's most promising oil-bearing rocks"}], "hard": [{"mean": "Lợi thế địa lý này sẽ giúp Nga có chủ quyền trên những vùng đáy biển rộng lớn và phần lớn lượng khí đốt mà đánh giá của USGS cho là có tiềm năng.", "parts": "Chủ ngữ: This optimal geography. Vị ngữ: will win. Tân ngữ 1: sovereignty over very large tracts of seabed. Tân ngữ 2: most of the natural gas. 'promised by the U.S. Geological Survey assessment' là cụm quá khứ phân từ bổ nghĩa cho 'natural gas'.", "s": "This optimal geography will win sovereignty over very large tracts of seabed and most of the natural gas promised by the U.S. Geological Survey assessment."}, {"mean": "Dãy núi ngầm dài ngàn dặm này, chia đôi vực sâu giữa Bắc Băng Dương, là hy vọng duy nhất để đòi mở rộng thềm lục địa tới tận...", "parts": "Chủ ngữ: This thousand-mile undersea mountain chain. Cụm phân từ chêm: roughly bisecting the abyss... Vị ngữ: is the only hope. Bổ ngữ: for a continental shelf extension claim. 'extending as far as...' bổ nghĩa cho 'claim'.", "s": "This thousand-mile undersea mountain chain, roughly bisecting the abyss of the central Arctic Ocean, is the only hope for a continental shelf extension claim extending as far as the..."}], "insight": "Tác giả lập luận rằng cuộc tranh giành Bắc Băng Dương sẽ không được quyết định bằng sức mạnh quân sự hay lời tuyên bố, mà chủ yếu bằng địa lý và dữ liệu khoa học. Theo Công ước Liên Hợp Quốc về Luật Biển (UNCLOS), một quốc gia có thể đòi chủ quyền đáy biển nếu chứng minh được thềm lục địa của mình kéo dài tự nhiên ra xa. Vì vậy các số liệu đo sâu (bathymetric, tức đo độ sâu đáy biển) và địa chất mới là thứ quyết định, và Nga được cho là có lợi thế vì đường bờ biển dài nhất và thềm lục địa rộng nhất. Câu hỏi mở đầu 'rốt cuộc mọi chuyện sẽ ra sao?' cho thấy giọng điệu của một người đang dự đoán dựa trên bằng chứng chứ chưa phải kết luận chắc chắn, và chính tác giả thừa nhận dữ liệu vẫn đang được thu thập.\n\nCụm 'nếu nó là phần thưởng' mang chút mỉa mai: Bắc Cực có giá trị biểu tượng lớn nhưng giá trị kinh tế thực tế còn đáng ngờ, khác với những vùng giàu dầu khí như biển Barents hay phía bắc Alaska. Dãy Lomonosov là then chốt vì nếu được chứng minh là phần kéo dài của lục địa thì quốc gia nào chứng minh được sẽ có cơ sở pháp lý để đòi cả khu vực quanh cực. Điều này gắn với chủ đề chung của cuốn sách: các đường biên giới và quyền lực toàn cầu trong tương lai sẽ bị định hình bởi địa lý, tài nguyên và biến đổi khí hậu đang làm băng tan, mở ra những vùng đất và biển trước đây không thể tiếp cận.", "insightDone": true}, {"n": 53, "date": "2026-11-01", "source": ["...geographic North Pole. Russia, Denmark, and Canada are busily mapping it. But the importance of the North Pole seabed, a distant, heavily ice-covered area and unpromising oil and gas province at that, is primarily symbolic. Personally speaking, if it's really necessary for any country to control the North Pole, then it seems only fair that it be Russia. Russia's first hydrographic surveys date to 1933. No surface ship ever reached the North Pole until the Soviet nuclear icebreaker Arktika accomplished it in 1977. By the end of 2009 the feat had been accomplished just eighty times: Once each by Canada and Norway, twice by Germany, thrice by the United States, six times by Sweden, and sixty-seven times by Russia. Her Sibir icebreaker completed the first (and only) voyage to reach the North Pole in winter back in 1989. As far as I'm concerned, Russia has earned it.", "Whether the science will reveal the Lomonosov Ridge to be geologically attached to Russia, or to Greenland (Denmark), or to Canada, or none of them, is unknown. What is known is that no one is bristling missiles over this. And there's little reason to think that anyone will."], "translation": ["...Cực Bắc địa lý. Nga, Đan Mạch và Canada đang tích cực lập bản đồ khu vực này. Nhưng tầm quan trọng của đáy biển ở Bắc Cực, vốn là một vùng xa xôi, phủ băng dày đặc và lại còn là một vùng dầu khí kém triển vọng, chủ yếu mang tính biểu tượng. Theo quan điểm cá nhân tôi, nếu thật sự cần có một quốc gia nào đó kiểm soát Bắc Cực, thì có vẻ chỉ công bằng khi đó là Nga. Các cuộc khảo sát thủy văn đầu tiên của Nga bắt đầu từ năm 1933. Chưa có tàu mặt nước nào đến được Bắc Cực cho đến khi tàu phá băng hạt nhân Arktika của Liên Xô làm được điều đó vào năm 1977. Tính đến cuối năm 2009, kỳ tích này mới được thực hiện vỏn vẹn tám mươi lần: Canada và Na Uy mỗi nước một lần, Đức hai lần, Hoa Kỳ ba lần, Thụy Điển sáu lần, và Nga sáu mươi bảy lần. Tàu phá băng Sibir của Nga đã hoàn thành chuyến đi đầu tiên (và duy nhất) đến được Bắc Cực vào mùa đông, từ năm 1989. Theo tôi, Nga xứng đáng có được nó.", "Liệu khoa học sẽ cho thấy dãy Lomonosov gắn liền về mặt địa chất với Nga, với Greenland (tức Đan Mạch), với Canada, hay không thuộc nước nào trong số đó, thì hiện vẫn chưa rõ. Điều đã rõ là không ai đang phô trương tên lửa vì chuyện này. Và cũng có rất ít lý do để nghĩ rằng sẽ có ai làm vậy."], "note": "Arktika, Sibir: tên các tàu phá băng hạt nhân của Liên Xô/Nga, giữ nguyên tên riêng. \"Hydrographic survey\": khảo sát thủy văn (đo đạc, lập bản đồ đáy biển và vùng nước). \"Bristling missiles\": nghĩa bóng là phô trương, dàn sẵn tên lửa để đe dọa. \"Lomonosov Ridge\": dãy Lomonosov. \"Her\" chỉ nước Nga (cách nói nhân cách hóa), nên dịch là \"của Nga\".", "vocab": [{"ex": "The team carried out a hydrographic survey of the bay.", "ipa": "/ˌhaɪdrəˈɡræfɪk/", "mean": "thuộc thủy văn học, đo đạc và vẽ bản đồ biển, sông, hồ", "pos": "tính từ", "vi": "thủy văn", "w": "hydrographic"}, {"ex": "Cables run along the seabed between the two islands.", "ipa": "/ˈsiːbed/", "mean": "đáy biển", "pos": "danh từ", "vi": "đáy biển", "w": "seabed"}, {"ex": "The land looked unpromising for farming.", "ipa": "/ʌnˈprɒmɪsɪŋ/", "mean": "không có triển vọng, khó có kết quả tốt", "pos": "tính từ", "vi": "kém triển vọng", "w": "unpromising"}, {"ex": "The basin is a major gas province.", "ipa": "/ˈprɒvɪns/", "mean": "vùng (ở đây: vùng địa chất giàu tài nguyên, như vùng dầu khí)", "pos": "danh từ", "vi": "vùng dầu khí", "w": "province"}, {"ex": "The payment was purely symbolic.", "ipa": "/sɪmˈbɒlɪk/", "mean": "mang tính biểu tượng, không có giá trị thực tế", "pos": "tính từ", "vi": "mang tính biểu tượng", "w": "symbolic"}, {"ex": "An icebreaker cleared a path for the cargo ships.", "ipa": "/ˈaɪsbreɪkə(r)/", "mean": "tàu phá băng", "pos": "danh từ", "vi": "tàu phá băng", "w": "icebreaker"}, {"ex": "Climbing the peak in winter was a remarkable feat.", "ipa": "/fiːt/", "mean": "kỳ tích, thành tựu khó khăn", "pos": "danh từ", "vi": "kỳ tích", "w": "feat"}, {"ex": "She accomplished everything she planned.", "ipa": "/əˈkʌmplɪʃ/", "mean": "hoàn thành, đạt được", "pos": "động từ", "vi": "làm được điều đó", "w": "accomplish"}, {"ex": "He knocked thrice before the door opened.", "ipa": "/θraɪs/", "mean": "ba lần", "pos": "trạng từ (cổ, văn chương)", "vi": "ba lần", "w": "thrice"}, {"ex": "A ridge runs along the ocean floor.", "ipa": "/rɪdʒ/", "mean": "dãy núi/sống núi (ở đây: dãy núi ngầm dưới đáy biển)", "pos": "danh từ", "vi": "dãy", "w": "ridge"}, {"ex": "The border was bristling with weapons.", "ipa": "/ˈbrɪsl/", "mean": "dựng lông, hằm hè; (bristling with) đầy rẫy, tua tủa", "pos": "động từ", "vi": "phô trương", "w": "bristle"}, {"ex": "The region is geologically unstable.", "ipa": "/ˌdʒiːəˈlɒdʒɪkli/", "mean": "về mặt địa chất", "pos": "trạng từ", "vi": "về mặt địa chất", "w": "geologically"}], "patterns": [{"ex": "It is essential that every student be present.", "exVi": "Điều thiết yếu là mọi học sinh phải có mặt.", "explain": "Sau các cụm chỉ sự cần thiết hoặc công bằng, mệnh đề 'that' có thể dùng thức giả định (động từ nguyên mẫu, không chia): 'it be Russia' thay vì 'it is Russia'.", "formula": "if + S + V (thực tế), then it seems only fair that + S + (should) + V nguyên mẫu", "name": "Câu điều kiện với 'it seems only fair that' (giả định)", "src": "if it's really necessary for any country to control the North Pole, then it seems only fair that it be Russia."}, {"ex": "As far as I'm concerned, the meeting was a waste of time.", "exVi": "Theo tôi, cuộc họp là lãng phí thời gian.", "explain": "Dùng để nêu quan điểm cá nhân, nghĩa là 'theo tôi'. Có thể thay 'I' bằng người khác.", "formula": "As far as + S + be concerned, + mệnh đề", "name": "As far as I'm concerned / Personally speaking", "src": "As far as I'm concerned, Russia has earned it."}, {"ex": "He gave me a gift, an expensive one at that.", "exVi": "Anh ấy tặng tôi một món quà, mà lại còn đắt tiền nữa.", "explain": "'at that' đặt cuối cụm để thêm một ý nhấn mạnh, nghĩa là 'mà lại còn', 'hơn nữa'.", "formula": "... , a + adj + N at that", "name": "Danh từ + 'at that' (nhấn mạnh bổ sung)", "src": "a distant, heavily ice-covered area and unpromising oil and gas province at that"}, {"ex": "Whether he will join us is still uncertain.", "exVi": "Việc anh ấy có tham gia cùng chúng ta hay không vẫn chưa chắc chắn.", "explain": "Mệnh đề 'whether' đóng vai trò chủ ngữ của câu, theo sau là động từ 'is'. Cấu trúc 'reveal + O + to be + adj' nghĩa là cho thấy cái gì là như thế nào.", "formula": "Whether A or B or C is unknown.", "name": "Whether... or... làm chủ ngữ", "src": "Whether the science will reveal the Lomonosov Ridge to be geologically attached to Russia, or to Greenland, or to Canada, or none of them, is unknown."}], "hard": [{"mean": "Chưa biết khoa học sẽ chứng minh dãy Lomonosov gắn với địa chất của nước nào, hoặc không thuộc nước nào.", "parts": "Chủ ngữ: mệnh đề danh từ 'Whether the science will reveal... none of them'. Trong đó: động từ 'reveal' + tân ngữ 'the Lomonosov Ridge' + 'to be geologically attached to' + các lựa chọn (Russia / Greenland / Canada / none of them). Vị ngữ: 'is unknown'.", "s": "Whether the science will reveal the Lomonosov Ridge to be geologically attached to Russia, or to Greenland (Denmark), or to Canada, or none of them, is unknown."}, {"mean": "Đến cuối năm 2009, kỳ tích này chỉ mới được thực hiện 80 lần, và phần lớn (67 lần) là do Nga.", "parts": "Mệnh đề chính: 'the feat had been accomplished just eighty times' (quá khứ hoàn thành bị động, mốc 'By the end of 2009'). Sau dấu hai chấm: liệt kê chi tiết theo từng nước, lược bỏ động từ vì đã hiểu từ vế trước.", "s": "By the end of 2009 the feat had been accomplished just eighty times: Once each by Canada and Norway, twice by Germany, thrice by the United States, six times by Sweden, and sixty-seven times by Russia."}], "insight": "Ý chính của tác giả là cuộc tranh giành Bắc Cực bị thổi phồng. Đáy biển quanh cực vừa xa xôi, vừa phủ băng dày, lại không phải vùng dầu khí giàu tiềm năng, nên giá trị của nó chủ yếu là biểu tượng về uy tín quốc gia chứ không phải lợi ích kinh tế hay quân sự thực chất. Vì vậy ông cho rằng dù ba nước (Nga, Đan Mạch, Canada) đều lập bản đồ để đòi quyền, nguy cơ xung đột vũ trang là rất thấp. Câu cuối (\"không ai phô trương tên lửa\") chính là bằng chứng ông dùng để phản bác những dự báo giật gân về một \"cuộc chiến Bắc Cực\".\n\nVề bối cảnh: dãy Lomonosov là một dãy núi ngầm dưới đáy Bắc Băng Dương. Theo Công ước Liên Hợp Quốc về Luật Biển (UNCLOS), một quốc gia có thể đòi mở rộng quyền với thềm lục địa nếu chứng minh được đáy biển đó là phần kéo dài tự nhiên của lục địa mình, nên việc khảo sát địa chất mới quan trọng đến vậy. Đoạn giữa mang giọng chủ quan, nửa nghiêm túc nửa mỉa mai (\"theo tôi, Nga xứng đáng\"): ông dùng số liệu về số lần đến Bắc Cực (Nga 67 trong tổng 80 lần) để cho thấy Nga có năng lực và lịch sử vượt trội trong việc chinh phục vùng này, nhưng đây là ý kiến cá nhân, không phải kết luận pháp lý.\n\nĐiều đáng suy ngẫm là cách nhìn xuyên suốt của cuốn sách: địa lý và các ràng buộc thực tế thường quyết định chính trị quốc tế nhiều hơn lời lẽ hùng hồn, và những điểm nóng được báo chí nhắc nhiều chưa chắc là nơi dễ nổ ra chiến tranh.", "insightDone": true}, {"n": 54, "date": "2026-11-02", "source": ["The Five-Century Dream", "The dream is a northern shipping route between the Atlantic and Asia's Far East, a quest spanning over five centuries since the English, Dutch, and Russians first began looking for it. The only alternative, until the Suez and Panama canals were built, was to sail all the way around the southern horns of either Africa or South America. Many intrepid souls died looking for a shorter route over the North American or Eurasian continents. Probing northwest (the Northwest Passage), their ships got stuck like bugs to flypaper in Canada's perennially frozen northern archipelago, en route to the Bering Strait. Others died trying northeast (the Northern Sea Route), attempting to trace Russia's long northern coastline to reach the Bering Strait from the other direction. Both routes have now been traversed many times but neither is a viable commercial shipping lane. However, a small amount of international traffic is stirring between Canada's port of Churchill (in Hudson Bay) and Europe, and occasionally Murmansk. Since the 2007 and 2008 sea-ice convulsions, the prospect of global trade flows streaming through the Northwest Passage,..."], "translation": ["Giấc mơ năm thế kỷ", "Giấc mơ ấy là một tuyến hàng hải phía bắc nối Đại Tây Dương với vùng Viễn Đông của châu Á, một cuộc tìm kiếm kéo dài hơn năm thế kỷ, kể từ khi người Anh, người Hà Lan và người Nga bắt đầu tìm đường. Cho đến khi kênh đào Suez và kênh đào Panama được xây dựng, lựa chọn thay thế duy nhất là đi vòng xuống tận các mũi đất cực nam của châu Phi hoặc Nam Mỹ. Nhiều người gan dạ đã chết khi tìm một lộ trình ngắn hơn vượt qua lục địa Bắc Mỹ hoặc lục địa Á-Âu. Khi dò đường về phía tây bắc (Con đường Tây Bắc), tàu của họ bị mắc kẹt như ruồi dính giấy bẫy ruồi trong quần đảo phía bắc đóng băng quanh năm của Canada, trên đường tới eo biển Bering. Những người khác thiệt mạng khi thử đi về phía đông bắc (Tuyến đường biển phương Bắc), cố men theo bờ biển phía bắc dài dằng dặc của Nga để đến eo biển Bering từ hướng ngược lại. Hiện nay cả hai tuyến đường đã được vượt qua nhiều lần, nhưng không tuyến nào là đường vận tải thương mại khả thi. Tuy nhiên, một lượng nhỏ giao thông quốc tế đang bắt đầu xuất hiện giữa cảng Churchill của Canada (ở vịnh Hudson) và châu Âu, thỉnh thoảng có cả Murmansk. Kể từ những biến động băng biển năm 2007 và 2008, viễn cảnh các dòng thương mại toàn cầu đổ qua Con đường Tây Bắc,..."], "note": "\"Northwest Passage\" dịch là Con đường Tây Bắc, \"Northern Sea Route\" là Tuyến đường biển phương Bắc (Nga gọi là Severny Morskoy Put). \"Southern horns\" chỉ mũi Hảo Vọng (châu Phi) và mũi Horn (Nam Mỹ). \"Like bugs to flypaper\" là cách so sánh hình ảnh: bị dính chặt không thoát được. \"Sea-ice convulsions\" ám chỉ băng biển Bắc Cực tan mạnh bất thường. Churchill là cảng ở bang Manitoba, Canada. Câu cuối bị cắt giữa chừng nên giữ dấu \"...\".", "vocab": [], "patterns": [], "hard": []}, {"n": 55, "date": "2026-11-02", "source": ["...the Northern Sea Route, or even straight over the North Pole has become one of the most breathlessly touted benefits of global climate change. After all, those fifteenth-century navigators were geographically correct: Even after the Panama and Suez canals were made, the shortest shipping distances between Asia and the West would still lie through the Arctic Ocean.", "Lest we get carried away with visions of colorful sailboat regattas in the Arctic Ocean, keep in mind just how formidable sea ice is to the maritime industry. Only the largest heavy class of icebreaker like the Rossiya can break through it confidently. Canada has just two heavy icebreakers, the United States three. Russia—by far the world leader in this domain—is expanding its fleet to around fourteen. Seven are nuclear-powered, the largest and most powerful in the world. But icebreakers are costly and few. They require a strengthened hull, an ice-clearing shape, and serious pushing power, features not possessed by normal ships. There are barely a hundred of them operating in the entire world. The world's other vessels, of course, num..."], "translation": ["...Tuyến đường biển phương Bắc, hay thậm chí đi thẳng qua Bắc Cực, đã trở thành một trong những lợi ích được người ta hào hứng ca ngợi nhất của biến đổi khí hậu toàn cầu. Suy cho cùng, các nhà hàng hải thế kỷ mười lăm ấy đã đúng về mặt địa lý: ngay cả sau khi kênh đào Panama và Suez được xây dựng, những quãng đường vận chuyển ngắn nhất giữa châu Á và phương Tây vẫn sẽ đi qua Bắc Băng Dương.", "Đừng để bị cuốn đi bởi những hình dung về các cuộc đua thuyền buồm đầy màu sắc trên Bắc Băng Dương; hãy nhớ rằng băng biển là một trở ngại đáng gờm đến mức nào đối với ngành hàng hải. Chỉ những tàu phá băng hạng nặng cỡ lớn nhất như Rossiya mới có thể phá băng một cách chắc chắn. Canada chỉ có hai tàu phá băng hạng nặng, Hoa Kỳ có ba. Nga, nước dẫn đầu thế giới áp đảo trong lĩnh vực này, đang mở rộng đội tàu lên khoảng mười bốn chiếc. Bảy chiếc chạy bằng năng lượng hạt nhân, là những tàu lớn nhất và mạnh nhất thế giới. Nhưng tàu phá băng vừa đắt đỏ vừa ít ỏi. Chúng cần có thân tàu được gia cố, hình dáng giúp rẽ băng và sức đẩy thật lớn, những đặc điểm mà tàu thông thường không có. Trên toàn thế giới chỉ có chưa đầy một trăm chiếc đang hoạt động. Dĩ nhiên, các tàu còn lại trên thế giới có số lượng..."], "note": "Rossiya: tên một tàu phá băng hạt nhân của Nga (nghĩa là \"nước Nga\"). Northern Sea Route: Tuyến đường biển phương Bắc. Icebreaker: tàu phá băng. \"Breathlessly touted\": được ca ngợi, quảng bá một cách hào hứng, có phần thổi phồng. \"Lest we get carried away\": để chúng ta không bị cuốn theo quá đà.", "vocab": [], "patterns": [], "hard": []}]}];

// Độ hay gặp: từ vựng = số lần xuất hiện trong bản gốc của cả cuốn (ít nhất bằng số trang liệt kê từ đó); mẫu câu = số trang dùng mẫu đó.

// Mỗi câu một lần đọc để ngắt nghỉ tự nhiên; câu hỏi và câu cảm thán nâng giọng một chút. Câu quá dài tách ở dấu phẩy.

// Tìm từ mới (chưa thuộc) trong một đoạn bản gốc; chấp nhận dạng chia (popularize → popularized, grind → grinds).
function wordRegex(w, lang) {
  // Bỏ chú thích trong ngoặc ở tên từ vựng, ví dụ "project (v.)" -> "project".
  const clean = w.replace(/\s*\([^)]*\)/g, "").trim() || w;

  if (lang === "zh") return new RegExp(esc1(clean), "g");

  const forms = t => {
    const lw = t.toLowerCase(); if (lw.length <= 2) return [lw]; if (lw.length === 3) return [lw, lw + "s", lw + "es"];

    if (last === "e") { f.add(lw.slice(0, -1) + "ing"); f.add(lw + "r"); f.add(lw + "st"); }
    if (last === "y" && !/[aeiou]y$/.test(lw)) { const b = lw.slice(0, -1); ["ies", "ied", "ier", "iest", "ily"].forEach(x => f.add(b + x)); }

    return [...f];
  };

}

const freqBadge = (it, unit) => it.freq > 1 ? `<span class="freq" title="Hay gặp">gặp ${it.freq} ${unit}</span>` : "";

// ---- Mức nhớ và trò chơi ôn tập ----
const lvOf = k => lv[k] || 0;
const dots = k => `<span class="dots" role="img" aria-label="Mức nhớ ${lvOf(k)} trên 3">${"●".repeat(lvOf(k))}${"○".repeat(3 - lvOf(k))}</span>`;
const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOf = a => a[Math.floor(Math.random() * a.length)];
const norm = t => String(t).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();
const cleanW = w => String(w).replace(/\s*\([^)]*\)/g, "").trim() || String(w);

function distractors(all, it, field, n) {
  const seen = new Set([norm(it[field])]), out = [];
  for (const o of shuf(all)) { if (o.key === it.key || !o[field]) continue; const k = norm(o[field]); if (seen.has(k)) continue; seen.add(k); out.push(o); if (out.length >= n) break; }
  return out;
}
function mkChoices(it, all, field, text, sub) {
  const list = shuf([it, ...distractors(all, it, field, 3)]);
  return { choices: list.map(o => ({ text: text(o), sub: sub ? sub(o) : "" })), answer: list.indexOf(it) };
}
function makeQ(kind, it, all, lang) {
  const L = lvOf(it.key);
  if (kind === "tu-vung") {
    let t = pickOf(L === 0 ? ["mean", "word"] : L === 1 ? ["word", "cloze", "listen"] : ["cloze", lang === "en" ? "type" : "word", "listen"]);
    if (t === "listen" && !ttsOK()) t = "word";
    if (t === "listen") return { type: "listen", it, ...mkChoices(it, all, "w", o => cleanW(o.w)) };
    if (t === "cloze") {
      const m = it.ex ? new RegExp(wordRegex(it.w, lang).source, "iu").exec(it.ex) : null;
      if (m) return { type: "cloze", it, text: it.ex.slice(0, m.index) + "_____" + it.ex.slice(m.index + m[0].length), ...mkChoices(it, all, "w", o => cleanW(o.w)) };
      t = "word";
    }
    if (t === "type") return { type: "type", it, answer: cleanW(it.w) };
    if (t === "mean") return { type: "mean", it, ...mkChoices(it, all, "mean", o => shortTxt(o.mean)) };
    return { type: "word", it, ...mkChoices(it, all, "w", o => cleanW(o.w)) };
  }
  let t = pickOf(L === 0 ? ["which", "formula"] : L === 1 ? ["formula", "order"] : ["order", "which"]);
  if (t === "order") {
    const toks = (it.ex || "").trim().split(/\s+/).filter(Boolean);
    if (lang === "zh" || toks.length < 4 || toks.length > 14) t = "which";
    else { let pool = shuf(toks.map((_, i) => i)); for (let n = 0; n < 5 && pool.every((v, i) => v === i); n++) pool = shuf(pool); return { type: "order", it, tokens: toks, pool, picked: [] }; }
  }
  if (t === "formula") return { type: "formula", it, ...mkChoices(it, all, "formula", o => o.formula) };
  return { type: "which", it, ...mkChoices(it, all, "name", o => o.name, o => o.formula) };
}

function startGame(kind) {
  const all = items(kind), lang = book() ? book().lang : "en";
  if (all.length < 3) { state.game = { kind, tooFew: true }; return; }
  // Thứ tự chọn: 1) mục đến hạn ôn (quá hạn lâu nhất trước); 2) mục cần nhớ có điểm cao (độ hay gặp x mức còn thiếu);
  // 3) vài mục đã nhớ để ôn cho chắc. Tối đa 10 câu.
  const now = Date.now(), score = i => i.freq * (3 - lvOf(i.key)) + Math.random() * 0.5;
  const dueList = all.filter(i => due[i.key] && due[i.key] <= now).sort((a, b) => due[a.key] - due[b.key]).slice(0, 10);
  const taken = new Set(dueList.map(i => i.key));
  const todo = all.filter(i => !known.has(i.key) && !taken.has(i.key)).sort((a, b) => score(b) - score(a));
  const picked = [...dueList, ...todo.slice(0, Math.max(0, Math.min(8, 10) - dueList.length))];
  const pk = new Set(picked.map(i => i.key));
  const done = shuf(all.filter(i => known.has(i.key) && !pk.has(i.key)));
  const nDone = picked.length < 8 ? Math.min(done.length, 10 - picked.length) : Math.min(done.length, 10 - picked.length, 2);
  const picks = shuf([...picked, ...done.slice(0, nDone)]);
  state.game = { kind, lang, all, qs: picks.map(it => makeQ(kind, it, all, lang)), i: 0, score: 0, streak: 0, best: 0, ans: null, missed: [], newKnown: [], demoted: [], retried: false, done: false };
}
// Đúng: +1 (câu trắc nghiệm) hoặc +2 (gõ từ, sắp xếp câu). Đạt 3 thì tự chuyển sang "Đã nhớ". Sai: về 0, và nếu đang "Đã nhớ" thì quay lại danh sách cần nhớ.
function gradeAnswer(q, ok) {
  const g = state.game, k = q.it.key; let note = "";
  if (ok) {

    if (lv[k] >= 3 && !known.has(k)) { known.add(k); g.newKnown.push(k); note = "Bạn đã nhớ mục này. Nó được chuyển sang “Đã nhớ”."; }
  } else {
    lv[k] = 0;
    if (known.has(k)) { known.delete(k); g.demoted.push(k); note = "Mục này quay lại danh sách cần nhớ."; }
  }

  if (g.i >= g.qs.length) {
    if (g.missed.length && !g.retried) { g.retried = true; g.qs.push(...g.missed.map(it => ({ ...makeQ(g.kind, it, g.all, g.lang), retry: true }))); }

function gameChoose(i) { const q = state.game.qs[state.game.i]; gameAnswer(i === q.answer, i); }
function gameCheckType() {

function gameUnpick(pos) { const g = state.game, q = g.qs[g.i]; if (g.ans) return; q.picked.splice(pos, 1); render(); }

function renderGameResult(g) {

function renderStudy(kind) {
  if (state.mode[kind] === "game") return toolbar(kind) + renderGame(kind);
  const list = filtered(kind);
  let body;
  if (!list.length) body = `<p class="empty">${items(kind).length ? (state.q.trim() ? "Không tìm thấy mục nào." : "Bạn đã nhớ hết các mục cần nhớ. Vào “Trò chơi” để ôn lại.") : "Chưa có mục nào."}</p>`;
  else if (state.mode[kind] === "list") body = `<div class="items">${list.map(kind === "tu-vung" ? vocabRow : patRow).join("")}</div>`;
  else {
    if (!state.deck || state.deck.kind !== kind) state.deck = { kind, keys: list.map(i => i.key) }, state.idx = 0;
    const deck = state.deck.keys.map(k => list.find(i => i.key === k)).filter(Boolean);
    if (state.idx >= deck.length) state.idx = 0;
    const it = deck[state.idx], L = esc(book().lang);

      : `<div class="formula">${esc(it.formula)}</div><div class="ex" lang="${L}" style="font-size:1.1rem">${esc(it.ex)}</div><div>${esc(it.explain)}</div><div class="quote" lang="${L}" style="text-align:left">${esc(it.src)}</div>`;
    body = `<div class="card" id="card" role="button" tabindex="0" aria-label="Lật thẻ">${front}

      <div class="card-nav"><span class="stat" style="align-self:center">${state.idx + 1}/${deck.length} · ${it.page ? "trang " + pad(it.page) : "thêm tay"}</span>

// Đọc câu trả lời dạng khuôn ===TAG=== (chịu được dấu ngoặc kép, gạch ngang, chữ nghiêng trong sách mà JSON không chịu được).
function parseTagged(text) {
  const grab = tag => { const m = String(text).match(new RegExp("===" + tag + "===[ \\t]*\\n?([\\s\\S]*?)(?=\\n?===[A-Z]+===|$)")); return m ? m[1].trim() : ""; };
  const paras = t => t.split(/\n\s*\n/).map(x => x.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
  return { lang: /zh|chinese|trung|中/i.test(grab("LANG")) ? "zh" : "en", source: paras(grab("SOURCE")), translation: paras(grab("TRANSLATION")), note: grab("NOTE") };
}

// Phát hiện trang đã dịch: so các cụm 5 từ liên tiếp. Hai trang Kindle liền nhau chỉ trùng một hai câu ở mép trang, nên chỉ báo khi trùng từ 60% trở lên.
const shingles = t => { const w = String(t).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean), out = new Set(); for (let i = 0; i + 5 <= w.length; i++) out.add(w.slice(i, i + 5).join(" ")); return out; };
function findDuplicate(text, pages) {
  const mine = shingles(text); if (mine.size < 3) return null;
  let best = null;
  for (const p of pages) {
    const theirs = shingles((p.source || []).join(" ")); let hit = 0;
    for (const x of mine) if (theirs.has(x)) hit++;
    const r = hit / mine.size;
    if (r >= 0.6 && (!best || r > best.ratio)) best = { page: p, ratio: r };
  }
  return best;
}
function showDup(d, pending) {
  state.dup = { n: d.page.n, pct: Math.round(d.ratio * 100), pending: pending || null };
  state.err = true; state.msg = ""; state.busy = false; render();
}

    source: (out.source || []).map(String), translation: out.translation.map(String), note: String(out.note || ""),

  await db.collection("pages").doc(`${b.id}-${pad(next)}`).set(page);
  state.result = page; state.draft = ""; store.set("draft", ""); state.file = null; state.pageLabel = ""; state.dup = null;
  state.book = b.id; store.set("book", b.id); state.msg = ""; state.newTitle = ""; state.newOrig = ""; state.newAuthor = "";

}

// force = true khi người dùng bấm "Vẫn lưu thành trang mới" sau cảnh báo trùng.
async function translate(force) {
  if (!sample || !db || !isOwner || state.busy) return render();
  const hasImage = !!state.file;
  if (!state.draft.trim() && !hasImage) { state.msg = "Hãy dán nội dung trang hoặc chọn ảnh trước."; state.err = true; return render(); }
  let b = book();
  if (state.book === "__new") {
    const t = state.newTitle.trim();
    if (!t) { state.msg = "Hãy nhập tên sách mới."; state.err = true; return render(); }
    const same = BOOKS.find(x => x.id === slug(t));
    b = same || { id: slug(t), title: t, original: state.newOrig.trim(), author: state.newAuthor.trim(), lang: "en", pages: [] };
  }
  const next = b.pages.length ? b.pages[b.pages.length - 1].n + 1 : 1;
  const prev = b.pages[b.pages.length - 1];
  state.dup = null;
  // Dán chữ: kiểm tra trùng trước khi tốn lượt dùng Claude.
  if (!force && !hasImage) { const d = findDuplicate(state.draft, b.pages); if (d) return showDup(d); }
  state.busy = true; state.err = false; state.result = null; state.msg = "Claude đang đọc và dịch trang…"; state.ctl = new AbortController(); render();
  try {
    const reply = await sample(buildPrompt(b, b.lang, next, prev ? (prev.translation || []).join("\n").slice(-1500) : "", hasImage),
      { signal: state.ctl.signal, ...(hasImage ? { images: [state.file] } : {}),
        onText: ({ text }) => { const el = document.getElementById("status"); if (el) el.textContent = `Claude đang viết… (${text.length} ký tự)`; } });
    const out = parseTagged(reply.text);
    if (!out.translation.length || !out.source.length) throw { code: reply.truncated ? "truncated" : "invalid_json" };
    if (reply.truncated) throw { code: "truncated" };
    // Ảnh: chỉ biết chữ sau khi Claude đọc, nên kiểm tra trùng ở đây và giữ kết quả để khỏi dịch lại nếu người dùng vẫn muốn lưu.
    if (!force) { const d = findDuplicate((out.source || []).join(" "), b.pages); if (d) return showDup(d, { b, next, out }); }
    return await savePage(b, next, out);
  } catch (e) {
    state.err = true; state.msg = errVi(e) + (e && (e.code === "invalid_json" || e.code === "truncated") ? " Bấm dịch lại, hoặc cắt trang làm hai phần rồi dán lần lượt." : "");
  } finally { state.busy = false; render(); }
}

// Thử đọc bộ nhớ tạm ngay trong lần bấm (một số trình duyệt cho phép, iPhone có thể hiện bong bóng "Dán" để bấm).
// Nếu bị chặn thì quay về cách cũ: đưa con trỏ vào ô để người dùng tự dán.
async function pasteFromClipboard() {
  const fallback = why => { state.pasteHint = true; state.pasteWhy = why || ""; render(); };
  const cb = navigator.clipboard;
  if (state.busy) return;
  if (!cb) return fallback("không có quyền đọc bộ nhớ");
  try {
    if (canImage && cb.read) {
      try {
        for (const item of await cb.read()) {
          const type = item.types.find(t => t.startsWith("image/"));
          if (type) { state.file = new File([await item.getType(type)], "trang." + type.split("/")[1], { type }); state.draft = ""; state.pasteHint = false; return translate(); }
          if (item.types.includes("text/plain")) {
            const text = await (await item.getType("text/plain")).text();
            if (text.trim()) { state.draft = text; store.set("draft", text); state.file = null; state.pasteHint = false; return translate(); }
          }
        }
      } catch (e) { if (!cb.readText) throw e; }
    }
    const text = cb.readText ? await cb.readText() : "";
    if (!text.trim()) return fallback("bộ nhớ trống hoặc không đọc được");
    state.draft = text; store.set("draft", text); state.file = null; state.pasteHint = false;
    translate();
  } catch (e) { fallback("bị chặn: " + ((e && e.name) || "lỗi")); }
}

const rdKey = () => "rdpos:" + (book() ? book().id : "") + ":" + state.rdLang;
function readerHTML() {
  const b = book(); if (!b) return "";
  const vocab = items("tu-vung"), lang = state.rdLang;
  return b.pages.map(p => {
    const vt = viTerms(p);
    const src = p.source || [], vi = p.translation || [];
    const body = lang === "both"
      ? Array.from({ length: Math.max(src.length, vi.length) }, (_, i) => (src[i] ? `<p class="rd-src" lang="${esc(b.lang)}">${markNew(src[i], vocab, b.lang)}</p>` : "") + (vi[i] ? `<p>${markVi(vi[i], vt)}</p>` : "")).join("")
      : lang === "src" ? src.map(t => `<p lang="${esc(b.lang)}">${markNew(t, vocab, b.lang)}</p>`).join("") : vi.map(t => `<p>${markVi(t, vt)}</p>`).join("");
    return `<div class="rd-mark">Trang ${pad(p.n)}${p.label ? ` · trang sách ${esc(p.label)}` : ""}</div>${body}`;
  }).join("");
}
function layoutReader(keepFrac) {
  const view = document.getElementById("rdView"), c = document.getElementById("rdContent");

  const W = view.clientWidth, G = 48;
  c.style.width = W + "px"; c.style.columnWidth = W + "px"; c.style.columnGap = G + "px"; c.style.fontSize = state.rdSize + "px";
  state.rdStep = W + G;
  state.rdPages = Math.max(1, Math.round((c.scrollWidth + G) / state.rdStep));
  goPage(Math.round(frac * (state.rdPages - 1)), false);
}
function goPage(n, anim = true) {
  const c = document.getElementById("rdContent");
  state.rdPage = Math.max(0, Math.min(state.rdPages - 1, n));

  if (e.target.closest("button, [data-vk], .sheet")) {
    const b = e.target.closest("button");
    if (b && (b.id === "rdStart" || b.id === "rdEnd")) { e.stopPropagation(); return goPage(b.id === "rdEnd" ? state.rdPages - 1 : 0); }

  }

document.addEventListener("click", e => {
  const addTab = e.target.closest && e.target.closest('nav.tabs a[data-tab="them-trang"]');
  if (addTab) { state.focusAdd = true; if (location.hash === "#them-trang") { e.preventDefault(); state.pop = null; render(); window.scrollTo(0, 0); } return; }

  if (b.dataset.rename) {

    if (!t || !db) return;
    return void Promise.all(dbPages.filter(p => p.book === id).map(p => db.collection("pages").doc(p.dbId).update({ bookTitle: t }))).catch(() => {});
  }
  if (b.dataset.listen) {
    const [bid, n] = [b.dataset.listen.slice(0, b.dataset.listen.lastIndexOf(":")), +b.dataset.listen.slice(b.dataset.listen.lastIndexOf(":") + 1)];
    const pg = (BOOKS.find(x => x.id === bid) || { pages: [] }).pages.find(x => x.n === n);
    return pg ? listen(b.dataset.listen, (pg.translation || []).join(" ")) : undefined;
  }
  if (b.hasAttribute("data-ttsrate")) { const r = [0.8, 0.9, 1, 1.15, 1.3]; ttsRate = r[(r.indexOf(ttsRate) + 1) % r.length]; store.set("ttsRate", ttsRate); if (ttsId) { const id = ttsId, [bid, n] = [id.slice(0, id.lastIndexOf(":")), +id.slice(id.lastIndexOf(":") + 1)]; const pg = (BOOKS.find(x => x.id === bid) || { pages: [] }).pages.find(x => x.n === n); if (pg) { ttsId = null; listen(id, (pg.translation || []).join(" ")); } } return refreshListen(); }
  if (b.id === "go") { state.dup = null; return translate(); }
  if (b.id === "dupCancel") { state.dup = null; return render(); }
  if (b.id === "dupForce") {
    const pend = state.dup && state.dup.pending; state.dup = null;
    if (pend) { state.busy = true; state.err = false; state.msg = "Đang lưu…"; render(); return savePage(pend.b, pend.next, pend.out).catch(e => { state.err = true; state.msg = errVi(e); state.busy = false; render(); }); }
    return translate(true);
  }
  if (b.dataset.viewpage) { state.scrollTo = "p-" + b.dataset.viewpage; if (location.hash === "#ban-dich") return render(); location.hash = "#ban-dich"; return; }
  if (b.id === "retryInsight") { const bk = book(); return explain(state.result || (bk && bk.pages[bk.pages.length - 1])); }
  if (b.dataset.explain) return explain(dbPages.find(p => p.dbId === b.dataset.explain));
  if (b.id === "retryAnalyze") { const bk = book(); return analyze(state.result || (bk && bk.pages[bk.pages.length - 1])); }
  if (b.id === "fsUp" || b.id === "fsDown") { rs = Math.round(Math.max(0.8, Math.min(1.8, rs + (b.id === "fsUp" ? 0.1 : -0.1))) * 10) / 10; store.set("rs", rs); return applyRs(); }
  if (b.id === "openReader") return openReader();

  else if (b.id === "grestart") startGame(t);
  else if (b.dataset.mode) { state.mode[t] = b.dataset.mode; state.deck = null; state.flipped = false; state.game = null; }
  else if (b.dataset.sort) { state.sort = b.dataset.sort; store.set("sort", state.sort); state.deck = null; state.flipped = false; }
  else if (b.dataset.filter) { state.filter = b.dataset.filter; state.deck = null; state.flipped = false; }
  else if (b.dataset.say) return speak(b.dataset.say);
  else if (b.dataset.known) toggleKnown(b.dataset.known, !known.has(b.dataset.known));
  else if (b.dataset.knownNext) { toggleKnown(b.dataset.knownNext, true); state.flipped = false; if (state.filter === "all") state.idx++; }
  else if (b.id === "again") { state.idx++; state.flipped = false; }
  else if (b.id === "shuffle") { const k = state.deck.keys; for (let i = k.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [k[i], k[j]] = [k[j], k[i]]; } state.idx = 0; state.flipped = false; }
  else if (b.id === "card") state.flipped = !state.flipped;

});
document.addEventListener("change", e => {

// Trình duyệt không cho trang tự đọc bộ nhớ tạm, nên bắt sự kiện Dán của người dùng (chữ hoặc ảnh) ở bất cứ đâu trong tab.

(async () => {
