": "nền móng", "w": "foundation"}, {"ex": "She stared at the results in astonishment.", "ipa": "/əˈstɑːnɪʃmənt/", "mean": "sự kinh ngạc", "pos": "danh từ", "vi": "kinh ngạc", "w": "astonishment"}, {"ex": "The forest has thinned over the last decade.", "ipa": "/θɪn/", "mean": "mỏng đi, trở nên mỏng", "pos": "động từ (thin – thinned)", "vi": "mỏng đi", "w": "thin"}, {"ex": "Weather in the mountains is rarely predictable.", "ipa": "/prɪˈdɪktəbl/", "mean": "có thể đoán trước (less predictable: khó đoán hơn)", "pos": "tính từ", "vi": "khó đoán hơn", "w": "predictable"}, {"ex": "The truck crashed through the barrier.", "ipa": "/kræʃ θruː/", "mean": "đâm/lao thủng qua, sụp xuống qua (lớp băng)", "pos": "cụm động từ", "vi": "lao thủng", "w": "crash through"}, {"ex": "Lack of sleep can impair your judgment.", "ipa": "/ɪmˈper/", "mean": "làm suy giảm, làm yếu đi (khả năng, chức năng)", "pos": "động từ", "vi": "làm suy giảm", "w": "impair"}, {"ex": "We grilled Arctic char for dinner.", "ipa": "/ˈɑːrktɪk tʃɑːr/", "mean": "cá hồi chấm Bắc Cực, loài cá nước lạnh", "pos": "danh từ", "vi": "cá hồi chấm Bắc Cực", "w": "Arctic char"}, {"ex": "They threw a big bash for her retirement.", "ipa": "/bæʃ/", "mean": "bữa tiệc lớn, buổi liên hoan", "pos": "danh từ (thân mật)", "vi": "bữa tiệc", "w": "bash"}], "patterns": [{"ex": "For decades my family has fished in this river.", "exVi": "Suốt nhiều thập kỷ, gia đình tôi đã đánh cá trên con sông này.", "explain": "Hiện tại hoàn thành với 'for' diễn tả việc bắt đầu từ lâu trong quá khứ và vẫn còn liên quan đến hiện tại. Ở đây, cụm 'For millennia' được đặt lên đầu câu để nhấn mạnh.", "formula": "S + have/has + V3 + (for + khoảng thời gian)", "name": "Thì hiện tại hoàn thành chỉ quá trình kéo dài đến nay", "src": "For millennia the Inuit and Yupik (Eskimo) peoples have lived along the shores of the Arctic Ocean"}, {"ex": "It is the system on which the whole economy depends.", "exVi": "Đó là hệ thống mà cả nền kinh tế dựa vào.", "explain": "Giới từ + 'which' mở đầu mệnh đề quan hệ mang tính trang trọng (upon which = mà trên đó). Cách này tạo văn phong học thuật, nhấn mạnh danh từ phía trước.", "formula": "It is + N + on/upon which + S + V", "name": "Câu chẻ nhấn mạnh với 'It is... on which'", "src": "It is the platform upon which they travel"}, {"ex": "We watched in horror as the water rose.", "exVi": "Chúng tôi kinh hoàng chứng kiến nước dâng lên.", "explain": "'as' ở đây nghĩa là 'khi, trong lúc', diễn tả việc chứng kiến một sự thay đổi đang diễn ra. 'in astonishment' là trạng ngữ chỉ cảm xúc.", "formula": "S + watch(ed) in + cảm xúc + as + S + V", "name": "Watch ... as + mệnh đề", "src": "These hunters have watched in astonishment as their sea-ice travel platform ... has thinned"}, {"ex": "The road—narrow even in summer—is closed in winter.", "exVi": "Con đường, vốn hẹp ngay cả vào mùa hè, bị đóng cửa vào mùa đông.", "explain": "Cặp dấu gạch ngang chèn một cụm tính từ làm thông tin phụ cho chủ ngữ. Có thể bỏ phần này mà câu vẫn đủ nghĩa.", "formula": "S —(cụm bổ sung)— V", "name": "Gạch ngang chèn thông tin bổ sung", "src": "their sea-ice travel platform—dangerous even in good times—has thinned"}], "hard": [{"mean": "Tác giả biết rằng băng yếu đi và mùa băng ngắn hơn hai đến ba tháng đang làm giảm khả năng săn hải cẩu và bắt cá hồi chấm của người dân.", "parts": "Chủ ngữ: I. Vị ngữ: learned. Mệnh đề that: chủ ngữ 'weaker ice and a two- to three-month shorter ice season' (xem như một khối nên dùng 'is'), vị ngữ 'is impairing', tân ngữ 'people's ability to catch seals and Arctic char'. 'two- to three-month' là dạng rút gọn của 'two-month to three-month'.", "s": "I learned that weaker ice and a two- to three-month shorter ice season is impairing people's ability to catch seals and Arctic char."}, {"mean": "Những thợ săn kinh ngạc nhìn lớp băng biển mà họ dùng để đi lại, vốn đã nguy hiểm, nay mỏng đi, khó đoán hơn và thậm chí biến mất.", "parts": "Chủ ngữ: These hunters. Vị ngữ: have watched in astonishment. Mệnh đề 'as': chủ ngữ 'their sea-ice travel platform', cụm chèn '—dangerous even in good times—', ba động từ song song: has thinned / (has) become less predictable / (has) even disappeared.", "s": "These hunters have watched in astonishment as their sea-ice travel platform—dangerous even in good times—has thinned, become less predictable, and even disappeared."}]}, {"n": 21, "date": "2026-10-28", "source": ["the ice has become unsafe. In Barrow, two thousand miles west on the northernmost tip of Alaska, I learned hunters are now taking boats many miles offshore, hoping to find bits of ice with a walrus or bearded seal.", "This is a serious matter. In the high Arctic, eating wild animals is an essential part of human survival and culture. In Barrow I was welcomed into the home of an Inuit elder, who explained that three-quarters of his community relies on wild-caught food. I was struck by this because Barrow is one of the most prosperous and modernized northern towns I have seen. There is a huge supermarket with most everything found in the supermarkets of Los Angeles. But groceries are two or three times more expensive because there is no road or rail to Barrow, so everything must be flown or barged in. Most people at least supplement their diet with wild food; many crucially depend on it. Alongside Pepe's Mexican Restaurant (which has surprisingly good..."], "translation": ["...lớp băng đã trở nên không còn an toàn. Ở Barrow, cách đây hai nghìn dặm về phía tây, trên mũi cực bắc của Alaska, tôi được biết các thợ săn giờ phải đi thuyền ra khơi nhiều dặm, hy vọng tìm được những mảng băng nhỏ có hải mã hoặc hải cẩu râu trên đó.", "Đây là một vấn đề nghiêm trọng. Ở vùng Bắc Cực cao, ăn thịt động vật hoang dã là một phần thiết yếu của sự sinh tồn và văn hóa của con người. Ở Barrow, tôi được đón vào nhà của một bậc trưởng lão người Inuit, ông giải thích rằng ba phần tư cộng đồng của ông sống nhờ vào thực phẩm đánh bắt, săn bắt từ tự nhiên. Điều này khiến tôi ngạc nhiên vì Barrow là một trong những thị trấn phương bắc thịnh vượng và hiện đại nhất mà tôi từng thấy. Ở đó có một siêu thị khổng lồ với hầu hết mọi thứ có trong các siêu thị ở Los Angeles. Nhưng hàng tạp hóa đắt gấp hai đến ba lần vì không có đường bộ hay đường sắt đến Barrow, nên mọi thứ đều phải chở đến bằng máy bay hoặc sà lan. Hầu hết người dân ít nhất cũng bổ sung thức ăn hoang dã vào khẩu phần; nhiều người phụ thuộc vào nó một cách sống còn. Bên cạnh nhà hàng Mexico Pepe's (nơi có món ăn ngon đến bất ngờ..."], "note": "Barrow là tên cũ của thị trấn Utqiaġvik ở Alaska (đổi tên năm 2016), nằm ở cực bắc nước Mỹ. Inuit là dân bản địa Bắc Cực. 'Two thousand miles west' so với địa điểm tác giả nhắc ở đoạn trước (Canada). 'Walrus' = hải mã, 'bearded seal' = hải cẩu râu. 'Wild-caught food' chỉ thực phẩm săn bắt, đánh bắt tự nhiên (còn gọi là subsistence food). Câu cuối bị cắt giữa chừng.", "vocab": [{"ex": "The company drilled for oil offshore.", "ipa": "/ˌɒfˈʃɔːr/", "mean": "ngoài khơi, cách xa bờ", "pos": "trạng từ/tính từ", "vi": "ra khơi", "w": "offshore"}, {"ex": "The bearded seal rested on a floating sheet of ice.", "ipa": "/ˈbɪərdɪd siːl/", "mean": "hải cẩu râu (loài hải cẩu lớn ở Bắc Cực)", "pos": "danh từ", "vi": "hải cẩu râu", "w": "bearded seal"}, {"ex": "A walrus can weigh over a tonne.", "ipa": "/ˈwɔːlrəs/", "mean": "hải mã", "pos": "danh từ", "vi": "hải mã", "w": "walrus"}, {"ex": "Few plants survive in the high Arctic.", "ipa": "/haɪ ˈɑːktɪk/", "mean": "vùng Bắc Cực cao, gần cực bắc", "pos": "cụm danh từ", "vi": "vùng Bắc Cực cao", "w": "high Arctic"}, {"ex": "Water is essential for life.", "ipa": "/ɪˈsenʃl/", "mean": "thiết yếu, không thể thiếu", "pos": "tính từ", "vi": "thiết yếu", "w": "essential"}, {"ex": "The village elder settled the dispute.", "ipa": "/ˈeldər/", "mean": "bậc trưởng lão, người lớn tuổi được kính trọng trong cộng đồng", "pos": "danh từ", "vi": "bậc trưởng lão", "w": "elder"}, {"ex": "Many islanders rely on fishing.", "ipa": "/rɪˈlaɪ ɒn/", "mean": "dựa vào, sống nhờ vào", "pos": "cụm động từ", "vi": "sống nhờ vào", "w": "rely on"}, {"ex": "She was struck by his honesty.", "ipa": "/strʌk/", "mean": "bị gây ấn tượng mạnh, ngạc nhiên", "pos": "quá khứ phân từ (be struck by)", "vi": "khiến tôi ngạc nhiên", "w": "struck"}, {"ex": "It was a prosperous trading city.", "ipa": "/ˈprɒspərəs/", "mean": "thịnh vượng, phát đạt", "pos": "tính từ", "vi": "thịnh vượng", "w": "prosperous"}, {"ex": "The modernized factory doubled output.", "ipa": "/ˈmɒdənaɪzd/", "mean": "được hiện đại hóa", "pos": "tính từ", "vi": "hiện đại", "w": "modernized"}, {"ex": "Coal is barged down the river.", "ipa": "/bɑːdʒ/", "mean": "chở bằng sà lan", "pos": "động từ (barge in: chở bằng sà lan)", "vi": "sà lan", "w": "barge"}, {"ex": "He supplements his income by teaching.", "ipa": "/ˈsʌplɪment/", "mean": "bổ sung", "pos": "động từ", "vi": "bổ sung", "w": "supplement"}, {"ex": "Sleep is crucially important for memory.", "ipa": "/ˈkruːʃəli/", "mean": "một cách then chốt, sống còn", "pos": "trạng từ", "vi": "một cách sống còn", "w": "crucially"}, {"ex": "I bought the groceries on the way home.", "ipa": "/ˈɡrəʊsəriz/", "mean": "hàng tạp hóa, thực phẩm hằng ngày", "pos": "danh từ số nhiều", "vi": "hàng tạp hóa", "w": "groceries"}], "patterns": [{"ex": "Flights here are twice as costly because fuel must be imported.", "exVi": "Chuyến bay ở đây đắt gấp đôi vì nhiên liệu phải nhập khẩu.", "explain": "So sánh bội số: 'X times more adj' nghĩa là gấp X lần. Theo sau là 'because' nêu lý do.", "formula": "two or three times + more + adj + because + mệnh đề", "name": "Số lần + more + tính từ + because", "src": "groceries are two or three times more expensive because there is no road or rail to Barrow"}, {"ex": "I met a doctor, who explained the treatment clearly.", "exVi": "Tôi gặp một bác sĩ, người đã giải thích rõ ràng về cách điều trị.", "explain": "Mệnh đề 'who' sau dấu phẩy bổ sung thông tin về người đứng trước; dịch thành 'ông ấy giải thích rằng...'.", "formula": "danh từ chỉ người, who + động từ", "name": "Mệnh đề quan hệ không xác định (who...)", "src": "an Inuit elder, who explained that three-quarters of his community relies on wild-caught food"}, {"ex": "We were struck by the silence because the city is usually noisy.", "exVi": "Chúng tôi ngạc nhiên trước sự yên tĩnh vì thành phố thường rất ồn.", "explain": "Diễn tả sự ngạc nhiên, ấn tượng mạnh; 'because' giải thích lý do gây ngạc nhiên.", "formula": "be struck by + N/điều gì + because + mệnh đề", "name": "Be struck by... because...", "src": "I was struck by this because Barrow is one of the most prosperous and modernized northern towns"}, {"ex": "All supplies must be shipped in by sea.", "exVi": "Mọi nhu yếu phẩm phải được chở đến bằng đường biển.", "explain": "Bị động với modal 'must' chỉ sự bắt buộc; 'flown/barged in' là hai động từ bị động song song.", "formula": "S + must be + V3", "name": "Bị động với must", "src": "everything must be flown or barged in"}], "hard": [{"mean": "Có một siêu thị khổng lồ bán hầu như mọi thứ mà các siêu thị ở Los Angeles có.", "parts": "Chủ ngữ giả: There; động từ: is; danh từ chính: a huge supermarket; 'with most everything' = với hầu như mọi thứ (khẩu ngữ Mỹ); 'found in the supermarkets of Los Angeles' là cụm quá khứ phân từ bổ nghĩa cho 'everything'.", "s": "There is a huge supermarket with most everything found in the supermarkets of Los Angeles."}, {"mean": "Ở Barrow tôi được một bậc trưởng lão Inuit đón vào nhà, và ông cho biết ba phần tư cộng đồng của ông sống dựa vào thực phẩm săn bắt từ tự nhiên.", "parts": "Trạng ngữ: In Barrow; chủ ngữ: I; vị ngữ bị động: was welcomed into the home of an Inuit elder; mệnh đề quan hệ: who explained; mệnh đề danh từ: that three-quarters of his community relies on wild-caught food (chủ ngữ 'three-quarters' chia số ít theo 'community').", "s": "In Barrow I was welcomed into the home of an Inuit elder, who explained that three-quarters of his community relies on wild-caught food."}, {"mean": "Ở Barrow, tôi biết rằng các thợ săn giờ phải đi thuyền ra xa nhiều dặm với hy vọng tìm thấy những mảng băng nhỏ có hải mã hoặc hải cẩu râu.", "parts": "Trạng ngữ địa điểm: In Barrow + cụm đồng vị (two thousand miles west on the northernmost tip of Alaska); chủ ngữ: I; vị ngữ: learned; mệnh đề danh từ: hunters are now taking boats many miles offshore; cụm phân từ chỉ mục đích: hoping to find bits of ice with a walrus or bearded seal.", "s": "In Barrow, two thousand miles west on the northernmost tip of Alaska, I learned hunters are now taking boats many miles offshore, hoping to find bits of ice with a walrus or bearded seal."}]}, {"n": 22, "date": "2026-10-28", "source": ["...food and is apparently visited by members of the Chicago Bulls basketball team) I saw plenty of bushmeat in Barrow. My host's kitchen and backyard were festooned with racks of drying meat and fish; in his driveway was a dead caribou. Another driveway had two seals, yet another a massive walrus. In the Arctic, obtaining “country food” is not for sport—it is as important to people's diet as thin-crust pizza is to New Yorkers.", "Of all northern peoples, the marine mammal-hunters living along the Arctic Ocean coast are suffering the most from climate change. Less sea ice means more accidents and fewer ice-loving animals to eat. It means faster shoreline erosion from pounding by the waves and storms of the open ocean. The Alaskan village of Shishmaref has lost this battle and will need to be relocated farther inland. But even in coastal towns, nearly everyone I meet bristles at the notion of being cast as a hapless climate-change refugee."], "translation": ["...đồ ăn và nghe nói còn được các thành viên đội bóng rổ Chicago Bulls ghé thăm), tôi đã thấy rất nhiều thịt thú rừng ở Barrow. Bếp và sân sau nhà chủ nhà tôi treo đầy những giàn thịt và cá phơi khô; trên lối vào nhà ông có một con tuần lộc đã chết. Lối vào nhà khác có hai con hải cẩu, nhà khác nữa là một con hải mã khổng lồ. Ở Bắc Cực, việc kiếm “thực phẩm bản địa” không phải để giải trí—nó quan trọng với khẩu phần ăn của người dân cũng như pizza đế mỏng đối với người New York.", "Trong tất cả các dân tộc phương bắc, những thợ săn thú biển sống dọc bờ Bắc Băng Dương đang chịu ảnh hưởng nặng nề nhất từ biến đổi khí hậu. Băng biển ít đi đồng nghĩa với nhiều tai nạn hơn và ít động vật ưa băng hơn để ăn thịt. Nó cũng có nghĩa là bờ biển xói mòn nhanh hơn do sóng và bão từ đại dương mở liên tục đập vào. Ngôi làng Shishmaref của Alaska đã thua trong cuộc chiến này và sẽ phải di dời vào sâu trong đất liền. Nhưng ngay cả ở các thị trấn ven biển, hầu hết những người tôi gặp đều phản ứng gay gắt trước ý nghĩ bị coi là những người tị nạn khí hậu đáng thương."], "note": "Barrow là thị trấn ở cực bắc Alaska (nay đổi tên thành Utqiaġvik). Shishmaref là làng của người Inupiat trên đảo ngoài khơi Alaska, bị xói lở bờ biển nghiêm trọng. “Country food” là cách gọi thực phẩm săn bắt, đánh bắt từ tự nhiên của cư dân vùng cực. Câu mở đầu bị cắt giữa chừng nên có dấu ngoặc đơn đóng không có ngoặc mở.", "vocab": [{"ex": "Bushmeat is still sold in some local markets.", "ipa": "/ˈbʊʃmiːt/", "mean": "thịt thú rừng/thú hoang được săn bắt để ăn", "pos": "danh từ", "vi": "thịt thú rừng", "w": "bushmeat"}, {"ex": "The street was festooned with colourful lanterns.", "ipa": "/feˈstuːnd wɪð/", "mean": "được treo/trang trí đầy bằng thứ gì", "pos": "cụm động từ bị động (festoon)", "vi": "treo đầy", "w": "festooned with"}, {"ex": "Fish were hung on a rack to dry in the sun.", "ipa": "/ræk/", "mean": "giàn, giá để treo hoặc phơi đồ", "pos": "danh từ", "vi": "giàn", "w": "rack"}, {"ex": "Herds of caribou migrate across the tundra each year.", "ipa": "/ˈkærɪbuː/", "mean": "tuần lộc Bắc Mỹ", "pos": "danh từ", "vi": "tuần lộc", "w": "caribou"}, {"ex": "A walrus can weigh over a tonne.", "ipa": "/ˈwɔːlrəs/", "mean": "hải mã", "pos": "danh từ", "vi": "hải mã", "w": "walrus"}, {"ex": "Many families still depend on country food in winter.", "ipa": "/ˈkʌntri fuːd/", "mean": "thực phẩm săn bắt, đánh bắt từ tự nhiên của cư dân bản địa", "pos": "danh từ (thuật ngữ vùng Bắc Cực)", "vi": "thực phẩm bản địa", "w": "country food"}, {"ex": "Whales and seals are marine mammals.", "ipa": "/məˈriːn ˈmæml/", "mean": "động vật có vú sống ở biển (hải cẩu, hải mã, cá voi...)", "pos": "danh từ", "vi": "thú biển", "w": "marine mammal"}, {"ex": "Coastal erosion threatens many homes.", "ipa": "/ɪˈrəʊʒn/", "mean": "sự xói mòn", "pos": "danh từ", "vi": "xói mòn", "w": "erosion"}, {"ex": "The pounding of the waves damaged the sea wall.", "ipa": "/ˈpaʊndɪŋ/", "mean": "sự đập liên tục, dồn dập", "pos": "danh từ", "vi": "đập vào", "w": "pounding"}, {"ex": "The company plans to relocate its office to Hanoi.", "ipa": "/ˌriːləʊˈkeɪt/", "mean": "di dời, chuyển đến nơi khác", "pos": "động từ", "vi": "di dời", "w": "relocate"}, {"ex": "Farmers moved inland to escape the floods.", "ipa": "/ˈɪnlənd/", "mean": "vào sâu trong đất liền, xa biển", "pos": "trạng từ / tính từ", "vi": "đất liền", "w": "inland"}, {"ex": "He bristled at the suggestion that he was lying.", "ipa": "/ˈbrɪsl æt/", "mean": "phản ứng gay gắt, khó chịu trước điều gì", "pos": "cụm động từ", "vi": "phản ứng gay gắt", "w": "bristle at"}, {"ex": "She was cast as the villain in the media.", "ipa": "/kɑːst æz/", "mean": "bị gán cho vai trò, hình ảnh nào đó", "pos": "cụm động từ", "vi": "bị coi là", "w": "cast as"}, {"ex": "The hapless tourists lost their luggage.", "ipa": "/ˈhæpləs/", "mean": "đáng thương, xui xẻo, bất lực", "pos": "tính từ", "vi": "đáng thương", "w": "hapless"}], "patterns": [{"ex": "Less rainfall means more droughts and fewer crops.", "exVi": "Mưa ít đi đồng nghĩa với nhiều hạn hán hơn và ít vụ mùa hơn.", "explain": "Dùng “mean” để nêu hệ quả của một thay đổi. Dùng fewer với danh từ đếm được số nhiều, less với danh từ không đếm được.", "formula": "Less + N (không đếm được) + means + more + N + and + fewer + N (đếm được)", "name": "Less/More X means more/fewer Y", "src": "Less sea ice means more accidents and fewer ice-loving animals to eat."}, {"ex": "Rice is as important to Vietnamese people as bread is to the French.", "exVi": "Cơm quan trọng với người Việt cũng như bánh mì quan trọng với người Pháp.", "explain": "So sánh tầm quan trọng của hai thứ đối với hai nhóm khác nhau, động từ ở vế sau được giữ lại (is).", "formula": "A is as important to X as B is to Y", "name": "So sánh tương đương mở rộng", "src": "it is as important to people's diet as thin-crust pizza is to New Yorkers"}, {"ex": "Of all the students, Lan is working the hardest.", "exVi": "Trong tất cả học sinh, Lan đang học chăm chỉ nhất.", "explain": "Mở đầu bằng “Of all...” để chỉ phạm vi so sánh, sau đó nêu nhóm nổi bật nhất. Trạng từ the most đứng cuối.", "formula": "Of all + N số nhiều, + the + N + is/are + V-ing + the most", "name": "So sánh nhất với “Of all...”", "src": "Of all northern peoples, the marine mammal-hunters ... are suffering the most from climate change."}, {"ex": "One room had a piano, another a large desk.", "exVi": "Một phòng có đàn piano, phòng khác có một cái bàn lớn.", "explain": "Ở vế sau lược bỏ động từ “had” vì đã xuất hiện ở vế trước, “yet another” nghĩa là “và một nhà khác nữa”.", "formula": "X had A, yet another (had) B", "name": "Lược bỏ động từ (ellipsis) trong liệt kê", "src": "Another driveway had two seals, yet another a massive walrus."}, {"ex": "He bristled at the notion of being treated like a child.", "exVi": "Anh ấy khó chịu trước ý nghĩ bị đối xử như một đứa trẻ.", "explain": "“the notion of” + danh động từ diễn tả ý nghĩ, khái niệm. Dạng bị động being cast as nhấn mạnh việc bị người khác gán cho hình ảnh nào đó.", "formula": "bristle at the notion of + being + V3/cast as + N", "name": "Bristle at the notion of + V-ing (bị động)", "src": "bristles at the notion of being cast as a hapless climate-change refugee"}], "hard": [{"mean": "Bếp và sân sau nhà chủ nhà treo đầy giàn thịt, cá phơi khô, còn trên lối vào có một con tuần lộc chết.", "parts": "Vế 1: chủ ngữ “My host's kitchen and backyard”, vị ngữ bị động “were festooned with racks of drying meat and fish”. Vế 2 (sau dấu chấm phẩy) đảo ngữ: trạng ngữ “in his driveway” + động từ “was” + chủ ngữ thật “a dead caribou”.", "s": "My host's kitchen and backyard were festooned with racks of drying meat and fish; in his driveway was a dead caribou."}, {"mean": "Băng ít đi cũng nghĩa là bờ biển bị xói mòn nhanh hơn do sóng và bão từ đại dương mở liên tục đập vào.", "parts": "Chủ ngữ “It” (băng biển ít đi); động từ “means”; tân ngữ “faster shoreline erosion”; cụm giới từ “from pounding by the waves and storms of the open ocean” chỉ nguyên nhân (pounding là danh động từ, “by the waves and storms” là tác nhân).", "s": "It means faster shoreline erosion from pounding by the waves and storms of the open ocean."}, {"mean": "Ngay cả ở các thị trấn ven biển, hầu như ai tôi gặp cũng khó chịu khi bị coi là người tị nạn khí hậu đáng thương.", "parts": "Trạng ngữ “even in coastal towns”; chủ ngữ “nearly everyone (that) I meet” (mệnh đề quan hệ lược that); vị ngữ “bristles at the notion of being cast as...”; “being cast as a hapless climate-change refugee” là danh động từ bị động.", "s": "But even in coastal towns, nearly everyone I meet bristles at the notion of being cast as a hapless climate-change refugee."}]}, {"n": 23, "date": "2026-10-28", "source": ["Even as they express frustration at having their lives damaged by people living thousands of miles away—and think it only fair that those damages be repatriated—they also point to their long history of adaptation and resilience in one of the world's most extreme environments. They are not sitting around idly in despair, or gazing forlornly out at the unfamiliar sea. They are buying boats, and organizing workshops, and setting about catching the fat salmon that are increasingly moving into their seas.", "There is more to this story than climate change. Later, we will discuss some profound demographic, political, and economic trends now under way that promise to be just as important to northerners' lives in the coming decades.", "Greenland's Fine Potatoes", "One of the more vivid media images of 2007 was one of happy Greenlanders ..."], "translation": ["Dù bày tỏ sự bức xúc khi cuộc sống của mình bị tổn hại bởi những người sống cách xa hàng nghìn dặm—và cho rằng chỉ công bằng khi những thiệt hại ấy được trả về lại nơi gây ra—họ cũng chỉ ra lịch sử thích nghi và bền bỉ lâu đời của mình trong một trong những môi trường khắc nghiệt nhất thế giới. Họ không ngồi không trong tuyệt vọng, hay buồn bã nhìn ra vùng biển xa lạ. Họ đang mua thuyền, tổ chức các buổi hội thảo, và bắt tay vào đánh bắt những con cá hồi béo ngày càng di chuyển vào vùng biển của họ.", "Câu chuyện này không chỉ có biến đổi khí hậu. Về sau, chúng ta sẽ bàn đến một số xu hướng sâu sắc về nhân khẩu, chính trị và kinh tế đang diễn ra, hứa hẹn sẽ quan trọng không kém đối với cuộc sống của người dân phương bắc trong những thập kỷ tới.", "Khoai tây ngon của Greenland", "Một trong những hình ảnh truyền thông sống động hơn của năm 2007 là hình ảnh những người Greenland vui vẻ ..."], "note": "repatriated: nghĩa đen là đưa trở về quê hương/nơi xuất xứ, ở đây dùng ẩn dụ là trả thiệt hại về cho người gây ra. northerners: người dân vùng phương bắc/Bắc Cực. Greenland: Greenland (Đảo Xanh), người Greenland là Greenlanders. fat salmon: cá hồi béo, chỉ cá hồi đang di cư lên vùng biển ấm dần.", "vocab": [], "patterns": [], "hard": []}, {"n": 24, "date": "2026-10-28", "source": ["...tending lush green potato fields against a backdrop of icebergs melting away into the ocean. The diminished sea ice was wreaking havoc on seal hunting—Greenland's finance and foreign affairs minister observed that subsistence hunting crashed by 75%—but people were beginning to plant potatoes, radishes, and broccoli. \"Farming, an occupation all but unheard of a century ago, has never looked better,\" trumpeted The Christian Science Monitor. By 2009 some fields were doing so well that Danish scientists started studying them, to learn why Greenland's potatoes were growing even better than southern ones.", "What could be a more iconic symbol of the world in 2050 than seal hunters turned farmers in one of the coldest places on Earth? But in terms of sheer caloric output, any climate-triggered boons to agriculture will not be realized on the narrow, rocky shores of Greenland, or indeed any other place in the Arctic. Similarly to what we saw for certain wild or..."], "translation": ["...chăm sóc những cánh đồng khoai tây xanh mướt trên nền những tảng băng trôi đang tan chảy ra đại dương. Lớp băng biển suy giảm đang gây tai họa cho việc săn hải cẩu—bộ trưởng tài chính và ngoại giao của Greenland nhận xét rằng hoạt động săn bắt để mưu sinh đã sụt giảm tới 75%—nhưng người dân bắt đầu trồng khoai tây, củ cải và súp lơ xanh. Tờ The Christian Science Monitor hồ hởi viết: \"Nghề nông, một nghề gần như chưa từng nghe đến cách đây một thế kỷ, chưa bao giờ trông khởi sắc đến thế.\" Đến năm 2009, một số cánh đồng phát triển tốt đến mức các nhà khoa học Đan Mạch bắt đầu nghiên cứu chúng, để tìm hiểu vì sao khoai tây của Greenland lại mọc còn tốt hơn khoai tây ở những vùng phía nam.", "Còn hình ảnh nào mang tính biểu tượng hơn cho thế giới năm 2050 so với những người săn hải cẩu hóa thành nông dân ở một trong những nơi lạnh nhất trên Trái Đất? Thế nhưng xét về sản lượng calo thuần túy, những lợi ích mà khí hậu mang lại cho nông nghiệp sẽ không thể thành hiện thực trên những bờ biển hẹp và đầy đá của Greenland, hay thật ra là bất cứ nơi nào khác ở Bắc Cực. Tương tự những gì ta đã thấy ở một số loài hoang dã..."], "note": "Greenland: vùng lãnh thổ tự trị thuộc Đan Mạch (thường đọc là Greenland hoặc Grơn-len). \"Subsistence hunting\": săn bắt để mưu sinh. \"The Christian Science Monitor\": tên một tờ báo Mỹ, giữ nguyên. \"Boons\": những điều có lợi, lợi ích. \"Caloric output\": sản lượng calo (lượng năng lượng thực phẩm tạo ra). Câu cuối bị cắt giữa chừng (\"wild or...\" có thể là \"wild organisms\" hay tương tự).", "vocab": [{"ex": "She spends her mornings tending the garden.", "ipa": "/ˈtendɪŋ/", "mean": "chăm sóc, trông nom (cây trồng, đồng ruộng)", "pos": "động từ (tend)", "vi": "chăm sóc", "w": "tending"}, {"ex": "The valley is lush after the rainy season.", "ipa": "/lʌʃ/", "mean": "xanh tươi, um tùm, tốt tươi", "pos": "tính từ", "vi": "xanh mướt", "w": "lush"}, {"ex": "The mountains formed a stunning backdrop to the wedding.", "ipa": "/ˈbækdrɒp/", "mean": "phông nền, bối cảnh phía sau", "pos": "danh từ", "vi": "trên nền", "w": "backdrop"}, {"ex": "Her diminished role made her consider leaving the company.", "ipa": "/dɪˈmɪnɪʃt/", "mean": "suy giảm, thu hẹp", "pos": "tính từ", "vi": "suy giảm", "w": "diminished"}, {"ex": "The storm wreaked havoc on the coastal towns.", "ipa": "/riːk ˈhævək/", "mean": "gây tàn phá, gây hỗn loạn nghiêm trọng", "pos": "thành ngữ (động từ + danh từ)", "vi": "gây tai họa", "w": "wreak havoc"}, {"ex": "Many families rely on subsistence farming.", "ipa": "/səbˈsɪstəns/", "mean": "sự mưu sinh, chỉ đủ sống", "pos": "danh từ / tính từ", "vi": "để mưu sinh", "w": "subsistence"}, {"ex": "The old tradition has all but disappeared.", "ipa": "/ɔːl bʌt/", "mean": "gần như, hầu như", "pos": "cụm trạng từ", "vi": "gần như", "w": "all but"}, {"ex": "The company trumpeted its record profits.", "ipa": "/ˈtrʌmpɪt/", "mean": "khoe khoang, tuyên bố rầm rộ", "pos": "động từ", "vi": "hồ hởi viết", "w": "trumpet"}, {"ex": "The Eiffel Tower is an iconic landmark.", "ipa": "/aɪˈkɒnɪk/", "mean": "mang tính biểu tượng", "pos": "tính từ", "vi": "mang tính biểu tượng", "w": "iconic"}, {"ex": "The sheer size of the project surprised us.", "ipa": "/ʃɪə/", "mean": "thuần túy, tuyệt đối", "pos": "tính từ", "vi": "thuần túy", "w": "sheer"}, {"ex": "The new road was a boon to local businesses.", "ipa": "/buːn/", "mean": "lợi ích, điều may mắn", "pos": "danh từ", "vi": "lợi ích", "w": "boon"}, {"ex": "The policy triggered a wave of protests.", "ipa": "/ˈtrɪɡəd/", "mean": "do ... gây ra, kích hoạt", "pos": "tính từ (quá khứ phân từ của trigger)", "vi": "mà khí hậu mang lại", "w": "triggered"}], "patterns": [{"ex": "She stood on the beach watching the sun setting over the sea.", "exVi": "Cô ấy đứng trên bãi biển, ngắm mặt trời lặn trên biển.", "explain": "Cụm V-ing bổ sung hành động đồng thời hoặc mô tả người/vật; 'melting away' bổ nghĩa cho 'icebergs'.", "formula": "V-ing + tân ngữ + (against/with...)", "name": "Phân từ hiện tại làm trạng ngữ/định ngữ", "src": "...tending lush green potato fields against a backdrop of icebergs melting away into the ocean."}, {"ex": "Hanoi, the capital of Vietnam, is famous for its street food.", "exVi": "Hà Nội, thủ đô của Việt Nam, nổi tiếng với ẩm thực đường phố.", "explain": "Cụm đặt giữa hai dấu phẩy giải thích thêm cho danh từ đứng trước.", "formula": "Danh từ, + cụm danh từ giải thích, + động từ", "name": "Đồng vị ngữ (apposition)", "src": "\"Farming, an occupation all but unheard of a century ago, has never looked better,\""}, {"ex": "What could be a better gift than a handwritten letter?", "exVi": "Còn món quà nào tuyệt hơn một bức thư viết tay?", "explain": "Câu hỏi tu từ ngụ ý: không có gì biểu tượng hơn. Dùng để nhấn mạnh.", "formula": "What could be a more + adj + N than ...?", "name": "So sánh nhất kiểu câu hỏi tu từ", "src": "What could be a more iconic symbol of the world in 2050 than seal hunters turned farmers...?"}, {"ex": "This year's harvest was even bigger than we expected.", "exVi": "Vụ thu hoạch năm nay còn lớn hơn cả chúng tôi mong đợi.", "explain": "'Even' nhấn mạnh mức độ hơn của so sánh, mang ý bất ngờ.", "formula": "S + V + even + adj-er + than ...", "name": "Cấu trúc ngạc nhiên/so sánh: even + so sánh hơn", "src": "...why Greenland's potatoes were growing even better than southern ones."}], "hard": [{"mean": "Xét về lượng calo thực tế, những lợi ích mà biến đổi khí hậu mang lại cho nông nghiệp sẽ không đạt được ở Greenland hay bất kỳ nơi nào khác ở Bắc Cực.", "parts": "Trạng ngữ: 'in terms of sheer caloric output' (xét về sản lượng calo thuần túy). Chủ ngữ: 'any climate-triggered boons to agriculture'. Vị ngữ bị động: 'will not be realized'. Trạng ngữ nơi chốn: 'on the narrow, rocky shores of Greenland, or indeed any other place in the Arctic'.", "s": "But in terms of sheer caloric output, any climate-triggered boons to agriculture will not be realized on the narrow, rocky shores of Greenland, or indeed any other place in the Arctic."}, {"mean": "Đến năm 2009, một số cánh đồng tốt đến mức các nhà khoa học Đan Mạch bắt đầu nghiên cứu để hiểu vì sao khoai tây Greenland mọc tốt hơn cả khoai tây ở phía nam.", "parts": "Mệnh đề chính: 'some fields were doing so well'. Mệnh đề kết quả: 'that Danish scientists started studying them' (so...that). Trạng ngữ mục đích: 'to learn why...'. Mệnh đề danh từ: 'why Greenland's potatoes were growing even better than southern ones' ('ones' thay cho 'potatoes').", "s": "By 2009 some fields were doing so well that Danish scientists started studying them, to learn why Greenland's potatoes were growing even better than southern ones."}], "insight": "Trang sách dùng hình ảnh nghịch lý: người săn hải cẩu ở Greenland thành nông dân trồng khoai tây giữa những tảng băng đang tan. Tác giả gọi đó là biểu tượng của thế giới năm 2050 vì nó cho thấy biến đổi khí hậu vừa phá vỡ lối sống cũ (săn bắt mưu sinh giảm 75% do băng biển thu hẹp) vừa mở ra cơ hội mới. Giọng văn có chút mỉa mai nhẹ: câu trích của The Christian Science Monitor (\"hồ hởi\") và câu hỏi tu từ \"còn hình ảnh nào biểu tượng hơn\" tạo cảm giác tin vui, để rồi chuyển hướng bằng chữ \"Thế nhưng\".\n\nLập luận cốt lõi nằm ở đoạn thứ hai: câu chuyện khoai tây Greenland hấp dẫn nhưng chỉ là hiện tượng cục bộ. Xét về tổng sản lượng calo, vùng Bắc Cực có đất hẹp, nhiều đá, nên không thể bù đắp cho những vùng nông nghiệp lớn có thể bị thiệt hại. Cụm \"sheer caloric output\" (sản lượng calo thuần túy) nhắc rằng điều quan trọng với an ninh lương thực là quy mô, không phải tính mới lạ. Đây cũng là cách đọc đáng nhớ với cả cuốn sách: những \"người thắng\" cục bộ của khí hậu ấm lên thường nổi bật trên báo chí, nhưng không làm thay đổi bức tranh toàn cầu. Cụm \"boons to agriculture\" (lợi ích cho nông nghiệp) cũng đáng học, vì \"boon\" nghĩa là điều may mắn, ơn huệ.", "insightDone": true}, {"n": 25, "date": "2026-10-28", "source": ["...ganisms, the pressure is a gradient from south to north, not a leap to the top of the planet. Summers there will always be brief, and its soils thin or nonexistent. A short-lived vegetable garden is one thing, but when it comes to producing major crops for global markets, any significant increases will be realized at the northern margins of present-day agriculture. There will be no amber fields of grain waving along the shores of the Arctic Ocean.", "In 2007 I watched some of the world's top agronomists and plant geneticists debate how best to save our temperate crops from the rising heat, droughts, and pathogens forecast for the coming decades. Their solution was part biotech—genetic modifications, for example—and part ancient practice: Move over, water-guzzling corn, here come the best drought-tolerant sorghums and millets . . . from Ethiopia! Without adaptation, the group concluded, the prospect of..."], "translation": ["...sinh vật, áp lực này là một gradient chạy từ nam lên bắc, chứ không phải một bước nhảy vọt lên tận đỉnh hành tinh. Mùa hè ở đó sẽ luôn ngắn ngủi, còn đất thì mỏng hoặc không có. Một vườn rau ngắn ngày là một chuyện, nhưng nói đến việc sản xuất các loại cây trồng chủ lực cho thị trường toàn cầu, thì mọi mức tăng đáng kể sẽ chỉ xảy ra ở rìa phía bắc của nền nông nghiệp hiện nay. Sẽ không có những cánh đồng ngũ cốc vàng óng lượn sóng dọc theo bờ Bắc Băng Dương.", "Năm 2007, tôi đã chứng kiến một số nhà nông học và nhà di truyền học thực vật hàng đầu thế giới tranh luận về cách tốt nhất để cứu các loại cây trồng ôn đới khỏi nắng nóng ngày một gia tăng, hạn hán và mầm bệnh được dự báo cho những thập niên tới. Giải pháp của họ một phần là công nghệ sinh học—chẳng hạn như biến đổi gen—và một phần là tập quán cổ xưa: Ngô ngốn nước hãy tránh sang một bên, những giống cao lương và kê chịu hạn tốt nhất đang đến đây... từ Ethiopia! Nhóm kết luận rằng nếu không thích nghi, viễn cảnh về..."], "note": "gradient: độ dốc/biến thiên dần dần (giữ nguyên từ \"gradient\" cho sát văn bản). agronomist: nhà nông học. temperate crops: cây trồng vùng ôn đới. sorghum: cao lương; millet: kê. \"Move over, ...\" là cách nói thân mật, ý là \"tránh chỗ cho cái mới\".", "vocab": [{"ex": "There is a temperature gradient from the coast to the mountains.", "ipa": "/ˈɡreɪ.di.ənt/", "mean": "độ dốc, sự biến thiên dần dần theo một hướng", "pos": "danh từ", "vi": "gradient", "w": "gradient"}, {"ex": "The company made a huge leap in sales last year.", "ipa": "/liːp/", "mean": "bước nhảy vọt, sự thay đổi đột ngột", "pos": "danh từ", "vi": "bước nhảy vọt", "w": "leap"}, {"ex": "Farms at the margin of the desert often fail.", "ipa": "/ˈmɑː.dʒɪn/", "mean": "rìa, ranh giới ngoài cùng của một vùng", "pos": "danh từ", "vi": "rìa", "w": "margin"}, {"ex": "The amber light of sunset covered the hills.", "ipa": "/ˈæm.bər/", "mean": "vàng óng (màu hổ phách)", "pos": "tính từ", "vi": "vàng óng", "w": "amber"}, {"ex": "An agronomist advised the farmers on soil care.", "ipa": "/əˈɡrɒn.ə.mɪst/", "mean": "nhà nông học", "pos": "danh từ", "vi": "nhà nông học", "w": "agronomist"}, {"ex": "The geneticist studied how plants resist disease.", "ipa": "/dʒəˈnet.ɪ.sɪst/", "mean": "nhà di truyền học", "pos": "danh từ", "vi": "nhà di truyền học", "w": "geneticist"}, {"ex": "Apples grow well in temperate regions.", "ipa": "/ˈtem.pər.ət/", "mean": "ôn đới, khí hậu ôn hòa", "pos": "tính từ", "vi": "ôn đới", "w": "temperate"}, {"ex": "This pathogen destroys wheat crops.", "ipa": "/ˈpæθ.ə.dʒən/", "mean": "mầm bệnh, tác nhân gây bệnh", "pos": "danh từ", "vi": "mầm bệnh", "w": "pathogen"}, {"ex": "Water-guzzling crops are risky in dry regions.", "ipa": "/ˈwɔː.tər ˌɡʌz.lɪŋ/", "mean": "ngốn nhiều nước", "pos": "tính từ", "vi": "ngốn nước", "w": "water-guzzling"}, {"ex": "Farmers are switching to drought-tolerant varieties.", "ipa": "/ˈdraʊt ˌtɒl.ər.ənt/", "mean": "chịu hạn tốt", "pos": "tính từ", "vi": "chịu hạn", "w": "drought-tolerant"}, {"ex": "Sorghum is a staple food in parts of Africa.", "ipa": "/ˈsɔː.ɡəm/", "mean": "cao lương, một loại ngũ cốc chịu hạn", "pos": "danh từ", "vi": "cao lương", "w": "sorghum"}, {"ex": "Millet can grow with very little rain.", "ipa": "/ˈmɪl.ɪt/", "mean": "kê, hạt ngũ cốc nhỏ chịu hạn", "pos": "danh từ", "vi": "kê", "w": "millet"}], "patterns": [{"ex": "The change is a slow process, not a sudden event.", "exVi": "Sự thay đổi là một quá trình chậm, không phải một sự kiện đột ngột.", "explain": "Dùng để nêu đúng bản chất của sự việc và loại bỏ cách hiểu sai.", "formula": "X is A, not B", "name": "Không phải A mà là B (phủ định đối lập)", "src": "the pressure is a gradient from south to north, not a leap to the top of the planet"}, {"ex": "Cooking for yourself is one thing, but when it comes to feeding a hundred guests, you need a plan.", "exVi": "Nấu cho mình là một chuyện, nhưng nói đến việc nuôi một trăm khách thì cần có kế hoạch.", "explain": "Đối lập hai mức độ: A thì có thể, nhưng B thì khác hẳn.", "formula": "A is one thing, but when it comes to B, ...", "name": "A là một chuyện, B là chuyện khác", "src": "A short-lived vegetable garden is one thing, but when it comes to producing major crops for global markets, ..."}, {"ex": "Move over, coal, here comes solar power.", "exVi": "Than đá hãy tránh sang một bên, năng lượng mặt trời đến rồi.", "explain": "Cách nói thân mật, vui, báo hiệu cái mới thay thế cái cũ; here come + chủ ngữ đảo sau.", "formula": "Move over, X, here come Y", "name": "Đảo ngữ với trạng từ chỉ nơi chốn / câu cảm thán", "src": "Move over, water-guzzling corn, here come the best drought-tolerant sorghums and millets"}, {"ex": "The storms forecast for tomorrow may close the port.", "exVi": "Những cơn bão được dự báo cho ngày mai có thể làm đóng cửa cảng.", "explain": "Quá khứ phân từ 'forecast' làm định ngữ rút gọn (= that are forecast).", "formula": "N + forecast for + thời gian", "name": "Cấu trúc bị động với động từ dự báo", "src": "rising heat, droughts, and pathogens forecast for the coming decades"}], "hard": [{"mean": "Trồng một vườn rau ngắn ngày ở vùng cực thì được, nhưng với cây trồng chủ lực cho thị trường toàn cầu, sản lượng chỉ tăng đáng kể ở rìa phía bắc của vùng nông nghiệp hiện nay.", "parts": "Vế 1: A short-lived vegetable garden is one thing (chủ ngữ: vườn rau ngắn ngày; vị ngữ: là một chuyện). Vế 2 (sau 'but'): when it comes to producing major crops for global markets (trạng ngữ chỉ phạm vi), any significant increases (chủ ngữ) will be realized (vị ngữ bị động) at the northern margins of present-day agriculture (trạng ngữ nơi chốn).", "s": "A short-lived vegetable garden is one thing, but when it comes to producing major crops for global markets, any significant increases will be realized at the northern margins of present-day agriculture."}, {"mean": "Giải pháp của họ một nửa là công nghệ sinh học, một nửa là kinh nghiệm cổ xưa: bỏ ngô tốn nước đi, thay bằng cao lương và kê chịu hạn từ Ethiopia.", "parts": "Chủ ngữ: Their solution. Vị ngữ: was part biotech and part ancient practice (một phần... một phần...). Phần chen giữa gạch ngang: ví dụ minh họa. Sau dấu hai chấm: câu giải thích bằng giọng khẩu ngữ, có đảo ngữ 'here come + chủ ngữ'.", "s": "Their solution was part biotech—genetic modifications, for example—and part ancient practice: Move over, water-guzzling corn, here come the best drought-tolerant sorghums and millets . . . from Ethiopia!"}], "insight": "Tác giả bác bỏ một giả định phổ biến: khi khí hậu ấm lên thì vùng Bắc Cực sẽ trở thành vựa lúa mới. Lập luận của ông là nhiệt độ chỉ là một yếu tố. Mùa hè ngắn và đất mỏng hoặc gần như không có (đất đóng băng vĩnh cửu, ít chất hữu cơ) vẫn là giới hạn cứng. Vì vậy, vành đai canh tác chỉ dịch dần lên phía bắc theo kiểu \"gradient\" (thay đổi từ từ), không nhảy vọt. Hình ảnh \"cánh đồng ngũ cốc vàng óng bên Bắc Băng Dương\" được dùng với giọng mỉa mai nhẹ để gạt đi viễn cảnh quá lạc quan ấy. Cũng nên để ý sự phân biệt giữa \"vườn rau ngắn ngày\" (trồng được ở quy mô nhỏ) và cây trồng chủ lực cho thị trường toàn cầu (cần diện tích, đất và mùa vụ ổn định).\n\nĐoạn sau chuyển sang hướng giải quyết: thay vì tìm đất mới, hãy làm cho cây trồng thích nghi. Giọng điệu hơi hài hước ở câu \"Move over, water-guzzling corn\" (\"tránh sang một bên nào, ngô ngốn nước\") cho thấy sự đảo vai: các loại cây truyền thống như cao lương và kê, vốn chịu hạn tốt và gắn với nông nghiệp châu Phi, có thể thay thế cây ôn đới quen thuộc. Điều đáng suy ngẫm là giải pháp kết hợp công nghệ hiện đại (biến đổi gen) với tri thức cổ xưa, và việc thích nghi quan trọng hơn là hy vọng thiên nhiên tự \"bù đắp\" cho biến đổi khí hậu.", "insightDone": true}, {"n": 26, "date": "2026-10-28", "source": ["food insecurity in the low latitudes was a serious threat.", "I was particularly impressed with presentations by Stanford University's Dave Lobell and Marshall Burke, who used twenty different climate models to statistically map where the food insecurities were most likely to emerge. Apparently, by the year 2030 South Asia, Southeast Asia, and southern Africa are especially vulnerable. By 2050, agricultural projections for sub-Saharan Africa get even worse, with average crop production losses of −22, −17, −17, −18, and −8% for corn, sorghum, millet, groundnut, and cassava, respectively. By century's end, things become still rougher, with one study concluding it is more than 90% likely that future growing season temperatures in the tropics and subtropics will exceed anything we've ever seen before, with bad implications for food crops. \"With growing season temperatures in excess of the hottest years on record . . . the stress on crops and live..."], "translation": ["...tình trạng mất an ninh lương thực ở các vĩ độ thấp là một mối đe dọa nghiêm trọng.", "Tôi đặc biệt ấn tượng với các bài thuyết trình của Dave Lobell và Marshall Burke thuộc Đại học Stanford. Họ đã dùng hai mươi mô hình khí hậu khác nhau để lập bản đồ thống kê về những nơi mà tình trạng mất an ninh lương thực có khả năng xuất hiện nhiều nhất. Theo đó, đến năm 2030, Nam Á, Đông Nam Á và miền nam châu Phi đặc biệt dễ bị tổn thương. Đến năm 2050, các dự báo nông nghiệp cho châu Phi cận Sahara còn tồi tệ hơn, với mức thiệt hại sản lượng trung bình là −22, −17, −17, −18 và −8% lần lượt đối với ngô, cao lương, kê, lạc và sắn. Đến cuối thế kỷ, mọi thứ còn khó khăn hơn nữa: một nghiên cứu kết luận rằng có hơn 90% khả năng nhiệt độ trong mùa sinh trưởng ở vùng nhiệt đới và cận nhiệt đới trong tương lai sẽ vượt quá bất cứ mức nào ta từng thấy, kéo theo những hệ lụy xấu cho cây lương thực. \"Khi nhiệt độ mùa sinh trưởng vượt quá cả những năm nóng nhất từng được ghi nhận... áp lực lên cây trồng và vật nuôi...\""], "note": "food insecurity: tình trạng mất an ninh lương thực (không đủ lương thực ổn định). low latitudes: các vĩ độ thấp (gần xích đạo, vùng nhiệt đới). sorghum: cao lương; millet: kê; groundnut: lạc (đậu phộng); cassava: sắn (khoai mì). sub-Saharan Africa: châu Phi cận Sahara. Dave Lobell, Marshall Burke: các nhà nghiên cứu ở Stanford. \"live-\" ở cuối trang là chữ bị ngắt dòng, có thể là \"livestock\" (vật nuôi, gia súc).", "vocab": [{"ex": "Food insecurity affects millions of families in rural areas.", "ipa": "/fuːd ˌɪnsɪˈkjʊərəti/", "mean": "tình trạng không bảo đảm đủ lương thực", "pos": "cụm danh từ (học thuật)", "vi": "tình trạng mất an ninh lương thực", "w": "food insecurity"}, {"ex": "Countries at low latitudes are usually hot all year.", "ipa": "/ˈlætɪtjuːd/", "mean": "vĩ độ", "pos": "danh từ", "vi": "vĩ độ thấp", "w": "latitude"}, {"ex": "The difference is statistically significant.", "ipa": "/stəˈtɪstɪkli/", "mean": "một cách thống kê, dựa trên số liệu", "pos": "trạng từ", "vi": "thống kê", "w": "statistically"}, {"ex": "New problems may emerge during the project.", "ipa": "/ɪˈmɜːdʒ/", "mean": "xuất hiện, nổi lên", "pos": "động từ", "vi": "xuất hiện", "w": "emerge"}, {"ex": "Small farmers are vulnerable to droughts.", "ipa": "/ˈvʌlnərəbl/", "mean": "dễ bị tổn thương, dễ chịu tác động xấu", "pos": "tính từ", "vi": "dễ bị tổn thương", "w": "vulnerable"}, {"ex": "The projection shows a rise in sea level.", "ipa": "/prəˈdʒekʃn/", "mean": "dự báo (dựa trên mô hình, số liệu)", "pos": "danh từ", "vi": "dự báo", "w": "projection"}, {"ex": "Sub-Saharan Africa has a fast-growing population.", "ipa": "/ˌsʌb səˈhɑːrən/", "mean": "thuộc vùng cận Sahara (phía nam sa mạc Sahara)", "pos": "tính từ", "vi": "cận Sahara", "w": "sub-Saharan"}, {"ex": "Sorghum grows well in dry soil.", "ipa": "/ˈsɔːrɡəm/", "mean": "cao lương (cây ngũ cốc chịu hạn)", "pos": "danh từ", "vi": "cao lương", "w": "sorghum"}, {"ex": "Cassava is a staple food in many tropical countries.", "ipa": "/kəˈsɑːvə/", "mean": "sắn (khoai mì)", "pos": "danh từ", "vi": "sắn", "w": "cassava"}, {"ex": "Anna and Tom are 20 and 25, respectively.", "ipa": "/rɪˈspektɪvli/", "mean": "lần lượt, theo thứ tự tương ứng", "pos": "trạng từ", "vi": "lần lượt", "w": "respectively"}, {"ex": "Citrus fruits grow well in the subtropics.", "ipa": "/ˌsʌbˈtrɒpɪks/", "mean": "vùng cận nhiệt đới", "pos": "danh từ (thường số nhiều)", "vi": "cận nhiệt đới", "w": "subtropics"}, {"ex": "Costs must not exceed the budget.", "ipa": "/ɪkˈsiːd/", "mean": "vượt quá", "pos": "động từ", "vi": "vượt quá", "w": "exceed"}], "patterns": [{"ex": "After midnight, the weather became still colder.", "exVi": "Sau nửa đêm, thời tiết trở nên còn lạnh hơn nữa.", "explain": "Dùng even/still để nhấn mạnh tình hình ngày càng tệ hơn so với mốc trước.", "formula": "get/become + so sánh hơn (even/still + adj-er/more adj)", "name": "Cấu trúc so sánh hơn kép với get/become", "src": "agricultural projections for sub-Saharan Africa get even worse"}, {"ex": "I met Dr. Lan, who studies marine biology.", "exVi": "Tôi đã gặp tiến sĩ Lan, người nghiên cứu sinh học biển.", "explain": "Mệnh đề who bổ sung thông tin về người được nhắc đến, tách bằng dấu phẩy.", "formula": "Danh từ chỉ người, who + V ... (bổ sung thông tin)", "name": "Mệnh đề quan hệ không xác định (who)", "src": "presentations by Stanford University's Dave Lobell and Marshall Burke, who used twenty different climate models"}, {"ex": "The city grew fast, with traffic getting worse every year.", "exVi": "Thành phố phát triển nhanh, kéo theo giao thông ngày một tệ hơn.", "explain": "With + cụm danh từ thêm thông tin về hệ quả hoặc tình huống đi kèm câu chính.", "formula": "..., with + N + (adj/V-ing/giới từ)", "name": "Mệnh đề phân từ chỉ kết quả: with + danh từ", "src": "with bad implications for food crops"}, {"ex": "It is 80% likely that the exam will be postponed.", "exVi": "Có đến 80% khả năng kỳ thi sẽ bị hoãn.", "explain": "Diễn đạt xác suất bằng phần trăm một cách học thuật.", "formula": "it is more than X% likely that + S + V", "name": "Likely + to-V / more than X% likely that", "src": "it is more than 90% likely that future growing season temperatures ... will exceed"}], "hard": [{"mean": "Đến năm 2050, dự báo nông nghiệp cho châu Phi cận Sahara còn xấu hơn, với mức giảm sản lượng trung bình lần lượt là 22%, 17%, 17%, 18% và 8% cho ngô, cao lương, kê, lạc và sắn.", "parts": "Trạng ngữ: By 2050. Chủ ngữ: agricultural projections for sub-Saharan Africa. Vị ngữ: get even worse. Cụm with: with average crop production losses of ... (giải thích mức độ tệ hơn). Cuối câu: for ... respectively (đối chiếu từng con số với từng loại cây theo thứ tự).", "s": "By 2050, agricultural projections for sub-Saharan Africa get even worse, with average crop production losses of −22, −17, −17, −18, and −8% for corn, sorghum, millet, groundnut, and cassava, respectively."}, {"mean": "Đến cuối thế kỷ, tình hình còn khó khăn hơn, khi một nghiên cứu kết luận rằng hơn 90% khả năng nhiệt độ mùa sinh trưởng ở vùng nhiệt đới và cận nhiệt đới sẽ vượt mọi mức từng thấy, gây hệ lụy xấu cho cây lương thực.", "parts": "Trạng ngữ: By century's end. Mệnh đề chính: things become still rougher. Cụm with 1: with one study concluding ... (nêu bằng chứng). Mệnh đề that: it is more than 90% likely that ... will exceed anything (chủ ngữ: future growing season temperatures; anything we've ever seen before là mệnh đề quan hệ rút gọn that). Cụm with 2: with bad implications for food crops (hệ quả).", "s": "By century's end, things become still rougher, with one study concluding it is more than 90% likely that future growing season temperatures in the tropics and subtropics will exceed anything we've ever seen before, with bad implications for food crops."}], "insight": "Tác giả muốn cho thấy biến đổi khí hậu không chỉ là chuyện nhiệt độ tăng mà sẽ biến thành khủng hoảng lương thực, và khủng hoảng ấy tập trung ở những vùng nhiệt đới vốn đã nghèo, dễ tổn thương. Lập luận đi theo ba mốc thời gian (2030, 2050, cuối thế kỷ) với mức độ xấu dần: từ việc xác định vùng rủi ro, đến con số thiệt hại cụ thể cho từng loại cây, rồi đến kết luận rằng nhiệt độ sẽ vượt xa mọi mức đã ghi nhận. Việc dùng nhiều mô hình khí hậu (hai mươi mô hình) là để tăng độ tin cậy: nếu nhiều mô hình độc lập cùng chỉ ra một xu hướng thì kết luận vững hơn nhiều so với dựa vào một mô hình.\n\nVài điều nên biết: \"vĩ độ thấp\" là vùng gần xích đạo (nhiệt đới và cận nhiệt đới); \"châu Phi cận Sahara\" là phần châu Phi phía nam sa mạc Sahara; \"mùa sinh trưởng\" là khoảng thời gian trong năm cây trồng phát triển được. Ngô, cao lương, kê, lạc và sắn là những cây lương thực chủ lực ở đó, nhiều gia đình nông dân sống nhờ vào chúng, nên mức giảm 17–22% có thể tác động trực tiếp đến bữa ăn và thu nhập. Cụm \"hơn 90% khả năng\" là cách nói xác suất của khoa học: không phải chắc chắn tuyệt đối, nhưng là mức rất cao. Điều đáng suy ngẫm là những nơi chịu thiệt nhiều nhất lại thường là nơi góp ít nhất vào lượng khí thải, và điều này gắn với chủ đề chung của cuốn sách về việc những xu hướng hiện nay sẽ định hình một thế giới rất khác vào năm 2050.", "insightDone": true}, {"n": 27, "date": "2026-10-28", "source": ["...stock will become global in character,\" wrote the paper's authors. \"Ignoring climate projections at this stage will only result in the worst form of triage.\"", "In contrast to these studies, a broad pattern of rising crop yields in Canada, some northern U.S. states, southern Scandinavia, the United Kingdom, and parts of Russia have been repeatedly demonstrated by climate-change model simulations for years. Already these countries are major producers of wheat, barley, rye, rapeseed, and potatoes. As early as 1990 it was apparent that regardless of what climate model was used, the northern U.S. states of Michigan, Minnesota, and Wisconsin would likely benefit from rising average temperatures, even if corn, wheat, and soybean production in the rest of the country declined. Similar north-south asymmetries in crop yield (with gains in the north and declines in the south) were later demonstrated for Europe and Russia. The general idea is that in the marginal..."], "translation": ["...nguồn dự trữ sẽ mang tính toàn cầu\", các tác giả của bài báo viết. \"Nếu lúc này mà làm ngơ các dự báo khí hậu thì kết cục chỉ là hình thức phân loại ưu tiên tồi tệ nhất.\"", "Trái với những nghiên cứu trên, các mô phỏng mô hình biến đổi khí hậu suốt nhiều năm qua đã nhiều lần cho thấy một xu hướng chung là năng suất cây trồng tăng ở Canada, một số bang phía bắc nước Mỹ, miền nam Scandinavia, Vương quốc Anh và một số vùng của Nga. Các quốc gia này vốn đã là những nhà sản xuất lớn về lúa mì, đại mạch, lúa mạch đen, hạt cải dầu và khoai tây. Ngay từ năm 1990, người ta đã thấy rõ rằng dù dùng mô hình khí hậu nào, các bang phía bắc nước Mỹ như Michigan, Minnesota và Wisconsin cũng nhiều khả năng được hưởng lợi từ nhiệt độ trung bình tăng, kể cả khi sản lượng ngô, lúa mì và đậu tương ở phần còn lại của nước Mỹ sụt giảm. Sự bất đối xứng bắc-nam tương tự về năng suất cây trồng (miền bắc tăng, miền nam giảm) sau đó cũng được chứng minh đối với châu Âu và Nga. Ý tưởng chung là ở những vùng biên..."], "note": "Triage: vốn là thuật ngữ y tế (phân loại bệnh nhân theo mức độ khẩn cấp để quyết định ưu tiên cứu chữa), ở đây dùng ẩn dụ cho việc buộc phải chọn cái gì được cứu, cái gì bỏ. \"Stock\" ở câu đầu bị cắt từ trang trước nên chưa rõ nghĩa chính xác (có thể là nguồn dự trữ/giống cây trồng). Rapeseed: hạt cải dầu. Barley: đại mạch. Rye: lúa mạch đen. Marginal: biên, tức những vùng điều kiện canh tác vốn ở ngưỡng giới hạn.", "vocab": [{"ex": "Hospitals used triage to decide which patients to treat first.", "ipa": "/ˈtriːɑːʒ/", "mean": "phân loại ưu tiên (khi nguồn lực hạn chế, phải chọn cứu cái nào trước)", "pos": "danh từ", "vi": "phân loại ưu tiên", "w": "triage"}, {"ex": "The country keeps a large stock of grain for emergencies.", "ipa": "/stɒk/", "mean": "nguồn dự trữ (ở đây là nguồn giống/vốn gen cây trồng)", "pos": "danh từ", "vi": "nguồn dự trữ", "w": "stock"}, {"ex": "The projection shows sea levels rising by 2050.", "ipa": "/prəˈdʒekʃn/", "mean": "dự báo, ước tính dựa trên dữ liệu", "pos": "danh từ", "vi": "dự báo", "w": "projection"}, {"ex": "In contrast to his brother, he prefers quiet places.", "ipa": "/ɪn ˈkɒntrɑːst tuː/", "mean": "trái với, khác với", "pos": "cụm giới từ", "vi": "Trái với", "w": "in contrast to"}, {"ex": "The simulation predicted a drier summer.", "ipa": "/ˌsɪmjuˈleɪʃn/", "mean": "mô phỏng (bằng máy tính)", "pos": "danh từ", "vi": "mô phỏng", "w": "simulation"}, {"ex": "The experiment demonstrated that the method works.", "ipa": "/ˈdemənstreɪt/", "mean": "chứng minh, cho thấy rõ", "pos": "động từ", "vi": "cho thấy", "w": "demonstrate"}, {"ex": "Rapeseed oil is common in European cooking.", "ipa": "/ˈreɪpsiːd/", "mean": "hạt cải dầu (cây lấy dầu)", "pos": "danh từ", "vi": "hạt cải dầu", "w": "rapeseed"}, {"ex": "Rye bread is popular in Northern Europe.", "ipa": "/raɪ/", "mean": "lúa mạch đen", "pos": "danh từ", "vi": "lúa mạch đen", "w": "rye"}, {"ex": "Regardless of the weather, the match will go ahead.", "ipa": "/rɪˈɡɑːdləs əv/", "mean": "bất kể, dù là", "pos": "cụm giới từ", "vi": "dù dùng mô hình khí hậu nào", "w": "regardless of"}, {"ex": "There is an asymmetry in how the two regions are affected.", "ipa": "/eɪˈsɪmətri/", "mean": "sự bất đối xứng, sự chênh lệch không đều", "pos": "danh từ", "vi": "bất đối xứng", "w": "asymmetry"}, {"ex": "Farming on marginal land is risky.", "ipa": "/ˈmɑːdʒɪnl/", "mean": "biên, ở ngưỡng giới hạn (đất/vùng chỉ vừa đủ để trồng trọt)", "pos": "tính từ", "vi": "vùng biên", "w": "marginal"}, {"ex": "Many farmers could benefit from longer growing seasons.", "ipa": "/ˈbenɪfɪt frɒm/", "mean": "được hưởng lợi từ", "pos": "cụm động từ", "vi": "được hưởng lợi từ", "w": "benefit from"}], "patterns": [{"ex": "Regardless of which route you take, the trip lasts two hours.", "exVi": "Dù bạn đi đường nào thì chuyến đi cũng mất hai tiếng.", "explain": "Diễn tả kết quả không đổi dù điều kiện thay đổi thế nào. Sau 'regardless of' có thể là danh từ hoặc mệnh đề nghi vấn.", "formula": "regardless of + what/which + N + S + V", "name": "Bất kể... (regardless of + từ nghi vấn)", "src": "regardless of what climate model was used"}, {"ex": "The results have been confirmed several times.", "exVi": "Các kết quả đã được xác nhận nhiều lần.", "explain": "Nhấn mạnh kết quả được chứng minh nhiều lần cho đến nay; chủ thể thực hiện không quan trọng.", "formula": "S + have/has been + V3 (+ adv)", "name": "Hiện tại hoàn thành bị động", "src": "a broad pattern of rising crop yields ... have been repeatedly demonstrated"}, {"ex": "She will go, even if it rains.", "exVi": "Cô ấy vẫn sẽ đi, kể cả khi trời mưa.", "explain": "'Even if' nêu một giả định bất lợi nhưng không làm thay đổi kết luận ở mệnh đề chính.", "formula": "S + would likely + V, even if + S + V", "name": "Dù cho... (even if)", "src": "would likely benefit ... even if corn, wheat, and soybean production in the rest of the country declined"}, {"ex": "The trend (with sales up and costs down) continued.", "exVi": "Xu hướng (doanh số tăng, chi phí giảm) vẫn tiếp tục.", "explain": "Cụm 'with...' trong ngoặc làm rõ nội dung của danh từ phía trước.", "formula": "N (with + A + and + B)", "name": "Ngoặc đơn bổ sung giải thích", "src": "north-south asymmetries in crop yield (with gains in the north and declines in the south)"}], "hard": [{"mean": "Ngay từ năm 1990 đã rõ rằng, mô hình nào cũng cho thấy các bang phía bắc Mỹ có khả năng hưởng lợi từ nhiệt độ tăng, dù sản lượng ở phần còn lại của nước Mỹ giảm.", "parts": "Trạng ngữ: As early as 1990. Chủ ngữ giả: it. Vị ngữ: was apparent. Mệnh đề that: (1) regardless of what climate model was used (trạng ngữ nhượng bộ); (2) chủ ngữ: the northern U.S. states of Michigan, Minnesota, and Wisconsin; vị ngữ: would likely benefit from rising average temperatures; (3) even if... declined (mệnh đề nhượng bộ).", "s": "As early as 1990 it was apparent that regardless of what climate model was used, the northern U.S. states of Michigan, Minnesota, and Wisconsin would likely benefit from rising average temperatures, even if corn, wheat, and soybean production in the rest of the country declined."}, {"mean": "Ngược với các nghiên cứu đó, các mô phỏng mô hình khí hậu nhiều năm qua liên tục cho thấy năng suất cây trồng nói chung tăng ở các vùng phía bắc kể trên.", "parts": "Trạng ngữ: In contrast to these studies. Chủ ngữ: a broad pattern of rising crop yields in [danh sách nơi chốn]. Vị ngữ: have been repeatedly demonstrated. Tác nhân: by climate-change model simulations. Trạng ngữ thời gian: for years.", "s": "In contrast to these studies, a broad pattern of rising crop yields in Canada, some northern U.S. states, southern Scandinavia, the United Kingdom, and parts of Russia have been repeatedly demonstrated by climate-change model simulations for years."}], "insight": "Điểm mấu chốt của trang này là biến đổi khí hậu không làm mọi nơi thiệt hại như nhau: nó tạo ra kẻ được và người mất. Các mô hình mô phỏng cho thấy vùng vĩ độ cao ở Bắc bán cầu (Canada, bắc nước Mỹ, nam Scandinavia, Anh, một phần nước Nga) có thể được lợi vì mùa sinh trưởng dài hơn và bớt lạnh, trong khi vùng phía nam nóng và khô hơn thì năng suất giảm. Cụm \"vùng biên\" (marginal) ở cuối trang có nghĩa là những vùng đất vốn chỉ vừa đủ điều kiện để trồng trọt, ví dụ vì quá lạnh. Chỉ cần ấm lên một chút là chúng chuyển từ khó canh tác sang canh tác được, nên mức tăng ở đó rõ rệt hơn.\n\nCâu mở đầu của đoạn (\"Trái với những nghiên cứu trên\") đặt các kết quả này đối lập với những nghiên cứu trước đó, vốn có vẻ thiên về dự báo thiệt hại. Cũng cần hiểu \"triage\" (phân loại ưu tiên) là thuật ngữ y học khẩn cấp: khi nguồn lực không đủ, người ta phải chọn cứu ai trước. Tác giả trích dẫn ý rằng nếu cứ phớt lờ dự báo khí hậu thì sau này buộc phải ra những quyết định đau đớn và vội vàng. Điều đáng suy ngẫm là những quốc gia vốn đã là nước sản xuất nông sản lớn có thể mạnh thêm, còn vùng phía nam dễ tổn thương hơn, nên biến đổi khí hậu có thể làm thay đổi cán cân lương thực và quyền lực giữa các nước, đúng với tinh thần của một cuốn sách nhìn về thế giới năm 2050.", "insightDone": true}, {"n": 28, "date": "2026-10-28", "source": ["...northern fringes of present-day agriculture, rising temperatures and longer growing seasons will boost current crops and perhaps allow introduction of new ones; in marginal southern fringes, rising temperatures and drought frequency should harm them.", "Other questions revolve around the relative importance of temperature versus moisture stress on plants, soil quality, strength of CO2 fertilization, and whether extreme events (heat waves, flooding) might be even more important determinants of future food supply than the long-term temperature and precipitation statistical averages produced by climate models. It is also an oversimplification to assert that Russian and Canadian agriculture, for example, will universally benefit from warmer air temperatures. Russia's current agricultural heartland lies in its dry southern steppes, where crop declines may not be fully offset by gains in the north. The same holds true for Canada's western prairies."], "translation": ["...phía bắc của nền nông nghiệp hiện nay, nhiệt độ tăng và mùa sinh trưởng kéo dài sẽ thúc đẩy các loại cây trồng hiện có và có lẽ còn cho phép đưa vào những loại cây mới; còn ở những vùng biên phía nam vốn đã khó canh tác, nhiệt độ tăng và hạn hán thường xuyên hơn sẽ gây hại cho cây trồng.", "Những câu hỏi khác xoay quanh tầm quan trọng tương đối của stress nhiệt so với stress thiếu nước đối với thực vật, chất lượng đất, mức độ mạnh của hiệu ứng \"bón phân\" CO2, và việc liệu các hiện tượng cực đoan (sóng nhiệt, lũ lụt) có thể còn quan trọng hơn trong việc quyết định nguồn cung lương thực tương lai so với các số liệu thống kê trung bình dài hạn về nhiệt độ và lượng mưa do các mô hình khí hậu tạo ra hay không. Cũng là quá đơn giản hóa nếu khẳng định rằng nền nông nghiệp của Nga và Canada, chẳng hạn, nhất loạt sẽ được hưởng lợi từ nhiệt độ không khí ấm hơn. Vùng nông nghiệp trọng yếu hiện nay của Nga nằm ở các thảo nguyên khô hạn phía nam, nơi mức sụt giảm cây trồng có thể không được bù đắp hoàn toàn bằng phần tăng thêm ở phía bắc. Điều tương tự cũng đúng với các đồng cỏ phía tây của Canada."], "note": "fringes: vùng biên, rìa (ở đây là vùng rìa phía bắc/phía nam của khu vực canh tác). CO2 fertilization: hiệu ứng \"bón phân\" CO2, tức nồng độ CO2 cao hơn có thể thúc đẩy quang hợp và cây phát triển. moisture stress: stress do thiếu nước/độ ẩm. steppes: thảo nguyên (kiểu Á-Âu). prairies: đồng cỏ (ở Bắc Mỹ, thường gọi là \"đồng cỏ prairie\").", "vocab": [{"ex": "Farms on the fringe of the desert need more water.", "ipa": "/frɪndʒ/", "mean": "vùng rìa, vùng biên", "pos": "danh từ", "vi": "vùng biên", "w": "fringe"}, {"ex": "Marginal land produces low yields.", "ipa": "/ˈmɑːrdʒɪnəl/", "mean": "kém màu mỡ, khó canh tác, lợi ích thấp", "pos": "tính từ", "vi": "vốn đã khó canh tác", "w": "marginal"}, {"ex": "Good rainfall will boost this year's harvest.", "ipa": "/buːst/", "mean": "thúc đẩy, làm tăng", "pos": "động từ", "vi": "thúc đẩy", "w": "boost"}, {"ex": "The debate revolves around the cost of the project.", "ipa": "/rɪˈvɑːlv əˈraʊnd/", "mean": "xoay quanh, tập trung vào", "pos": "cụm động từ", "vi": "xoay quanh", "w": "revolve around"}, {"ex": "Moisture stress reduces the growth of wheat.", "ipa": "/ˈmɔɪstʃər stres/", "mean": "stress thiếu nước ở thực vật", "pos": "cụm danh từ (thuật ngữ)", "vi": "stress thiếu nước", "w": "moisture stress"}, {"ex": "Fertilization of the soil improved the crop.", "ipa": "/ˌfɜːrtələˈzeɪʃn/", "mean": "sự bón phân, sự thụ tinh; ở đây là hiệu ứng CO2 kích thích cây phát triển", "pos": "danh từ", "vi": "hiệu ứng \"bón phân\" CO2", "w": "fertilization"}, {"ex": "Income is a key determinant of food choices.", "ipa": "/dɪˈtɜːrmɪnənt/", "mean": "yếu tố quyết định", "pos": "danh từ", "vi": "quyết định", "w": "determinant"}, {"ex": "The statistical average hides big regional differences.", "ipa": "/stəˈtɪstɪkl ˈævərɪdʒ/", "mean": "giá trị trung bình thống kê", "pos": "cụm danh từ", "vi": "số liệu thống kê trung bình", "w": "statistical average"}, {"ex": "Saying the problem is only economic is an oversimplification.", "ipa": "/ˌoʊvərˌsɪmpləfəˈkeɪʃn/", "mean": "sự đơn giản hóa quá mức", "pos": "danh từ", "vi": "quá đơn giản hóa", "w": "oversimplification"}, {"ex": "The rule is not universally accepted.", "ipa": "/ˌjuːnɪˈvɜːrsəli/", "mean": "một cách phổ biến, ở mọi nơi", "pos": "trạng từ", "vi": "nhất loạt", "w": "universally"}, {"ex": "Higher yields may offset the rising costs.", "ipa": "/ˌɔːfˈset/", "mean": "bù đắp, cân bằng", "pos": "động từ", "vi": "bù đắp", "w": "offset"}, {"ex": "The steppe stretches for thousands of kilometers.", "ipa": "/step/", "mean": "thảo nguyên khô", "pos": "danh từ", "vi": "thảo nguyên", "w": "steppe"}], "patterns": [{"ex": "The question is whether prices will fall next year.", "exVi": "Câu hỏi là liệu giá có giảm vào năm tới hay không.", "explain": "Whether dùng để nêu một câu hỏi có/không như một thành phần của câu, nghĩa là 'liệu... hay không'.", "formula": "question(s) + revolve around + ... + whether + S + V", "name": "Câu hỏi gián tiếp với whether", "src": "whether extreme events (heat waves, flooding) might be even more important determinants..."}, {"ex": "Drought may be even more harmful than flooding.", "exVi": "Hạn hán có thể thậm chí còn gây hại hơn lũ lụt.", "explain": "Even nhấn mạnh mức độ hơn nữa, nghĩa là 'thậm chí còn... hơn'.", "formula": "even + more/adj-er + ... + than + N", "name": "So sánh hơn với even", "src": "even more important determinants of future food supply than the long-term ... averages"}, {"ex": "It is unrealistic to expect rapid change.", "exVi": "Thật không thực tế khi mong đợi sự thay đổi nhanh chóng.", "explain": "It đứng đầu câu thay cho chủ ngữ thật là cụm to V, giúp câu dễ đọc hơn.", "formula": "It is + adj + to + V / It is an oversimplification + to V", "name": "Cấu trúc giả chủ ngữ It is + adj + to V", "src": "It is also an oversimplification to assert that Russian and Canadian agriculture... will universally benefit"}, {"ex": "He moved to Hanoi, where he found a new job.", "exVi": "Anh ấy chuyển đến Hà Nội, nơi anh ấy tìm được công việc mới.", "explain": "Where bổ sung thông tin về địa điểm vừa nhắc tới, nghĩa là 'nơi mà'.", "formula": "N (nơi chốn) + , where + S + V", "name": "Mệnh đề quan hệ với where", "src": "dry southern steppes, where crop declines may not be fully offset by gains in the north"}], "hard": [{"mean": "Các câu hỏi khác tập trung vào bốn vấn đề: tầm quan trọng của nhiệt so với thiếu nước, chất lượng đất, sức mạnh của hiệu ứng CO2, và liệu các hiện tượng cực đoan có quyết định nguồn lương thực tương lai mạnh hơn các số liệu trung bình dài hạn của mô hình khí hậu hay không.", "parts": "Chủ ngữ: Other questions. Vị ngữ: revolve around. Tân ngữ của around gồm 4 thành phần song song: (1) the relative importance of temperature versus moisture stress on plants, (2) soil quality, (3) strength of CO2 fertilization, (4) whether extreme events... Mệnh đề whether có so sánh 'more important ... than the ... averages'; cụm 'produced by climate models' là rút gọn quan hệ bổ nghĩa cho 'averages'.", "s": "Other questions revolve around the relative importance of temperature versus moisture stress on plants, soil quality, strength of CO2 fertilization, and whether extreme events (heat waves, flooding) might be even more important determinants of future food supply than the long-term temperature and precipitation statistical averages produced by climate models."}, {"mean": "Vùng nông nghiệp cốt lõi hiện nay của Nga nằm ở thảo nguyên khô phía nam, nơi cây trồng giảm sút có thể không được bù đắp đầy đủ bằng phần tăng ở phía bắc.", "parts": "Chủ ngữ: Russia's current agricultural heartland. Vị ngữ: lies in its dry southern steppes. Mệnh đề quan hệ: where crop declines may not be fully offset by gains in the north (bị động với may not be offset).", "s": "Russia's current agricultural heartland lies in its dry southern steppes, where crop declines may not be fully offset by gains in the north."}], "insight": "Tác giả đang chống lại một suy nghĩ quen thuộc: \"khí hậu ấm lên thì các nước ở vĩ độ cao như Nga, Canada sẽ được lợi\". Lập luận của ông là bức tranh này quá giản lược. Ở rìa phía bắc, mùa sinh trưởng dài hơn quả có thể giúp cây trồng hiện có và mở ra khả năng trồng loại mới. Nhưng ở rìa phía nam vốn đã khô và khó canh tác, nóng hơn cộng với hạn hán thường xuyên hơn sẽ gây hại. Điểm mấu chốt là phần lớn sản lượng của Nga và Canada hiện nằm ở phía nam (thảo nguyên khô của Nga, đồng cỏ prairie phía tây Canada), nên phần mất ở đó chưa chắc được bù bằng phần được thêm ở phía bắc. Vùng đất phía bắc cũng không tự nhiên trở thành đất canh tác tốt, vì còn phụ thuộc vào chất lượng đất.\n\nVài khái niệm nên biết: \"stress nhiệt\" và \"stress thiếu nước\" là hai kiểu áp lực khác nhau lên cây, và không dễ biết cái nào quyết định hơn. \"Hiệu ứng bón phân CO2\" là giả thuyết rằng nhiều CO2 hơn trong không khí có thể giúp một số cây quang hợp và lớn nhanh hơn, nhưng mức độ thực tế còn nhiều tranh luận, nên tác giả xếp nó vào các câu hỏi chưa có lời đáp. Ý cuối đáng suy ngẫm: các mô hình khí hậu thường cho số liệu trung bình dài hạn, trong khi mùa màng có thể bị quyết định bởi những cú sốc ngắn như sóng nhiệt hay lũ. Vì vậy dự báo về an ninh lương thực cần dè dặt hơn so với những kết luận \"vùng này thắng, vùng kia thua\" nghe có vẻ gọn gàng.", "insightDone": true}, {"n": 29, "date": "2026-10-28", "source": ["But relative to the rest of the world, the NORCs—especially the northernmost U.S. states, parts of Canada and Russia, and northern Europe—count among the few places on Earth where we can reasonably expect to see rising crop production from climate change.", "Please pass the potatoes."], "translation": ["Nhưng so với phần còn lại của thế giới, các NORC, đặc biệt là những bang cực bắc của Hoa Kỳ, một số vùng của Canada và Nga, cùng Bắc Âu, nằm trong số ít nơi trên Trái Đất mà chúng ta có thể kỳ vọng một cách hợp lý là sản lượng cây trồng sẽ tăng lên do biến đổi khí hậu.", "Làm ơn chuyển giúp tôi đĩa khoai tây."], "note": "NORC: viết tắt của \"Northern Rim Countries\", chỉ nhóm các nước vành đai phía bắc (Bắc Mỹ, Bắc Âu, Nga). \"Please pass the potatoes\" là câu nói quen thuộc trên bàn ăn, ở đây được dùng như một câu chuyển đoạn mang tính hài hước.", "vocab": [{"ex": "Prices are low relative to last year.", "ipa": "/ˈrelətɪv tuː/", "mean": "so với, xét trong mối tương quan với", "pos": "cụm giới từ", "vi": "so với", "w": "relative to"}, {"ex": "She counts among the best surgeons in the country.", "ipa": "/kaʊnt əˈmʌŋ/", "mean": "được xếp vào số, nằm trong số", "pos": "cụm động từ", "vi": "nằm trong số", "w": "count among"}, {"ex": "Alaska is the northernmost U.S. state.", "ipa": "/ˈnɔːðənməʊst/", "mean": "ở cực bắc, xa về phía bắc nhất", "pos": "tính từ", "vi": "cực bắc", "w": "northernmost"}, {"ex": "We can reasonably assume the results are accurate.", "ipa": "/ˈriːznəbli/", "mean": "một cách hợp lý, có cơ sở", "pos": "trạng từ", "vi": "một cách hợp lý", "w": "reasonably"}, {"ex": "Experts expect prices to fall next year.", "ipa": "/ɪkˈspekt/", "mean": "kỳ vọng, dự đoán (có cơ sở)", "pos": "động từ", "vi": "kỳ vọng", "w": "expect"}, {"ex": "Drought reduced crop production in the region.", "ipa": "/krɒp prəˈdʌkʃn/", "mean": "sản lượng cây trồng, hoạt động sản xuất nông sản", "pos": "danh từ ghép", "vi": "sản lượng cây trồng", "w": "crop production"}, {"ex": "Rising temperatures threaten coral reefs.", "ipa": "/ˈraɪzɪŋ/", "mean": "đang tăng lên", "pos": "tính từ", "vi": "tăng lên", "w": "rising"}, {"ex": "Climate change affects farming worldwide.", "ipa": "/ˈklaɪmət tʃeɪndʒ/", "mean": "biến đổi khí hậu", "pos": "danh từ ghép", "vi": "biến đổi khí hậu", "w": "climate change"}, {"ex": "Could you pass me the salt?", "ipa": "/pɑːs/", "mean": "chuyển, đưa (vật cho người khác) ở bàn ăn", "pos": "động từ", "vi": "chuyển giúp", "w": "pass"}], "patterns": [{"ex": "Relative to its size, the country produces a lot of wheat.", "exVi": "So với diện tích của mình, quốc gia này sản xuất rất nhiều lúa mì.", "explain": "Dùng để đặt một đối tượng vào mối so sánh với phần còn lại; mang sắc thái học thuật, gần nghĩa compared with.", "formula": "relative to + danh từ, mệnh đề chính", "name": "So sánh tương đối: relative to", "src": "But relative to the rest of the world, the NORCs ... count among the few places on Earth..."}, {"ex": "This lake counts among the few places where the water is still clean.", "exVi": "Hồ này nằm trong số ít nơi nước vẫn còn sạch.", "explain": "Diễn đạt chủ thể thuộc nhóm nhỏ, đặc biệt. Theo sau là mệnh đề quan hệ với where.", "formula": "S + count among + the few/the best + N", "name": "Một trong số ít: count among the few", "src": "count among the few places on Earth where we can reasonably expect..."}, {"ex": "There are few cities where people can live without a car.", "exVi": "Có rất ít thành phố mà người ta có thể sống không cần xe hơi.", "explain": "Where bổ nghĩa cho danh từ chỉ nơi chốn, giải thích điều có thể xảy ra ở đó.", "formula": "place + where + S + V", "name": "Mệnh đề quan hệ với where", "src": "places on Earth where we can reasonably expect to see rising crop production"}, {"ex": "Please close the window.", "exVi": "Làm ơn đóng cửa sổ lại.", "explain": "Câu mệnh lệnh thêm please để lịch sự, thường dùng khi ăn uống, nhờ vả.", "formula": "Please + động từ nguyên mẫu + tân ngữ", "name": "Câu yêu cầu lịch sự", "src": "Please pass the potatoes."}], "hard": [{"mean": "So với thế giới, các vùng NORC là một trong số ít nơi mà biến đổi khí hậu có thể khiến sản lượng nông nghiệp tăng lên.", "parts": "Trạng ngữ: relative to the rest of the world (so với phần còn lại của thế giới). Chủ ngữ: the NORCs. Phần chen giữa gạch ngang: liệt kê ví dụ (các bang cực bắc nước Mỹ, một số vùng Canada và Nga, Bắc Âu). Vị ngữ: count among the few places on Earth. Mệnh đề quan hệ: where we can reasonably expect to see rising crop production from climate change (nơi ta có thể kỳ vọng thấy sản lượng cây trồng tăng do biến đổi khí hậu).", "s": "But relative to the rest of the world, the NORCs—especially the northernmost U.S. states, parts of Canada and Russia, and northern Europe—count among the few places on Earth where we can reasonably expect to see rising crop production from climate change."}], "insight": "Ý chính của đoạn này là một nhận định mang tính so sánh: trong một thế giới mà biến đổi khí hậu nhìn chung đe dọa nông nghiệp, các vùng ở vĩ độ rất cao lại có thể được hưởng lợi. Cụm \"so với phần còn lại của thế giới\" rất quan trọng, vì tác giả không nói các vùng này sẽ không chịu thiệt hại, mà chỉ nói họ nằm trong số ít nơi có cơ sở hợp lý để kỳ vọng sản lượng tăng. Lập luận nền tảng là khi nhiệt độ ấm lên, mùa sinh trưởng ở phương Bắc dài hơn, ít băng giá hơn và nhiều diện tích có thể canh tác hơn, trong khi các vùng ôn đới và nhiệt đới có nguy cơ gặp nóng, hạn hán hoặc thiếu nước.\n\nVề thuật ngữ, NORC là cách viết tắt mà sách dùng để chỉ nhóm các nước và khu vực phương Bắc (Bắc Mỹ, Nga, Bắc Âu...); bạn nên đối chiếu với phần định nghĩa ở phần trước của sách để nắm chính xác phạm vi. Điều đáng suy ngẫm là kết luận này mang tính địa chính trị: nếu các vùng phương Bắc được lợi về lương thực còn nhiều nơi khác bị thiệt, cán cân quyền lực, di cư và an ninh lương thực toàn cầu có thể bị xáo trộn.\n\nCâu cuối, \"Please pass the potatoes\" (làm ơn chuyển giúp tôi đĩa khoai tây), là một câu đời thường, có vẻ như một nét hài hước hoặc chuyển cảnh, đặt cạnh chủ đề lương thực để tạo giọng điệu nhẹ nhàng. Khi đứng riêng, câu này chỉ là lời nhờ lịch sự trong bữa ăn và không có nghĩa sâu xa hơn.", "insightDone": true}, {"n": 30, "date": "2026-10-28", "source": ["CHAPTER 6", "One if by Land, Two if by Sea", "In August 2007 the Russian nuclear-powered icebreaker Rossiya broke a path to the North Pole, the research vessel Akademik Fyodorov trailing closely behind. An opening was cut through the sea ice and two tiny submarines lowered by crane into the freezing water. Their crews then dove 4,300 meters—more than two and a half miles beneath the ice—to the floor of the Arctic Ocean. A robotic arm collected samples and planted a titanium tricolor Russian flag directly into the yellow mud of the northernmost spot on the planet. \"The Arctic is ours,\" declared Artur Chilingarov, the polar explorer, oceanographer, and Duma politician who led the expedition and also went down in one of the subs. Vaguely remembered for rescuing a stuck polar ship in the 1980s, he became an instant celebrity; ..."], "translation": ["CHƯƠNG 6", "Một nếu đi đường bộ, hai nếu đi đường biển", "Tháng 8 năm 2007, tàu phá băng chạy bằng năng lượng hạt nhân của Nga mang tên Rossiya đã mở một lối đi tới Bắc Cực, theo sát phía sau là tàu nghiên cứu Akademik Fyodorov. Một khoảng trống được khoét xuyên qua lớp băng biển, và hai chiếc tàu ngầm nhỏ xíu được cẩu thả xuống làn nước lạnh buốt. Thủy thủ đoàn của chúng sau đó lặn sâu 4.300 mét, tức hơn hai dặm rưỡi dưới lớp băng, xuống tận đáy Bắc Băng Dương. Một cánh tay robot đã thu thập mẫu vật và cắm một lá cờ ba màu của Nga làm bằng titan thẳng xuống lớp bùn vàng ở điểm cực bắc của hành tinh. \"Bắc Cực là của chúng ta,\" ông Artur Chilingarov tuyên bố. Ông là nhà thám hiểm vùng cực, nhà hải dương học kiêm chính trị gia của Duma, người dẫn đầu chuyến thám hiểm và cũng đã xuống biển trên một trong hai chiếc tàu ngầm. Trước đó, người ta chỉ nhớ mơ hồ về ông qua việc giải cứu một con tàu cực bị kẹt vào thập niên 1980, nhưng ông bỗng trở thành người nổi tiếng chỉ sau một đêm; ..."], "note": "\"One if by Land, Two if by Sea\" là câu quen thuộc của người Mỹ, lấy từ tín hiệu đèn lồng báo quân Anh tiến đánh (một đèn nếu đi đường bộ, hai đèn nếu đi đường biển) trong bài thơ về Paul Revere. Tiêu đề chương dùng câu này để gợi sự tranh giành Bắc Cực. Duma: Viện Duma Quốc gia, hạ viện của Nga. Rossiya, Akademik Fyodorov: tên tàu, giữ nguyên. Artur Chilingarov: nhà thám hiểm cực người Nga. Icebreaker: tàu phá băng. 4,300 meters ≈ 2,7 dặm.", "vocab": [{"ex": "The icebreaker cleared a channel for the cargo ships.", "ipa": "/ˈaɪsˌbreɪkər/", "mean": "tàu phá băng, tàu chuyên mở đường qua vùng biển đóng băng", "pos": "danh từ", "vi": "tàu phá băng", "w": "icebreaker"}, {"ex": "The child came trailing behind his mother.", "ipa": "/ˈtreɪlɪŋ/", "mean": "đi theo sau, bám theo phía sau", "pos": "động từ (V-ing)", "vi": "theo sát phía sau", "w": "trailing"}, {"ex": "Sea ice is shrinking every summer.", "ipa": "/siː aɪs/", "mean": "băng biển, băng hình thành từ nước biển đóng băng", "pos": "danh từ", "vi": "lớp băng biển", "w": "sea ice"}, {"ex": "The submarine stayed underwater for weeks.", "ipa": "/ˌsʌbməˈriːn/", "mean": "tàu ngầm", "pos": "danh từ", "vi": "tàu ngầm", "w": "submarine"}, {"ex": "They lowered the boat into the river.", "ipa": "/ˈloʊərd/", "mean": "hạ xuống, thả xuống", "pos": "động từ (quá khứ)", "vi": "được cẩu thả xuống", "w": "lowered"}, {"ex": "The divers dove to inspect the wreck.", "ipa": "/doʊv/", "mean": "lặn xuống, đi sâu xuống nước", "pos": "động từ (quá khứ của dive)", "vi": "lặn sâu", "w": "dove"}, {"ex": "The climbers planted a flag on the summit.", "ipa": "/ˈplæntɪd/", "mean": "cắm, đặt chắc xuống (nghĩa bóng: đánh dấu chủ quyền)", "pos": "động từ (quá khứ)", "vi": "cắm", "w": "planted"}, {"ex": "The tricolor flew above the town hall.", "ipa": "/ˈtraɪˌkʌlər/", "mean": "ba màu; cờ ba màu", "pos": "danh từ/tính từ", "vi": "cờ ba màu", "w": "tricolor"}, {"ex": "The frame is made of titanium.", "ipa": "/taɪˈteɪniəm/", "mean": "titan, kim loại nhẹ và rất bền", "pos": "danh từ", "vi": "titan", "w": "titanium"}, {"ex": "The government declared a state of emergency.", "ipa": "/dɪˈklerd/", "mean": "tuyên bố một cách công khai, dứt khoát", "pos": "động từ (quá khứ)", "vi": "tuyên bố", "w": "declared"}, {"ex": "The oceanographer studied deep-sea currents.", "ipa": "/ˌoʊʃəˈnɑːɡrəfər/", "mean": "nhà hải dương học", "pos": "danh từ", "vi": "nhà hải dương học", "w": "oceanographer"}, {"ex": "I vaguely remember meeting her years ago.", "ipa": "/ˈveɪɡli/", "mean": "một cách mơ hồ, không rõ ràng", "pos": "trạng từ", "vi": "mơ hồ", "w": "vaguely"}], "patterns": [{"ex": "The chef cooked dinner, his assistant washing the dishes.", "exVi": "Đầu bếp nấu bữa tối, trong khi trợ lý của ông rửa bát.", "explain": "Cụm danh từ + V-ing có chủ ngữ riêng, diễn tả sự việc xảy ra cùng lúc với mệnh đề chính. Ở đây tàu Akademik Fyodorov đi
