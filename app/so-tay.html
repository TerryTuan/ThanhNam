sát phía sau trong lúc tàu Rossiya mở đường.", "formula": "Mệnh đề chính, + danh từ + V-ing/phân từ", "name": "Cụm phân từ chỉ hành động đồng thời (absolute construction)", "src": "the Russian nuclear-powered icebreaker Rossiya broke a path to the North Pole, the research vessel Akademik Fyodorov trailing closely behind"}, {"ex": "A tunnel was dug and the walls reinforced with steel.", "exVi": "Một đường hầm được đào và các bức tường được gia cố bằng thép.", "explain": "Nhấn mạnh hành động và kết quả thay vì người thực hiện. Ở vế sau, 'were' được lược bỏ vì trùng với vế trước.", "formula": "S + be + V3 (+ by agent)", "name": "Câu bị động", "src": "An opening was cut through the sea ice and two tiny submarines lowered by crane"}, {"ex": "Maria Lopez, a doctor and writer who lives in Hanoi, won the prize.", "exVi": "Maria Lopez, một bác sĩ kiêm nhà văn sống ở Hà Nội, đã giành giải thưởng.", "explain": "Cụm danh từ đặt sau tên riêng để giới thiệu thêm về người đó. Mệnh đề 'who led...' tiếp tục bổ nghĩa cho cụm này.", "formula": "Danh từ riêng, + cụm danh từ bổ nghĩa, + động từ", "name": "Đồng vị ngữ (appositive)", "src": "Artur Chilingarov, the polar explorer, oceanographer, and Duma politician who led the expedition"}, {"ex": "Known for his honesty, he was trusted by everyone.", "exVi": "Nổi tiếng vì sự trung thực, ông được mọi người tin tưởng.", "explain": "Cụm phân từ ở đầu câu bổ nghĩa cho chủ ngữ 'he', mang nghĩa 'ông vốn được nhớ mơ hồ vì...'. Chủ ngữ của cụm và của mệnh đề chính phải cùng một người.", "formula": "V3 + ..., + S + V", "name": "Cụm phân từ quá khứ đứng đầu câu", "src": "Vaguely remembered for rescuing a stuck polar ship in the 1980s, he became an instant celebrity"}], "hard": [{"mean": "Trước đó, ông chỉ được nhớ mơ hồ vì từng giải cứu một con tàu cực bị kẹt vào thập niên 1980, nhưng nay bỗng trở thành người nổi tiếng ngay lập tức.", "parts": "Cụm phân từ quá khứ 'Vaguely remembered for rescuing a stuck polar ship in the 1980s' (bổ nghĩa cho chủ ngữ); chủ ngữ: he; vị ngữ: became an instant celebrity; 'for rescuing...' là giới từ + V-ing chỉ lý do được nhớ đến.", "s": "Vaguely remembered for rescuing a stuck polar ship in the 1980s, he became an instant celebrity;"}, {"mean": "Sau đó, thủy thủ đoàn của hai tàu ngầm lặn xuống 4.300 mét, tức hơn hai dặm rưỡi dưới lớp băng, tới tận đáy Bắc Băng Dương.", "parts": "Chủ ngữ: Their crews; trạng từ: then; vị ngữ: dove 4,300 meters; phần chèn giữa hai dấu gạch ngang 'more than two and a half miles beneath the ice' giải thích thêm khoảng cách; trạng ngữ chỉ đích: to the floor of the Arctic Ocean.", "s": "Their crews then dove 4,300 meters—more than two and a half miles beneath the ice—to the floor of the Arctic Ocean."}], "insight": "Tiêu đề chương \"One if by Land, Two if by Sea\" mượn từ câu nổi tiếng trong bài thơ của Longfellow về Paul Revere (1775): người ta treo một đèn nếu quân Anh tiến đường bộ, hai đèn nếu đi đường biển. Ở đây tác giả dùng ẩn ý đó để báo hiệu rằng chương này nói về các tuyến đường và sự cạnh tranh quyền lực, nay chuyển lên Bắc Cực khi băng tan mở ra những lối đi mới trên biển.\n\nVụ cắm cờ năm 2007 chủ yếu mang tính biểu tượng và chính trị: Nga muốn thể hiện yêu sách về đáy biển Bắc Cực, vốn được cho là giàu dầu khí và khoáng sản. Việc cắm một lá cờ titan không tự tạo ra chủ quyền theo luật quốc tế; các tuyên bố về thềm lục địa được xét theo Công ước Liên Hợp Quốc về Luật Biển (UNCLOS). Giọng văn của tác giả hơi mỉa mai khi nhấn vào chi tiết \"tàu ngầm nhỏ xíu\", lá cờ, và việc Chilingarov bỗng nổi tiếng. Qua đó ông cho thấy màn trình diễn này vừa ngoạn mục vừa mang tính sân khấu, và là dấu hiệu của cuộc tranh giành mới ở một vùng đất trước đây gần như không ai tranh chấp, một chủ đề lớn của cuốn sách về cách biến đổi khí hậu và địa chính trị định hình lại thế giới.", "insightDone": true}, {"n": 31, "date": "2026-10-28", "source": ["President Putin later awarded him a gold Hero of Russia medal.", "For the next several months, the world proceeded to go crazy about Russians staking out the North Pole. Western politicians spluttered in outrage. \"This isn't the fifteenth century,\" Canada's foreign minister Peter MacKay told a crowd of television reporters. \"You can't go around the world and just plant flags and say: 'We're claiming this territory.'\" Media reports framed the story as a thinly veiled grab for natural resources, citing a recent comment by U.S. Geological Survey (USGS) scientist Don Gautier, who had ballparked that the Arctic could hold up to one-fourth of the last undiscovered hydrocarbons remaining on Earth. The presumption was that Russia had fired the opening salvo in a new sovereignty race for vast riches of untapped oil and gas—resources desperately needed to support the world economy in the coming century—thought to lie beneath the frigid seafloor of the Arctic Ocean."], "translation": ["Sau đó, Tổng thống Putin đã trao tặng ông Huân chương Anh hùng Liên bang Nga bằng vàng.", "Trong vài tháng tiếp theo, cả thế giới xôn xao về chuyện người Nga cắm mốc ở Bắc Cực. Các chính trị gia phương Tây phẫn nộ đến mức nói lắp bắp. \"Đây không phải thế kỷ mười lăm,\" Bộ trưởng Ngoại giao Canada Peter MacKay nói với đám đông phóng viên truyền hình. \"Không thể cứ đi khắp thế giới, cắm cờ rồi tuyên bố: 'Chúng tôi đang chiếm vùng lãnh thổ này.'\" Các bản tin trên báo chí mô tả vụ việc như một màn tranh giành tài nguyên thiên nhiên được che đậy sơ sài, và dẫn lại nhận xét gần đây của nhà khoa học Don Gautier thuộc Cục Khảo sát Địa chất Hoa Kỳ (USGS), người ước đoán rằng Bắc Cực có thể chứa tới một phần tư lượng hydrocarbon chưa được phát hiện còn lại trên Trái Đất. Người ta cho rằng Nga đã bắn loạt đạn mở màn trong một cuộc đua chủ quyền mới nhằm giành những kho dầu khí khổng lồ chưa được khai thác, những nguồn tài nguyên cực kỳ cần thiết để nuôi nền kinh tế thế giới trong thế kỷ tới, được cho là nằm dưới đáy Bắc Băng Dương lạnh giá."], "note": "Hero of Russia: Anh hùng Liên bang Nga, danh hiệu cao quý nhất của Nga. Peter MacKay: Bộ trưởng Ngoại giao Canada thời đó. USGS: Cục Khảo sát Địa chất Hoa Kỳ. Hydrocarbons: hydrocarbon, chỉ dầu mỏ và khí đốt tự nhiên. \"Ballparked\": ước chừng, đoán đại khái. \"Fired the opening salvo\": nghĩa đen là bắn loạt đạn mở màn, nghĩa bóng là khơi mào một cuộc tranh đua.", "vocab": [{"ex": "The company staked out a large share of the new market.", "ipa": "/steɪk aʊt/", "mean": "cắm mốc, đánh dấu để khẳng định chủ quyền hoặc quyền sở hữu", "pos": "cụm động từ", "vi": "cắm mốc", "w": "stake out"}, {"ex": "He spluttered with rage when he heard the news.", "ipa": "/ˈsplʌtər/", "mean": "nói lắp bắp, nói không thành lời vì tức giận hoặc bối rối", "pos": "động từ", "vi": "nói lắp bắp", "w": "splutter"}, {"ex": "The decision caused public outrage.", "ipa": "/ˈaʊtreɪdʒ/", "mean": "sự phẫn nộ, sự căm phẫn", "pos": "danh từ", "vi": "phẫn nộ", "w": "outrage"}, {"ex": "She made a thinly veiled threat to quit.", "ipa": "/ˈθɪnli veɪld/", "mean": "che đậy sơ sài, lộ liễu, không giấu được ý đồ", "pos": "cụm tính từ", "vi": "được che đậy sơ sài", "w": "thinly veiled"}, {"ex": "Critics called the merger a power grab.", "ipa": "/ɡræb/", "mean": "sự chiếm đoạt, sự tranh giành (thường mang nghĩa tiêu cực)", "pos": "danh từ", "vi": "màn tranh giành", "w": "grab"}, {"ex": "Can you ballpark the cost of the project?", "ipa": "/ˈbɔːlpɑːrk/", "mean": "ước đoán đại khái, ước chừng", "pos": "động từ (khẩu ngữ)", "vi": "ước đoán", "w": "ballpark"}, {"ex": "Hydrocarbons are the main components of crude oil.", "ipa": "/ˌhaɪdrəˈkɑːrbən/", "mean": "hydrocarbon, hợp chất hydro-carbon (dầu mỏ, khí đốt)", "pos": "danh từ", "vi": "hydrocarbon", "w": "hydrocarbon"}, {"ex": "The speech was the first salvo in the election battle.", "ipa": "/ˈsælvoʊ/", "mean": "loạt đạn, loạt tấn công dồn dập (nghĩa bóng: hành động mở đầu mạnh mẽ)", "pos": "danh từ", "vi": "loạt đạn", "w": "salvo"}, {"ex": "The island's sovereignty is disputed by two countries.", "ipa": "/ˈsɑːvrənti/", "mean": "chủ quyền", "pos": "danh từ", "vi": "chủ quyền", "w": "sovereignty"}, {"ex": "The region has untapped mineral wealth.", "ipa": "/ʌnˈtæpt/", "mean": "chưa được khai thác", "pos": "tính từ", "vi": "chưa được khai thác", "w": "untapped"}, {"ex": "They survived the frigid night in a tent.", "ipa": "/ˈfrɪdʒɪd/", "mean": "lạnh giá, lạnh buốt", "pos": "tính từ", "vi": "lạnh giá", "w": "frigid"}], "patterns": [{"ex": "The firm cut prices, hoping to attract more customers.", "exVi": "Công ty giảm giá, với hy vọng thu hút thêm khách hàng.", "explain": "Cụm V-ing đứng sau dấu phẩy bổ sung thông tin về cách hoặc căn cứ của hành động ở mệnh đề chính. Dùng nhiều trong văn báo chí.", "formula": "S + V + O, + V-ing + nguồn/bằng chứng", "name": "Dẫn lời bằng phân từ (citing...)", "src": "Media reports framed the story as a thinly veiled grab for natural resources, citing a recent comment by U.S. Geological Survey (USGS) scientist Don Gautier"}, {"ex": "The newspaper framed the strike as a threat to the economy.", "exVi": "Tờ báo mô tả cuộc đình công như một mối đe dọa đối với nền kinh tế.", "explain": "Mô tả, trình bày một sự việc theo một góc nhìn nhất định.", "formula": "frame + O + as + danh từ", "name": "Frame A as B", "src": "Media reports framed the story as a thinly veiled grab for natural resources"}, {"ex": "The belief was that the team had already left.", "exVi": "Người ta tin rằng cả đội đã rời đi từ trước.", "explain": "Mệnh đề that giải thích nội dung của danh từ trừu tượng. Quá khứ hoàn thành (had fired) chỉ việc xảy ra trước.", "formula": "The + danh từ (presumption/assumption/belief) + was + that + mệnh đề", "name": "The presumption was that...", "src": "The presumption was that Russia had fired the opening salvo in a new sovereignty race"}, {"ex": "Funds raised by students will help the school.", "exVi": "Số tiền do học sinh quyên góp sẽ giúp ích cho ngôi trường.", "explain": "Bỏ 'that are/which are' và giữ V3 để bổ nghĩa cho danh từ phía trước.", "formula": "danh từ + (that are) + V-ed/V3 + ...", "name": "Rút gọn mệnh đề quan hệ bằng phân từ quá khứ", "src": "resources desperately needed to support the world economy... thought to lie beneath the frigid seafloor"}], "hard": [{"mean": "Người ta cho rằng Nga đã khởi đầu cuộc đua chủ quyền mới để giành lượng dầu khí khổng lồ chưa khai thác, thứ rất cần cho kinh tế thế giới và được cho là nằm dưới đáy biển lạnh giá của Bắc Băng Dương.", "parts": "Chủ ngữ: The presumption. Vị ngữ: was that... Mệnh đề that: Russia had fired the opening salvo in a new sovereignty race (Nga đã bắn loạt đạn mở màn trong cuộc đua chủ quyền mới) for vast riches of untapped oil and gas (nhằm giành kho dầu khí khổng lồ chưa khai thác). Cụm đồng vị giữa hai dấu gạch ngang: resources desperately needed... century (nguồn tài nguyên rất cần cho nền kinh tế). Cụm cuối: thought to lie beneath... (được cho là nằm dưới đáy Bắc Băng Dương).", "s": "The presumption was that Russia had fired the opening salvo in a new sovereignty race for vast riches of untapped oil and gas—resources desperately needed to support the world economy in the coming century—thought to lie beneath the frigid seafloor of the Arctic Ocean."}, {"mean": "Không thể cứ đi khắp nơi cắm cờ rồi tuyên bố đó là lãnh thổ của mình.", "parts": "Chủ ngữ: You. Vị ngữ: can't go around the world and just plant flags and say... Ba hành động nối bằng and: go around the world (đi khắp thế giới), plant flags (cắm cờ), say (tuyên bố). Nội dung lời nói: 'We're claiming this territory.'", "s": "You can't go around the world and just plant flags and say: 'We're claiming this territory.'"}], "insight": "Trang này kể về sự kiện năm 2007, khi một tàu ngầm Nga cắm cờ titan xuống đáy biển ngay dưới điểm Bắc Cực. Tác giả (Laurence C. Smith) dùng nó để cho thấy phản ứng của thế giới: giới chính trị và báo chí vội cho rằng đây là màn mở đầu cuộc tranh giành dầu khí. Câu của Peter MacKay về \"thế kỷ mười lăm\" ám chỉ thời các cường quốc châu Âu cắm cờ để chiếm đất mới như bất kỳ ai khác trên Trái Đất, tôi vẫn chẳng hay biết chuyện gì đang xảy ra. Tôi bị cắt đứt khỏi thế giới bên ngoài, đang rẽ sóng đi về phía bắc qua một vùng biển vắng lặng, cách Toronto cả nghìn dặm về phía bắc. Vào lúc lá cờ Nga bằng titan được cắm xuống, có lẽ tôi đang ngủ, hoặc đang xịt nước rửa những tấm lưới bắt sinh vật phù du hôi rình. Phải vài ngày sau tôi mới nghe nói về chuyện đó.", "Khi ấy tôi sống trên tàu CCGS Amundsen, một tàu phá băng cỡ nhỏ hơn của Lực lượng Bảo vệ Bờ biển Canada, đang hướng tới vịnh Hudson và cuối cùng là Hành lang Tây Bắc. Cuộc sống hằng ngày của tôi xoay quanh trong một thế giới kim loại sơn phết, dài chưa đầy một trăm mét và rộng hai mươi mét, với những ca kíp luân phiên thất thường giữa ngủ, làm việc và ăn ở nhà ăn. Chúng tôi đã rời bến Quebec trong sự chào đón rình rang chỉ sáu ngày trước vụ cắm cờ của người Nga.", "Tôi chưa thật sự hiểu những chuyến thám hiểm khoa học bằng tàu phá băng này quan trọng đến mức nào. Một đám đông đứng chen chúc dọc theo con tàu và..."], "note": "Rossiya: tên tàu phá băng chạy bằng năng lượng hạt nhân của Nga (nghĩa là \"nước Nga\"). CCGS = Canadian Coast Guard Ship (Tàu của Lực lượng Bảo vệ Bờ biển Canada). Amundsen: tên tàu, đặt theo nhà thám hiểm Roald Amundsen. Hudson Bay: vịnh Hudson. Northwest Passage: Hành lang Tây Bắc, tuyến đường biển qua Bắc Cực của Canada nối Đại Tây Dương với Thái Bình Dương. \"Hosing off\": xịt nước rửa. \"Plankton nets\": lưới thu mẫu sinh vật phù du.", "vocab": [{"ex": "The village was cut off by the flood.", "ipa": "/kʌt ɒf/", "mean": "bị cô lập, bị cắt đứt liên lạc", "pos": "cụm động từ (bị động)", "vi": "bị cắt đứt khỏi thế giới bên ngoài", "w": "cut off"}, {"ex": "The ship steamed slowly out of the harbor.", "ipa": "/stiːm/", "mean": "(tàu) chạy, di chuyển bằng máy hơi nước/động cơ", "pos": "động từ", "vi": "đang rẽ sóng đi về phía bắc", "w": "steam"}, {"ex": "He hosed off the mud from his boots.", "ipa": "/həʊz ɒf/", "mean": "xịt nước rửa sạch", "pos": "cụm động từ", "vi": "xịt nước rửa", "w": "hose off"}, {"ex": "Take out that stinky garbage, please.", "ipa": "/ˈstɪŋki/", "mean": "hôi thối", "pos": "tính từ (khẩu ngữ)", "vi": "hôi rình", "w": "stinky"}, {"ex": "Whales feed on plankton.", "ipa": "/ˈplæŋktən/", "mean": "sinh vật phù du", "pos": "danh từ", "vi": "sinh vật phù du", "w": "plankton"}, {"ex": "The icebreaker opened a path through the frozen sea.", "ipa": "/ˈaɪsbreɪkə/", "mean": "tàu phá băng", "pos": "danh từ", "vi": "tàu phá băng", "w": "icebreaker"}, {"ex": "Her life revolves around her research.", "ipa": "/rɪˈvɒlv əˈraʊnd/", "mean": "xoay quanh, lấy làm trung tâm", "pos": "cụm động từ", "vi": "xoay quanh", "w": "revolve around"}, {"ex": "He kept erratic working hours.", "ipa": "/ɪˈrætɪk/", "mean": "thất thường, không đều đặn", "pos": "tính từ", "vi": "thất thường", "w": "erratic"}, {"ex": "The museum opened with great fanfare.", "ipa": "/wɪð ɡreɪt ˈfænfeə/", "mean": "rầm rộ, long trọng, được quảng bá rình rang", "pos": "thành ngữ", "vi": "trong sự chào đón rình rang", "w": "with great fanfare"}, {"ex": "She didn't grasp the risks at first.", "ipa": "/ɡrɑːsp/", "mean": "nắm bắt, hiểu thấu", "pos": "động từ", "vi": "hiểu", "w": "grasp"}, {"ex": "Fans milled outside the stadium.", "ipa": "/mɪl/ (milled: /mɪld/)", "mean": "đi lại lộn xộn, tụ tập chen chúc", "pos": "động từ (mill around/alongside)", "vi": "đứng chen chúc", "w": "mill"}], "patterns": [{"ex": "Despite living near the sea, he can't swim.", "exVi": "Dù sống gần biển, anh ấy không biết bơi.", "explain": "Despite đi với V-ing hoặc danh từ để nêu điều trái với kỳ vọng; mệnh đề chính nói kết quả bất ngờ.", "formula": "Despite + V-ing/N, S + V (nghịch với vế trước)", "name": "Despite + V-ing (nhượng bộ)", "src": "Despite being closer to the Rossiya than just about anyone else on Earth, I had no idea what was going on."}, {"ex": "She works harder than just about anyone else here.", "exVi": "Cô ấy làm việc chăm chỉ hơn hầu như bất kỳ ai ở đây.", "explain": "just about = hầu như; dùng để so sánh nhấn mạnh gần như tuyệt đối.", "formula": "be + adj-er/more adj + than just about + anyone/anything else", "name": "So sánh hơn + than just about anyone else", "src": "closer to the Rossiya than just about anyone else on Earth"}, {"ex": "He sat by the window, watching the rain.", "exVi": "Anh ấy ngồi bên cửa sổ, ngắm mưa rơi.", "explain": "Cụm V-ing bổ sung hành động diễn ra cùng lúc với mệnh đề chính.", "formula": "S + be + V-ed, V-ing + ...", "name": "Phân từ hiện tại chỉ hành động đồng thời", "src": "I was cut off from the outside world, steaming north through an empty ocean..."}, {"ex": "It was a week before the package arrived.", "exVi": "Phải một tuần sau gói hàng mới đến.", "explain": "Nhấn mạnh phải mất một khoảng thời gian rồi sự việc mới xảy ra.", "formula": "It was + khoảng thời gian + before + S + V", "name": "It was ... before ... (mãi mới)", "src": "It was several days before I even heard about it."}], "hard": [{"mean": "Tôi chưa thật sự nhận ra những chuyến đi khoa học bằng tàu phá băng này quan trọng đến mức nào.", "parts": "Chủ ngữ: I; Vị ngữ: hadn't fully grasped (quá khứ hoàn thành phủ định); Tân ngữ: mệnh đề danh từ 'what a big deal these scientific icebreaker cruises are' (what a big deal = tầm quan trọng lớn đến mức nào, dạng câu cảm thán trong mệnh đề).", "s": "I hadn't fully grasped what a big deal these scientific icebreaker cruises are."}, {"mean": "Sinh hoạt hằng ngày của tôi gói gọn trong một thế giới kim loại sơn phết nhỏ hẹp, với lịch ngủ, làm, ăn luân phiên thất thường.", "parts": "Chủ ngữ: My daily routine; Vị ngữ: revolved in a painted metallic world; Cụm bổ nghĩa: less than a hundred meters long and twenty (meters) wide (rút gọn, lược 'meters'); Cụm 'with...' chỉ đi kèm: ca kíp luân phiên thất thường giữa ngủ, làm việc, ăn uống.", "s": "My daily routine revolved in a painted metallic world less than a hundred meters long and twenty wide, with erratic rotating shifts of sleep, work, and cafeteria."}], "insight": "Tác giả mở đầu bằng một nghịch lý: ông ở gần sự kiện nhất nhưng lại biết về nó muộn nhất. Qua đó ông cho thấy những vùng cực Bắc xa xôi vừa là nơi diễn ra các cuộc tranh giành địa chính trị, vừa là nơi con người thật sự bị tách khỏi dòng tin tức. Giọng văn tự giễu nhẹ nhàng (đang ngủ hoặc đang xịt rửa lưới plankton hôi) cho thấy khoa học thực địa là công việc lặp đi lặp lại, nhọc nhằn, trái ngược với cảnh \"đại sự\" mà truyền thông kể.\n\nBối cảnh: sự kiện nhắc đến là việc Nga cắm cờ titan dưới đáy biển ở Bắc Cực năm 2007, được dùng như biểu tượng của cuộc đua giành tài nguyên và tuyến hàng hải khi băng tan. Hành lang Tây Bắc (Northwest Passage) là tuyến đường biển nối Đại Tây Dương với Thái Bình Dương qua quần đảo Bắc Cực của Canada, ngày càng khả thi khi băng tan. Tàu CCGS Amundsen là tàu phá băng của Canada được dùng cho nghiên cứu khoa học. Chi tiết về kích thước con tàu và nhịp sống ca kíp nhấn mạnh một thế giới khép kín, nhỏ bé giữa đại dương rộng lớn.\n\nĐiều đáng suy ngẫm là sự đối lập giữa quy mô nhỏ của những người làm khoa học và tầm vóc lớn của các thay đổi mà họ đang ghi nhận. Điều này gắn với chủ đề chung của sách: biến đổi khí hậu và địa chính trị sẽ định hình lại bản đồ thế giới, và Bắc Cực là một trong những nơi đầu tiên cho thấy điều đó.", "insightDone": true}, {"n": 33, "date": "2026-10-28", "source": ["...news crews swarmed the ship's officers and chief scientists. I spotted Louis Fortier, the director of ArcticNet who had invited me along, surrounded by television cameras. He pumped my hand and told me to enjoy myself before being spun around for another interview. A crane lifted the gangplank and the expedition's first rotation—forty scientists, thirty-five crew members of the Canadian Coast Guard, and a handful of journalists—waved at the mass of people standing onshore. Horns blared, a gleaming red helicopter circled overhead, and the two crowds yelled good-byes over the widening slice of water. As we pulled away down the St. Lawrence Seaway, I was surprised to see a few camera crews (and Louis) still milling around on deck. Were they joining the expedition, too, I wondered? Twenty minutes later my question was answered. The ship's helicopter, which had been buzzing around the ship, landed on the aft helipad and ferried them back to Quebec City."], "translation": ["...các đoàn phóng viên vây kín các sĩ quan và những nhà khoa học trưởng của con tàu. Tôi nhận ra Louis Fortier, giám đốc ArcticNet, người đã mời tôi đi cùng, đang bị các máy quay truyền hình vây quanh. Ông bắt tay tôi thật chặt và bảo tôi cứ tận hưởng chuyến đi, rồi lại bị kéo xoay đi để trả lời một cuộc phỏng vấn khác. Một chiếc cần cẩu nhấc cầu tàu lên, và đợt thám hiểm đầu tiên của chuyến đi, gồm bốn mươi nhà khoa học, ba mươi lăm thuyền viên của Lực lượng Bảo vệ Bờ biển Canada và một số ít nhà báo, vẫy chào đám đông đang đứng trên bờ. Còi tàu rú vang, một chiếc trực thăng đỏ bóng loáng lượn vòng trên đầu, và hai đám đông gào lên những lời tạm biệt qua dải nước ngày càng rộng ra. Khi chúng tôi rời bến, đi xuống theo tuyến đường thủy St. Lawrence Seaway, tôi ngạc nhiên khi thấy vài đoàn quay phim (và cả Louis) vẫn còn lảng vảng trên boong. Chẳng lẽ họ cũng tham gia chuyến thám hiểm này sao, tôi tự hỏi. Hai mươi phút sau, câu hỏi của tôi đã có lời đáp. Chiếc trực thăng của tàu, nãy giờ vẫn bay vo ve quanh tàu, hạ cánh xuống bãi đáp phía đuôi và đưa họ quay trở lại thành phố Quebec."], "note": "ArcticNet: mạng lưới nghiên cứu khoa học Bắc Cực của Canada. St. Lawrence Seaway: tuyến đường thủy nối Đại Tây Dương với vùng Ngũ Đại Hồ, thường để nguyên tên. \"Gangplank\" là cầu tàu (tấm ván bắc từ tàu lên bờ). \"Aft helipad\" là bãi đáp trực thăng ở phía đuôi tàu. \"Rotation\" ở đây chỉ một đợt (nhóm người thay phiên nhau) trong chuyến thám hiểm. \"Quebec City\" dịch là thành phố Quebec, khác với tỉnh Quebec.", "vocab": [{"ex": "Fans swarmed the singer as he left the hotel.", "ipa": "/swɔːrm/", "mean": "vây kín, kéo đến đông đúc xung quanh", "pos": "động từ", "vi": "vây kín", "w": "swarm"}, {"ex": "Passengers walked slowly up the gangplank.", "ipa": "/ˈɡæŋplæŋk/", "mean": "tấm ván/cầu bắc lên xuống tàu", "pos": "danh từ", "vi": "cầu tàu", "w": "gangplank"}, {"ex": "He pumped my hand and thanked me warmly.", "ipa": "/pʌmp/", "mean": "bắt tay thật chặt, lắc mạnh tay", "pos": "cụm động từ", "vi": "bắt tay thật chặt", "w": "pump (someone's hand)"}, {"ex": "She spun around when she heard her name.", "ipa": "/spɪn əˈraʊnd/", "mean": "bị xoay người lại, bị kéo đi chỗ khác", "pos": "cụm động từ", "vi": "bị kéo xoay đi", "w": "spin around"}, {"ex": "The second rotation of workers arrives in May.", "ipa": "/roʊˈteɪʃn/", "mean": "đợt, lượt (người luân phiên làm việc)", "pos": "danh từ", "vi": "đợt thám hiểm đầu tiên", "w": "rotation"}, {"ex": "Only a handful of students passed the test.", "ipa": "/ə ˈhændfʊl əv/", "mean": "một số ít", "pos": "cụm từ", "vi": "một số ít", "w": "a handful of"}, {"ex": "Car horns blared in the traffic jam.", "ipa": "/bler/", "mean": "vang lên inh ỏi (còi, nhạc)", "pos": "động từ", "vi": "rú vang", "w": "blare"}, {"ex": "She drove a gleaming black car.", "ipa": "/ˈɡliːmɪŋ/", "mean": "sáng bóng, lấp lánh", "pos": "tính từ", "vi": "bóng loáng", "w": "gleaming"}, {"ex": "People milled around outside waiting for the doors to open.", "ipa": "/mɪl əˈraʊnd/", "mean": "đi lại quanh quẩn, lảng vảng không mục đích", "pos": "cụm động từ", "vi": "lảng vảng", "w": "mill around"}, {"ex": "A drone buzzed around the stadium.", "ipa": "/bʌz əˈraʊnd/", "mean": "bay vo ve quanh", "pos": "cụm động từ", "vi": "bay vo ve quanh", "w": "buzz around"}, {"ex": "The aft deck was empty at night.", "ipa": "/æft/", "mean": "thuộc phía đuôi tàu", "pos": "tính từ", "vi": "phía đuôi", "w": "aft"}, {"ex": "Buses ferried guests from the airport to the hotel.", "ipa": "/ˈferi/", "mean": "đưa đón, chở qua lại", "pos": "động từ", "vi": "đưa họ quay trở lại", "w": "ferry"}], "patterns": [{"ex": "I saw my teacher surrounded by students.", "exVi": "Tôi thấy thầy giáo đang bị học sinh vây quanh.", "explain": "Cụm quá khứ phân từ 'surrounded by...' bổ nghĩa cho danh từ, cho biết trạng thái của người đó.", "formula": "S + V + O + V-ing / Having + ... ", "name": "Phân từ hiện tại chỉ hành động đồng thời / tả cảnh", "src": "I spotted Louis Fortier... surrounded by television cameras."}, {"ex": "He smiled before being led away by the guards.", "exVi": "Anh ấy mỉm cười trước khi bị lính canh dẫn đi.", "explain": "Sau 'before' dùng dạng V-ing; ở đây là bị động 'being + V3' khi chủ ngữ chịu tác động.", "formula": "... before + being + V3", "name": "Câu bị động với trạng từ thời gian (before + V-ing)", "src": "told me to enjoy myself before being spun around for another interview"}, {"ex": "Was she angry with me, I wondered?", "exVi": "Cô ấy có giận mình không nhỉ, tôi tự hỏi.", "explain": "Câu hỏi trực tiếp đặt trước, rồi 'I wondered' chen sau để thuật lại suy nghĩ; giọng văn kể chuyện sinh động.", "formula": "Were they + V-ing ..., I wondered?", "name": "Câu hỏi gián tiếp trong suy nghĩ (đảo ngữ tự thuật)", "src": "Were they joining the expedition, too, I wondered?"}, {"ex": "My brother, who had been waiting for hours, finally left.", "exVi": "Anh trai tôi, người đã đợi hàng giờ, cuối cùng đã bỏ đi.", "explain": "Mệnh đề 'which...' đặt giữa hai dấu phẩy bổ sung thông tin phụ; thì quá khứ hoàn thành tiếp diễn cho hành động kéo dài trước đó.", "formula": "N, which + V ..., + V chính", "name": "Mệnh đề quan hệ không xác định", "src": "The ship's helicopter, which had been buzzing around the ship, landed..."}], "hard": [{"mean": "Cần cẩu nhấc cầu tàu lên, và đợt đầu tiên của chuyến thám hiểm (gồm ba nhóm người được liệt kê) vẫy chào đám đông trên bờ.", "parts": "Chủ ngữ 1: A crane; vị ngữ 1: lifted the gangplank. Chủ ngữ 2: the expedition's first rotation; phần chen giữa hai dấu gạch ngang liệt kê thành phần của đợt này (40 nhà khoa học, 35 thuyền viên, một số nhà báo); vị ngữ 2: waved at the mass of people; 'standing onshore' là cụm phân từ bổ nghĩa cho 'people'.", "s": "A crane lifted the gangplank and the expedition's first rotation—forty scientists, thirty-five crew members of the Canadian Coast Guard, and a handful of journalists—waved at the mass of people standing onshore."}, {"mean": "Khi tàu rời bến xuôi theo tuyến St. Lawrence, tôi ngạc nhiên thấy vài đoàn quay phim (và cả Louis) vẫn còn lảng vảng trên boong.", "parts": "Mệnh đề thời gian: As we pulled away down the St. Lawrence Seaway. Mệnh đề chính: I was surprised to see... ; 'to see' là động từ nguyên mẫu chỉ nguyên nhân của sự ngạc nhiên; 'a few camera crews (and Louis) still milling around on deck' là tân ngữ + V-ing (thấy ai đó đang làm gì).", "s": "As we pulled away down the St. Lawrence Seaway, I was surprised to see a few camera crews (and Louis) still milling around on deck."}], "insight": "Đoạn văn mở đầu bằng một cảnh rất náo nhiệt: báo chí, còi tàu, trực thăng, đám đông tiễn biệt. Chi tiết cuối cùng là điểm nhấn. Các đoàn quay phim và cả Louis Fortier, người đứng đầu ArcticNet, ở lại trên boong thêm một lúc rồi được trực thăng đưa về đất liền. Tác giả dùng câu hỏi ngây thơ \"Chẳng lẽ họ cũng đi cùng sao?\" để tạo một cú ngoặt nhẹ, hơi hài hước. Từ đó có thể thấy chuyến đi được dàn dựng như một sự kiện truyền thông: lễ xuất phát là một màn trình diễn cho công chúng, trong khi công việc khoa học thật sự chỉ bắt đầu khi đám đông đã rời đi. Giọng văn của tác giả nhẹ nhàng, quan sát và hơi mỉa mai, nhưng không công kích ai.\n\nVề bối cảnh: ArcticNet là mạng lưới nghiên cứu khoa học của Canada về Bắc Cực và tác động của biến đổi khí hậu ở đó. Tàu thuộc Lực lượng Bảo vệ Bờ biển Canada, rời Quebec City và đi xuống sông St. Lawrence để ra Bắc Cực. Việc một chuyến khảo sát khoa học thu hút nhiều camera như vậy cho thấy vùng Bắc Cực đang là tâm điểm chú ý của công chúng, vì băng tan ở đây là dấu hiệu rõ nhất của biến đổi khí hậu. Điều này cũng liên quan đến chủ đề chung của cuốn sách, tức là những thay đổi của thế giới trong tương lai gần và cách con người nhìn nhận chúng.", "insightDone": true}, {"n": 34, "date": "2026-10-28", "source": ["That first night at sea, there was quite a party. Off-duty crew ditched their crisp military blues to mingle with the scientists in shorts, T-shirts, and halter tops. The room steamed, a stereo thumped, and everyone got at least mildly inebriated. American icebreaker cruises are dry, but the Canadians open a beer bar two nights a week. This early in the expedition, the selection was astonishing. I bought two bottles of Kilkenny and set out to learn more about the rare caste of scientist called oceanographers. I found one and we shouted back and forth about marine stratification, ocean sampling, the sexual habits of right whales (quite promiscuous), and the sexual habits of cruise scientists (apparently, also so). It was a great time. But by the third beer, when she had touched my arm twice, I figured it was time to leave.", "Three weeks later, after a grueling round-the-clock schedule of moving, anchoring, crane operating, water sampling, and laboratory work, we dis..."], "translation": ["Đêm đầu tiên trên biển, cả tàu mở một bữa tiệc khá náo nhiệt. Các thuyền viên hết ca trực cởi bỏ bộ quân phục xanh chỉnh tề để hòa vào đám nhà khoa học đang mặc quần short, áo phông và áo hai dây. Căn phòng nóng hầm hập, dàn âm thanh dập thình thịch, và ai cũng ngà ngà say ít nhiều. Các chuyến tàu phá băng của Mỹ cấm rượu bia, nhưng người Canada thì mở quầy bia hai đêm mỗi tuần. Vào thời điểm đầu chuyến thám hiểm này, các loại bia thật phong phú đến kinh ngạc. Tôi mua hai chai Kilkenny và bắt tay vào tìm hiểu thêm về một giống nhà khoa học hiếm hoi mang tên nhà hải dương học. Tôi tìm được một người, và chúng tôi hét qua hét lại về sự phân tầng của biển, việc lấy mẫu nước biển, thói quen tình dục của cá voi đầu bò (khá bừa bãi), và thói quen tình dục của các nhà khoa học đi tàu (nghe nói cũng thế). Thật là một buổi vui. Nhưng đến cốc bia thứ ba, khi cô ấy đã chạm vào tay tôi hai lần, tôi nghĩ đã đến lúc rời đi.", "Ba tuần sau, sau một lịch trình khắc nghiệt chạy suốt ngày đêm gồm di chuyển, thả neo, vận hành cần cẩu, lấy mẫu nước và làm việc trong phòng thí nghiệm, chúng tôi..."], "note": "Kilkenny: nhãn bia kem (cream ale) của Ireland. Right whale: cá voi đầu bò (cá voi franca). Halter top: áo hai dây buộc cổ. Oceanographer: nhà hải dương học. \"Inebriated\": say rượu (cách nói trang trọng). \"Dry\" ở đây nghĩa là cấm rượu bia. Từ \"dis...\" ở cuối trang bị cắt giữa chữ, sẽ nối sang trang sau.", "vocab": [{"ex": "He ditched his plan and stayed home.", "ipa": "/dɪtʃ/", "mean": "vứt bỏ, bỏ lại, cởi bỏ", "pos": "động từ (informal)", "vi": "cởi bỏ", "w": "ditch"}, {"ex": "She wore a crisp white shirt to the interview.", "ipa": "/krɪsp/", "mean": "phẳng phiu, chỉnh tề (quần áo)", "pos": "tính từ", "vi": "chỉnh tề", "w": "crisp"}, {"ex": "Guests mingled before dinner.", "ipa": "/ˈmɪŋɡl/", "mean": "hòa vào, giao lưu với đám đông", "pos": "động từ", "vi": "hòa vào", "w": "mingle"}, {"ex": "She wore a halter top on the beach.", "ipa": "/ˈhɔːltər tɒp/", "mean": "áo hai dây buộc cổ", "pos": "danh từ", "vi": "áo hai dây", "w": "halter top"}, {"ex": "The inebriated guest sang loudly.", "ipa": "/ɪˈniːbrieɪtɪd/", "mean": "say rượu", "pos": "tính từ (trang trọng)", "vi": "ngà ngà say", "w": "inebriated"}, {"ex": "The icebreaker cleared a path through the Arctic.", "ipa": "/ˈaɪsbreɪkər/", "mean": "tàu phá băng", "pos": "danh từ", "vi": "tàu phá băng", "w": "icebreaker"}, {"ex": "Water stratification affects ocean life.", "ipa": "/ˌstrætɪfɪˈkeɪʃn/", "mean": "sự phân tầng", "pos": "danh từ (học thuật)", "vi": "sự phân tầng", "w": "stratification"}, {"ex": "Some species are highly promiscuous.", "ipa": "/prəˈmɪskjuəs/", "mean": "bừa bãi trong quan hệ tình dục", "pos": "tính từ", "vi": "bừa bãi", "w": "promiscuous"}, {"ex": "Pilots are a special caste of professionals.", "ipa": "/kɑːst/", "mean": "giai tầng, giống, nhóm người riêng biệt", "pos": "danh từ", "vi": "giống", "w": "caste"}, {"ex": "The marathon was a grueling test.", "ipa": "/ˈɡruːəlɪŋ/", "mean": "vất vả, kiệt sức", "pos": "tính từ", "vi": "khắc nghiệt", "w": "grueling"}, {"ex": "They anchored near the island.", "ipa": "/ˈæŋkər/", "mean": "thả neo, neo đậu", "pos": "động từ", "vi": "thả neo", "w": "anchor"}, {"ex": "The hospital offers round-the-clock care.", "ipa": "/ˌraʊnd ðə ˈklɒk/", "mean": "suốt ngày đêm", "pos": "tính từ", "vi": "chạy suốt ngày đêm", "w": "round-the-clock"}], "patterns": [{"ex": "She set out to prove her theory.", "exVi": "Cô ấy bắt tay vào chứng minh giả thuyết của mình.", "explain": "Diễn tả việc bắt đầu làm gì với mục đích rõ ràng.", "formula": "set out to + V nguyên mẫu", "name": "Cấu trúc 'set out to + động từ'", "src": "I bought two bottles of Kilkenny and set out to learn more about the rare caste of scientist"}, {"ex": "By midnight, everyone had left.", "exVi": "Đến nửa đêm thì mọi người đã về hết.", "explain": "'By' nghĩa là 'đến lúc'. Quá khứ hoàn thành (had touched) diễn tả việc xảy ra trước mốc đó.", "formula": "By + danh từ thời gian, S + V", "name": "By + thời điểm, mệnh đề (đến lúc thì đã)", "src": "But by the third beer, when she had touched my arm twice, I figured it was time to leave."}, {"ex": "I figured it was time to go home.", "exVi": "Tôi nghĩ đã đến lúc về nhà.", "explain": "Đã đến lúc làm gì; 'figure' nghĩa là nghĩ, đoán.", "formula": "it is/was time to + V nguyên mẫu", "name": "It was time to + V", "src": "I figured it was time to leave."}, {"ex": "The day was full of meeting, writing, and traveling.", "exVi": "Ngày hôm đó đầy ắp họp hành, viết lách và đi lại.", "explain": "Dùng chuỗi danh động từ/danh từ song song để liệt kê hoạt động.", "formula": "a schedule of + V-ing, V-ing, and V-ing", "name": "Liệt kê danh động từ sau 'of'", "src": "a grueling round-the-clock schedule of moving, anchoring, crane operating, water sampling, and laboratory work"}], "hard": [{"mean": "Các thuyền viên hết ca cởi quân phục để hòa vào đám nhà khoa học đang mặc đồ thoải mái.", "parts": "Chủ ngữ: Off-duty crew (thuyền viên hết ca). Vị ngữ: ditched their crisp military blues (cởi bỏ quân phục xanh chỉnh tề). Mục đích: to mingle with the scientists. Cụm giới từ 'in shorts, T-shirts, and halter tops' bổ nghĩa cho 'the scientists' (những người mặc...).", "s": "Off-duty crew ditched their crisp military blues to mingle with the scientists in shorts, T-shirts, and halter tops."}, {"mean": "Tôi tìm được một nhà hải dương học và chúng tôi hét qua hét lại về nhiều chủ đề, kể cả chuyện tình dục của cá voi và của giới khoa học trên tàu.", "parts": "Hai vế nối bằng 'and': (1) I found one; (2) we shouted back and forth about... Sau 'about' là danh sách bốn chủ đề. Ngoặc đơn là lời bình thêm; 'also so' = also promiscuous (tránh lặp từ).", "s": "I found one and we shouted back and forth about marine stratification, ocean sampling, the sexual habits of right whales (quite promiscuous), and the sexual habits of cruise scientists (apparently, also so)."}], "insight": "Đoạn văn mở đầu bằng một cảnh tiệc tùng nhẹ nhàng, hóm hỉnh để đưa người đọc vào đời sống thật của một chuyến tàu phá băng nghiên cứu: không chỉ là khoa học nghiêm túc, mà còn là một cộng đồng nhỏ bị cách ly, sống chung nhiều tuần giữa biển. Chi tiết vui như \"quân phục chỉnh tề\" đổi thành quần short và áo phông, hay việc tàu Mỹ cấm rượu còn người Canada mở quầy bia, cho thấy sự khác biệt văn hóa và cách con người tìm niềm vui để giải tỏa áp lực. Giọng kể tự giễu, dí dỏm (gọi nhà hải dương học là một \"giống\" hiếm, so sánh thói quen tình dục của cá voi với của các nhà khoa học) nhằm làm cho khoa học trở nên gần gũi, đời thường.\n\nVề bối cảnh, \"phân tầng\" (stratification) trong hải dương học là hiện tượng nước biển chia thành các lớp theo nhiệt độ và độ mặn, ảnh hưởng đến dòng hải lưu và sự trao đổi nhiệt, khí giữa các tầng nước. Câu \"Ba tuần sau...\" tạo sự tương phản rõ rệt: từ đêm tiệc vui vẻ sang nhịp làm việc khắc nghiệt suốt ngày đêm, gợi ý rằng dữ liệu khoa học về đại dương và khí hậu phải đánh đổi bằng sức lao động rất lớn. Từ trang này tôi chỉ có thể suy ra đến đó, còn mạch lập luận lớn hơn của sách thì cần đọc tiếp mới rõ.", "insightDone": true}, {"n": 35, "date": "2026-10-28", "source": ["...embarked in Churchill, Manitoba. A new rotation of scientists and crew were waiting excitedly to board the ship. It felt strange to give up my tiny cabin, familiar narrow hallways, and new friends to a bunch of strangers. But our rotation was just the first of many. The Amundsen was in her first leg of a historic 448-day journey, the longest scientific cruise ever undertaken in the Arctic. Over the next fifteen months she would cycle through some two hundred people and shock the world by gliding easily through the Northwest Passage. At a cost of $40 million, the expedition was Canada's biggest contribution to the 2007-2009 International Polar Year. While less splashy than the titanium Russian flag, Canada, too, was asserting its presence in the new Arctic Ocean.", "Who Owns the North Pole?"], "translation": ["...rời tàu tại Churchill, Manitoba. Một ca luân phiên mới gồm các nhà khoa học và thủy thủ đoàn đang háo hức chờ lên tàu. Thật lạ lẫm khi phải nhường căn phòng bé xíu, những hành lang hẹp quen thuộc và những người bạn mới của mình cho một đám người xa lạ. Nhưng đợt của chúng tôi mới chỉ là đợt đầu tiên trong rất nhiều đợt. Tàu Amundsen đang ở chặng đầu của một hành trình lịch sử kéo dài 448 ngày, chuyến khảo sát khoa học dài nhất từng được thực hiện ở Bắc Cực. Trong mười lăm tháng tiếp theo, con tàu sẽ luân chuyển qua khoảng hai trăm người và khiến thế giới sửng sốt khi lướt nhẹ nhàng qua Hành lang Tây Bắc. Với chi phí 40 triệu đô la, chuyến thám hiểm này là đóng góp lớn nhất của Canada cho Năm Địa cực Quốc tế 2007-2009. Tuy kém ồn ào hơn lá cờ titan của Nga, Canada cũng đang khẳng định sự hiện diện của mình ở Bắc Băng Dương mới.", "Ai sở hữu Bắc Cực?"], "note": "\"Amundsen\" là tên tàu nghiên cứu phá băng của Canada (CCGS Amundsen), đặt theo nhà thám hiểm Roald Amundsen. \"Northwest Passage\" là Hành lang Tây Bắc, tuyến đường biển qua quần đảo Bắc Cực của Canada nối Đại Tây Dương với Thái Bình Dương. \"International Polar Year\" là Năm Địa cực Quốc tế, chương trình nghiên cứu cực quốc tế. \"Rotation\" ở đây là đợt/ca luân phiên của đoàn khoa học. \"Titanium Russian flag\" nói đến lá cờ titan Nga cắm xuống đáy biển ở Bắc Cực năm 2007. Câu đầu bị cắt giữa chừng nên tôi dịch \"embarked\" theo ngữ cảnh là rời tàu, vì đoàn mới đang chờ lên tàu.", "vocab": [{"ex": "Passengers embarked at dawn.", "ipa": "/ɪmˈbɑːk/", "mean": "lên tàu; (ở đây) bắt đầu một chuyến đi", "pos": "động từ", "vi": "rời tàu", "w": "embark"}, {"ex": "The night rotation starts at ten.", "ipa": "/rəʊˈteɪʃn/", "mean": "ca/đợt luân phiên (nhóm người thay nhau làm việc)", "pos": "danh từ", "vi": "ca luân phiên", "w": "rotation"}, {"ex": "A bunch of kids were playing outside.", "ipa": "/ə bʌntʃ əv/", "mean": "một nhóm, một đám (người/vật)", "pos": "cụm từ (thân mật)", "vi": "một đám người", "w": "a bunch of"}, {"ex": "The first leg of the trip was the longest.", "ipa": "/leɡ/", "mean": "chặng (của một hành trình)", "pos": "danh từ", "vi": "chặng đầu", "w": "leg"}, {"ex": "She undertook a major research project.", "ipa": "/ˌʌndəˈteɪk/", "mean": "đảm nhận, tiến hành (việc lớn)", "pos": "động từ (undertake, undertook, undertaken)", "vi": "được thực hiện", "w": "undertake"}, {"ex": "The team cycled through three managers in a year.", "ipa": "/ˈsaɪkl θruː/", "mean": "lần lượt đi qua, luân chuyển hết nhiều người/vật", "pos": "cụm động từ", "vi": "luân chuyển qua", "w": "cycle through"}, {"ex": "The boat glided across the lake.", "ipa": "/ɡlaɪd/", "mean": "lướt đi nhẹ nhàng, êm ái", "pos": "động từ", "vi": "lướt nhẹ nhàng", "w": "glide"}, {"ex": "The expedition lasted two years.", "ipa": "/ˌekspəˈdɪʃn/", "mean": "chuyến thám hiểm", "pos": "danh từ", "vi": "chuyến thám hiểm", "w": "expedition"}, {"ex": "The company launched a splashy ad campaign.", "ipa": "/ˈsplæʃi/", "mean": "gây chú ý, phô trương, ồn ào", "pos": "tính từ (thân mật)", "vi": "ồn ào", "w": "splashy"}, {"ex": "The country asserted its right to the islands.", "ipa": "/əˈsɜːt/", "mean": "khẳng định (quyền, vị thế, sự hiện diện)", "pos": "động từ", "vi": "khẳng định", "w": "assert"}, {"ex": "The frame is made of titanium.", "ipa": "/tɪˈteɪniəm/", "mean": "titan (kim loại nhẹ, bền)", "pos": "danh từ", "vi": "titan", "w": "titanium"}], "patterns": [{"ex": "He didn't know he would become famous.", "exVi": "Anh ấy không biết rằng mình sẽ trở nên nổi tiếng.", "explain": "Dùng would để kể về sự việc sẽ xảy ra sau một thời điểm trong câu chuyện, thường mang giọng người kể nhìn lại.", "formula": "S + would + V (nói về điều xảy ra sau mốc thời gian đã nêu)", "name": "Tương lai trong quá khứ với would", "src": "Over the next fifteen months she would cycle through some two hundred people..."}, {"ex": "It felt great to finish the exam.", "exVi": "Thật tuyệt khi hoàn thành bài thi.", "explain": "It đứng trước làm chủ ngữ giả, cụm to V phía sau mới là chủ ngữ thật, diễn tả cảm giác hoặc đánh giá.", "formula": "It + felt/is + adj + to + V", "name": "Giả chủ ngữ It + to V", "src": "It felt strange to give up my tiny cabin..."}, {"ex": "While smaller than my old flat, the new one is cozier.", "exVi": "Tuy nhỏ hơn căn hộ cũ, căn mới lại ấm cúng hơn.", "explain": "While rút gọn (lược S + be) mang nghĩa 'tuy... nhưng', nêu điểm kém hơn rồi đối lập với ý chính.", "formula": "While + adj-er/less + than + N, S + V", "name": "While + tính từ so sánh (nhượng bộ rút gọn)", "src": "While less splashy than the titanium Russian flag, Canada, too, was asserting its presence..."}, {"ex": "He climbed Everest, the highest mountain ever climbed by his family.", "exVi": "Anh ấy leo Everest, ngọn núi cao nhất mà gia đình anh từng chinh phục.", "explain": "Cụm danh từ sau dấu phẩy giải thích thêm cho danh từ trước đó. Ever + quá khứ phân từ nhấn mạnh 'từng có'.", "formula": "S, + the + N (cụm bổ sung), + V", "name": "Đồng vị ngữ với dấu phẩy", "src": "The Amundsen was in her first leg of a historic 448-day journey, the longest scientific cruise ever undertaken..."}], "hard": [{"mean": "Trong mười lăm tháng sau đó, con tàu sẽ có khoảng hai trăm người lần lượt lên xuống, và làm thế giới kinh ngạc khi lướt qua Hành lang Tây Bắc một cách dễ dàng.", "parts": "Trạng ngữ thời gian: Over the next fifteen months. Chủ ngữ: she (con tàu). Vị ngữ 1: would cycle through some two hundred people. Vị ngữ 2: (would) shock the world. By + V-ing: by gliding easily through the Northwest Passage chỉ cách thức.", "s": "Over the next fifteen months she would cycle through some two hundred people and shock the world by gliding easily through the Northwest Passage."}, {"mean": "Dù ít phô trương hơn việc Nga cắm lá cờ titan, Canada cũng đang khẳng định sự hiện diện của mình ở Bắc Băng Dương mới.", "parts": "Mệnh đề nhượng bộ rút gọn: While (it was) less splashy than the titanium Russian flag. Chủ ngữ: Canada. too chèn giữa hai dấu phẩy. Vị ngữ: was asserting its presence in the new Arctic Ocean (quá khứ tiếp diễn).", "s": "While less splashy than the titanium Russian flag, Canada, too, was asserting its presence in the new Arctic Ocean."}], "insight": "Tác giả dùng một chi tiết nhỏ, cảm giác tiếc nuối khi phải nhường cabin và những người bạn cho ca luân phiên mới, để dẫn sang một bức tranh lớn hơn: chuyến đi của tàu Amundsen không chỉ là hoạt động khoa học thuần túy mà còn là một hành động mang tính chính trị. Câu \"Canada, too, was asserting its presence\" là mấu chốt: tác giả so sánh hai cách khẳng định chủ quyền ở Bắc Cực, một bên là hành động phô trương như việc Nga cắm cờ titan dưới đáy biển năm 2007, bên kia là sự hiện diện bền bỉ, lặng lẽ bằng nghiên cứu khoa học. Cụm \"less splashy\" có chút giọng mỉa nhẹ, vì \"splashy\" vừa nghĩa là gây chú ý, vừa gợi hình ảnh nước bắn tung tóe.\n\nVề bối cảnh, Amundsen là tàu phá băng của Canada, đặt theo tên nhà thám hiểm Na Uy Roald Amundsen, người đầu tiên đi qua Hành lang Tây Bắc bằng tàu (1903–1906). Hành lang Tây Bắc là tuyến đường biển qua quần đảo Bắc Cực của Canada, nối Đại Tây Dương với Thái Bình Dương; trước đây bị băng chặn, nay băng tan khiến tàu \"lướt nhẹ nhàng\" qua được, và đó là lý do thế giới sửng sốt. Năm Địa cực Quốc tế 2007–2009 là chương trình nghiên cứu cực quy mô toàn cầu. Tiêu đề \"Ai sở hữu Bắc Cực?\" cho thấy chủ đề chung của cuốn sách: khi khí hậu thay đổi, vùng đất băng từng bị bỏ quên trở thành nơi các quốc gia tranh giành tài nguyên, tuyến hàng hải và ảnh hưởng, còn khoa học có thể đồng thời là công cụ tìm hiểu lẫn công cụ khẳng định quyền lực.", "insightDone": true}, {"n": 36, "date": "2026-10-28", "source": ["Unlike the Amundsen expedition, Chilingarov's dive to the North Pole was privately funded and really just a daring stunt. But that didn't stop the flag-planting from triggering an international commotion. Russia's response was that the flag was merely symbolic: The United States once planted a flag on the moon—did anyone seriously consider that a declaration of legal sovereignty? Her real claim to the North Pole was not from a flag, but from the geological samples collected by this and many other Russian expeditions in the Arctic. These data would prove that the Lomonosov Ridge—an underwater mountain chain, rising some three thousand meters above the seafloor, that bisects the Arctic Ocean—was geologically attached to Russia's continental shelf. This would win her sovereignty of a huge chunk of ocean floor—possibly including the North Pole—in accordance with the United Nations Convention on the Law of the Sea (UNCLOS)."], "translation": ["Không giống chuyến thám hiểm của tàu Amundsen, chuyến lặn xuống Bắc Cực của Chilingarov do tư nhân tài trợ và thực chất chỉ là một màn liều lĩnh để gây chú ý. Nhưng điều đó không ngăn việc cắm cờ gây ra một làn sóng xôn xao quốc tế. Phản ứng của Nga là lá cờ chỉ mang tính biểu tượng: Hoa Kỳ cũng từng cắm cờ trên Mặt Trăng, vậy có ai nghiêm túc coi đó là một tuyên bố chủ quyền pháp lý không? Yêu sách thực sự của Nga đối với Bắc Cực không đến từ một lá cờ, mà từ các mẫu địa chất do chuyến thám hiểm này cùng nhiều chuyến thám hiểm khác của Nga ở Bắc Cực thu thập. Những dữ liệu này sẽ chứng minh rằng Dãy Lomonosov, một chuỗi núi dưới nước cao khoảng ba nghìn mét so với đáy biển và cắt đôi Bắc Băng Dương, về mặt địa chất gắn liền với thềm lục địa của Nga. Điều này sẽ giúp Nga giành được chủ quyền đối với một vùng đáy đại dương rộng lớn, có thể bao gồm cả Bắc Cực, theo Công ước Liên Hợp Quốc về Luật Biển (UNCLOS)."], "note": "Chilingarov: Artur Chilingarov, nhà thám hiểm Nga, người điều khiển chuyến lặn và cắm cờ titan năm 2007. Dãy Lomonosov (Lomonosov Ridge): dãy núi ngầm dưới Bắc Băng Dương. Thềm lục địa (continental shelf) và chủ quyền (sovereignty) là thuật ngữ luật biển. UNCLOS: Công ước Liên Hợp Quốc về Luật Biển. Trong bản gốc, \"her\" chỉ nước Nga (cách gọi nhân cách hóa), nên bản dịch dùng \"Nga\".", "vocab": [{"ex": "She made a daring escape from the burning building.", "ipa": "/ˈdeərɪŋ/", "mean": "táo bạo, liều lĩnh", "pos": "adj (tính từ)", "vi": "liều lĩnh", "w": "daring"}, {"ex": "The company's publicity stunt went viral.", "ipa": "/stʌnt/", "mean": "màn biểu diễn gây chú ý, chiêu trò", "pos": "n (danh từ)", "vi": "màn liều lĩnh để gây chú ý", "w": "stunt"}, {"ex": "There was a commotion outside the embassy.", "ipa": "/kəˈmoʊʃn/", "mean": "sự xôn xao, náo động", "pos": "n (danh từ)", "vi": "làn sóng xôn xao", "w": "commotion"}, {"ex": "It was merely a rumor, not a fact.", "ipa": "/ˈmɪrli/", "mean": "chỉ là, đơn thuần", "pos": "adv (trạng từ)", "vi": "chỉ", "w": "merely"}, {"ex": "The handshake was a symbolic gesture of peace.", "ipa": "/sɪmˈbɑːlɪk/", "mean": "mang tính biểu tượng", "pos": "adj (tính từ)", "vi": "mang tính biểu tượng", "w": "symbolic"}, {"ex": "The island's sovereignty is disputed by two countries.", "ipa": "/ˈsɑːvrənti/", "mean": "chủ quyền", "pos": "n (danh từ)", "vi": "chủ quyền", "w": "sovereignty"}, {"ex": "Geological surveys revealed large oil reserves.", "ipa": "/ˌdʒiːəˈlɑːdʒɪkl/", "mean": "thuộc địa chất", "pos": "adj (tính từ)", "vi": "địa chất", "w": "geological"}, {"ex": "The hikers followed the ridge to the summit.", "ipa": "/rɪdʒ/", "mean": "dãy núi, sống núi", "pos": "n (danh từ)", "vi": "Dãy", "w": "ridge"}, {"ex": "The river bisects the city.", "ipa": "/baɪˈsekt/", "mean": "cắt đôi, chia làm hai", "pos": "v (động từ)", "vi": "cắt đôi", "w": "bisect"}, {"ex": "Fishing is common on the continental shelf.", "ipa": "/ˌkɑːntɪˈnentl ʃelf/", "mean": "thềm lục địa", "pos": "n (cụm danh từ)", "vi": "thềm lục địa", "w": "continental shelf"}, {"ex": "The work was done in accordance with safety rules.", "ipa": "/ɪn əˈkɔːrdns wɪð/", "mean": "theo, phù hợp với", "pos": "prep phrase (cụm giới từ)", "vi": "theo", "w": "in accordance with"}, {"ex": "Several nations have a claim to the territory.", "ipa": "/kleɪm/", "mean": "yêu sách, yêu cầu chủ quyền", "pos": "n (danh từ)", "vi": "Yêu sách", "w": "claim"}], "patterns": [{"ex": "Unlike his brother, Tom prefers staying home.", "exVi": "Không giống anh trai, Tom thích ở nhà hơn.", "explain": "Dùng 'Unlike' để đối chiếu hai đối tượng, nêu điểm khác biệt ở mệnh đề chính.", "formula": "Unlike + danh từ, + mệnh đề", "name": "Không giống... (đối lập với)", "src": "Unlike the Amundsen expedition, Chilingarov's dive to the North Pole was privately funded..."}, {"ex": "His success was not from luck, but from hard work.", "exVi": "Thành công của anh ấy không đến từ may mắn, mà từ sự chăm chỉ.", "explain": "Phủ định một nguồn gốc rồi khẳng định nguồn gốc thật sự bằng 'not... but...'.", "formula": "S + was/is not from A, but from B", "name": "Nhấn mạnh bằng cấu trúc phủ định – khẳng định", "src": "Her real claim to the North Pole was not from a flag, but from the geological samples..."}, {"ex": "The Mekong—a river that flows through six countries—supports millions of people.", "exVi": "Sông Mê Kông, dòng sông chảy qua sáu quốc gia, nuôi sống hàng triệu người.", "explain": "Phần giữa hai dấu gạch ngang bổ sung thông tin về danh từ đứng trước, không làm đổi cấu trúc câu chính.", "formula": "Danh từ — a/an + cụm danh từ + mệnh đề quan hệ — + động từ", "name": "Mệnh đề quan hệ rút gọn / đồng vị ngữ chèn giữa hai dấu gạch ngang", "src": "the Lomonosov Ridge—an underwater mountain chain, rising some three thousand meters above the seafloor, that bisects the Arctic Ocean—was geologically attached..."}, {"ex": "Everyone makes mistakes—who can say they are perfect?", "exVi": "Ai cũng mắc lỗi, ai dám nói mình hoàn hảo?", "explain": "Câu hỏi không cần trả lời, hàm ý đáp án là 'không ai cả', dùng để phản bác.", "formula": "Fact — did anyone seriously consider...?", "name": "Câu hỏi tu từ", "src": "The United States once planted a flag on the moon—did anyone seriously consider that a declaration of legal sovereignty?"}], "hard": [{"mean": "Những dữ liệu này sẽ chứng minh Dãy Lomonosov, một chuỗi núi dưới nước cao khoảng 3.000 m và cắt đôi Bắc Băng Dương, về địa chất liền với thềm lục địa của Nga.", "parts": "Chủ ngữ: These data. Vị ngữ: would prove. Mệnh đề danh ngữ (that...): the Lomonosov Ridge was geologically attached to Russia's continental shelf. Phần chèn giữa hai dấu gạch ngang: an underwater mountain chain (đồng vị ngữ) + rising... seafloor (cụm phân từ) + that bisects the Arctic Ocean (mệnh đề quan hệ).", "s": "These data would prove that the Lomonosov Ridge—an underwater mountain chain, rising some three thousand meters above the seafloor, that bisects the Arctic Ocean—was geologically attached to Russia's continental shelf."}, {"mean": "Điều đó sẽ giúp Nga giành chủ quyền một vùng đáy biển rộng lớn, có thể gồm cả Bắc Cực, theo Công ước Liên Hợp Quốc về Luật Biển.", "parts": "Chủ ngữ: This (việc chứng minh đó). Vị ngữ: would win her sovereignty of a huge chunk of ocean floor (her = Russia). Phần chèn: possibly including the North Pole. Trạng ngữ: in accordance with UNCLOS.", "s": "This would win her sovereignty of a huge chunk of ocean floor—possibly including the North Pole—in accordance with the United Nations Convention on the Law of the Sea (UNCLOS)."}], "insight": "Tác giả chỉ ra khoảng cách giữa hình ảnh và thực chất trong tranh chấp chủ quyền. Việc cắm cờ dưới đáy biển năm 2007 là một màn trình diễn gây chú ý, và chính Nga cũng thừa nhận nó chỉ mang tính biểu tượng, với lập luận so sánh với lá cờ Mỹ trên Mặt Trăng (cắm cờ không có nghĩa là tuyên bố chủ quyền pháp lý). Điều thật sự có sức nặng là bằng chứng khoa học và khung pháp lý: các mẫu địa chất được dùng để chứng minh Dãy Lomonosov là phần nối dài của thềm lục địa Nga.\n\nVề kiến thức nền, theo Công ước Liên Hợp Quốc về Luật Biển (UNCLOS), một quốc gia có thể đòi quyền đối với đáy biển và tài nguyên bên dưới nếu chứng minh được vùng đó là phần kéo dài tự nhiên của thềm lục địa mình. Vì vậy địa chất trở thành công cụ chính trị: ai chứng minh được mối liên hệ địa chất thì có cơ sở đòi quyền. Cần lưu ý đây là quyền đối với đáy biển, không phải chủ quyền với mặt nước hay vùng băng phía trên. Cũng nên để ý giọng điệu hơi mỉa mai của tác giả khi gọi chuyến lặn là \"màn liều lĩnh\" (stunt), đối lập với chuyến thám hiểm Amundsen mang tính khám phá thật sự.\n\nĐiều đáng suy ngẫm là trong cuộc cạnh tranh tài nguyên và lãnh thổ mới như Bắc Cực, biểu tượng thu hút dư luận nhưng luật pháp và dữ liệu khoa học mới quyết định kết quả.", "insightDone": true}, {"n": 37, "date": "2026-10-28", "source": ["UNCLOS and geology are critically important to this story, as we shall see shortly. But in late 2007 the world's eyes were transfixed by that flag, not sediment samples. The great global economic contraction was still a year away. Energy demand was soaring and resurgent Russia, fueled by hundred-dollars-a-barrel oil and Putin's steely gaze, was growing increasingly assertive on the world stage. Two months later, when the news hit about the record-shattering low in the amount of summertime Arctic sea ice,325 the image of uncorked shipping lanes, vast new energy reserves, and Russians planting flags in a brand-new ocean proved too much to resist. Arctic fever went viral. Headlines and pundits declared that a new colonial race for the frontier—a \"mad scramble\" for control of the Arctic Ocean and its vast presumed resources—had begun.326"], "translation": ["UNCLOS và địa chất có vai trò cực kỳ quan trọng trong câu chuyện này, như chúng ta sẽ sớm thấy. Nhưng vào cuối năm 2007, cả thế giới đổ dồn mắt vào lá cờ ấy chứ không phải những mẫu trầm tích. Cuộc suy thoái kinh tế toàn cầu lớn còn một năm nữa mới xảy ra. Nhu cầu năng lượng tăng vọt, và nước Nga đang trỗi dậy, được tiếp sức bởi giá dầu một trăm đô la một thùng cùng ánh nhìn sắt đá của Putin, ngày càng tỏ ra quyết đoán hơn trên sân khấu thế giới. Hai tháng sau, khi có tin lượng băng biển Bắc Cực vào mùa hè xuống mức thấp kỷ lục,325 hình ảnh những tuyến hàng hải được khai thông, những trữ lượng năng lượng mới khổng lồ và người Nga cắm cờ trên một đại dương hoàn toàn mới đã trở nên quá sức cưỡng. Cơn sốt Bắc Cực lan truyền chóng mặt. Các báo và các nhà bình luận tuyên bố rằng một cuộc chạy đua thực dân mới nhằm chiếm lĩnh vùng biên cương này, một cuộc \"tranh giành điên cuồng\" quyền kiểm soát Bắc Băng Dương và các nguồn tài nguyên khổng lồ được cho là tồn tại ở đó, đã bắt đầu.326"], "note": "UNCLOS: Công ước Liên Hợp Quốc về Luật Biển (đã dịch ở trang trước). \"Went viral\": lan truyền nhanh chóng (như trên mạng). \"Uncorked shipping lanes\": nghĩa bóng là các tuyến hàng hải được \"mở nút\", tức thông thoáng nhờ băng tan. \"Steely gaze\": ánh nhìn sắt đá, ám chỉ phong cách cứng rắn của Putin. Các số 325, 326 là số chú thích cuối sách.", "vocab": [{"ex": "The audience was transfixed by her performance.", "ipa": "/trænsˈfɪkst/", "mean": "bị cuốn hút, chết lặng không rời mắt", "pos": "tính từ (quá khứ phân từ)", "vi": "đổ dồn mắt vào", "w": "transfixed"}, {"ex": "The economy suffered a sharp contraction last year.", "ipa": "/kənˈtrækʃn/", "mean": "sự co lại, suy giảm (kinh tế)", "pos": "danh từ", "vi": "suy thoái kinh tế", "w": "contraction"}, {"ex": "Soaring prices made food hard to afford.", "ipa": "/ˈsɔːrɪŋ/", "mean": "tăng vọt, tăng vọt", "pos": "tính từ", "vi": "tăng vọt", "w": "soaring"}, {"ex": "A resurgent China changed regional politics.", "ipa": "/rɪˈsɜːrdʒənt/", "mean": "trỗi dậy trở lại", "pos": "tính từ", "vi": "đang trỗi dậy", "w": "resurgent"}, {"ex": "Her success was fueled by hard work.", "ipa": "/ˈfjuːəld baɪ/", "mean": "được tiếp sức, được thúc đẩy bởi", "pos": "cụm động từ (bị động)", "vi": "được tiếp sức bởi", "w": "fueled by"}, {"ex": "He gave her a steely look.", "ipa": "/ˈstiːli/", "mean": "sắt đá, lạnh lùng và cứng rắn", "pos": "tính từ", "vi": "sắt đá", "w": "steely"}, {"ex": "She became more assertive in meetings.", "ipa": "/əˈsɜːrtɪv/", "mean": "quyết đoán, khẳng định mạnh mẽ", "pos": "tính từ", "vi": "quyết đoán", "w": "assertive"}, {"ex": "The team posted a record-shattering score.", "ipa": "/ˈrekərd ˈʃætərɪŋ/", "mean": "phá vỡ kỷ lục", "pos": "tính từ ghép", "vi": "thấp kỷ lục", "w": "record-shattering"}, {"ex": "The uncorked bottle was left on the table.", "ipa": "/ʌnˈkɔːrkt/", "mean": "được khai thông, mở nút chai", "pos": "tính từ (nghĩa bóng)", "vi": "được khai thông", "w": "uncorked"}, {"ex": "The video went viral within hours.", "ipa": "/ɡoʊ ˈvaɪrəl/", "mean": "lan truyền chóng mặt (trên mạng)", "pos": "thành ngữ", "vi": "lan truyền chóng mặt", "w": "go viral"}, {"ex": "Political pundits disagreed about the result.", "ipa": "/ˈpʌndɪt/", "mean": "nhà bình luận, chuyên gia bình luận", "pos": "danh từ", "vi": "các nhà bình luận", "w": "pundit"}, {"ex": "There was a mad scramble for the last tickets.", "ipa": "/mæd ˈskræmbl/", "mean": "cuộc tranh giành hỗn loạn, điên cuồng", "pos": "cụm danh từ", "vi": "tranh giành điên cuồng", "w": "mad scramble"}], "patterns": [{"ex": "The company, backed by investors, expanded abroad.", "exVi": "Công ty, được các nhà đầu tư hậu thuẫn, đã mở rộng ra nước ngoài.", "explain": "Cụm phân từ quá khứ đặt giữa hai dấu phẩy, bổ sung nguyên nhân hoặc nguồn động lực cho chủ ngữ.", "formula": "S, (Ved/V3) + by + N, V...", "name": "Phân từ quá khứ làm trạng ngữ bổ nghĩa", "src": "resurgent Russia, fueled by hundred-dollars-a-barrel oil and Putin's steely gaze, was growing increasingly assertive"}, {"ex": "a ten-minute break", "exVi": "một giờ nghỉ giải lao mười phút", "explain": "Nhiều từ nối bằng gạch nối đóng vai trò một tính từ bổ nghĩa cho danh từ đứng sau.", "formula": "number + noun-singular + noun → tính từ", "name": "Danh từ ghép làm tính từ có gạch nối", "src": "hundred-dollars-a-barrel oil"}, {"ex": "The offer proved too good to refuse.", "exVi": "Lời đề nghị hóa ra quá hấp dẫn nên không thể từ chối.", "explain": "Cấu trúc 'too ... to' diễn tả mức độ quá mức khiến không thể làm gì; 'prove' ở đây nghĩa là 'hóa ra là'.", "formula": "When + clause, S + proved + too + adj + to V", "name": "Mệnh đề when + câu chủ chính, nhấn mạnh với 'proved too much to resist'", "src": "the image ... proved too much to resist"}, {"ex": "A new rival—a startup from Seoul—entered the market.", "exVi": "Một đối thủ mới, một công ty khởi nghiệp từ Seoul, đã gia nhập thị trường.", "explain": "Dấu gạch ngang chèn một cụm danh từ để diễn giải, làm rõ danh từ đứng trước.", "formula": "N — N phrase — V", "name": "Đồng cách bằng dấu gạch ngang", "src": "a new colonial race for the frontier—a \"mad scramble\" for control ... —had begun"}], "hard": [{"mean": "Báo chí và các nhà bình luận tuyên bố một cuộc chạy đua thực dân mới đã bắt đầu, tức là cuộc tranh giành điên cuồng để kiểm soát Bắc Băng Dương và nguồn tài nguyên được cho là khổng lồ.", "parts": "Chủ ngữ: Headlines and pundits. Vị ngữ: declared. Mệnh đề that: a new colonial race for the frontier ... had begun. Phần giữa hai gạch ngang là đồng vị ngữ giải thích 'race'. 'presumed' = được cho là có.", "s": "Headlines and pundits declared that a new colonial race for the frontier—a \"mad scramble\" for control of the Arctic Ocean and its vast presumed resources—had begun."}, {"mean": "Nhu cầu năng lượng tăng vọt, còn nước Nga trỗi dậy, được giá dầu cao và sự cứng rắn của Putin tiếp sức, ngày càng quyết đoán trên trường quốc tế.", "parts": "Hai mệnh đề nối bằng and. Mệnh đề 1: Energy demand was soaring. Mệnh đề 2: chủ ngữ resurgent Russia, vị ngữ was growing increasingly assertive, cụm phân từ fueled by ... chen giữa, trạng ngữ on the world stage.", "s": "Energy demand was soaring and resurgent Russia, fueled by hundred-dollars-a-barrel oil and Putin's steely gaze, was growing increasingly assertive on the world stage."}], "insight": "Tác giả đang dựng lại cách một sự kiện mang tính biểu tượng biến thành một làn sóng cường điệu của truyền thông. Lá cờ mà người Nga cắm xuống đáy biển Bắc Cực (tháng 8/2007) về mặt pháp lý chẳng có giá trị gì. Theo UNCLOS, Công ước Liên Hợp Quốc về Luật Biển, quyền đối với thềm lục địa mở rộng phụ thuộc vào bằng chứng địa chất (như việc dãy Lomonosov có phải là phần kéo dài của thềm lục địa hay không) và vào quy trình thẩm định của một ủy ban khoa học, chứ không phụ thuộc vào việc ai cắm cờ. Vì thế câu mở đầu nhấn mạnh \"địa chất\" và \"mẫu trầm tích\" để đối lập cái thực chất với cái hình ảnh mà cả thế giới đang dán mắt vào.\n\nBối cảnh năm 2007 giải thích vì sao tin này bùng nổ: giá dầu cao, nhu cầu năng lượng tăng, nước Nga dưới thời Putin đang tự tin hơn, còn khủng hoảng tài chính 2008 chưa xảy ra. Khi băng biển mùa hè xuống mức thấp kỷ lục, hai hình ảnh ấy ghép lại thành một câu chuyện hấp dẫn về tuyến hàng hải mới, kho năng lượng mới và một cuộc đua chiếm đất. Cụm \"Arctic fever went viral\" dùng ẩn dụ bệnh dịch để gợi sự lây lan của cảm xúc, còn \"mad scramble\" cho thấy giọng điệu hơi mỉa mai của tác giả, vì ông đặt cụm từ trong ngoặc kép như một khẩu hiệu báo chí chứ không phải nhận định của mình. Chữ \"presumed\" (được cho là) cũng ngầm báo rằng các nguồn tài nguyên ấy chưa chắc đã lớn như người ta tưởng.\n\nĐiều đáng suy ngẫm là khoảng cách giữa nhận thức của công chúng và thực tế pháp lý, kinh tế. Đây là một ví dụ về việc dự đoán tương lai dễ bị hình ảnh và nỗi sợ chi phối, một chủ đề hợp với một cuốn sách bàn về thế giới năm 2050.", "insightDone": true}, {"n": 38, "date": "2026-10-28", "source": ["The perception that vast quantities of valuable natural resources lie awaiting in the North is not without merit. Most of its land surface has yet to be prospected for minerals; the Arctic Ocean seafloor is among the least mapped on Earth. Some of the world's biggest mines are dug into Alaska and Siberia; one of the purest iron ores ever found was recently discovered on Canada's Baffin Island.327 The discovery of diamonds in the Northwest Territories in 1991 sparked the biggest North American staking rush since the Klondike and propelled Canada from having no diamonds at all to becoming the world's third-largest producer almost overnight. No one really knows what the new Arctic Ocean biology will be, but a longer open-water season can only mean more photosynthesis, more complex food webs, and the prospect of valuable new fisheries there. There are staggering volumes of gas hydrate—a sort of solid methane dry-ice that accumulates in the pore spaces of ocean sediments and..."], "translation": ["Quan niệm cho rằng phương Bắc đang chờ sẵn những khối lượng khổng lồ tài nguyên thiên nhiên quý giá không phải là không có cơ sở. Phần lớn bề mặt đất liền ở đó vẫn chưa được thăm dò khoáng sản; đáy Bắc Băng Dương thuộc hàng ít được lập bản đồ nhất trên Trái Đất. Một số mỏ lớn nhất thế giới nằm sâu trong lòng Alaska và Siberia; gần đây, một trong những loại quặng sắt tinh khiết nhất từng được biết đến đã được phát hiện trên đảo Baffin của Canada.327 Việc phát hiện kim cương ở Lãnh thổ Tây Bắc vào năm 1991 đã châm ngòi cho cơn sốt cắm mốc đất khai khoáng lớn nhất Bắc Mỹ kể từ thời Klondike, và gần như chỉ sau một đêm đã đưa Canada từ chỗ không có viên kim cương nào trở thành nhà sản xuất lớn thứ ba thế giới. Không ai thực sự biết hệ sinh vật mới của Bắc Băng Dương sẽ ra sao, nhưng mùa nước mở kéo dài hơn chắc chắn đồng nghĩa với quá trình quang hợp nhiều hơn, các mạng lưới thức ăn phức tạp hơn, và triển vọng xuất hiện những ngư trường mới có giá trị ở đó. Ngoài ra còn có những khối lượng khổng lồ khí hydrat, một dạng \"băng khô\" mê-tan rắn tích tụ trong các lỗ rỗng của trầm tích đại dương và..."], "note": "Gas hydrate: khí hydrat (hydrat khí), mê-tan bị giữ trong cấu trúc băng ở nhiệt độ thấp, áp suất cao. Staking rush: cơn sốt cắm mốc đất để giữ quyền khai thác khoáng sản. Klondike: cơn sốt vàng Klondike (1896–1899) ở Yukon, Canada. Northwest Territories: Lãnh thổ Tây Bắc (Canada). Baffin: đảo Baffin. Số 327 là số chú thích cuối sách. \"Open-water season\": mùa nước mở, tức thời gian biển không bị băng phủ.", "vocab": [{"ex": "Several companies are prospecting for gold in the region.", "ipa": "/ˈprɒspekt/ (động từ: /prəˈspekt/)", "mean": "thăm dò, tìm kiếm khoáng sản", "pos": "động từ (to prospect for)", "vi": "thăm dò khoáng sản", "w": "prospect"}, {"ex": "His proposal is not without merit, but it is too costly.", "ipa": "/nɒt wɪˈðaʊt ˈmerɪt/", "mean": "không phải là không có cơ sở, có phần đúng", "pos": "thành ngữ", "vi": "không phải là không có cơ sở", "w": "not without merit"}, {"ex": "Scientists mapped the seafloor using sonar.", "ipa": "/ˈsiːflɔː(r)/", "mean": "đáy biển", "pos": "danh từ", "vi": "đáy Bắc Băng Dương", "w": "seafloor"}, {"ex": "The ore is transported by train to the port.", "ipa": "/ɔː(r)/", "mean": "quặng", "pos": "danh từ", "vi": "quặng sắt", "w": "ore"}, {"ex": "The gold discovery triggered a staking rush in 1896.", "ipa": "/ˈsteɪkɪŋ rʌʃ/", "mean": "cơn sốt cắm mốc chiếm đất khai khoáng", "pos": "cụm danh từ", "vi": "cơn sốt cắm mốc đất khai khoáng", "w": "staking rush"}, {"ex": "The success of the film propelled her to stardom.", "ipa": "/prəˈpel/", "mean": "đẩy lên, thúc đẩy mạnh mẽ", "pos": "động từ", "vi": "đưa Canada từ chỗ không có viên kim cương nào trở thành", "w": "propel"}, {"ex": "Photosynthesis requires sunlight, water and carbon dioxide.", "ipa": "/ˌfəʊtəʊˈsɪnθəsɪs/", "mean": "quang hợp", "pos": "danh từ", "vi": "quá trình quang hợp nhiều hơn", "w": "photosynthesis"}, {"ex": "Pollution can damage the entire marine food web.", "ipa": "/fuːd web/", "mean": "mạng lưới thức ăn", "pos": "cụm danh từ", "vi": "các mạng lưới thức ăn phức tạp hơn", "w": "food web"}, {"ex": "Overfishing has destroyed many coastal fisheries.", "ipa": "/ˈfɪʃəri/", "mean": "ngư trường, nghề cá", "pos": "danh từ", "vi": "những ngư trường mới có giá trị", "w": "fishery"}, {"ex": "The project cost a staggering two billion dollars.", "ipa": "/ˈstæɡərɪŋ/", "mean": "khổng lồ, gây choáng váng", "pos": "tính từ", "vi": "những khối lượng khổng lồ", "w": "staggering"}, {"ex": "Gas hydrate may become a future energy source.", "ipa": "/ɡæs ˈhaɪdreɪt/", "mean": "khí hydrat (băng cháy)", "pos": "cụm danh từ", "vi": "khí hydrat", "w": "gas hydrate"}, {"ex": "Rivers carry sediment into the sea.", "ipa": "/ˈsedɪmənt/", "mean": "trầm tích", "pos": "danh từ", "vi": "trầm tích đại dương", "w": "sediment"}], "patterns": [{"ex": "The plan is not without risk.", "exVi": "Kế hoạch này không phải là không có rủi ro.", "explain": "Phủ định của 'without' tạo nghĩa khẳng định nhẹ nhàng, thận trọng: 'có phần đúng/có giá trị'.", "formula": "not without + danh từ", "name": "Phủ định kép để nhấn mạnh", "src": "The perception ... is not without merit."}, {"ex": "The belief that money brings happiness is common.", "exVi": "Niềm tin rằng tiền mang lại hạnh phúc là điều phổ biến.", "explain": "Mệnh đề 'that' giải thích nội dung của danh từ trừu tượng đứng trước (perception, belief, fact).", "formula": "The perception/idea/belief + that + S + V", "name": "Mệnh đề đồng vị với that", "src": "The perception that vast quantities of valuable natural resources lie awaiting in the North..."}, {"ex": "The bridge has yet to be completed.", "exVi": "Cây cầu vẫn chưa được hoàn thành.", "explain": "Nghĩa là 'vẫn chưa', nhấn mạnh việc chưa xảy ra nhưng có thể sẽ xảy ra. Ở đây dùng bị động: has yet to be + V3.", "formula": "S + has/have yet to + V nguyên mẫu", "name": "Cấu trúc 'has yet to + V'", "src": "Most of its land surface has yet to be prospected for minerals"}, {"ex": "Higher prices can only mean fewer customers.", "exVi": "Giá cao hơn chắc chắn đồng nghĩa với ít khách hơn.", "explain": "'can only mean' diễn đạt hệ quả tất yếu; lặp 'more' tạo nhịp liệt kê.", "formula": "S + can only mean + more + N, more + N", "name": "So sánh hơn song song với can only mean", "src": "a longer open-water season can only mean more photosynthesis, more complex food webs"}], "hard": [{"mean": "Việc phát hiện kim cương năm 1991 gây ra cơn sốt chiếm đất khai khoáng lớn nhất Bắc Mỹ từ thời Klondike và gần như chỉ sau một đêm đã biến Canada từ nước không có kim cương thành nhà sản xuất lớn thứ ba thế giới.", "parts": "Chủ ngữ: The discovery of diamonds in the Northwest Territories in 1991. Vị ngữ 1: sparked the biggest ... staking rush since the Klondike. Vị ngữ 2 (nối bằng and): propelled Canada from having no diamonds at all to becoming the world's third-largest producer. Trạng ngữ: almost overnight.", "s": "The discovery of diamonds in the Northwest Territories in 1991 sparked the biggest North American staking rush since the Klondike and propelled Canada from having no diamonds at all to becoming the world's third-largest producer almost overnight."}, {"mean": "Chưa ai biết hệ sinh vật mới của Bắc Băng Dương sẽ thế nào, nhưng mùa nước mở dài hơn chắc chắn kéo theo quang hợp nhiều hơn, mạng lưới thức ăn phức tạp hơn và khả năng có ngư trường mới giá trị.", "parts": "Vế 1: No one really knows + mệnh đề danh từ 'what the new Arctic Ocean biology will be' (làm tân ngữ của knows). Vế 2 (sau but): chủ ngữ 'a longer open-water season', vị ngữ 'can only mean' + ba danh từ liệt kê: more photosynthesis, more complex food webs, the prospect of valuable new fisheries.", "s": "No one really knows what the new Arctic Ocean biology will be, but a longer open-water season can only mean more photosynthesis, more complex food webs, and the prospect of valuable new fisheries there."}], "insight": "Tác giả đang đánh giá một niềm tin phổ biến: rằng vùng Bắc Cực là một \"kho báu\" tài nguyên chưa được động đến. Ông không bác bỏ mà thừa nhận niềm tin ấy có phần đúng, rồi đưa ra ba loại bằng chứng: khoáng sản (mỏ ở Alaska, Siberia, quặng sắt đảo Baffin, kim cương ở Canada), sinh vật biển (ngư trường mới), và năng lượng (khí hydrat). Lập luận nằm ở chỗ phần lớn vùng này chưa được thăm dò, nên những gì đã tìm thấy có thể mới chỉ là phần nổi.\n\nVài điểm nền đáng biết: cơn sốt Klondike là đợt đổ xô tìm vàng ở Canada cuối thế kỷ 19, nên so sánh với nó cho thấy quy mô và sự hào hứng của vụ kim cương năm 1991. \"Cắm mốc đất\" (staking) là việc đánh dấu quyền khai thác một khu đất. \"Mùa nước mở\" là khoảng thời gian biển không bị băng phủ; khi băng tan sớm hơn và lâu hơn, ánh sáng xuống được mặt nước nhiều hơn, tảo quang hợp nhiều hơn và chuỗi thức ăn có thể phát triển. Khí hydrat là mê-tan bị giam trong cấu trúc băng ở trầm tích đáy biển; nó là nguồn năng lượng tiềm năng nhưng cũng gây lo ngại vì mê-tan là khí nhà kính mạnh.\n\nĐiều đáng suy ngẫm là giọng điệu khá thận trọng: câu \"không ai thực sự biết\" nhắc rằng nhiều dự đoán về tương lai Bắc Cực còn bất định. Trong bối cảnh cuốn sách nói về thế giới năm 2050, trang này cho thấy biến đổi khí hậu làm vùng Bắc mở ra cơ hội kinh tế, nhưng đi kèm là những rủi ro và cạnh tranh mà ta chưa lường hết.", "insightDone": true}, {"n": 39, "date": "2026-10-29", "source": ["...permafrost—which no one has yet figured out how to recover but is plausibly a coveted fossil fuel of the future.", "The plainest prize of all is natural gas and oil. The Arctic's broad continental shelves are draped in thick sequences of shale-rich sedimentary rock, an ideal geological setting for finding oil and gas. Prospects for natural gas are particularly high. In 2008 and 2009, the U.S. Geological Survey released new assessments concluding that about 30% of the world's undiscovered natural gas and 13% of its undiscovered oil lies in the Arctic, mostly offshore in less than five hundred meters of water. These numbers are huge considering the region as a whole covers just 4% of the globe. The USGS assessments conclude it is more than 95% probable that the Arctic holds at least 770 trillion cubic feet of gas, with a fifty-fifty chance it contains more than double that. To put these numbers into perspective, the total proved gas reserves of the United States, Canada, and Mexico com..."], "translation": ["...và lớp băng vĩnh cửu, thứ mà đến nay chưa ai tìm ra cách khai thác nhưng có thể sẽ trở thành một loại nhiên liệu hóa thạch được thèm muốn trong tương lai.", "Phần thưởng rõ ràng nhất chính là khí tự nhiên và dầu mỏ. Các thềm lục địa rộng lớn của Bắc Cực được phủ bởi những tầng đá trầm tích giàu đá phiến dày đặc, một bối cảnh địa chất lý tưởng để tìm thấy dầu và khí. Triển vọng về khí tự nhiên đặc biệt cao. Năm 2008 và 2009, Cục Khảo sát Địa chất Hoa Kỳ (USGS) công bố những đánh giá mới, kết luận rằng khoảng 30% lượng khí tự nhiên chưa được phát hiện của thế giới và 13% lượng dầu chưa được phát hiện nằm ở Bắc Cực, phần lớn ở ngoài khơi, trong vùng nước sâu chưa đến năm trăm mét. Những con số này thật khổng lồ nếu xét rằng toàn bộ khu vực chỉ chiếm 4% diện tích địa cầu. Các đánh giá của USGS kết luận rằng với xác suất trên 95%, Bắc Cực chứa ít nhất 770 nghìn tỷ feet khối khí, và có 50% khả năng con số này vượt quá gấp đôi mức đó. Để dễ hình dung, tổng trữ lượng khí đã được xác minh của Hoa Kỳ, Canada và Mexico cộng lại..."], "note": "USGS = U.S. Geological Survey (Cục Khảo sát Địa chất Hoa Kỳ). Permafrost = băng vĩnh cửu (lớp đất đóng băng quanh năm). \"Proved reserves\" = trữ lượng đã được xác minh (đã chứng minh có thể khai thác về mặt kinh tế). 770 trillion cubic feet ≈ 770 nghìn tỷ feet khối (trillion kiểu Mỹ = nghìn tỷ). \"Fifty-fifty chance\" = khả năng 50/50.", "vocab": [{"ex": "Permafrost in Siberia is thawing faster than expected.", "ipa": "/ˈpɜːrməfrɒst/", "mean": "lớp đất đóng băng vĩnh cửu ở vùng cực", "pos": "danh từ", "vi": "lớp băng vĩnh cửu", "w": "permafrost"}, {"ex": "The delay can plausibly be explained by bad weather.", "ipa": "/ˈplɔːzəbli/", "mean": "một cách hợp lý, có khả năng xảy ra", "pos": "trạng từ", "vi": "có thể", "w": "plausibly"}, {"ex": "She won the coveted first prize.", "ipa": "/ˈkʌvɪtɪd/", "mean": "được thèm muốn, khao khát", "pos": "tính từ", "vi": "được thèm muốn", "w": "coveted"}, {"ex": "Control of the port was the main prize of the war.", "ipa": "/praɪz/", "mean": "phần thưởng, thứ đáng giành lấy (nghĩa bóng)", "pos": "danh từ", "vi": "Phần thưởng", "w": "prize"}, {"ex": "Many fish species live on the continental shelf.", "ipa": "/ˌkɒntɪˈnentl ʃelf/", "mean": "thềm lục địa", "pos": "danh từ", "vi": "thềm lục địa", "w": "continental shelf"}, {"ex": "The mountains were draped in thick fog.", "ipa": "/dreɪpt ɪn/", "mean": "được phủ lên, bao phủ", "pos": "cụm động từ (bị động)", "vi": "được phủ bởi", "w": "draped in"}, {"ex": "Limestone is a common sedimentary rock.", "ipa": "/ˌsedɪˈmentri rɒk/", "mean": "đá trầm tích", "pos": "danh từ", "vi": "đá trầm tích", "w": "sedimentary rock"}, {"ex": "Shale gas has changed the energy market.", "ipa": "/ʃeɪl/", "mean": "đá phiến sét", "pos": "danh từ", "vi": "đá phiến", "w": "shale"}, {"ex": "Many undiscovered species live in the deep sea.", "ipa": "/ˌʌndɪˈskʌvərd/", "mean": "chưa được phát hiện", "pos": "tính từ", "vi": "chưa được phát hiện", "w": "undiscovered"}, {"ex": "The company operates an offshore wind farm.", "ipa": "/ˌɒfˈʃɔːr/", "mean": "ngoài khơi", "pos": "tính từ/trạng từ", "vi": "ngoài khơi", "w": "offshore"}, {"ex": "The country's proved reserves will last 50 years.", "ipa": "/pruːvd rɪˈzɜːrvz/", "mean": "trữ lượng đã được xác minh", "pos": "danh từ", "vi": "trữ lượng khí đã được xác minh", "w": "proved reserves"}, {"ex": "Seeing the vast ocean put my problems into perspective.", "ipa": "/pʊt ˈɪntuː pərˈspektɪv/", "mean": "giúp nhìn nhận đúng quy mô, so sánh để dễ hình dung", "pos": "thành ngữ", "vi": "Để dễ hình dung", "w": "put into perspective"}], "patterns": [{"ex": "The report, which nobody has read, is very long.", "exVi": "Bản báo cáo, thứ mà chưa ai đọc, rất dài.", "explain": "Mệnh đề which bổ sung thông tin về danh từ đứng trước, ở đây có hai vế nối bằng but: chưa ai biết cách khai thác nhưng có thể là nhiên liệu được thèm muốn.", "formula": "danh từ + —which/, which + (S) + V", "name": "Mệnh đề quan hệ không xác định với which (bổ sung thông tin)", "src": "permafrost—which no one has yet figured out how to recover but is plausibly a coveted fossil fuel of the future"}, {"ex": "The hills are covered with green forest.", "exVi": "Những ngọn đồi được phủ bởi rừng xanh.", "explain": "Dùng bị động để mô tả trạng thái bề mặt được bao phủ bởi thứ gì đó.", "formula": "S + be + V3 + in/with + N", "name": "Câu bị động với cụm giới từ chỉ vật liệu phủ", "src": "The Arctic's broad continental shelves are draped in thick sequences of shale-rich sedimentary rock"}, {"ex": "About 70% of the Earth's surface is covered by water.", "exVi": "Khoảng 70% bề mặt Trái Đất được nước bao phủ.", "explain": "Nêu tỉ lệ của một tổng thể. Động từ có thể chia theo danh từ không đếm được ở số ít (lies).", "formula": "X% of + the world's + N + lies/is + in...", "name": "Phân số/tỉ lệ + of + danh từ", "src": "about 30% of the world's undiscovered natural gas and 13% of its undiscovered oil lies in the Arctic"}, {"ex": "It is highly probable that prices will rise next year.", "exVi": "Rất có khả năng giá sẽ tăng vào năm sau.", "explain": "Cấu trúc câu giả chủ ngữ it để diễn đạt xác suất một cách học thuật.", "formula": "It is + (more than) X% probable that + S + V", "name": "Xác suất: it is X% probable that", "src": "it is more than 95% probable that the Arctic holds at least 770 trillion cubic feet of gas"}], "hard": [{"mean": "Các đánh giá của USGS kết luận rằng xác suất trên 95% là Bắc Cực chứa ít nhất 770 nghìn tỷ feet khối khí, và có 50% khả năng nó chứa nhiều hơn gấp đôi lượng đó.", "parts": "Chủ ngữ: The USGS assessments; vị ngữ: conclude; mệnh đề tân ngữ: it is more than 95% probable that the Arctic holds at least 770 trillion cubic feet of gas; cụm with + danh từ bổ sung: with a fifty-fifty chance (that) it contains more than double that (that = 770 nghìn tỷ feet khối).", "s": "The USGS assessments conclude it is more than 95% probable that the Arctic holds at least 770 trillion cubic feet of gas, with a fifty-fifty chance it contains more than double that."}, {"mean": "Những con số này rất lớn nếu xét rằng toàn bộ khu vực chỉ chiếm 4% diện tích Trái Đất.", "parts": "Chủ ngữ: These numbers; vị ngữ: are huge; considering + mệnh đề: xét rằng the region as a whole covers just 4% of the globe (considering dùng như liên từ, nghĩa là 'xét rằng/vì').", "s": "These numbers are huge considering the region as a whole covers just 4% of the globe."}], "insight": "Tác giả đang lập luận rằng Bắc Cực không chỉ là vùng băng xa xôi mà là một \"phần thưởng\" tài nguyên, và khí tự nhiên cùng dầu mỏ là phần thưởng rõ nhất. Lý do nằm ở địa chất: các thềm lục địa rộng được phủ bởi đá trầm tích giàu đá phiến, loại môi trường thường sinh ra và giữ dầu khí. Việc đặt hai con số 30% khí và 13% dầu chưa phát hiện bên cạnh con số 4% diện tích địa cầu là thủ pháp so sánh để người đọc thấy mức độ tập trung bất thường của tài nguyên ở đây. Việc nói thêm rằng phần lớn nằm ngoài khơi, ở vùng nước nông dưới 500 mét, ngầm cho thấy chúng có thể khai thác được về mặt kỹ thuật hơn so với biển sâu.\n\nVề kiến thức nền: \"ch
